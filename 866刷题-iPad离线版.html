"id":"gaohua04-004","type":"tf","match":true},{"id":"gaohua04-001","type":"tf","match":true},{"id":"gaohua04-024","type":"short","match":true}],"notes":[{"h":"八、单体与自由基的活性顺序","t":"教材把活性拆成两列，这一组结论常以选择题出现：单体的活性顺序大致为苯乙烯 > 丁二烯 > 异戊二烯 > 丙烯腈 > 醋酸乙烯酯 > 氯乙烯 > 乙烯；自由基的活性顺序则相反，氯乙烯自由基 > 醋酸乙烯酯自由基 > 丙烯腈自由基 > 丁二烯自由基 > 苯乙烯自由基。\n为什么相反？因为取代基的共轭作用既稳定单体（降低其能量），也稳定自由基。共轭强的单体本身稳定、不容易被引发，但它生成的自由基很稳定、选择性高。所以“稳定的单体对应稳定的自由基，但反应活性低”——这句话是理解整张表的钥匙。"},{"h":"十、易错清单与自测","t":"★★★　能默写 F1 的组成方程，并说清 f 与 F 的区别\n★★★　能画出五种竞聚率组合的曲线，并标出恒比点\n★★★　能用恒比点公式算出具体投料比\n★★★　能解释为什么转化率高时共聚物组成会漂移，并给出三种控制方法\n★★　能写出 Mayo-Lewis 法的作图思路，并说明为何要低转化率取样\n★★　能写出 Q-e 方程与 r1r2 = exp[-(e1 - e2)²]，并说明其含义\n★★　能列出单体与自由基的活性顺序，并解释为何相反\n★　能说出 ABS、SBR、EVA 的组成与主要用途\n与前后章的接口本章的稳态与等活性假设直接继承第 3 章；本章的序列结构结论（无规、交替、嵌段）会在高物第一章“链结构”和第五章“相容性”里再次用到。读高物时遇到“为什么两种聚合物不相容”，先想本章的极性差。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Q-e 方程与单体活性顺序（简答、论述）"},{"id":"gaohua04n09","label":"交替共聚与序列结构（选择、简答）","stars":3,"point":"r1r2 趋近 0 时交替","imgs":[],"quiz":[{"id":"gaohua04-008","type":"term","match":true},{"id":"gaohua04-021","type":"short","match":true},{"id":"gaohua04-005","type":"tf","match":true}],"notes":[{"h":"表 2　五种竞聚率组合与共聚行为","t":"情形 ｜ 条件 ｜ 曲线特征 ｜ 产物结构\n理想恒比共聚 ｜ r1 = r2 = 1 ｜ F1 = f1 的直线 ｜ 两种单元无规分布，组成等于投料比\n理想非恒比共聚 ｜ r1r2 = 1，r1 ≠ 1 ｜ 曲线与对角线相交于恒比点 ｜ 无规，但有恒比组成\n交替共聚 ｜ r1 = r2 = 0（或 r1r2 → 0） ｜ 曲线呈水平线 F1 = 0.5 ｜ 严格交替序列\n有恒比点的非理想共聚 ｜ r1 < 1、r2 < 1（r1r2 < 1） ｜ 曲线与对角线相交 ｜ 无规，组成随转化率漂移\n嵌段或接枝倾向 ｜ r1 > 1、r2 > 1（r1r2 > 1） ｜ 曲线呈 S 形 ｜ 出现长序列，实际体系少见\n图 1　共聚组成曲线小结：五种竞聚率组合对应的 F1–f1 曲线（北化《高分子化学·重点内容》课件）\n这五种情形不需要死记，画图即可推：把 F1 = f1 的对角线画出来，再看曲线在它上方还是下方。当 r1 很大、r2 很小时，曲线先在对角线上方、后穿过对角线到下方，中间那个交点就是恒比点。"},{"h":"十、易错清单与自测","t":"★★★　能默写 F1 的组成方程，并说清 f 与 F 的区别\n★★★　能画出五种竞聚率组合的曲线，并标出恒比点\n★★★　能用恒比点公式算出具体投料比\n★★★　能解释为什么转化率高时共聚物组成会漂移，并给出三种控制方法\n★★　能写出 Mayo-Lewis 法的作图思路，并说明为何要低转化率取样\n★★　能写出 Q-e 方程与 r1r2 = exp[-(e1 - e2)²]，并说明其含义\n★★　能列出单体与自由基的活性顺序，并解释为何相反\n★　能说出 ABS、SBR、EVA 的组成与主要用途\n与前后章的接口本章的稳态与等活性假设直接继承第 3 章；本章的序列结构结论（无规、交替、嵌段）会在高物第一章“链结构”和第五章“相容性”里再次用到。读高物时遇到“为什么两种聚合物不相容”，先想本章的极性差。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"交替共聚与序列结构（选择、简答）"},{"id":"gaohua04n10","label":"共聚物的工业品种（填空、选择）","stars":2,"point":"ABS、SBR、EVA、乙丙橡胶","imgs":["img/map/m072.jpg"],"quiz":[{"id":"gaohua04-023","type":"short","match":true},{"id":"gaohua04-024","type":"short","match":true},{"id":"gaohua04-001","type":"tf","match":true}],"notes":[{"h":"一、本章坐标：两种单体的“性格”如何合成一条链","t":"均聚只能改分子量，共聚能改结构，所以工业上的重要牌号几乎都是共聚物：ABS 是丙烯腈-丁二烯-苯乙烯，丁苯橡胶是苯乙烯-丁二烯，EVA 是乙烯-醋酸乙烯酯。共聚的核心问题只有一个：两种单体谁更愿意跟自己玩、谁更愿意跟对方玩？这个“性格”就是竞聚率。\n逻辑链：① 竞聚率 r1、r2（同种加成与异种加成的速率之比） → ② 瞬时组成方程（由四个增长反应与稳态假设推出 F1 与 f1 的关系） → ③ 曲线形状（r1r2 决定恒比、交替还是无规） → ④ 转化率效应（单体消耗速度不同，组成随转化率漂移） → ⑤ 控制手段（恒比点投料、补加单体、连续聚合） → ⑥ Q-e 估算（用共振与极性预估未知体系的竞聚率）读法：读法：这条链的前半段是热力学与动力学（谁快），后半段是工程（怎么把组成稳定住）。考计算多半在前半段，考简答多半在后半段。\n命题口径共聚合是计算题的高频来源（给 r1、r2 与投料比求 F1，或给 F1 反求投料），简答则偏爱“恒比点”“为什么要补加单体”“Q-e 的物理意义与局限”。这一章的公式不多，但每一个都要能解释形状。"},{"h":"表 2　五种竞聚率组合与共聚行为","t":"情形 ｜ 条件 ｜ 曲线特征 ｜ 产物结构\n理想恒比共聚 ｜ r1 = r2 = 1 ｜ F1 = f1 的直线 ｜ 两种单元无规分布，组成等于投料比\n理想非恒比共聚 ｜ r1r2 = 1，r1 ≠ 1 ｜ 曲线与对角线相交于恒比点 ｜ 无规，但有恒比组成\n交替共聚 ｜ r1 = r2 = 0（或 r1r2 → 0） ｜ 曲线呈水平线 F1 = 0.5 ｜ 严格交替序列\n有恒比点的非理想共聚 ｜ r1 < 1、r2 < 1（r1r2 < 1） ｜ 曲线与对角线相交 ｜ 无规，组成随转化率漂移\n嵌段或接枝倾向 ｜ r1 > 1、r2 > 1（r1r2 > 1） ｜ 曲线呈 S 形 ｜ 出现长序列，实际体系少见\n图 1　共聚组成曲线小结：五种竞聚率组合对应的 F1–f1 曲线（北化《高分子化学·重点内容》课件）\n这五种情形不需要死记，画图即可推：把 F1 = f1 的对角线画出来，再看曲线在它上方还是下方。当 r1 很大、r2 很小时，曲线先在对角线上方、后穿过对角线到下方，中间那个交点就是恒比点。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"共聚物的工业品种（填空、选择）"}],"logic":{"question":"两种单体一起聚合时，链的组成和序列由什么决定，怎样防止组成漂移？","role":"把单单体链增长扩展为竞争增长：竞聚率把单体活性连接到共聚物组成和序列结构。","input":"自由基增长与链转移、单体和自由基活性","output":"共聚组成方程、F1-f1 曲线、恒比点与组成控制","prev":"gaohua03","next":"gaohua05","links":[{"cid":"gaowu01","text":"共聚组成与序列结构属于高物的链近程结构"},{"cid":"gaowu02","text":"嵌段/无规序列进一步影响相容性和聚集态"}],"focus":["r1、r2 的物理意义与五种组合","共聚组成微分方程及恒比点","组成漂移、序列结构和三类控制方法","Q-e 方程的适用边界"],"common":["由 r1、r2 和投料组成计算瞬时共聚物组成","画 F1-f1 曲线并判断理想、交替、恒比或嵌段倾向","根据曲线选择恒比投料、控制转化率或补加活泼单体","用 Q-e 与竞聚率共同解释单体共聚能力"],"examRefs":["past2023-012","past2022-012","past2021-012","past2021-018"]},"examRefs":["past2023-012","past2022-012","past2021-012","past2021-018"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":10,"examRefs":4,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua05":{"title":"聚合方法","subject":"gaohua","nodes":[{"id":"gaohua05n01","label":"四种方法的组分与配比（选择、填空）","stars":4,"point":"看有无水、有无乳化剂、有无溶剂","imgs":["img/map/m073.jpg","img/map/m074.jpg","img/map/m075.jpg"],"quiz":[{"id":"gaohua05-009","type":"fill","match":true},{"id":"gaohua05-026","type":"essay","match":true},{"id":"gaohua05-019","type":"short","match":true}],"notes":[{"h":"表 2　四种聚合方法比较","t":"方法 ｜ 主要组分 ｜ 反应场所 ｜ 产物形态 ｜ 关键难点\n本体聚合 ｜ 单体 + 引发剂（+ 少量助剂） ｜ 单体本体 ｜ 块状或粒状 ｜ 散热难、粘度大、易暴聚\n悬浮聚合 ｜ 单体 + 引发剂 + 水 + 分散剂 ｜ 单体液滴内 ｜ 珠状颗粒（0.1 至 1 mm） ｜ 粒径控制、粘连\n乳液聚合 ｜ 单体 + 水 + 乳化剂 + 水溶性引发剂 ｜ 胶束与乳胶粒内 ｜ 乳胶（0.05 至 0.5 μm） ｜ 乳化剂残留、后处理\n溶液聚合 ｜ 单体 + 引发剂 + 溶剂 ｜ 溶液相 ｜ 溶液或沉淀 ｜ 溶剂回收、分子量偏低\n图 1　乳液聚合与悬浮聚合的体系比较：分散尺度差三个数量级（北化《高分子化学·重点内容》课件）\n一眼判别法：配方里有水、有乳化剂（如十二烷基硫酸钠）、引发剂是过硫酸钾，一定是乳液聚合；有水、有分散剂（如聚乙烯醇、碳酸镁）、引发剂是油溶性的 AIBN 或 BPO，一定是悬浮聚合；全是单体无溶剂是本体的悬浮？不，是本体；有大量溶剂（如甲苯、环己烷）则是溶液聚合。\n图 2　悬浮聚合与乳液聚合的成粒过程示意（北化《高分子化学·重点内容》课件）"},{"h":"一、本章坐标：同一反应，四种“场地”","t":"前三章讲的是分子怎么长，本章讲的是让它们在什么地方长。反应机理不变，换了场地之后，传热、粘度、产物形态、成本全变了。工业上选哪一种，往往不是因为化学更好，而是因为工程上更划算。\n逻辑链：① 体系的相态（单体、聚合物、水、助剂谁在谁里） → ② 分散方式（机械搅拌还是乳化剂胶束） → ③ 反应场所（本体、颗粒、胶束、溶液） → ④ 产物形态（块状、珠状、乳胶、溶液） → ⑤ 工程取舍（传热、粘度、成本、后处理）读法：读法：把四种方法当成四个“反应器”，每个都问三件事——热能不能散出去、粘度会不会失控、产物怎么拿出来。这三问就是简答题的骨架。\n命题口径本章分值不高但极稳：选择题考“给一套配方判断方法与机理”（北化几乎每年一题），简答题考“乳液聚合为什么能同时高速率与高分子量”。这两类题吃透，本章就结束了。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"四种方法的组分与配比（选择、填空）"},{"id":"gaohua05n02","label":"本体聚合的优缺点与本体法PS（简答、论述）","stars":4,"point":"纯度高但散热难，分预聚与后聚合","imgs":["img/map/m076.jpg","img/map/m077.jpg","img/map/m078.jpg"],"quiz":[{"id":"gaohua05-023","type":"short","match":true},{"id":"gaohua05-006","type":"term","match":true},{"id":"gaohua05-024","type":"short","match":true}],"notes":[{"h":"四、本体聚合：纯度最高，也最难过热","t":"本体聚合只有单体和引发剂，产物纯净、后处理简单、适合做光学件与医用材料（如有机玻璃板、透镜）。它的死穴是散热：反应一开始体系就变粘，热量散不出去，局部温度升高又加快引发剂分解，正反馈下去就是暴聚。\n工业上的解法是“两段式”：先在预聚釜里做到一定转化率（如 10% 至 20%），此时粘度还不高、可以搅拌散热；再把预聚物灌进模具，在较低温度下长时间后聚合。PMMA 板、PS 棒都是这么做的。这个工艺细节是论述题的加分点。\n本体法聚苯乙烯还有连续本体法：用多级串联反应器，靠自身粘度形成活塞流，后期在脱挥器中抽走残余单体。苯乙烯本体聚合的难点是苯乙烯本身是良溶剂，聚合物一生成就溶解，粘度上升极快。"},{"h":"五、悬浮聚合：把本体反应切成小液滴","t":"悬浮聚合本质上是“无数个小本体反应器”。单体被搅拌打散成液滴，靠分散剂（水溶性高分子如聚乙烯醇、或难溶无机盐如碳酸镁）吸附在液滴表面，防止碰撞后粘连。引发剂必须油溶，溶在单体里。\n产物是珠状颗粒，粒径 0.1 至 1 mm，可直接用于成型，省去造粒。PVC 的 80% 以上产量来自悬浮法，这也是为什么市售 PVC 是白色粉末或珠粒。控制粒径靠三件事：搅拌转速、分散剂种类与用量、水与单体的比例。转速越高、分散剂越有效，粒径越小。\n悬浮聚合的传热比本体好得多——每个液滴都在水中，热量通过水带走。这就是它的核心优势：既保留本体聚合的纯度（产物中几乎无乳化剂残留），又解决了散热。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"本体聚合的优缺点与本体法 PS（简答、论述）"},{"id":"gaohua05n03","label":"悬浮聚合与分散剂作用（简答、选择）","stars":4,"point":"珠状产物，分散剂防粘连","imgs":[],"quiz":[{"id":"gaohua05-013","type":"fill","match":true},{"id":"gaohua05-006","type":"term","match":true},{"id":"gaohua05-024","type":"short","match":true}],"notes":[{"h":"五、悬浮聚合：把本体反应切成小液滴","t":"悬浮聚合本质上是“无数个小本体反应器”。单体被搅拌打散成液滴，靠分散剂（水溶性高分子如聚乙烯醇、或难溶无机盐如碳酸镁）吸附在液滴表面，防止碰撞后粘连。引发剂必须油溶，溶在单体里。\n产物是珠状颗粒，粒径 0.1 至 1 mm，可直接用于成型，省去造粒。PVC 的 80% 以上产量来自悬浮法，这也是为什么市售 PVC 是白色粉末或珠粒。控制粒径靠三件事：搅拌转速、分散剂种类与用量、水与单体的比例。转速越高、分散剂越有效，粒径越小。\n悬浮聚合的传热比本体好得多——每个液滴都在水中，热量通过水带走。这就是它的核心优势：既保留本体聚合的纯度（产物中几乎无乳化剂残留），又解决了散热。"},{"h":"表 2　四种聚合方法比较","t":"方法 ｜ 主要组分 ｜ 反应场所 ｜ 产物形态 ｜ 关键难点\n本体聚合 ｜ 单体 + 引发剂（+ 少量助剂） ｜ 单体本体 ｜ 块状或粒状 ｜ 散热难、粘度大、易暴聚\n悬浮聚合 ｜ 单体 + 引发剂 + 水 + 分散剂 ｜ 单体液滴内 ｜ 珠状颗粒（0.1 至 1 mm） ｜ 粒径控制、粘连\n乳液聚合 ｜ 单体 + 水 + 乳化剂 + 水溶性引发剂 ｜ 胶束与乳胶粒内 ｜ 乳胶（0.05 至 0.5 μm） ｜ 乳化剂残留、后处理\n溶液聚合 ｜ 单体 + 引发剂 + 溶剂 ｜ 溶液相 ｜ 溶液或沉淀 ｜ 溶剂回收、分子量偏低\n图 1　乳液聚合与悬浮聚合的体系比较：分散尺度差三个数量级（北化《高分子化学·重点内容》课件）\n一眼判别法：配方里有水、有乳化剂（如十二烷基硫酸钠）、引发剂是过硫酸钾，一定是乳液聚合；有水、有分散剂（如聚乙烯醇、碳酸镁）、引发剂是油溶性的 AIBN 或 BPO，一定是悬浮聚合；全是单体无溶剂是本体的悬浮？不，是本体；有大量溶剂（如甲苯、环己烷）则是溶液聚合。\n图 2　悬浮聚合与乳液聚合的成粒过程示意（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"悬浮聚合与分散剂作用（简答、选择）"},{"id":"gaohua05n04","label":"乳液聚合的四个组分与三个阶段（论述、简答）","stars":5,"point":"胶束成核、乳胶粒长大、聚合完成","imgs":["img/map/m079.jpg","img/map/m080.jpg"],"quiz":[{"id":"gaohua05-011","type":"fill","match":true},{"id":"gaohua05-002","type":"tf","match":true},{"id":"gaohua05-005","type":"tf","match":true}],"notes":[{"h":"表 3　乳液聚合三个阶段的关键变化","t":"阶段 ｜ 乳胶粒数 ｜ 单体来源 ｜ 速率 ｜ 主要事件\n成核期 ｜ 迅速增加 ｜ 单体液滴 + 胶束增溶 ｜ 上升 ｜ 胶束成核，形成乳胶粒\n生长期 ｜ 恒定 ｜ 单体液滴经水相扩散 ｜ 恒定 ｜ 乳胶粒长大，产物积累\n完成期 ｜ 恒定 ｜ 乳胶粒内残余单体 ｜ 下降 ｜ 残余单体聚合，反应结束\n图 3　乳液聚合工业生产实例与产物用途（北化《高分子化学·重点内容》课件）\n论述题模板问“乳液聚合为何速率与分子量同时高”，按三层答：①体系被乳化剂分隔成大量孤立乳胶粒，终止被空间隔离；②每粒自由基数少、寿命长，链得以充分增长，故分子量高；③乳胶粒数量巨大，总速率仍高。再补一句“因此它突破了本体聚合中 Rp 与 Xn 的矛盾”。"},{"h":"六、乳液聚合：本章的重头戏","t":"乳液聚合的体系有四个组分：单体（难溶于水）、水、乳化剂、水溶性引发剂。乳化剂是两亲分子，浓度超过临界胶束浓度（CMC）后，在水里自组装成胶束（直径约 5 至 10 nm），同时把部分单体增溶进胶束内部。\n乳液聚合的引发反应式（KPS 体系，必须会写）：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（70—90 ℃）2 SO₄·⁻；SO₄·⁻ + 单体 → 单体自由基。若加亚硫酸氢钠作还原剂，则 S₂O₈²⁻ + HSO₃⁻ → SO₄²⁻ + SO₄·⁻ + HSO₃·，活化能大幅下降，可在室温聚合（这就是“低温乳液聚合”丁苯橡胶的做法）。\n反应分三个阶段，这是必背内容：\n第一阶段（胶束成核期）：水溶性引发剂在水相分解，生成自由基；自由基扩散到胶束内，与其中的单体反应，胶束变成乳胶粒的“核”。此阶段乳胶粒数目迅速增加，单体主要来自单体液滴的补充。\n第二阶段（乳胶粒生长期）：胶束消失，乳胶粒数目固定。单体从液滴经水相扩散进乳胶粒，在其中聚合。此阶段乳胶粒不断长大，聚合速率基本恒定，是主要的产品生长期。\n第三阶段（聚合完成期）：单体液滴耗尽，只剩乳胶粒内部的残余单体继续聚合，单体浓度下降，速率随之降低，直至反应结束。\n为什么乳液聚合能同时做到“速率快”和“分子量高”？关键在于“隔离”。每个乳胶粒里通常只有一个自由基（第二个自由基进入前，前一个已被终止或被困住），因此不存在双基终止，自由基寿命长、链可以长得很长；同时乳胶粒数量极多（每毫升可达 10¹⁴ 个），总反应速率并不低。这一条把第 3 章的“Rp 与 Xn 互相矛盾”直接推翻了，是全书最漂亮的工程解法。\n定量上，乳液聚合速率 Rp = kp·[M]·N·n̄/（2N_A），其中 N 为乳胶粒浓度、n̄ 为每粒平均自由基数。可见 Rp 与乳胶粒数目成正比，而乳胶粒数目由乳化剂用量决定。所以“多加乳化剂 → 更多胶束 → 更多乳胶粒 → 更快”，这条推理链要能说清。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"乳液聚合的四个组分与三个阶段（论述、简答）"},{"id":"gaohua05n05","label":"乳液聚合高速率又高分子量的原因（论述）","stars":5,"point":"反应被分隔在孤立胶束中，终止难","imgs":["img/map/m081.jpg","img/map/m082.jpg","img/map/m083.jpg"],"quiz":[{"id":"gaohua05-023","type":"short","match":true},{"id":"gaohua05-018","type":"mcq","match":true},{"id":"gaohua05-005","type":"tf","match":true}],"notes":[{"h":"表 3　乳液聚合三个阶段的关键变化","t":"阶段 ｜ 乳胶粒数 ｜ 单体来源 ｜ 速率 ｜ 主要事件\n成核期 ｜ 迅速增加 ｜ 单体液滴 + 胶束增溶 ｜ 上升 ｜ 胶束成核，形成乳胶粒\n生长期 ｜ 恒定 ｜ 单体液滴经水相扩散 ｜ 恒定 ｜ 乳胶粒长大，产物积累\n完成期 ｜ 恒定 ｜ 乳胶粒内残余单体 ｜ 下降 ｜ 残余单体聚合，反应结束\n图 3　乳液聚合工业生产实例与产物用途（北化《高分子化学·重点内容》课件）\n论述题模板问“乳液聚合为何速率与分子量同时高”，按三层答：①体系被乳化剂分隔成大量孤立乳胶粒，终止被空间隔离；②每粒自由基数少、寿命长，链得以充分增长，故分子量高；③乳胶粒数量巨大，总速率仍高。再补一句“因此它突破了本体聚合中 Rp 与 Xn 的矛盾”。"},{"h":"六、乳液聚合：本章的重头戏","t":"乳液聚合的体系有四个组分：单体（难溶于水）、水、乳化剂、水溶性引发剂。乳化剂是两亲分子，浓度超过临界胶束浓度（CMC）后，在水里自组装成胶束（直径约 5 至 10 nm），同时把部分单体增溶进胶束内部。\n乳液聚合的引发反应式（KPS 体系，必须会写）：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（70—90 ℃）2 SO₄·⁻；SO₄·⁻ + 单体 → 单体自由基。若加亚硫酸氢钠作还原剂，则 S₂O₈²⁻ + HSO₃⁻ → SO₄²⁻ + SO₄·⁻ + HSO₃·，活化能大幅下降，可在室温聚合（这就是“低温乳液聚合”丁苯橡胶的做法）。\n反应分三个阶段，这是必背内容：\n第一阶段（胶束成核期）：水溶性引发剂在水相分解，生成自由基；自由基扩散到胶束内，与其中的单体反应，胶束变成乳胶粒的“核”。此阶段乳胶粒数目迅速增加，单体主要来自单体液滴的补充。\n第二阶段（乳胶粒生长期）：胶束消失，乳胶粒数目固定。单体从液滴经水相扩散进乳胶粒，在其中聚合。此阶段乳胶粒不断长大，聚合速率基本恒定，是主要的产品生长期。\n第三阶段（聚合完成期）：单体液滴耗尽，只剩乳胶粒内部的残余单体继续聚合，单体浓度下降，速率随之降低，直至反应结束。\n为什么乳液聚合能同时做到“速率快”和“分子量高”？关键在于“隔离”。每个乳胶粒里通常只有一个自由基（第二个自由基进入前，前一个已被终止或被困住），因此不存在双基终止，自由基寿命长、链可以长得很长；同时乳胶粒数量极多（每毫升可达 10¹⁴ 个），总反应速率并不低。这一条把第 3 章的“Rp 与 Xn 互相矛盾”直接推翻了，是全书最漂亮的工程解法。\n定量上，乳液聚合速率 Rp = kp·[M]·N·n̄/（2N_A），其中 N 为乳胶粒浓度、n̄ 为每粒平均自由基数。可见 Rp 与乳胶粒数目成正比，而乳胶粒数目由乳化剂用量决定。所以“多加乳化剂 → 更多胶束 → 更多乳胶粒 → 更快”，这条推理链要能说清。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"乳液聚合高速率又高分子量的原因（论述）"},{"id":"gaohua05n06","label":"乳化剂与临界胶束浓度（名词解释）","stars":3,"point":"形成胶束的最低浓度","imgs":[],"quiz":[{"id":"gaohua05-007","type":"term","match":true},{"id":"gaohua05-012","type":"fill","match":true},{"id":"gaohua05-025","type":"calc","match":true}],"notes":[{"h":"六、乳液聚合：本章的重头戏","t":"乳液聚合的体系有四个组分：单体（难溶于水）、水、乳化剂、水溶性引发剂。乳化剂是两亲分子，浓度超过临界胶束浓度（CMC）后，在水里自组装成胶束（直径约 5 至 10 nm），同时把部分单体增溶进胶束内部。\n乳液聚合的引发反应式（KPS 体系，必须会写）：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（70—90 ℃）2 SO₄·⁻；SO₄·⁻ + 单体 → 单体自由基。若加亚硫酸氢钠作还原剂，则 S₂O₈²⁻ + HSO₃⁻ → SO₄²⁻ + SO₄·⁻ + HSO₃·，活化能大幅下降，可在室温聚合（这就是“低温乳液聚合”丁苯橡胶的做法）。\n反应分三个阶段，这是必背内容：\n第一阶段（胶束成核期）：水溶性引发剂在水相分解，生成自由基；自由基扩散到胶束内，与其中的单体反应，胶束变成乳胶粒的“核”。此阶段乳胶粒数目迅速增加，单体主要来自单体液滴的补充。\n第二阶段（乳胶粒生长期）：胶束消失，乳胶粒数目固定。单体从液滴经水相扩散进乳胶粒，在其中聚合。此阶段乳胶粒不断长大，聚合速率基本恒定，是主要的产品生长期。\n第三阶段（聚合完成期）：单体液滴耗尽，只剩乳胶粒内部的残余单体继续聚合，单体浓度下降，速率随之降低，直至反应结束。\n为什么乳液聚合能同时做到“速率快”和“分子量高”？关键在于“隔离”。每个乳胶粒里通常只有一个自由基（第二个自由基进入前，前一个已被终止或被困住），因此不存在双基终止，自由基寿命长、链可以长得很长；同时乳胶粒数量极多（每毫升可达 10¹⁴ 个），总反应速率并不低。这一条把第 3 章的“Rp 与 Xn 互相矛盾”直接推翻了，是全书最漂亮的工程解法。\n定量上，乳液聚合速率 Rp = kp·[M]·N·n̄/（2N_A），其中 N 为乳胶粒浓度、n̄ 为每粒平均自由基数。可见 Rp 与乳胶粒数目成正比，而乳胶粒数目由乳化剂用量决定。所以“多加乳化剂 → 更多胶束 → 更多乳胶粒 → 更快”，这条推理链要能说清。"},{"h":"一、本章坐标：同一反应，四种“场地”","t":"前三章讲的是分子怎么长，本章讲的是让它们在什么地方长。反应机理不变，换了场地之后，传热、粘度、产物形态、成本全变了。工业上选哪一种，往往不是因为化学更好，而是因为工程上更划算。\n逻辑链：① 体系的相态（单体、聚合物、水、助剂谁在谁里） → ② 分散方式（机械搅拌还是乳化剂胶束） → ③ 反应场所（本体、颗粒、胶束、溶液） → ④ 产物形态（块状、珠状、乳胶、溶液） → ⑤ 工程取舍（传热、粘度、成本、后处理）读法：读法：把四种方法当成四个“反应器”，每个都问三件事——热能不能散出去、粘度会不会失控、产物怎么拿出来。这三问就是简答题的骨架。\n命题口径本章分值不高但极稳：选择题考“给一套配方判断方法与机理”（北化几乎每年一题），简答题考“乳液聚合为什么能同时高速率与高分子量”。这两类题吃透，本章就结束了。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"乳化剂与临界胶束浓度（名词解释）"},{"id":"gaohua05n07","label":"溶液聚合与沉淀聚合（简答）","stars":3,"point":"溶剂既是介质又是转移对象","imgs":["img/map/m084.jpg","img/map/m085.jpg"],"quiz":[{"id":"gaohua05-026","type":"essay","match":true},{"id":"gaohua05-006","type":"term","match":true},{"id":"gaohua05-023","type":"short","match":true}],"notes":[{"h":"七、溶液聚合与沉淀聚合","t":"溶液聚合把单体和引发剂溶在溶剂里，优点是粘度低、传热好、温度易控，适合做涂料、胶黏剂。缺点是溶剂成了链转移的对象，分子量偏低；而且溶剂回收成本高、有环保压力。\n如果聚合物不溶于所选溶剂，反应一开始就析出，就是沉淀聚合。丙烯腈在水中聚合、以及聚丙烯腈碳纤维原丝的生产都属于这一类。沉淀聚合的机理与乳液不同：没有胶束，成核靠均相成核后析出，颗粒内部反应使局部浓度高，也常出现加速。"},{"h":"表 2　四种聚合方法比较","t":"方法 ｜ 主要组分 ｜ 反应场所 ｜ 产物形态 ｜ 关键难点\n本体聚合 ｜ 单体 + 引发剂（+ 少量助剂） ｜ 单体本体 ｜ 块状或粒状 ｜ 散热难、粘度大、易暴聚\n悬浮聚合 ｜ 单体 + 引发剂 + 水 + 分散剂 ｜ 单体液滴内 ｜ 珠状颗粒（0.1 至 1 mm） ｜ 粒径控制、粘连\n乳液聚合 ｜ 单体 + 水 + 乳化剂 + 水溶性引发剂 ｜ 胶束与乳胶粒内 ｜ 乳胶（0.05 至 0.5 μm） ｜ 乳化剂残留、后处理\n溶液聚合 ｜ 单体 + 引发剂 + 溶剂 ｜ 溶液相 ｜ 溶液或沉淀 ｜ 溶剂回收、分子量偏低\n图 1　乳液聚合与悬浮聚合的体系比较：分散尺度差三个数量级（北化《高分子化学·重点内容》课件）\n一眼判别法：配方里有水、有乳化剂（如十二烷基硫酸钠）、引发剂是过硫酸钾，一定是乳液聚合；有水、有分散剂（如聚乙烯醇、碳酸镁）、引发剂是油溶性的 AIBN 或 BPO，一定是悬浮聚合；全是单体无溶剂是本体的悬浮？不，是本体；有大量溶剂（如甲苯、环己烷）则是溶液聚合。\n图 2　悬浮聚合与乳液聚合的成粒过程示意（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"溶液聚合与沉淀聚合（简答）"},{"id":"gaohua05n08","label":"方法选择的依据（简答、论述）","stars":3,"point":"产物形态、传热、成本、环保","imgs":[],"quiz":[{"id":"gaohua05-026","type":"essay","match":true},{"id":"gaohua05-019","type":"short","match":true},{"id":"gaohua05-020","type":"short","match":true}],"notes":[{"h":"表 4　方法选择的三条判据","t":"判据 ｜ 指向的方法 ｜ 示例\n要最高纯度、光学或医用 ｜ 本体聚合 ｜ PMMA 板、PS 棒\n要珠状颗粒、省去造粒 ｜ 悬浮聚合 ｜ PVC、PS 珠粒、离子交换树脂白球\n要乳胶或直接做涂料、胶黏剂 ｜ 乳液聚合 ｜ 丁苯胶乳、丙烯酸酯乳液、ABS 接枝\n要低粘度、便于连续或涂布 ｜ 溶液聚合 ｜ 丙烯酸树脂溶液、PVAc 溶液"},{"h":"一、本章坐标：同一反应，四种“场地”","t":"前三章讲的是分子怎么长，本章讲的是让它们在什么地方长。反应机理不变，换了场地之后，传热、粘度、产物形态、成本全变了。工业上选哪一种，往往不是因为化学更好，而是因为工程上更划算。\n逻辑链：① 体系的相态（单体、聚合物、水、助剂谁在谁里） → ② 分散方式（机械搅拌还是乳化剂胶束） → ③ 反应场所（本体、颗粒、胶束、溶液） → ④ 产物形态（块状、珠状、乳胶、溶液） → ⑤ 工程取舍（传热、粘度、成本、后处理）读法：读法：把四种方法当成四个“反应器”，每个都问三件事——热能不能散出去、粘度会不会失控、产物怎么拿出来。这三问就是简答题的骨架。\n命题口径本章分值不高但极稳：选择题考“给一套配方判断方法与机理”（北化几乎每年一题），简答题考“乳液聚合为什么能同时高速率与高分子量”。这两类题吃透，本章就结束了。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"方法选择的依据（简答、论述）"}],"logic":{"question":"既定聚合机理怎样在反应器中实施，同时解决散热、分散、速率和分子量问题？","role":"从“链怎么长”转向“工业上怎么做”；不是新机理，而是对前两章机理的工程实现。","input":"自由基/逐步聚合动力学与热效应","output":"本体、溶液、悬浮、乳液四种方法的组分、场所和工艺选择","prev":"gaohua04","next":"gaohua06","links":[{"cid":"gaohua03","text":"乳液聚合的高速度高分子量必须回到双基终止解释"},{"cid":"gaohua02","text":"熔融、溶液、界面缩聚是逐步聚合的实施接口"}],"focus":["四种方法的组分、引发剂溶解性和聚合场所","悬浮与乳液聚合的分散/成核区别","乳液聚合三阶段及高速率、高分子量原因"],"common":["比较悬浮聚合和乳液聚合的微球形成机理","画乳液聚合三阶段并解释 Rp 变化","针对散热、产品形态和纯度选择聚合方法"],"examRefs":["past2023-015","past2023-016","past2022-007"]},"examRefs":["past2023-015","past2023-016","past2022-007"],"sourceNodeCount":8,"audit":{"sourceNodes":8,"added":0,"nodes":8,"withQuiz":8,"examRefs":3,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua06":{"title":"离子型聚合","subject":"gaohua","nodes":[{"id":"gaohua06n01","label":"离子聚合的三大特征（填空、简答）","stars":5,"point":"快引发、快增长、难终止（阴离子无终止）","imgs":["img/map/m086.jpg","img/map/m087.jpg","img/map/m088.jpg"],"quiz":[{"id":"gaohua06-009","type":"fill","match":true},{"id":"gaohua06-010","type":"fill","match":true},{"id":"gaohua06-004","type":"tf","match":true}],"notes":[{"h":"表 2　三种连锁聚合的特征对比（简答必背）","t":"特征 ｜ 自由基聚合 ｜ 阴离子聚合 ｜ 阳离子聚合\n引发 ｜ 慢引发（引发剂分解控速） ｜ 快引发（瞬时完成） ｜ 快引发（需共引发剂）\n增长 ｜ 快，活化能约 20 至 40 kJ/mol ｜ 快 ｜ 极快，活化能很低\n终止 ｜ 速终止（双基终止） ｜ 不终止（除杂质外） ｜ 难终止，主要靠转移\n转移 ｜ 有，四种对象 ｜ 几乎没有 ｜ 极易向单体转移\n分子量分布 ｜ 较宽，d 约 2 至 5 ｜ 极窄，d 可至 1.05 ｜ 宽\n温度影响 ｜ 升温快而短 ｜ 低温有利（抑制杂质与副反应） ｜ 必须低温，否则无高分子量"},{"h":"四、阴离子聚合：唯一能做“精确制造”的聚合","t":"阴离子聚合的引发剂有四类：碱金属（Na、Li）直接给电子；有机锂（正丁基锂）直接加成；萘钠这类芳香族自由基负离子，先给电子生成自由基负离子，再偶合成双负离子；格氏试剂（RMgX）。其中萘钠引发丁二烯是经典反应式题：\n萘钠 → Na⁺ + 萘⁻·；萘⁻· + CH₂=CH—CH=CH₂ → ·CH₂—CH=CH—CH₂⁻Na⁺ → 偶合为 Na⁺⁻CH₂—CH=CH—CH₂—CH₂—CH=CH—CH₂⁻Na⁺\n图 2　萘钠引发三步完整反应式：①Na 与萘在 THF 中发生电子转移，生成萘自由基负离子 Na⁺；②自由基负离子把电子转给苯乙烯，生成单体自由基负离子；③两个自由基偶合，生成两端带负电的双阴离子（北化《高分子化学·重点内容》课件第 4.2.2.1 节）\n图 3　阴离子加成引发反应式：以正丁基锂（n-BuLi）为例，CH₃CH₂CH₂CH₂⁻Li⁺ + H₂C=CH(Ph) → n-BuCH₂—CH⁻(Ph)Li⁺（electron addition）；正丁基锂是最常用的阴离子聚合引发剂，可溶于非极性溶剂。同页还列有机金属化合物 MtR、格氏试剂 RMgX、金属氨基化合物 MtNH₂、烷氧阴离子 RO⁻／PhO⁻（北化《高分子化学·重点内容》课件第 4.2.2.2 节）\n这条式的要点是“电子转移 + 偶合”，产物是一个两端都带负电的双负离子，两个方向同时增长。答题时少写偶合这一步，就会丢掉一半分。\n阴离子聚合的特征可以概括为四个字：快、长、不终止、窄。快引发——引发速率远大于增长速率，所有链几乎同时开始；长增长——链一边长一边等单体；不终止——没有自发终止，也没有 disproportionation，只有杂质或人为加水才终止；窄分布——因为同时开始、同时结束，分子量分布接近泊松分布，d 可小到 1.05。\n正因为“不终止”，才叫活性聚合：聚合结束后再加新单体，链会继续长。用这个性质可以做嵌段共聚物（SBS）、端基官能化聚合物（遥爪聚合物）、以及分子量精确的标样。\n聚合度的计算极简单，因为引发剂分子数等于链数：Xn = n(单体)/n(引发剂)。工业上做窄分布 PS 标样就用这个式子反算引发剂用量。注意若体系含微量杂质（如水、醇），会先消耗掉一部分引发剂，实际 Xn 偏大，所以计算题常给出“含水 1×10⁻⁴ mol/L”这样的条件让你扣除。\n例题（北化期末原题）：一次性投料 10 L、浓度 1.25 mol/L 的苯乙烯-四氢呋喃溶液（含水 1×10⁻⁴ mol/L），要制备聚合度 800 的 PS，需加浓度 0.4 mol/L 的萘钠多少毫升？\n解：所需引发剂物质的量 = 单体总量/DP = 1.25×10/800 = 0.03125 mol；杂质水消耗的引发剂为 1×10⁻⁴×10 = 0.001 mol；合计 0.03225 mol；体积 = 0…"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"离子聚合的三大特征（填空、简答）"},{"id":"gaohua06n02","label":"阴离子的引发体系（反应式、选择）","stars":4,"point":"碱金属、有机锂、萘钠、格氏试剂","imgs":["img/map/m089.jpg","img/map/m090.jpg","img/map/m091.jpg"],"quiz":[{"id":"gaohua06-026","type":"essay","match":true},{"id":"gaohua06-019","type":"short","match":true},{"id":"gaohua06-021","type":"short","match":true}],"notes":[{"h":"【真题 4】写出萘钠引发丁二烯聚合的引发反应式。","t":"来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·反应与制备题第 4 题（附标准答案）\n参考答案与给分点：萘钠解离出 Na⁺ 与萘自由基负离子；萘自由基负离子把电子转移给丁二烯，生成丁二烯自由基负离子；两个自由基负离子偶合，形成两端带负电的双负离子，随后向两侧增长。给分点 3 分：电子转移 1 分、自由基负离子 1 分、偶合成双负离子 1 分。"},{"h":"四、阴离子聚合：唯一能做“精确制造”的聚合","t":"阴离子聚合的引发剂有四类：碱金属（Na、Li）直接给电子；有机锂（正丁基锂）直接加成；萘钠这类芳香族自由基负离子，先给电子生成自由基负离子，再偶合成双负离子；格氏试剂（RMgX）。其中萘钠引发丁二烯是经典反应式题：\n萘钠 → Na⁺ + 萘⁻·；萘⁻· + CH₂=CH—CH=CH₂ → ·CH₂—CH=CH—CH₂⁻Na⁺ → 偶合为 Na⁺⁻CH₂—CH=CH—CH₂—CH₂—CH=CH—CH₂⁻Na⁺\n图 2　萘钠引发三步完整反应式：①Na 与萘在 THF 中发生电子转移，生成萘自由基负离子 Na⁺；②自由基负离子把电子转给苯乙烯，生成单体自由基负离子；③两个自由基偶合，生成两端带负电的双阴离子（北化《高分子化学·重点内容》课件第 4.2.2.1 节）\n图 3　阴离子加成引发反应式：以正丁基锂（n-BuLi）为例，CH₃CH₂CH₂CH₂⁻Li⁺ + H₂C=CH(Ph) → n-BuCH₂—CH⁻(Ph)Li⁺（electron addition）；正丁基锂是最常用的阴离子聚合引发剂，可溶于非极性溶剂。同页还列有机金属化合物 MtR、格氏试剂 RMgX、金属氨基化合物 MtNH₂、烷氧阴离子 RO⁻／PhO⁻（北化《高分子化学·重点内容》课件第 4.2.2.2 节）\n这条式的要点是“电子转移 + 偶合”，产物是一个两端都带负电的双负离子，两个方向同时增长。答题时少写偶合这一步，就会丢掉一半分。\n阴离子聚合的特征可以概括为四个字：快、长、不终止、窄。快引发——引发速率远大于增长速率，所有链几乎同时开始；长增长——链一边长一边等单体；不终止——没有自发终止，也没有 disproportionation，只有杂质或人为加水才终止；窄分布——因为同时开始、同时结束，分子量分布接近泊松分布，d 可小到 1.05。\n正因为“不终止”，才叫活性聚合：聚合结束后再加新单体，链会继续长。用这个性质可以做嵌段共聚物（SBS）、端基官能化聚合物（遥爪聚合物）、以及分子量精确的标样。\n聚合度的计算极简单，因为引发剂分子数等于链数：Xn = n(单体)/n(引发剂)。工业上做窄分布 PS 标样就用这个式子反算引发剂用量。注意若体系含微量杂质（如水、醇），会先消耗掉一部分引发剂，实际 Xn 偏大，所以计算题常给出“含水 1×10⁻⁴ mol/L”这样的条件让你扣除。\n例题（北化期末原题）：一次性投料 10 L、浓度 1.25 mol/L 的苯乙烯-四氢呋喃溶液（含水 1×10⁻⁴ mol/L），要制备聚合度 800 的 PS，需加浓度 0.4 mol/L 的萘钠多少毫升？\n解：所需引发剂物质的量 = 单体总量/DP = 1.25×10/800 = 0.03125 mol；杂质水消耗的引发剂为 1×10⁻⁴×10 = 0.001 mol；合计 0.03225 mol；体积 = 0…"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"阴离子的引发体系（反应式、选择）"},{"id":"gaohua06n03","label":"离子对形态与溶剂极性（简答、论述）","stars":4,"point":"极性越大越松散，活性越高、立构越差","imgs":[],"quiz":[{"id":"gaohua06-007","type":"term","match":true},{"id":"gaohua06-026","type":"essay","match":true},{"id":"gaohua06-021","type":"short","match":true}],"notes":[{"h":"一、本章坐标：从“自由基”换成“离子”，规则全变","t":"自由基带一个未成对电子，行为对称；离子带整电荷，必须与抗衡离子共存，于是“离子对”成了本章的枢纽概念。引发剂、溶剂极性、温度，都是通过改变离子对的紧密程度来改变速率与立构规整性的。\n逻辑链：① 引发剂与共引发剂（决定能不能引发、引发快慢） → ② 离子对形态（紧密对、松散对、自由离子，活性递增） → ③ 增长与终止（阴离子难终止、阳离子易向单体转移） → ④ 分子量控制（阴离子靠计量，阳离子靠温度与转移） → ⑤ 活性聚合（无杂质、无终止时可做窄分布与嵌段） → ⑥ 开环聚合（环张力驱动，本质仍是离子型连锁）读法：读法：阴离子看“稳定”，阳离子看“不稳定”。阴离子的关键是让碳负离子活下去，阳离子的关键是别让它被单体抢走质子。抓住了这个对立，后面所有现象都能推。\n命题口径本章在 866 中以填空、选择、反应式为主：萘钠引发丁二烯的引发式、丁基橡胶的单体与机理、活性阴离子的聚合度计算、离子聚合的“快引发、快增长、难终止”三大特征几乎年年见。开环聚合虽无独立章，但真题里偶有出现（三四元环的驱动力、环氧丙烷只能得低聚物）。"},{"h":"三、离子对：一个被忽略但决定一切的变量","t":"离子聚合的活性中心不是一个自由的碳正离子或碳负离子，而是与抗衡离子（反离子）靠静电作用绑在一起的“离子对”。按结合紧密程度分三态：紧密离子对（两者紧贴，活性最低）、松散离子对（隔着一层溶剂化分子）、自由离子（完全解离，活性最高）。\n溶剂极性是关键。介电常数大的溶剂（如四氢呋喃、二氯甲烷）能把离子对拉开，活性上升、聚合速率加快；但同时立构选择性下降，因为自由离子没有空间约束。所以工业上做高顺式聚丁二烯时反而用非极性溶剂（己烷），让离子对保持紧密，立构才规整。\n这条规律在第 3 章也出现过：向自由基体系加四氢呋喃不提速，因为自由基不带电荷；向阴离子体系加四氢呋喃则明显提速。北化的期末题就是拿这一点做对比，考你是否理解“离子对”这个概念的存在。\n图 1　抗衡离子与离子对的存在对链增长的影响：同时影响速率与立构（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"离子对形态与溶剂极性（简答、论述）"},{"id":"gaohua06n04","label":"活性阴离子的条件与计算（计算、简答）","stars":5,"point":"Xn = n[M]/n[I]，需绝对无杂质","imgs":["img/map/m092.jpg","img/map/m093.jpg"],"quiz":[{"id":"gaohua06-026","type":"essay","match":true},{"id":"gaohua06-007","type":"term","match":true},{"id":"gaohua06-022","type":"short","match":true}],"notes":[{"h":"四、阴离子聚合：唯一能做“精确制造”的聚合","t":"阴离子聚合的引发剂有四类：碱金属（Na、Li）直接给电子；有机锂（正丁基锂）直接加成；萘钠这类芳香族自由基负离子，先给电子生成自由基负离子，再偶合成双负离子；格氏试剂（RMgX）。其中萘钠引发丁二烯是经典反应式题：\n萘钠 → Na⁺ + 萘⁻·；萘⁻· + CH₂=CH—CH=CH₂ → ·CH₂—CH=CH—CH₂⁻Na⁺ → 偶合为 Na⁺⁻CH₂—CH=CH—CH₂—CH₂—CH=CH—CH₂⁻Na⁺\n图 2　萘钠引发三步完整反应式：①Na 与萘在 THF 中发生电子转移，生成萘自由基负离子 Na⁺；②自由基负离子把电子转给苯乙烯，生成单体自由基负离子；③两个自由基偶合，生成两端带负电的双阴离子（北化《高分子化学·重点内容》课件第 4.2.2.1 节）\n图 3　阴离子加成引发反应式：以正丁基锂（n-BuLi）为例，CH₃CH₂CH₂CH₂⁻Li⁺ + H₂C=CH(Ph) → n-BuCH₂—CH⁻(Ph)Li⁺（electron addition）；正丁基锂是最常用的阴离子聚合引发剂，可溶于非极性溶剂。同页还列有机金属化合物 MtR、格氏试剂 RMgX、金属氨基化合物 MtNH₂、烷氧阴离子 RO⁻／PhO⁻（北化《高分子化学·重点内容》课件第 4.2.2.2 节）\n这条式的要点是“电子转移 + 偶合”，产物是一个两端都带负电的双负离子，两个方向同时增长。答题时少写偶合这一步，就会丢掉一半分。\n阴离子聚合的特征可以概括为四个字：快、长、不终止、窄。快引发——引发速率远大于增长速率，所有链几乎同时开始；长增长——链一边长一边等单体；不终止——没有自发终止，也没有 disproportionation，只有杂质或人为加水才终止；窄分布——因为同时开始、同时结束，分子量分布接近泊松分布，d 可小到 1.05。\n正因为“不终止”，才叫活性聚合：聚合结束后再加新单体，链会继续长。用这个性质可以做嵌段共聚物（SBS）、端基官能化聚合物（遥爪聚合物）、以及分子量精确的标样。\n聚合度的计算极简单，因为引发剂分子数等于链数：Xn = n(单体)/n(引发剂)。工业上做窄分布 PS 标样就用这个式子反算引发剂用量。注意若体系含微量杂质（如水、醇），会先消耗掉一部分引发剂，实际 Xn 偏大，所以计算题常给出“含水 1×10⁻⁴ mol/L”这样的条件让你扣除。\n例题（北化期末原题）：一次性投料 10 L、浓度 1.25 mol/L 的苯乙烯-四氢呋喃溶液（含水 1×10⁻⁴ mol/L），要制备聚合度 800 的 PS，需加浓度 0.4 mol/L 的萘钠多少毫升？\n解：所需引发剂物质的量 = 单体总量/DP = 1.25×10/800 = 0.03125 mol；杂质水消耗的引发剂为 1×10⁻⁴×10 = 0.001 mol；合计 0.03225 mol；体积 = 0…"},{"h":"一、本章坐标：从“自由基”换成“离子”，规则全变","t":"自由基带一个未成对电子，行为对称；离子带整电荷，必须与抗衡离子共存，于是“离子对”成了本章的枢纽概念。引发剂、溶剂极性、温度，都是通过改变离子对的紧密程度来改变速率与立构规整性的。\n逻辑链：① 引发剂与共引发剂（决定能不能引发、引发快慢） → ② 离子对形态（紧密对、松散对、自由离子，活性递增） → ③ 增长与终止（阴离子难终止、阳离子易向单体转移） → ④ 分子量控制（阴离子靠计量，阳离子靠温度与转移） → ⑤ 活性聚合（无杂质、无终止时可做窄分布与嵌段） → ⑥ 开环聚合（环张力驱动，本质仍是离子型连锁）读法：读法：阴离子看“稳定”，阳离子看“不稳定”。阴离子的关键是让碳负离子活下去，阳离子的关键是别让它被单体抢走质子。抓住了这个对立，后面所有现象都能推。\n命题口径本章在 866 中以填空、选择、反应式为主：萘钠引发丁二烯的引发式、丁基橡胶的单体与机理、活性阴离子的聚合度计算、离子聚合的“快引发、快增长、难终止”三大特征几乎年年见。开环聚合虽无独立章，但真题里偶有出现（三四元环的驱动力、环氧丙烷只能得低聚物）。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"活性阴离子的条件与计算（计算、简答）"},{"id":"gaohua06n05","label":"SBS三嵌段与热塑性弹性体（简答、制备题）","stars":4,"point":"苯乙烯-丁二烯-苯乙烯，两端硬中间软","imgs":["img/map/m094.jpg","img/map/m095.jpg"],"quiz":[{"id":"gaohua06-014","type":"fill","match":true},{"id":"gaohua06-025","type":"calc","match":true}],"notes":[{"h":"四、阴离子聚合：唯一能做“精确制造”的聚合","t":"阴离子聚合的引发剂有四类：碱金属（Na、Li）直接给电子；有机锂（正丁基锂）直接加成；萘钠这类芳香族自由基负离子，先给电子生成自由基负离子，再偶合成双负离子；格氏试剂（RMgX）。其中萘钠引发丁二烯是经典反应式题：\n萘钠 → Na⁺ + 萘⁻·；萘⁻· + CH₂=CH—CH=CH₂ → ·CH₂—CH=CH—CH₂⁻Na⁺ → 偶合为 Na⁺⁻CH₂—CH=CH—CH₂—CH₂—CH=CH—CH₂⁻Na⁺\n图 2　萘钠引发三步完整反应式：①Na 与萘在 THF 中发生电子转移，生成萘自由基负离子 Na⁺；②自由基负离子把电子转给苯乙烯，生成单体自由基负离子；③两个自由基偶合，生成两端带负电的双阴离子（北化《高分子化学·重点内容》课件第 4.2.2.1 节）\n图 3　阴离子加成引发反应式：以正丁基锂（n-BuLi）为例，CH₃CH₂CH₂CH₂⁻Li⁺ + H₂C=CH(Ph) → n-BuCH₂—CH⁻(Ph)Li⁺（electron addition）；正丁基锂是最常用的阴离子聚合引发剂，可溶于非极性溶剂。同页还列有机金属化合物 MtR、格氏试剂 RMgX、金属氨基化合物 MtNH₂、烷氧阴离子 RO⁻／PhO⁻（北化《高分子化学·重点内容》课件第 4.2.2.2 节）\n这条式的要点是“电子转移 + 偶合”，产物是一个两端都带负电的双负离子，两个方向同时增长。答题时少写偶合这一步，就会丢掉一半分。\n阴离子聚合的特征可以概括为四个字：快、长、不终止、窄。快引发——引发速率远大于增长速率，所有链几乎同时开始；长增长——链一边长一边等单体；不终止——没有自发终止，也没有 disproportionation，只有杂质或人为加水才终止；窄分布——因为同时开始、同时结束，分子量分布接近泊松分布，d 可小到 1.05。\n正因为“不终止”，才叫活性聚合：聚合结束后再加新单体，链会继续长。用这个性质可以做嵌段共聚物（SBS）、端基官能化聚合物（遥爪聚合物）、以及分子量精确的标样。\n聚合度的计算极简单，因为引发剂分子数等于链数：Xn = n(单体)/n(引发剂)。工业上做窄分布 PS 标样就用这个式子反算引发剂用量。注意若体系含微量杂质（如水、醇），会先消耗掉一部分引发剂，实际 Xn 偏大，所以计算题常给出“含水 1×10⁻⁴ mol/L”这样的条件让你扣除。\n例题（北化期末原题）：一次性投料 10 L、浓度 1.25 mol/L 的苯乙烯-四氢呋喃溶液（含水 1×10⁻⁴ mol/L），要制备聚合度 800 的 PS，需加浓度 0.4 mol/L 的萘钠多少毫升？\n解：所需引发剂物质的量 = 单体总量/DP = 1.25×10/800 = 0.03125 mol；杂质水消耗的引发剂为 1×10⁻⁴×10 = 0.001 mol；合计 0.03225 mol；体积 = 0…"},{"h":"表 2　三种连锁聚合的特征对比（简答必背）","t":"特征 ｜ 自由基聚合 ｜ 阴离子聚合 ｜ 阳离子聚合\n引发 ｜ 慢引发（引发剂分解控速） ｜ 快引发（瞬时完成） ｜ 快引发（需共引发剂）\n增长 ｜ 快，活化能约 20 至 40 kJ/mol ｜ 快 ｜ 极快，活化能很低\n终止 ｜ 速终止（双基终止） ｜ 不终止（除杂质外） ｜ 难终止，主要靠转移\n转移 ｜ 有，四种对象 ｜ 几乎没有 ｜ 极易向单体转移\n分子量分布 ｜ 较宽，d 约 2 至 5 ｜ 极窄，d 可至 1.05 ｜ 宽\n温度影响 ｜ 升温快而短 ｜ 低温有利（抑制杂质与副反应） ｜ 必须低温，否则无高分子量"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"SBS 三嵌段与热塑性弹性体（简答、制备题）"},{"id":"gaohua06n06","label":"阳离子的引发与共引发剂（填空、简答）","stars":4,"point":"Lewis 酸需质子源或卤代烃","imgs":["img/map/m096.jpg"],"quiz":[{"id":"gaohua06-004","type":"tf","match":true},{"id":"gaohua06-026","type":"essay","match":true},{"id":"gaohua06-021","type":"short","match":true}],"notes":[{"h":"一、本章坐标：从“自由基”换成“离子”，规则全变","t":"自由基带一个未成对电子，行为对称；离子带整电荷，必须与抗衡离子共存，于是“离子对”成了本章的枢纽概念。引发剂、溶剂极性、温度，都是通过改变离子对的紧密程度来改变速率与立构规整性的。\n逻辑链：① 引发剂与共引发剂（决定能不能引发、引发快慢） → ② 离子对形态（紧密对、松散对、自由离子，活性递增） → ③ 增长与终止（阴离子难终止、阳离子易向单体转移） → ④ 分子量控制（阴离子靠计量，阳离子靠温度与转移） → ⑤ 活性聚合（无杂质、无终止时可做窄分布与嵌段） → ⑥ 开环聚合（环张力驱动，本质仍是离子型连锁）读法：读法：阴离子看“稳定”，阳离子看“不稳定”。阴离子的关键是让碳负离子活下去，阳离子的关键是别让它被单体抢走质子。抓住了这个对立，后面所有现象都能推。\n命题口径本章在 866 中以填空、选择、反应式为主：萘钠引发丁二烯的引发式、丁基橡胶的单体与机理、活性阴离子的聚合度计算、离子聚合的“快引发、快增长、难终止”三大特征几乎年年见。开环聚合虽无独立章，但真题里偶有出现（三四元环的驱动力、环氧丙烷只能得低聚物）。"},{"h":"五、阳离子聚合：一手好牌，打得很难","t":"阳离子引发需要“双组分”：主引发剂是 Lewis 酸（BF₃、AlCl₃、SnCl₄、TiCl₄），共引发剂是质子源（水、醇、氯化氢）或卤代烃（RCl）。两者先反应生成质子或碳正离子，再引发单体。所以“痕量水”在阳离子体系里不是杂质而是必需品——北化期末题专门给出“AlCl₃ + 痕量水”这个条件。\n阳离子引发的反应式（以 BF₃/H₂O 引发异丁烯为例）：BF₃ + H₂O ⇌ H⁺[BF₃OH]⁻（生成质子酸）；H⁺[BF₃OH]⁻ + CH₂=C(CH₃)₂ → (CH₃)₃C⁺[BF₃OH]⁻（质子加到含氢多的碳上，生成叔碳正离子，稳定性最好）；随后叔碳正离子反复插入异丁烯，每次插入都再生叔碳正离子。三氯化铝体系同理：AlCl₃ + H₂O ⇌ H⁺[AlCl₃OH]⁻。\n阳离子增长极快，但终止与转移也极容易。最致命的是向单体转移：增长链的碳正离子从单体上夺取氢（或质子），自己变成稳定分子，同时把单体变成新的碳正离子。异丁烯聚合就是典型——转移极快，常温下几乎只能得到低分子量产物，所以工业上必须在 −100 ℃ 左右低温聚合，才能得到丁基橡胶用的高分子量聚异丁烯。\n丁基橡胶由异丁烯与少量异戊二烯（约 2% 至 3%）经阳离子共聚而成，引入的异戊二烯单元提供双键供后续硫化。这个配方要能默写，填空题常考“两种单体 + 机理”。\n阳离子聚合还有一个特点：链转移后活性中心不消失，所以“难终止、易转移”。这与阴离子的“不终止、不转移”正好相反。答题时把这两句并排写，对比分就稳了。\n图 6　阳离子聚合的特征：快引发、快增长、难终止、易转移（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"阳离子的引发与共引发剂（填空、简答）"},{"id":"gaohua06n07","label":"阳离子向单体转移与丁基橡胶（填空、简答）","stars":4,"point":"异丁烯-异戊二烯，阳离子共聚","imgs":[],"quiz":[{"id":"gaohua06-003","type":"tf","match":true},{"id":"gaohua06-026","type":"essay","match":true},{"id":"gaohua06-024","type":"short","match":true}],"notes":[{"h":"五、阳离子聚合：一手好牌，打得很难","t":"阳离子引发需要“双组分”：主引发剂是 Lewis 酸（BF₃、AlCl₃、SnCl₄、TiCl₄），共引发剂是质子源（水、醇、氯化氢）或卤代烃（RCl）。两者先反应生成质子或碳正离子，再引发单体。所以“痕量水”在阳离子体系里不是杂质而是必需品——北化期末题专门给出“AlCl₃ + 痕量水”这个条件。\n阳离子引发的反应式（以 BF₃/H₂O 引发异丁烯为例）：BF₃ + H₂O ⇌ H⁺[BF₃OH]⁻（生成质子酸）；H⁺[BF₃OH]⁻ + CH₂=C(CH₃)₂ → (CH₃)₃C⁺[BF₃OH]⁻（质子加到含氢多的碳上，生成叔碳正离子，稳定性最好）；随后叔碳正离子反复插入异丁烯，每次插入都再生叔碳正离子。三氯化铝体系同理：AlCl₃ + H₂O ⇌ H⁺[AlCl₃OH]⁻。\n阳离子增长极快，但终止与转移也极容易。最致命的是向单体转移：增长链的碳正离子从单体上夺取氢（或质子），自己变成稳定分子，同时把单体变成新的碳正离子。异丁烯聚合就是典型——转移极快，常温下几乎只能得到低分子量产物，所以工业上必须在 −100 ℃ 左右低温聚合，才能得到丁基橡胶用的高分子量聚异丁烯。\n丁基橡胶由异丁烯与少量异戊二烯（约 2% 至 3%）经阳离子共聚而成，引入的异戊二烯单元提供双键供后续硫化。这个配方要能默写，填空题常考“两种单体 + 机理”。\n阳离子聚合还有一个特点：链转移后活性中心不消失，所以“难终止、易转移”。这与阴离子的“不终止、不转移”正好相反。答题时把这两句并排写，对比分就稳了。\n图 6　阳离子聚合的特征：快引发、快增长、难终止、易转移（北化《高分子化学·重点内容》课件）"},{"h":"一、本章坐标：从“自由基”换成“离子”，规则全变","t":"自由基带一个未成对电子，行为对称；离子带整电荷，必须与抗衡离子共存，于是“离子对”成了本章的枢纽概念。引发剂、溶剂极性、温度，都是通过改变离子对的紧密程度来改变速率与立构规整性的。\n逻辑链：① 引发剂与共引发剂（决定能不能引发、引发快慢） → ② 离子对形态（紧密对、松散对、自由离子，活性递增） → ③ 增长与终止（阴离子难终止、阳离子易向单体转移） → ④ 分子量控制（阴离子靠计量，阳离子靠温度与转移） → ⑤ 活性聚合（无杂质、无终止时可做窄分布与嵌段） → ⑥ 开环聚合（环张力驱动，本质仍是离子型连锁）读法：读法：阴离子看“稳定”，阳离子看“不稳定”。阴离子的关键是让碳负离子活下去，阳离子的关键是别让它被单体抢走质子。抓住了这个对立，后面所有现象都能推。\n命题口径本章在 866 中以填空、选择、反应式为主：萘钠引发丁二烯的引发式、丁基橡胶的单体与机理、活性阴离子的聚合度计算、离子聚合的“快引发、快增长、难终止”三大特征几乎年年见。开环聚合虽无独立章，但真题里偶有出现（三四元环的驱动力、环氧丙烷只能得低聚物）。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"阳离子向单体转移与丁基橡胶（填空、简答）"},{"id":"gaohua06n08","label":"温度对离子聚合的影响（简答）","stars":3,"point":"低温有利：抑制转移、提高立构","imgs":["img/map/m097.jpg","img/map/m098.jpg"],"quiz":[{"id":"gaohua06-004","type":"tf","match":true},{"id":"gaohua06-009","type":"fill","match":true},{"id":"gaohua06-010","type":"fill","match":true}],"notes":[{"h":"表 2　三种连锁聚合的特征对比（简答必背）","t":"特征 ｜ 自由基聚合 ｜ 阴离子聚合 ｜ 阳离子聚合\n引发 ｜ 慢引发（引发剂分解控速） ｜ 快引发（瞬时完成） ｜ 快引发（需共引发剂）\n增长 ｜ 快，活化能约 20 至 40 kJ/mol ｜ 快 ｜ 极快，活化能很低\n终止 ｜ 速终止（双基终止） ｜ 不终止（除杂质外） ｜ 难终止，主要靠转移\n转移 ｜ 有，四种对象 ｜ 几乎没有 ｜ 极易向单体转移\n分子量分布 ｜ 较宽，d 约 2 至 5 ｜ 极窄，d 可至 1.05 ｜ 宽\n温度影响 ｜ 升温快而短 ｜ 低温有利（抑制杂质与副反应） ｜ 必须低温，否则无高分子量"},{"h":"四、阴离子聚合：唯一能做“精确制造”的聚合","t":"阴离子聚合的引发剂有四类：碱金属（Na、Li）直接给电子；有机锂（正丁基锂）直接加成；萘钠这类芳香族自由基负离子，先给电子生成自由基负离子，再偶合成双负离子；格氏试剂（RMgX）。其中萘钠引发丁二烯是经典反应式题：\n萘钠 → Na⁺ + 萘⁻·；萘⁻· + CH₂=CH—CH=CH₂ → ·CH₂—CH=CH—CH₂⁻Na⁺ → 偶合为 Na⁺⁻CH₂—CH=CH—CH₂—CH₂—CH=CH—CH₂⁻Na⁺\n图 2　萘钠引发三步完整反应式：①Na 与萘在 THF 中发生电子转移，生成萘自由基负离子 Na⁺；②自由基负离子把电子转给苯乙烯，生成单体自由基负离子；③两个自由基偶合，生成两端带负电的双阴离子（北化《高分子化学·重点内容》课件第 4.2.2.1 节）\n图 3　阴离子加成引发反应式：以正丁基锂（n-BuLi）为例，CH₃CH₂CH₂CH₂⁻Li⁺ + H₂C=CH(Ph) → n-BuCH₂—CH⁻(Ph)Li⁺（electron addition）；正丁基锂是最常用的阴离子聚合引发剂，可溶于非极性溶剂。同页还列有机金属化合物 MtR、格氏试剂 RMgX、金属氨基化合物 MtNH₂、烷氧阴离子 RO⁻／PhO⁻（北化《高分子化学·重点内容》课件第 4.2.2.2 节）\n这条式的要点是“电子转移 + 偶合”，产物是一个两端都带负电的双负离子，两个方向同时增长。答题时少写偶合这一步，就会丢掉一半分。\n阴离子聚合的特征可以概括为四个字：快、长、不终止、窄。快引发——引发速率远大于增长速率，所有链几乎同时开始；长增长——链一边长一边等单体；不终止——没有自发终止，也没有 disproportionation，只有杂质或人为加水才终止；窄分布——因为同时开始、同时结束，分子量分布接近泊松分布，d 可小到 1.05。\n正因为“不终止”，才叫活性聚合：聚合结束后再加新单体，链会继续长。用这个性质可以做嵌段共聚物（SBS）、端基官能化聚合物（遥爪聚合物）、以及分子量精确的标样。\n聚合度的计算极简单，因为引发剂分子数等于链数：Xn = n(单体)/n(引发剂)。工业上做窄分布 PS 标样就用这个式子反算引发剂用量。注意若体系含微量杂质（如水、醇），会先消耗掉一部分引发剂，实际 Xn 偏大，所以计算题常给出“含水 1×10⁻⁴ mol/L”这样的条件让你扣除。\n例题（北化期末原题）：一次性投料 10 L、浓度 1.25 mol/L 的苯乙烯-四氢呋喃溶液（含水 1×10⁻⁴ mol/L），要制备聚合度 800 的 PS，需加浓度 0.4 mol/L 的萘钠多少毫升？\n解：所需引发剂物质的量 = 单体总量/DP = 1.25×10/800 = 0.03125 mol；杂质水消耗的引发剂为 1×10⁻⁴×10 = 0.001 mol；合计 0.03225 mol；体积 = 0…"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"温度对离子聚合的影响（简答）"},{"id":"gaohua06n09","label":"开环聚合的热力学驱动力（填空、简答）","stars":4,"point":"环张力，三四元环最强","imgs":["img/map/m099.jpg","img/map/m100.jpg","img/map/m101.jpg"],"quiz":[{"id":"gaohua06-022","type":"short","match":true},{"id":"gaohua06-004","type":"tf","match":true},{"id":"gaohua06-009","type":"fill","match":true}],"notes":[{"h":"七、开环聚合：环张力驱动的连锁反应","t":"开环聚合是把环状单体打开、连成线形链。它的热力学判据是 ΔG = ΔH − TΔS < 0。开环后熵是减少的（混乱度下降），所以必须靠焓变来驱动——也就是环张力。三、四元环的键角偏离正常值大、张力大，ΔH 负得足够多，聚合容易；五、六元环张力小，热力学上常常“聚合不了”，甚至平衡偏向单体。七元环以上又因构象不利而重新变得可聚合，这就是“环张力随环大小起伏”的规律。\n北化的一道填空正是这个点：三、四元环状单体聚合的主要推动力是环张力（ΔH）；环氧丙烷与环丙烷相比，环丙烷的碳碳键极难打开，而环氧丙烷的碳氧键极性大、易被进攻，但受侧基甲基的位阻与转移影响，通常只能得到低聚物。\n按活性中心分，开环聚合有阴离子开环（环氧乙烷、环氧丙烷，用 KOH 或醇钾引发）、阳离子开环（四氢呋喃、己内酰胺用酸引发）、配位开环（己内酰胺水解或碱催化开环得尼龙 6）、以及开环易位聚合（ROMP，用 Grubbs 催化剂把环烯打开）。\n开环聚合的三条必备反应式：①阴离子开环（环氧乙烷）　RO⁻K⁺ + n CH₂—CH₂—O（环）→ RO(CH₂CH₂O)n⁻K⁺；②己内酰胺碱催化开环　n 己内酰胺 → —(NH(CH₂)₅CO)—n（开环后无小分子析出，与尼龙 66 的缩聚形成对照）；③阳离子开环（四氢呋喃）　THF + H⁺ → HO(CH₂)₄⁺，再逐个插入 THF 环。\n尼龙 6 与尼龙 66 的差别就出在这里：尼龙 66 是己二胺与己二酸的缩聚，尼龙 6 是己内酰胺开环后聚合。同样是聚酰胺，反应类型不同，这正是绪论“判别三步法”的实战检验。"},{"h":"表 2　三种连锁聚合的特征对比（简答必背）","t":"特征 ｜ 自由基聚合 ｜ 阴离子聚合 ｜ 阳离子聚合\n引发 ｜ 慢引发（引发剂分解控速） ｜ 快引发（瞬时完成） ｜ 快引发（需共引发剂）\n增长 ｜ 快，活化能约 20 至 40 kJ/mol ｜ 快 ｜ 极快，活化能很低\n终止 ｜ 速终止（双基终止） ｜ 不终止（除杂质外） ｜ 难终止，主要靠转移\n转移 ｜ 有，四种对象 ｜ 几乎没有 ｜ 极易向单体转移\n分子量分布 ｜ 较宽，d 约 2 至 5 ｜ 极窄，d 可至 1.05 ｜ 宽\n温度影响 ｜ 升温快而短 ｜ 低温有利（抑制杂质与副反应） ｜ 必须低温，否则无高分子量"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"开环聚合的热力学驱动力（填空、简答）"},{"id":"gaohua06n10","label":"开环聚合的类型与品种（选择、制备）","stars":3,"point":"己内酰胺、环氧乙烷、THF、ROMP","imgs":[],"quiz":[{"id":"gaohua06-022","type":"short","match":true},{"id":"gaohua06-025","type":"calc","match":true},{"id":"gaohua06-026","type":"essay","match":true}],"notes":[{"h":"七、开环聚合：环张力驱动的连锁反应","t":"开环聚合是把环状单体打开、连成线形链。它的热力学判据是 ΔG = ΔH − TΔS < 0。开环后熵是减少的（混乱度下降），所以必须靠焓变来驱动——也就是环张力。三、四元环的键角偏离正常值大、张力大，ΔH 负得足够多，聚合容易；五、六元环张力小，热力学上常常“聚合不了”，甚至平衡偏向单体。七元环以上又因构象不利而重新变得可聚合，这就是“环张力随环大小起伏”的规律。\n北化的一道填空正是这个点：三、四元环状单体聚合的主要推动力是环张力（ΔH）；环氧丙烷与环丙烷相比，环丙烷的碳碳键极难打开，而环氧丙烷的碳氧键极性大、易被进攻，但受侧基甲基的位阻与转移影响，通常只能得到低聚物。\n按活性中心分，开环聚合有阴离子开环（环氧乙烷、环氧丙烷，用 KOH 或醇钾引发）、阳离子开环（四氢呋喃、己内酰胺用酸引发）、配位开环（己内酰胺水解或碱催化开环得尼龙 6）、以及开环易位聚合（ROMP，用 Grubbs 催化剂把环烯打开）。\n开环聚合的三条必备反应式：①阴离子开环（环氧乙烷）　RO⁻K⁺ + n CH₂—CH₂—O（环）→ RO(CH₂CH₂O)n⁻K⁺；②己内酰胺碱催化开环　n 己内酰胺 → —(NH(CH₂)₅CO)—n（开环后无小分子析出，与尼龙 66 的缩聚形成对照）；③阳离子开环（四氢呋喃）　THF + H⁺ → HO(CH₂)₄⁺，再逐个插入 THF 环。\n尼龙 6 与尼龙 66 的差别就出在这里：尼龙 66 是己二胺与己二酸的缩聚，尼龙 6 是己内酰胺开环后聚合。同样是聚酰胺，反应类型不同，这正是绪论“判别三步法”的实战检验。"},{"h":"【真题 4】写出萘钠引发丁二烯聚合的引发反应式。","t":"来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·反应与制备题第 4 题（附标准答案）\n参考答案与给分点：萘钠解离出 Na⁺ 与萘自由基负离子；萘自由基负离子把电子转移给丁二烯，生成丁二烯自由基负离子；两个自由基负离子偶合，形成两端带负电的双负离子，随后向两侧增长。给分点 3 分：电子转移 1 分、自由基负离子 1 分、偶合成双负离子 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"开环聚合的类型与品种（选择、制备）"},{"label":"单体对阴离子、阳离子与自由基聚合的选择性","stars":4,"point":"单体能否进行某类聚合取决于双键电子效应、取代基稳定活性中心的能力，以及活泼氢/杂质是否使活性中心终止；不能只用“吸电子就阴离子、供电子就阳离子”一条口诀下结论。","notesTitle":"真题补漏讲解","notes":[{"h":"电子效应＋活性中心稳定性＋副反应","t":"带吸电子共轭基、能稳定负电荷中心的单体常更适合阴离子聚合；能使碳正离子稳定的供电子取代单体常更适合阳离子聚合。苯乙烯、共轭二烯等体系具有多条可能路径，具体仍受引发剂和条件控制。\n\n含 —COOH、—OH 等活泼氢的单体或杂质会与强碱性阴离子活性中心发生质子转移，不能简单当作普通阴离子聚合单体。氯乙烯的工业自由基路线还要结合链转移、树脂形态与工艺解释，不宜只用一条电子效应口诀。"}],"quiz":[{"id":"past2023-007","type":"mcq","match":true},{"id":"past2021-007","type":"mcq","match":true},{"id":"past2022-008","type":"short","match":true}],"added":true,"id":"gaohua06n11","imgs":[],"quizAudited":true,"fullLabel":"单体对阴离子、阳离子与自由基聚合的选择性","importanceBasis":"已录2021—2023真题与课程体系补漏"}],"logic":{"question":"离子活性中心为何对单体和杂质高度敏感？怎样利用无终止实现活性与嵌段设计？","role":"把活性中心的电子效应和离子对环境引入链增长，建立“可控链长与序列”的另一条路径。","input":"自由基基元反应、单体电子效应","output":"阴/阳离子引发与选择性、活性聚合、嵌段及开环聚合","prev":"gaohua05","next":"gaohua07","links":[{"cid":"gaohua03","text":"与自由基对比引发、终止、转移和分子量分布"},{"cid":"gaowu01","text":"SBS 等嵌段结构是高物链序列与相形态的入口"}],"focus":["阴/阳离子引发体系和单体选择性","离子对、溶剂极性与温度效应","活性阴离子条件、Mn 计算和 SBS 设计","开环聚合的热力学驱动力"],"common":["判断单体适合自由基、阴离子或阳离子聚合并说明原因","由单体/引发剂用量和转化率计算理论 Mn","用顺序加料设计嵌段共聚物","比较活性阴离子与自由基聚合的终止和分布"],"examRefs":["past2023-007","past2023-010","past2021-001","past2021-007","past2021-008","past2022-008"]},"examRefs":["past2023-007","past2023-010","past2021-001","past2021-007","past2021-008","past2022-008"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":1,"nodes":11,"withQuiz":11,"examRefs":6,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua07":{"title":"配位聚合","subject":"gaohua","nodes":[{"id":"gaohua07n01","label":"全同、间同、无规立构的定义（名词解释、选择）","stars":5,"point":"看主链两侧甲基的排列是否规律","imgs":["img/map/m102.jpg","img/map/m103.jpg","img/map/m104.jpg"],"quiz":[{"id":"gaohua07-024","type":"short","match":true}],"notes":[{"h":"一、本章坐标：链长成什么形状，由催化剂说了算","t":"前六章解决的是“链有多长”，本章解决“链长成什么形状”。同样是聚丙烯，无规立构的是不能做塑料的橡胶状物，等规立构的却是能做汽车保险杠的工程塑料。差别不在分子量，而在甲基在链上的排列方式。\n逻辑链：① 单体与催化剂配位（烯烃先与过渡金属空位配位，再插入） → ② 活性中心（过渡金属的空位是唯一的反应场所） → ③ 插入方向（决定每个单元的头尾与构型） → ④ 立构选择性（决定全同、间同还是无规） → ⑤ 产品性能（等规度高则结晶、刚硬；无规则 rubbery）读法：读法：本章的逻辑非常线性——催化剂决定空位，空位决定插入方向，方向决定立构，立构决定性能。所有简答题都可以沿这条线答。\n命题口径866 对本章的要求偏基础：立构概念（全同、间同、无规）、Z-N 催化剂的两组分与作用、丙烯为什么不能自由基聚合、乙丙橡胶的共聚机理。极少出复杂计算，但名词与填空一旦丢分很可惜。"},{"h":"三、立构：三种排列，三种材料","t":"把聚乙烯的氢换成甲基，就得到聚丙烯。甲基在链上的排列方式有三种：全部排在主链平面同一侧，叫全同立构（等规）；交替排在两侧，叫间同立构；随机排布，叫无规立构。前两种是立构规整的，能结晶；第三种不能结晶，是橡胶状的无定形物。\n衡量规整程度用立构规整度（等规指数），即规整单元占总单元的分数。工业等规 PP 的等规指数通常在 95% 以上，剩下 5% 的无规部分会影响透明性与韧性。这个数字要能说出来，简答题里常要求“说明等规指数对性能的影响”。\n聚二烯还有一套异构：双键上的基团在同侧为顺式，在两侧为反式。顺式 1,4-聚丁二烯链规整、可结晶，是优良的轮胎胶；反式 1,4-聚异戊二烯就是天然橡胶的主要成分。注意区分“立构”与“顺反”——前者讲手性碳的构型，后者讲双键的几何。\n图 1　配位聚合与定向聚合：立构规整性的来源（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"全同、间同、无规立构的定义（名词解释、选择）"},{"id":"gaohua07n02","label":"立构规整度与等规指数（名词解释、简答）","stars":4,"point":"规整单元所占的分数","imgs":[],"quiz":[{"id":"gaohua07-026","type":"essay","match":true},{"id":"gaohua07-007","type":"term","match":true},{"id":"gaohua07-011","type":"fill","match":true}],"notes":[{"h":"三、立构：三种排列，三种材料","t":"把聚乙烯的氢换成甲基，就得到聚丙烯。甲基在链上的排列方式有三种：全部排在主链平面同一侧，叫全同立构（等规）；交替排在两侧，叫间同立构；随机排布，叫无规立构。前两种是立构规整的，能结晶；第三种不能结晶，是橡胶状的无定形物。\n衡量规整程度用立构规整度（等规指数），即规整单元占总单元的分数。工业等规 PP 的等规指数通常在 95% 以上，剩下 5% 的无规部分会影响透明性与韧性。这个数字要能说出来，简答题里常要求“说明等规指数对性能的影响”。\n聚二烯还有一套异构：双键上的基团在同侧为顺式，在两侧为反式。顺式 1,4-聚丁二烯链规整、可结晶，是优良的轮胎胶；反式 1,4-聚异戊二烯就是天然橡胶的主要成分。注意区分“立构”与“顺反”——前者讲手性碳的构型，后者讲双键的几何。\n图 1　配位聚合与定向聚合：立构规整性的来源（北化《高分子化学·重点内容》课件）"},{"h":"九、易错清单与自测","t":"★★★　能用文字或简图说明全同、间同、无规的区别\n★★★　能说出 Z-N 催化剂两组分的名称、作用与活性中心形成过程\n★★★　能解释丙烯为什么不能自由基聚合，并给出正确替代路线\n★★★　能区分配位聚合与定向聚合两个概念\n★★　能说出三代催化剂的主要差别与等规指数范围\n★★　能说明乙丙橡胶为什么是弹性体\n★★　能区分立构异构与顺反异构\n★　能举出四个配位聚合的工业品种\n与高物的接口本章的立构规整度直接决定高物第五章的结晶能力：等规 PP 能结晶所以刚硬透明，无规 PP 不能结晶所以是软的。读高物结晶章时，回来对照本章的表 3，理解会快很多。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"立构规整度与等规指数（名词解释、简答）"},{"id":"gaohua07n03","label":"顺反异构（聚二烯）（选择、简答）","stars":3,"point":"双键两侧基团的相对位置","imgs":[],"quiz":[],"notes":[{"h":"三、立构：三种排列，三种材料","t":"把聚乙烯的氢换成甲基，就得到聚丙烯。甲基在链上的排列方式有三种：全部排在主链平面同一侧，叫全同立构（等规）；交替排在两侧，叫间同立构；随机排布，叫无规立构。前两种是立构规整的，能结晶；第三种不能结晶，是橡胶状的无定形物。\n衡量规整程度用立构规整度（等规指数），即规整单元占总单元的分数。工业等规 PP 的等规指数通常在 95% 以上，剩下 5% 的无规部分会影响透明性与韧性。这个数字要能说出来，简答题里常要求“说明等规指数对性能的影响”。\n聚二烯还有一套异构：双键上的基团在同侧为顺式，在两侧为反式。顺式 1,4-聚丁二烯链规整、可结晶，是优良的轮胎胶；反式 1,4-聚异戊二烯就是天然橡胶的主要成分。注意区分“立构”与“顺反”——前者讲手性碳的构型，后者讲双键的几何。\n图 1　配位聚合与定向聚合：立构规整性的来源（北化《高分子化学·重点内容》课件）"},{"h":"九、易错清单与自测","t":"★★★　能用文字或简图说明全同、间同、无规的区别\n★★★　能说出 Z-N 催化剂两组分的名称、作用与活性中心形成过程\n★★★　能解释丙烯为什么不能自由基聚合，并给出正确替代路线\n★★★　能区分配位聚合与定向聚合两个概念\n★★　能说出三代催化剂的主要差别与等规指数范围\n★★　能说明乙丙橡胶为什么是弹性体\n★★　能区分立构异构与顺反异构\n★　能举出四个配位聚合的工业品种\n与高物的接口本章的立构规整度直接决定高物第五章的结晶能力：等规 PP 能结晶所以刚硬透明，无规 PP 不能结晶所以是软的。读高物结晶章时，回来对照本章的表 3，理解会快很多。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"顺反异构（聚二烯）（选择、简答）"},{"id":"gaohua07n04","label":"Z-N催化剂的两组分及作用（简答、填空）","stars":5,"point":"主催化剂 TiCl₃/TiCl₄，助催化剂 AlEt₃","imgs":["img/map/m105.jpg","img/map/m106.jpg"],"quiz":[{"id":"gaohua07-003","type":"tf","match":true},{"id":"gaohua07-023","type":"short","match":true},{"id":"gaohua07-026","type":"essay","match":true}],"notes":[{"h":"一、本章坐标：链长成什么形状，由催化剂说了算","t":"前六章解决的是“链有多长”，本章解决“链长成什么形状”。同样是聚丙烯，无规立构的是不能做塑料的橡胶状物，等规立构的却是能做汽车保险杠的工程塑料。差别不在分子量，而在甲基在链上的排列方式。\n逻辑链：① 单体与催化剂配位（烯烃先与过渡金属空位配位，再插入） → ② 活性中心（过渡金属的空位是唯一的反应场所） → ③ 插入方向（决定每个单元的头尾与构型） → ④ 立构选择性（决定全同、间同还是无规） → ⑤ 产品性能（等规度高则结晶、刚硬；无规则 rubbery）读法：读法：本章的逻辑非常线性——催化剂决定空位，空位决定插入方向，方向决定立构，立构决定性能。所有简答题都可以沿这条线答。\n命题口径866 对本章的要求偏基础：立构概念（全同、间同、无规）、Z-N 催化剂的两组分与作用、丙烯为什么不能自由基聚合、乙丙橡胶的共聚机理。极少出复杂计算，但名词与填空一旦丢分很可惜。"},{"h":"四、Ziegler-Natta 催化剂：两组分，各有分工","t":"经典 Z-N 催化剂由两部分组成：主催化剂是第 IV 至 VI 族过渡金属化合物，工业上常用 TiCl₄ 或 TiCl₃；助催化剂是第 I 至 III 族金属的烷基化合物，常用三乙基铝 Al(C₂H₅)₃。两者一接触就生成具有空位的活性中心。\n图 2　第一代 Ziegler-Natta 催化剂的组成式（课件通式）：主催化剂 Mt(IV–VIII)X（Mt 为 Ti、V、Cr、Mo、Co、Ni，X 为 Cl、Br、I；α-烯烃、环烯烃、二烯烃分别对应不同金属）+ 共催化剂 Mt(I–III)R（Mt 为 Li、Mg、Zn、Al，R 为 CH₃ 至 C₁₁H₂₃，应用最多的是 AlXₙR(3−n)）（北化《高分子化学·重点内容》课件第 5.3.1 节）\n催化剂配制的反应式要能写出：TiCl₄ + Al(C₂H₅)₃ → C₂H₅TiCl₃ + Al(C₂H₅)₂Cl（烷基化）；随后 C₂H₅TiCl₃ → TiCl₃ + C₂H₅·（还原，生成低价态 Ti³⁺）；活性中心可写作 [TiCl₃⁺]—C₂H₅，其上的空位是烯烃配位的入口。\n为什么必须两种组分？因为单靠 TiCl₄ 没有活性：它需要烷基铝把 Ti 烷基化，再经过还原，生成低价态（Ti³⁺ 或 Ti²⁺）且带空位的表面中心。空位是烯烃配位的入口，没有空位就没有配位聚合。这一条是“为什么催化剂要由多个组分组成”这类题的标准答案。\n催化剂有三代演进：第一代是 TiCl₃–AlEt₃ 两组分，活性低、需脱灰；第二代加入第三组分（如醚、酯）提高立构选择性；第三代是载体型，把 TiCl₄ 负载在 MgCl₂ 上，活性提高几十倍，等规指数可达 98%，且可省去脱灰工序。第四代是茂金属与后过渡金属催化剂，属于“单活性中心”，每个中心结构相同，因此分子量分布极窄、立构可精确设计。\n图 3　Ziegler-Natta 催化剂的组分与活性中心的形成（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Z-N 催化剂的两组分及作用（简答、填空）"},{"id":"gaohua07n05","label":"三代Z-N催化剂的演进（简答）","stars":3,"point":"两组分、三组分、载体型、茂金属","imgs":[],"quiz":[{"id":"gaohua07-026","type":"essay","match":true},{"id":"gaohua07-003","type":"tf","match":true},{"id":"gaohua07-009","type":"fill","match":true}],"notes":[{"h":"四、Ziegler-Natta 催化剂：两组分，各有分工","t":"经典 Z-N 催化剂由两部分组成：主催化剂是第 IV 至 VI 族过渡金属化合物，工业上常用 TiCl₄ 或 TiCl₃；助催化剂是第 I 至 III 族金属的烷基化合物，常用三乙基铝 Al(C₂H₅)₃。两者一接触就生成具有空位的活性中心。\n图 2　第一代 Ziegler-Natta 催化剂的组成式（课件通式）：主催化剂 Mt(IV–VIII)X（Mt 为 Ti、V、Cr、Mo、Co、Ni，X 为 Cl、Br、I；α-烯烃、环烯烃、二烯烃分别对应不同金属）+ 共催化剂 Mt(I–III)R（Mt 为 Li、Mg、Zn、Al，R 为 CH₃ 至 C₁₁H₂₃，应用最多的是 AlXₙR(3−n)）（北化《高分子化学·重点内容》课件第 5.3.1 节）\n催化剂配制的反应式要能写出：TiCl₄ + Al(C₂H₅)₃ → C₂H₅TiCl₃ + Al(C₂H₅)₂Cl（烷基化）；随后 C₂H₅TiCl₃ → TiCl₃ + C₂H₅·（还原，生成低价态 Ti³⁺）；活性中心可写作 [TiCl₃⁺]—C₂H₅，其上的空位是烯烃配位的入口。\n为什么必须两种组分？因为单靠 TiCl₄ 没有活性：它需要烷基铝把 Ti 烷基化，再经过还原，生成低价态（Ti³⁺ 或 Ti²⁺）且带空位的表面中心。空位是烯烃配位的入口，没有空位就没有配位聚合。这一条是“为什么催化剂要由多个组分组成”这类题的标准答案。\n催化剂有三代演进：第一代是 TiCl₃–AlEt₃ 两组分，活性低、需脱灰；第二代加入第三组分（如醚、酯）提高立构选择性；第三代是载体型，把 TiCl₄ 负载在 MgCl₂ 上，活性提高几十倍，等规指数可达 98%，且可省去脱灰工序。第四代是茂金属与后过渡金属催化剂，属于“单活性中心”，每个中心结构相同，因此分子量分布极窄、立构可精确设计。\n图 3　Ziegler-Natta 催化剂的组分与活性中心的形成（北化《高分子化学·重点内容》课件）"},{"h":"表 2　三代催化剂的比较","t":"代次 ｜ 组成 ｜ 活性 ｜ 等规指数 ｜ 备注\n第一代 ｜ TiCl₃ + AlEt₃ ｜ 低（约 20 kg/g Ti） ｜ 约 90% ｜ 需脱灰、脱无规物\n第二代 ｜ 加第三组分（酯、醚） ｜ 中 ｜ 约 95% ｜ 仍需脱灰\n第三代 ｜ TiCl₄/MgCl₂ 载体型 + AlEt₃ + 给电子体 ｜ 高（可达数百 kg/g Ti） ｜ 约 98% ｜ 免脱灰，工业主流\n第四代 ｜ 茂金属（如二茂锆）+ 甲基铝氧烷 ｜ 极高 ｜ 可精确设计 ｜ 单活性中心，分布窄"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"三代 Z-N 催化剂的演进（简答）"},{"id":"gaohua07n06","label":"配位聚合与定向聚合的区别（名词解释、简答）","stars":4,"point":"配位指机理，定向指结果","imgs":["img/map/m107.jpg","img/map/m108.jpg","img/map/m109.jpg"],"quiz":[{"id":"gaohua07-012","type":"fill","match":true},{"id":"gaohua07-006","type":"term","match":true},{"id":"gaohua07-020","type":"short","match":true}],"notes":[{"h":"表 3　配位聚合的主要工业品种","t":"产品 ｜ 单体 ｜ 催化剂 ｜ 关键性能\n高密度聚乙烯 HDPE ｜ 乙烯 ｜ Z-N 或铬系 ｜ 线形、结晶度高、刚硬\n等规聚丙烯 ｜ 丙烯 ｜ Z-N 或茂金属 ｜ 耐热、刚硬，可做工程件\n乙丙橡胶 EPM/EPDM ｜ 乙烯 + 丙烯（+ 第三单体） ｜ Z-N 或茂金属 ｜ 无规共聚不结晶，弹性好\n顺丁橡胶 ｜ 丁二烯 ｜ 镍系、钴系或稀土 ｜ 顺式 1,4 含量高，耐磨\n聚异戊二烯 ｜ 异戊二烯 ｜ 稀土或锂系 ｜ 结构接近天然橡胶\n注意乙丙橡胶为什么是橡胶：乙烯与丙烯无规共聚后，链上不再有规整的重复序列，无法结晶，Tg 又低，所以常温下高弹。这与第 5 章的“共聚改结构”是同一思路，只是换了催化剂。"},{"h":"九、易错清单与自测","t":"★★★　能用文字或简图说明全同、间同、无规的区别\n★★★　能说出 Z-N 催化剂两组分的名称、作用与活性中心形成过程\n★★★　能解释丙烯为什么不能自由基聚合，并给出正确替代路线\n★★★　能区分配位聚合与定向聚合两个概念\n★★　能说出三代催化剂的主要差别与等规指数范围\n★★　能说明乙丙橡胶为什么是弹性体\n★★　能区分立构异构与顺反异构\n★　能举出四个配位聚合的工业品种\n与高物的接口本章的立构规整度直接决定高物第五章的结晶能力：等规 PP 能结晶所以刚硬透明，无规 PP 不能结晶所以是软的。读高物结晶章时，回来对照本章的表 3，理解会快很多。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"配位聚合与定向聚合的区别（名词解释、简答）"},{"id":"gaohua07n07","label":"丙烯不能用自由基聚合的原因（简答）","stars":4,"point":"烯丙基氢易被夺，生成稳定自由基","imgs":["img/map/m110.jpg","img/map/m111.jpg","img/map/m112.jpg"],"quiz":[{"id":"gaohua07-004","type":"tf","match":true},{"id":"gaohua07-024","type":"short","match":true},{"id":"gaohua07-012","type":"fill","match":true}],"notes":[{"h":"五、丙烯为什么不能自由基聚合","t":"这是本章最常被问的一道“为什么”。丙烯的α-碳上有一个烯丙基氢，自由基极易夺取这个氢发生链转移，生成一个烯丙基自由基——它与双键共轭、非常稳定，几乎不再引发新链。结果是引发剂被白白消耗、链长不起来，甚至完全不聚。这就是“自阻聚”作用。\n所以工业上做聚丙烯只能用配位聚合：催化剂把丙烯配位在金属空位上，插入时不会发生夺氢，链得以稳定增长。同理，异丁烯也只能阳离子聚合，因为它的叔碳自由基同样容易发生歧化终止。\n这条规律可以总结成一句口诀：α-烯烃有烯丙基氢，自由基走不通，必须配位；异丁烯有叔氢，自由基也走不通，必须阳离子。\n图 4　乙丙橡胶的配位共聚：乙烯与丙烯无规共聚，不能结晶故为弹性体（北化《高分子化学·重点内容》课件）"},{"h":"八、真题与期末题演练","t":"【真题 1】丙烯不能进行自由基聚合的主要原因是（　）；配位聚合可以制备（　）和（　）两种立构规整聚丙烯；在提高配位聚合催化剂催化效率和定向能力的发展中，催化剂可分为（　）、（　）、（　）和茂金属催化剂等几种类型。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·填空题第 4 题（附标准答案）\n参考答案与给分点：自阻聚，即极易向单体转移、生成低活性的烯丙基自由基；全同立构、间同立构；两组分 Z-N 催化剂、三组分 Z-N 催化剂、载体型 Z-N 催化剂。给分点：六空各 0.5 分。答“不能生成稳定自由基”“易发生链转移”也可给分，但要点出烯丙基氢。\n【真题 2】为什么 Ziegler-Natta 催化剂必须由主催化剂与助催化剂等多个组分构成？各组分的功能是什么？\n来源：综合简答（据北化课件与期末口径整理）\n参考答案与给分点：主催化剂（TiCl₄ 或 TiCl₃）本身不能引发聚合，需要助催化剂（AlEt₃ 等烷基铝）先把 Ti 烷基化，再经还原生成低价态、表面带空位的活性中心；空位是烯烃配位的入口，故缺一不可。第三组分（给电子体）的作用是占据催化剂表面的非选择性位点、提高等规指数；载体（MgCl₂）的作用是使 TiCl₄ 高度分散、增大比表面积，从而大幅提高活性。答题要点：烷基化、还原、空位、给电子体的选择性、载体的分散作用，五点齐全为满分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"丙烯不能用自由基聚合的原因（简答）"},{"id":"gaohua07n08","label":"插入机理（空位与四中心过渡态）（简答、论述）","stars":3,"point":"Cossee-Arlman 机理","imgs":[],"quiz":[{"id":"gaohua07-020","type":"short","match":true},{"id":"gaohua07-012","type":"fill","match":true},{"id":"gaohua07-026","type":"essay","match":true}],"notes":[{"h":"六、插入机理：空位、四中心、构型保持","t":"Cossee-Arlman 机理把增长写成三步：①烯烃的双键与过渡金属的空位配位，形成π络合物；②在四中心过渡态中，烯烃的π键打开，与金属—碳键、空位同时作用，碳原子转移到链端；③金属上重新出现空位，等待下一个单体。\n立构规整性从何而来？因为空位在催化剂表面的位置是固定的，每次插入后链的构型被“锁”在同一侧，于是得到全同；如果催化剂结构让空位交替出现在两侧，就得到间同。所以立构不是靠温度或溶剂，而是靠催化剂的空间结构——这也是“定向聚合”一词的来源。\n两个概念要分清：配位聚合指“单体先与过渡金属配位再插入”这一机理；定向聚合指“产物立构规整”这一结果。配位聚合通常能定向，但定向聚合不一定都靠配位（例如某些自由基体系在低温下也有一定立构选择性）。答题时把这两句并排写，名词解释就满分了。"},{"h":"一、本章坐标：链长成什么形状，由催化剂说了算","t":"前六章解决的是“链有多长”，本章解决“链长成什么形状”。同样是聚丙烯，无规立构的是不能做塑料的橡胶状物，等规立构的却是能做汽车保险杠的工程塑料。差别不在分子量，而在甲基在链上的排列方式。\n逻辑链：① 单体与催化剂配位（烯烃先与过渡金属空位配位，再插入） → ② 活性中心（过渡金属的空位是唯一的反应场所） → ③ 插入方向（决定每个单元的头尾与构型） → ④ 立构选择性（决定全同、间同还是无规） → ⑤ 产品性能（等规度高则结晶、刚硬；无规则 rubbery）读法：读法：本章的逻辑非常线性——催化剂决定空位，空位决定插入方向，方向决定立构，立构决定性能。所有简答题都可以沿这条线答。\n命题口径866 对本章的要求偏基础：立构概念（全同、间同、无规）、Z-N 催化剂的两组分与作用、丙烯为什么不能自由基聚合、乙丙橡胶的共聚机理。极少出复杂计算，但名词与填空一旦丢分很可惜。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"插入机理（空位与四中心过渡态）（简答、论述）"},{"id":"gaohua07n09","label":"茂金属催化剂的特点（简答）","stars":3,"point":"单活性中心、窄分布、立构可调","imgs":[],"quiz":[{"id":"gaohua07-018","type":"mcq","match":true},{"id":"gaohua07-009","type":"fill","match":true},{"id":"gaohua07-026","type":"essay","match":true}],"notes":[{"h":"表 2　三代催化剂的比较","t":"代次 ｜ 组成 ｜ 活性 ｜ 等规指数 ｜ 备注\n第一代 ｜ TiCl₃ + AlEt₃ ｜ 低（约 20 kg/g Ti） ｜ 约 90% ｜ 需脱灰、脱无规物\n第二代 ｜ 加第三组分（酯、醚） ｜ 中 ｜ 约 95% ｜ 仍需脱灰\n第三代 ｜ TiCl₄/MgCl₂ 载体型 + AlEt₃ + 给电子体 ｜ 高（可达数百 kg/g Ti） ｜ 约 98% ｜ 免脱灰，工业主流\n第四代 ｜ 茂金属（如二茂锆）+ 甲基铝氧烷 ｜ 极高 ｜ 可精确设计 ｜ 单活性中心，分布窄"},{"h":"四、Ziegler-Natta 催化剂：两组分，各有分工","t":"经典 Z-N 催化剂由两部分组成：主催化剂是第 IV 至 VI 族过渡金属化合物，工业上常用 TiCl₄ 或 TiCl₃；助催化剂是第 I 至 III 族金属的烷基化合物，常用三乙基铝 Al(C₂H₅)₃。两者一接触就生成具有空位的活性中心。\n图 2　第一代 Ziegler-Natta 催化剂的组成式（课件通式）：主催化剂 Mt(IV–VIII)X（Mt 为 Ti、V、Cr、Mo、Co、Ni，X 为 Cl、Br、I；α-烯烃、环烯烃、二烯烃分别对应不同金属）+ 共催化剂 Mt(I–III)R（Mt 为 Li、Mg、Zn、Al，R 为 CH₃ 至 C₁₁H₂₃，应用最多的是 AlXₙR(3−n)）（北化《高分子化学·重点内容》课件第 5.3.1 节）\n催化剂配制的反应式要能写出：TiCl₄ + Al(C₂H₅)₃ → C₂H₅TiCl₃ + Al(C₂H₅)₂Cl（烷基化）；随后 C₂H₅TiCl₃ → TiCl₃ + C₂H₅·（还原，生成低价态 Ti³⁺）；活性中心可写作 [TiCl₃⁺]—C₂H₅，其上的空位是烯烃配位的入口。\n为什么必须两种组分？因为单靠 TiCl₄ 没有活性：它需要烷基铝把 Ti 烷基化，再经过还原，生成低价态（Ti³⁺ 或 Ti²⁺）且带空位的表面中心。空位是烯烃配位的入口，没有空位就没有配位聚合。这一条是“为什么催化剂要由多个组分组成”这类题的标准答案。\n催化剂有三代演进：第一代是 TiCl₃–AlEt₃ 两组分，活性低、需脱灰；第二代加入第三组分（如醚、酯）提高立构选择性；第三代是载体型，把 TiCl₄ 负载在 MgCl₂ 上，活性提高几十倍，等规指数可达 98%，且可省去脱灰工序。第四代是茂金属与后过渡金属催化剂，属于“单活性中心”，每个中心结构相同，因此分子量分布极窄、立构可精确设计。\n图 3　Ziegler-Natta 催化剂的组分与活性中心的形成（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"茂金属催化剂的特点（简答）"},{"id":"gaohua07n10","label":"主要工业品种（填空、选择）","stars":2,"point":"HDPE、等规 PP、乙丙橡胶、顺丁","imgs":[],"quiz":[{"id":"gaohua07-007","type":"term","match":true}],"notes":[{"h":"表 3　配位聚合的主要工业品种","t":"产品 ｜ 单体 ｜ 催化剂 ｜ 关键性能\n高密度聚乙烯 HDPE ｜ 乙烯 ｜ Z-N 或铬系 ｜ 线形、结晶度高、刚硬\n等规聚丙烯 ｜ 丙烯 ｜ Z-N 或茂金属 ｜ 耐热、刚硬，可做工程件\n乙丙橡胶 EPM/EPDM ｜ 乙烯 + 丙烯（+ 第三单体） ｜ Z-N 或茂金属 ｜ 无规共聚不结晶，弹性好\n顺丁橡胶 ｜ 丁二烯 ｜ 镍系、钴系或稀土 ｜ 顺式 1,4 含量高，耐磨\n聚异戊二烯 ｜ 异戊二烯 ｜ 稀土或锂系 ｜ 结构接近天然橡胶\n注意乙丙橡胶为什么是橡胶：乙烯与丙烯无规共聚后，链上不再有规整的重复序列，无法结晶，Tg 又低，所以常温下高弹。这与第 5 章的“共聚改结构”是同一思路，只是换了催化剂。"},{"h":"九、易错清单与自测","t":"★★★　能用文字或简图说明全同、间同、无规的区别\n★★★　能说出 Z-N 催化剂两组分的名称、作用与活性中心形成过程\n★★★　能解释丙烯为什么不能自由基聚合，并给出正确替代路线\n★★★　能区分配位聚合与定向聚合两个概念\n★★　能说出三代催化剂的主要差别与等规指数范围\n★★　能说明乙丙橡胶为什么是弹性体\n★★　能区分立构异构与顺反异构\n★　能举出四个配位聚合的工业品种\n与高物的接口本章的立构规整度直接决定高物第五章的结晶能力：等规 PP 能结晶所以刚硬透明，无规 PP 不能结晶所以是软的。读高物结晶章时，回来对照本章的表 3，理解会快很多。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"主要工业品种（填空、选择）"}],"logic":{"question":"催化剂怎样控制单体插入方向，从而得到立构规整的链？","role":"从“能否聚合”推进到“链的空间排列能否控制”，把合成直接接到结晶和性能。","input":"单体电子效应、活性中心与链增长","output":"配位插入、Z-N 催化、立构规整性与顺反异构","prev":"gaohua06","next":"gaohua08","links":[{"cid":"gaowu05","text":"立构规整性决定结晶能力，是本章最直接的高物出口"},{"cid":"gaowu01","text":"全同/间同/无规属于构型而非构象"}],"focus":["构型、立构规整度与顺反异构","Z-N 催化剂组成、作用和配位插入机理","配位聚合与定向聚合的区别","丙烯不宜自由基聚合的原因"],"common":["辨析全同、间同、无规 PP 并联系结晶/DSC 曲线","写 Z-N 两组分作用并解释丙烯配位聚合","比较配位聚合、定向聚合和立构规整聚合的概念范围"],"examRefs":["past2022-011","past2021-013","past2021-020"]},"examRefs":["past2022-011","past2021-013","past2021-020"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":9,"examRefs":3,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua08":{"title":"聚合物的化学反应","subject":"gaohua","nodes":[{"id":"gaohua08n01","label":"影响反应性的物理与化学因素（简答、论述）","stars":5,"point":"两大因素，四个物理项，两个化学效应","imgs":["img/map/m113.jpg","img/map/m114.jpg","img/map/m115.jpg"],"quiz":[{"id":"gaohua08-023","type":"short","match":true},{"id":"gaohua08-003","type":"tf","match":true},{"id":"gaohua08-026","type":"essay","match":true}],"notes":[{"h":"三、反应性：先把“为什么慢”讲清楚","t":"物理因素有四条。①溶解性：反应多在溶液或溶胀态进行，聚合物不溶就只能表面反应，转化率上不去。②结晶性：晶区里分子排列紧密、链段不能动，试剂进不去，所以结晶度高的聚合物反应慢且不均一。③交联度：交联把链锁成网络，只能溶胀不能溶解，反应深度受限。④空间位阻与相态：大体积试剂进不去，非均相体系反应更慢。\n化学因素有两条，是名词解释的高频点。①邻位基团效应：相邻官能团已经反应后，会改变邻近基团的电子环境或空间环境，使其活性上升或下降；典型例子是聚甲基丙烯酸甲酯水解时，已水解的羧基会促进邻近酯基水解（协同效应）。②几率效应：在无规、不可逆的反应中，当相邻基团必须成对参与时，总有一些孤立基团找不到配对对象，于是转化率存在上限。教材给出的上限约 86.5%，这是统计规律，不是化学限制。\n把这两条合起来看：邻位基团效应改变“反应快慢”，几率效应决定“能不能反应完”。答题时分别举例，不要混在一起。\n图 1　影响聚合物化学反应性的因素：物理因素与化学因素（北化《高分子化学·重点内容》课件）"},{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"影响反应性的物理与化学因素（简答、论述）"},{"id":"gaohua08n02","label":"几率效应与邻位基团效应（名词解释、简答）","stars":4,"point":"转化率上限约 86.5%","imgs":["img/map/m116.jpg","img/map/m117.jpg"],"quiz":[{"id":"gaohua08-006","type":"term","match":true}],"notes":[{"h":"【真题 3】简述几率效应的含义。","t":"来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·简答题第 1 题（节选：几率效应）\n参考答案与给分点：在由相邻官能团参与的无规、不可逆反应中，由于反应的随机性，总有一部分官能团的邻位基团已被反应或无法配对，使这些基团不能参与反应，因而转化率存在上限（教材给出的上限约为 86.5%）。它不是化学活性不足，而是统计几何约束造成的。给分点：无规不可逆 1 分，孤立基团不能配对 1 分，转化率上限 1 分。"},{"h":"三、反应性：先把“为什么慢”讲清楚","t":"物理因素有四条。①溶解性：反应多在溶液或溶胀态进行，聚合物不溶就只能表面反应，转化率上不去。②结晶性：晶区里分子排列紧密、链段不能动，试剂进不去，所以结晶度高的聚合物反应慢且不均一。③交联度：交联把链锁成网络，只能溶胀不能溶解，反应深度受限。④空间位阻与相态：大体积试剂进不去，非均相体系反应更慢。\n化学因素有两条，是名词解释的高频点。①邻位基团效应：相邻官能团已经反应后，会改变邻近基团的电子环境或空间环境，使其活性上升或下降；典型例子是聚甲基丙烯酸甲酯水解时，已水解的羧基会促进邻近酯基水解（协同效应）。②几率效应：在无规、不可逆的反应中，当相邻基团必须成对参与时，总有一些孤立基团找不到配对对象，于是转化率存在上限。教材给出的上限约 86.5%，这是统计规律，不是化学限制。\n把这两条合起来看：邻位基团效应改变“反应快慢”，几率效应决定“能不能反应完”。答题时分别举例，不要混在一起。\n图 1　影响聚合物化学反应性的因素：物理因素与化学因素（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"几率效应与邻位基团效应（名词解释、简答）"},{"id":"gaohua08n03","label":"反应类型的三分法（选择、简答）","stars":4,"point":"聚合度不变、增大、减小","imgs":[],"quiz":[{"id":"gaohua08-026","type":"essay","match":true},{"id":"gaohua08-019","type":"short","match":true},{"id":"gaohua08-023","type":"short","match":true}],"notes":[{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"},{"h":"表 3　三类聚合物反应","t":"类型 ｜ 聚合度变化 ｜ 典型反应 ｜ 工业意义\n聚合度基本不变 ｜ 不变 ｜ 取代、加成、环化 ｜ PVA、维尼纶、氯化聚氯乙烯\n聚合度增大 ｜ 增大 ｜ 交联、接枝、嵌段、扩链 ｜ 硫化、固化、增韧改性\n聚合度减小 ｜ 减小 ｜ 降解、解聚、水解 ｜ 老化、回收、造粒\n这个三分法是答题的骨架：题目问“维尼纶的制备属于哪类反应”，先答“聚合度基本不变的侧基反应”，再写反应式，评卷一眼就看到结构。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"反应类型的三分法（选择、简答）"},{"id":"gaohua08n04","label":"PVA与维尼纶的合成（反应式、简答）","stars":5,"point":"先聚醋酸乙烯酯，再醇解、缩醛化","imgs":["img/map/m118.jpg","img/map/m119.jpg","img/map/m120.jpg"],"quiz":[{"id":"gaohua08-019","type":"short","match":true},{"id":"gaohua08-026","type":"essay","match":true},{"id":"gaohua08-025","type":"calc","match":true}],"notes":[{"h":"五、PVA 与维尼纶：一条不能走直线的合成路线","t":"聚乙烯醇不能由乙烯醇单体聚合得到，因为乙烯醇会立刻互变异构为乙醛。工业路线是：先由醋酸乙烯酯自由基聚合得到聚醋酸乙烯酯（PVAc），再用甲醇或碱催化醇解（酯交换），把乙酰基换成羟基，得到 PVA。\n第一步： n CH₂=CH—OCOCH₃ → —(CH₂—CH(OCOCH₃))—n\n第二步（醇解）： —(CH₂—CH(OCOCH₃))—n + n CH₃OH → —(CH₂—CH(OH))—n + n CH₃COOCH₃\n第三步（缩醛化）： PVA 与甲醛在酸催化下，相邻两个羟基成环缩醛，得到聚乙烯醇缩甲醛，即维尼纶。\n为什么要缩醛化？因为纯 PVA 溶于水，不能做纤维。把部分羟基缩醛化后，亲水性下降、耐热水性提高，才能纺丝做维尼纶。这一步也解释了本章的核心命题：同一官能团，反应程度不同，性能天差地别。\n图 2　PVA 的两步反应式（课件原式）：①n CH₂=CH—OCOCH₃ 经 BPO 引发溶液聚合得 PVAc；②PVAc 在 CH₃OH／NaOH 中醇解（酯交换）得 PVA；牌号「1788」「1799」即醇解度 88%、99% 的两个常用品级（北化《高分子化学·重点内容》课件第 9.2 节）\n图 3　橡胶硫化的定义与要点（课件 9.3 交联反应）：硫化是把塑性高分子材料转变为弹性橡胶的过程；适用含双键橡胶（天然、顺丁、三元乙丙、丁苯、丁腈、丁基）；目的是消除分子间滑动造成的永久变形、显示高弹性；交联剂为硫黄或含硫化合物（北化《高分子化学·重点内容》课件第 9.3 节）"},{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"PVA 与维尼纶的合成（反应式、简答）"},{"id":"gaohua08n05","label":"离子交换树脂（简答、选择）","stars":3,"point":"交联度决定交换容量与溶胀","imgs":[],"quiz":[{"id":"gaohua08-012","type":"fill","match":true},{"id":"gaohua08-018","type":"mcq","match":true},{"id":"gaohua08-020","type":"short","match":true}],"notes":[{"h":"表 2　两类影响因素对照","t":"类别 ｜ 具体项 ｜ 作用方式 ｜ 典型例子\n物理因素 ｜ 溶解度 ｜ 决定试剂能否进入链间 ｜ PVA 溶于水故易缩醛化\n物理因素 ｜ 结晶度 ｜ 晶区链段不可动，反应慢 ｜ 高密度聚乙烯氯化困难\n物理因素 ｜ 交联度 ｜ 网络限制溶胀与扩散 ｜ 离子交换树脂交联度越高越慢\n物理因素 ｜ 空间位阻 ｜ 大体积试剂难靠近 ｜ 叔碳上的取代难进行\n化学因素 ｜ 邻位基团效应 ｜ 改变邻近基团活性 ｜ PMMA 水解的协同效应\n化学因素 ｜ 几率效应 ｜ 孤立基团无法配对 ｜ 转化率上限约 86.5%"},{"h":"六、交联：把线形链变成网","t":"交联属于“聚合度增大”的反应。最常见的三个例子：橡胶的硫黄硫化（硫桥把两条链连起来，用量通常 1% 至 3%）；聚乙烯的过氧化物交联（用 DCP 分解产生的自由基夺氢，两个链自由基偶合）；以及辐射交联（高能射线直接产生链自由基）。\n三种交联的反应式（按机理写，别只写过程）：①硫黄硫化　~CH₂—C(CH₃)=CH—CH₂~ + S₈ → ~CH₂—C(CH₃)—CH(Sₓ)—CH₂~（在双键的烯丙位生成多硫交联键）；②过氧化物交联　DCP → 2 RO·；~CH₂~ + RO· → ~CH·~ + ROH；2 ~CH·~ → ~CH—CH~（两条链自由基偶合，形成 C—C 交联）；③辐射交联　~CH₂~ →（高能射线）~CH·~ + H·，再按②的方式偶合。\n交联度的控制极其关键。橡胶交联不足则强度低、永久变形大；交联过度则变硬变脆、失去弹性。聚乙烯电缆料交联后耐热性与耐环境应力开裂性显著提高，这就是交联聚乙烯（XLPE）能用于高压电缆的原因。\n离子交换树脂则是“交联 + 官能团”的组合产品：苯乙烯与二乙烯基苯共聚得到交联网络（白球），再磺化得阳离子树脂，或氯甲基化后胺化得阴离子树脂。交联度决定树脂的溶胀程度与交换容量——交联度高则不易溶胀、容量大但交换速度慢。\n图 4　离子交换树脂的合成反应式：苯乙烯 + 二乙烯苯经 BPO 引发悬浮聚合，得体形共聚物小球母体（白球）；再经磺化反应或氯甲基化反应——两者都是苯环上的取代反应——得到离子交换树脂（北化《高分子化学·重点内容》课件第 9.2 节）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"离子交换树脂（简答、选择）"},{"id":"gaohua08n06","label":"橡胶硫化与聚乙烯交联（填空、简答）","stars":4,"point":"硫黄硫化、过氧化物交联、辐射交联","imgs":["img/map/m121.jpg","img/map/m122.jpg","img/map/m123.jpg"],"quiz":[{"id":"gaohua08-011","type":"fill","match":true},{"id":"gaohua08-022","type":"short","match":true},{"id":"gaohua08-002","type":"tf","match":true}],"notes":[{"h":"六、交联：把线形链变成网","t":"交联属于“聚合度增大”的反应。最常见的三个例子：橡胶的硫黄硫化（硫桥把两条链连起来，用量通常 1% 至 3%）；聚乙烯的过氧化物交联（用 DCP 分解产生的自由基夺氢，两个链自由基偶合）；以及辐射交联（高能射线直接产生链自由基）。\n三种交联的反应式（按机理写，别只写过程）：①硫黄硫化　~CH₂—C(CH₃)=CH—CH₂~ + S₈ → ~CH₂—C(CH₃)—CH(Sₓ)—CH₂~（在双键的烯丙位生成多硫交联键）；②过氧化物交联　DCP → 2 RO·；~CH₂~ + RO· → ~CH·~ + ROH；2 ~CH·~ → ~CH—CH~（两条链自由基偶合，形成 C—C 交联）；③辐射交联　~CH₂~ →（高能射线）~CH·~ + H·，再按②的方式偶合。\n交联度的控制极其关键。橡胶交联不足则强度低、永久变形大；交联过度则变硬变脆、失去弹性。聚乙烯电缆料交联后耐热性与耐环境应力开裂性显著提高，这就是交联聚乙烯（XLPE）能用于高压电缆的原因。\n离子交换树脂则是“交联 + 官能团”的组合产品：苯乙烯与二乙烯基苯共聚得到交联网络（白球），再磺化得阳离子树脂，或氯甲基化后胺化得阴离子树脂。交联度决定树脂的溶胀程度与交换容量——交联度高则不易溶胀、容量大但交换速度慢。\n图 4　离子交换树脂的合成反应式：苯乙烯 + 二乙烯苯经 BPO 引发悬浮聚合，得体形共聚物小球母体（白球）；再经磺化反应或氯甲基化反应——两者都是苯环上的取代反应——得到离子交换树脂（北化《高分子化学·重点内容》课件第 9.2 节）"},{"h":"八、真题与期末题演练","t":"【真题 1】聚甲基丙烯酸甲酯、聚乙烯、聚氯乙烯热降解的方式主要是（　）、（　）、（　）；丁苯橡胶采用（　）交联，聚乙烯采用（　）交联。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·填空题第 8 题（附标准答案）\n参考答案与给分点：解聚、无规断链、取代基脱除；硫化、过氧化物。给分点：五空各 0.5 分。判断依据是链自由基的稳定性与侧基是否存在：PMMA 有两个α-取代基、链自由基稳定故解聚；PE 无侧基故无规断链；PVC 有氯侧基故脱 HCl。\n【真题 2】与小分子化学反应相比，写出四点影响聚合物化学反应的主要因素。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·简答题第 3 题（附标准答案）\n参考答案与给分点：①物理因素中的溶解度：聚合物溶解性下降时，试剂难以进入链间，反应活性下降；②结晶性：结晶度越高，链段被固定，反应只能在晶区外或表面进行；③交联度：交联度越高，只能溶胀不能溶解，反应深度受限；④空间位阻：大体积试剂难以靠近官能团；⑤化学因素中的邻位基团效应：相邻基团已反应会改变邻近基团的活性；⑥几率效应：相邻基团需成对参与时，孤立基团无法反应，转化率有上限（约 86.5%）。答出四点即可，每点 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"橡胶硫化与聚乙烯交联（填空、简答）"},{"id":"gaohua08n07","label":"热降解的三种方式（填空、简答）","stars":5,"point":"解聚、无规断链、侧基脱除","imgs":[],"quiz":[{"id":"gaohua08-010","type":"fill","match":true},{"id":"gaohua08-004","type":"tf","match":true},{"id":"gaohua08-015","type":"mcq","match":true}],"notes":[{"h":"七、降解：三种方式，三种结局","t":"热降解是本章最常考的知识点，教材按机理分三类：\n①解聚（depolymerization）：链端自由基逐个脱去单体，几乎全部变回单体。典型是聚甲基丙烯酸甲酯（PMMA），因为它有两个α-取代基，链自由基稳定、不易发生链转移，解聚成为主路径。所以 PMMA 可以热解回收单体。\n②无规断链：链在随机位置断裂，产物是大小不一的片段，单体回收率很低。典型是聚乙烯，因为主链上没有易脱除的侧基，链自由基会随机夺氢断链。\n③侧基脱除（取代基消除）：不先断主链，而是先脱去侧基并形成共轭双键。典型是聚氯乙烯，加热到 100 ℃ 以上就脱 HCl，主链逐步变成共轭多烯，颜色由白变黄变黑。这也是 PVC 加工必须加稳定剂的原因。\n图 5　降解的三种方式与典型聚合物：解聚、无规断链、侧基脱除（北化《高分子化学·重点内容》课件）\n除热降解外还有氧化降解（氧气与光共同作用，是户外老化的主因）、光降解（紫外光激发产生自由基）、水解降解（酯键、酰胺键遇水断裂，是可降解塑料的设计基础）与生物降解。答题时把“外因—机理—后果—对策”四段写全，比只列名词得分高。"},{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"热降解的三种方式（填空、简答）"},{"id":"gaohua08n08","label":"老化与稳定化（简答）","stars":3,"point":"氧、光、热是主要外因","imgs":[],"quiz":[{"id":"gaohua08-014","type":"fill","match":true}],"notes":[{"h":"九、易错清单与自测","t":"★★★　能默写 PVA 与维尼纶的三步反应式，并说明为何不能由乙烯醇直接聚合\n★★★　能说出影响反应性的四个物理因素与两个化学效应，并各举一例\n★★★　能判断 PMMA、PE、PVC 的热降解方式并说明原因\n★★★　能区分聚合度不变、增大、减小三类反应并举例\n★★　能解释几率效应为什么给出 86.5% 这个上限\n★★　能说明硫化与过氧化物交联的机理差别\n★★　能解释离子交换树脂交联度与交换容量的关系\n★　知道老化与稳定化的基本对策\n本章的战略价值很多人把这一章当“边角料”，其实它是论述题的万能素材：可降解塑料、塑料回收、橡胶再生、材料老化，全部落在这里。考场上遇到“谈谈高分子材料的可持续发展”，就写本章的降解三条路 + 交联与回收的关系。"},{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"老化与稳定化（简答）"},{"id":"gaohua08n09","label":"接枝与嵌段共聚（简答、制备）","stars":3,"point":"先聚后接或先接后聚","imgs":["img/map/m124.jpg"],"quiz":[{"id":"gaohua08-020","type":"short","match":true},{"id":"gaohua08-012","type":"fill","match":true}],"notes":[{"h":"表 3　三类聚合物反应","t":"类型 ｜ 聚合度变化 ｜ 典型反应 ｜ 工业意义\n聚合度基本不变 ｜ 不变 ｜ 取代、加成、环化 ｜ PVA、维尼纶、氯化聚氯乙烯\n聚合度增大 ｜ 增大 ｜ 交联、接枝、嵌段、扩链 ｜ 硫化、固化、增韧改性\n聚合度减小 ｜ 减小 ｜ 降解、解聚、水解 ｜ 老化、回收、造粒\n这个三分法是答题的骨架：题目问“维尼纶的制备属于哪类反应”，先答“聚合度基本不变的侧基反应”，再写反应式，评卷一眼就看到结构。"},{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"接枝与嵌段共聚（简答、制备）"},{"id":"gaohua08n10","label":"功能高分子与回收（论述铺垫）","stars":2,"point":"高分子的“第二生命”","imgs":["img/map/m125.jpg","img/map/m126.jpg"],"quiz":[],"notes":[{"h":"九、易错清单与自测","t":"★★★　能默写 PVA 与维尼纶的三步反应式，并说明为何不能由乙烯醇直接聚合\n★★★　能说出影响反应性的四个物理因素与两个化学效应，并各举一例\n★★★　能判断 PMMA、PE、PVC 的热降解方式并说明原因\n★★★　能区分聚合度不变、增大、减小三类反应并举例\n★★　能解释几率效应为什么给出 86.5% 这个上限\n★★　能说明硫化与过氧化物交联的机理差别\n★★　能解释离子交换树脂交联度与交换容量的关系\n★　知道老化与稳定化的基本对策\n本章的战略价值很多人把这一章当“边角料”，其实它是论述题的万能素材：可降解塑料、塑料回收、橡胶再生、材料老化，全部落在这里。考场上遇到“谈谈高分子材料的可持续发展”，就写本章的降解三条路 + 交联与回收的关系。"},{"h":"一、本章坐标：同一条链，为什么小分子能反应它却不能","t":"第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。\n逻辑链：① 反应性影响因素（物理因素：溶解、结晶、交联、位阻） → ② 化学因素（邻位基团效应、几率效应） → ③ 反应类型（聚合度不变、增大、减小三类） → ④ 典型工业反应（醇解制 PVA、硫化、离子交换、接枝） → ⑤ 降解与老化（解聚、无规断链、侧基脱除）读法：读法：先判断“聚合度变不变”，再判断“是什么机理”，最后才写反应式。顺序错了，答案会跑题。\n命题口径本章是简答与填空的富矿：影响聚合物反应性的因素（四点）、热降解的三种方式（PMMA 解聚、PE 无规断链、PVC 脱 HCl）、维尼纶的合成路线（从单体写起的反应式）几乎每年出现。分值不高但极稳，属于“必拿分”章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"功能高分子与回收（论述铺垫）"}],"logic":{"question":"聚合物形成后，怎样通过侧基/主链反应进行改性，又为何会降解和老化？","role":"把合成链接到加工、使用、功能化和回收：聚合度可基本不变、增大或减小。","input":"已形成的聚合物链、侧基和主链结构","output":"相似转变、接枝/嵌段/交联、降解、稳定化与功能化","prev":"gaohua07","next":null,"links":[{"cid":"gaowu06","text":"交联、接枝和降解最终要由蠕变、强度、韧性等性能检验"},{"cid":"gaowu02","text":"交联后只能溶胀不能溶解，溶胀可反推交联度"}],"focus":["几率效应、邻位基团效应与反应不均一性","PVA/维尼纶的间接合成路线","接枝、嵌段、交联与橡胶硫化","热降解方式、老化与稳定化"],"common":["写 PVAC→PVA→维尼纶反应式并说明不能直接聚合乙烯醇","设计接枝/聚合物刷路线并区分 grafting-from/through/onto","比较解聚、无规断链和侧基脱除","用动态共价键解释交联网络的重塑与自修复"],"examRefs":["past2023-014","past2022-007","past2021-014","past2021-021"]},"examRefs":["past2023-014","past2022-007","past2021-014","past2021-021"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":9,"examRefs":4,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu01":{"title":"高分子链结构","subject":"gaowu","nodes":[{"id":"gaowu01n01","label":"高分子的结构层次（近程与远程）（简答、名词解释）","stars":4,"point":"近程看化学连接，远程看空间构象","imgs":["img/map/m127.jpg","img/map/m128.jpg","img/map/m129.jpg"],"quiz":[{"id":"gaowu01-009","type":"fill","match":true},{"id":"gaowu01-020","type":"short","match":true},{"id":"gaowu01-002","type":"tf","match":true}],"notes":[{"h":"表 2　构造形态对性能的影响","t":"形态 ｜ 结构特征 ｜ 性能变化 ｜ 典型例子\n线形 ｜ 无分支，可溶可熔 ｜ 结晶性好、可加工 ｜ HDPE、等规 PP\n支化 ｜ 主链带长短支链 ｜ 密度与结晶度下降，柔软透明 ｜ LDPE、乙丙橡胶\n交联 ｜ 链间以化学键连成网 ｜ 不溶不熔，Tg 升高，弹性好 ｜ 硫化橡胶、固化环氧\n星形 ｜ 一个核心引出多条臂 ｜ 粘度低、支化度高 ｜ 星形 SBS\n梯型 ｜ 双链并行的刚性结构 ｜ 耐高温、高模量 ｜ 梯形聚合物\n图 1　高分子的结构层次：近程结构与远程结构的划分（北化《高分子物理》期末复习总结）\n图 2　链结构的基本要素：化学组成、连接方式与构型（北化《高分子物理》期末复习总结）\n图 3　构型与构象的区别：能否靠单键旋转相互转变（北化《高分子物理》期末复习总结）"},{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"高分子的结构层次（近程与远程）（简答、名词解释）"},{"id":"gaowu01n02","label":"构型与构象的区别（名词解释、选择）","stars":5,"point":"构型需断键才能变，构象靠单键旋转","imgs":[],"quiz":[{"id":"gaowu01-006","type":"term","match":true},{"id":"gaowu01-024","type":"essay","match":true},{"id":"gaowu01-001","type":"tf","match":true}],"notes":[{"h":"四、构型与构象：一字之差，天壤之别","t":"构型指链上取代基在空间的固定排布，例如全同、间同、无规，以及顺式、反式。要改变构型必须打断化学键、重新成键，所以构型是写死的。\n构象指围绕单键内旋转所形成的空间形态。它不需要断键，只需克服内旋转位垒，因此常温下就能快速互变。一条链在溶液里同时存在无数构象，我们只能用统计方法描述它。\n这个概念几乎年年考，因为一句话就能判：题目说加热后由全同变间同，一定错，那要断键；题目说拉伸后链由无规线团变伸展，一定对，那是构象变化。"},{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"构型与构象的区别（名词解释、选择）"},{"id":"gaowu01n03","label":"键长、键角与内旋转（简答）","stars":4,"point":"键长键角固定，内旋转决定柔性","imgs":[],"quiz":[{"id":"gaowu01-023","type":"calc","match":true},{"id":"gaowu01-001","type":"tf","match":true}],"notes":[{"h":"五、链柔性：内旋转的难易","t":"链柔性来自单键的内旋转。键长和键角是固定的（碳碳键长约 0.154 nm，键角约 109.5 度），但相邻两个键可以绕中间的键旋转，于是链能折叠成各种形状。旋转要克服位垒：位垒小则易旋转，链柔；位垒大则难旋转，链刚。\n影响柔性的因素归成四类。①主链结构：碳碳键、碳氧键、硅氧键的位垒小，柔性好，聚硅氧烷的 Tg 低到零下 120 度；芳环、杂环、双键使链刚硬，如聚酰亚胺、聚苯。②侧基：小侧基（甲基）影响小，大侧基（苯环）增加位垒使链刚；但柔性长侧基反而降低 Tg。③分子间作用力：氢键与极性基使链互相粘住，柔性下降。④温度：升温使位垒相对降低，柔性上升。\n注意区分链柔性与材料柔软。一条柔顺的链如果结晶度高，材料照样是硬的。这是简答题常见的陷阱。"},{"h":"七、真题与期末题演练","t":"【真题 1】下列聚合物中刚性因子最大的是：A 聚乙烯　B 聚丙烯腈　C 聚氯乙烯　D 聚丙烯\n来源：北京化工大学《高分子物理》期末试题 A 卷·选择题第 9 题（附标准答案）\n参考答案与给分点：答 B。刚性因子反映实测无扰尺寸相对自由旋转链的增大倍数。聚丙烯腈的侧基是强极性的腈基，链间偶极作用强、内旋转位垒大，故最大；PE 主链最柔顺，最小；PVC 与 PP 居中。给分点：选对 2 分。\n【真题 2】沿 C 轴拉伸，PE 的模量比等规 PP 的模量高 7 倍，解释原因。\n来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 1 题第（4）问（附标准答案）\n参考答案与给分点：沿 C 轴方向，PE 的分子链为平面锯齿构象，链的伸展靠键长与键角的变化实现，键长键角是硬的，形变很小，故模量高；等规 PP 的分子链为螺旋构象，受力时可通过单键旋转使螺旋伸展，形变容易发生，故模量低。给分点：构象类型 1 分，形变机制 2 分。\n【真题 3】聚合物在溶液中通常呈（　）构象，在晶区中通常为（　）或（　）构象。\n来源：北京化工大学《高分子物理》期末试题 A 卷·填空题第 1 题（附标准答案）\n参考答案与给分点：无规线团；平面锯齿、螺旋。给分点：三空各 0.5 分。判据是环境：溶液里链自由，取熵最大的无规线团；晶区里链要密堆砌，取规整的平面锯齿（PE、PVA）或螺旋（等规 PP、PTFE）。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"键长、键角与内旋转（简答）"},{"id":"gaowu01n04","label":"链段与等效自由连接链（名词解释、计算）","stars":4,"point":"把真实链折算成 n 个长度为 l 的链段","imgs":["img/map/m130.jpg","img/map/m131.jpg","img/map/m132.jpg"],"quiz":[{"id":"gaowu01-023","type":"calc","match":true},{"id":"gaowu01-024","type":"essay","match":true},{"id":"gaowu01-007","type":"term","match":true}],"notes":[{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"},{"h":"八、易错清单与自测","t":"★★★　能用一句话区分构型与构象，并举两个例子\n★★★　能说出近程结构与远程结构各包含什么\n★★★　能写出自由连接链与自由旋转链的均方末端距关系\n★★★　能解释 PE 与等规 PP 沿 C 轴模量差 7 倍的原因\n★★　能说明支化与交联对 Tg、密度、加工性的影响\n★★　能用刚性因子解释 PAN、芳纶为什么刚\n★★　能说出链段、等效自由连接链的定义与用途\n★　能列举三种典型链构象及其出现场合\n与下一章的接口本章的无规线团是第 2 章高分子溶液的直接前提：溶液里链是线团，线团的大小决定粘度与沉降，才引出 θ 状态、特性粘数与 GPC。读完本章马上读溶液章，逻辑是连着的。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"链段与等效自由连接链（名词解释、计算）"},{"id":"gaowu01n05","label":"均方末端距与均方回转半径（计算、简答）","stars":4,"point":"自由连接链 nl 平方；自由旋转链约 2nl 平方","imgs":[],"quiz":[{"id":"gaowu01-023","type":"calc","match":true},{"id":"gaowu01-012","type":"fill","match":true}],"notes":[{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"},{"h":"六、统计尺寸：把一条乱麻量化","t":"一条无规线团的链，两端距离随时在变，所以只能求平均值。最常用的是均方末端距（r 为两端点间距的平方的平均值）与均方回转半径（各质点到质心距离平方的平均值），两者对无规线团有回转半径的平方等于均方末端距的六分之一。\n模型分三级。①自由连接链：假设每个键可任意取向、彼此无关，得均方末端距等于键数乘以键长的平方。②自由旋转链：允许内旋转但键角固定为 109.5 度，结果为 n l 平方乘 (1 加 cos 键角)/(1 减 cos 键角)，代入后约为自由连接链的 2 倍。③真实链：受位阻与分子间力限制，实际尺寸比自由旋转链还大，用刚性因子描述，它等于实测无扰尺寸与自由旋转链尺寸之比的平方根，数值越大越刚硬。\n为了让真实链也能套用最简单的高斯统计，引入等效自由连接链：把整条链折成若干个长度为链段长度的独立单元，使均方末端距等于链段数乘以链段长度的平方。这里的链段长度就是链段这个概念的定量化身——链段不是真实存在的片段，而是把相关运动折算成一个独立单元。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"均方末端距与均方回转半径（计算、简答）"},{"id":"gaowu01n06","label":"刚性因子与特征比（选择、简答）","stars":3,"point":"实测值与自由旋转值之比，越大越刚","imgs":[],"quiz":[{"id":"gaowu01-023","type":"calc","match":true},{"id":"gaowu01-008","type":"term","match":true},{"id":"gaowu01-016","type":"mcq","match":true}],"notes":[{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"},{"h":"表 4　三个模型与两个参数","t":"模型 ｜ 均方末端距 ｜ 适用与说明\n自由连接链 ｜ n 乘以 l 的平方 ｜ 最理想化，用于估算下限\n自由旋转链 ｜ 约为自由连接链的 2 倍（键角 109.5 度） ｜ 键角固定，仍高估柔性\n等效自由连接链 ｜ 链段数乘以链段长度的平方 ｜ 真实链的等效描述，链段由此定义\n刚性因子 ｜ 实测值与自由旋转链值之比的平方根 ｜ 越大链越刚，PAN、芳纶较大\n特征比 ｜ 实测无扰尺寸与自由连接尺寸之比 ｜ 衡量偏离理想链的程度\n计算提示题目给聚合度、键长、键角时，先算键数 n：加聚物一条主链上每个结构单元含两个碳碳键，故 n 等于聚合度的 2 倍。这一步错了，后面全错。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"刚性因子与特征比（选择、简答）"},{"id":"gaowu01n07","label":"影响链柔性的因素（简答、论述）","stars":4,"point":"主链结构、侧基、分子间力、温度","imgs":["img/map/m133.jpg"],"quiz":[{"id":"gaowu01-024","type":"essay","match":true},{"id":"gaowu01-004","type":"tf","match":true},{"id":"gaowu01-005","type":"tf","match":true}],"notes":[{"h":"表 3　影响链柔性的因素与方向","t":"因素 ｜ 变化 ｜ 柔性变化 ｜ 例子\n主链键型 ｜ 碳碳、碳氧、硅氧键 ｜ 柔性好，Tg 低 ｜ PE、POM、硅橡胶\n主链刚性基团 ｜ 芳环、杂环、双键 ｜ 柔性差，Tg 高 ｜ 聚酰亚胺、PET\n侧基体积 ｜ 体积大（苯环） ｜ 柔性差 ｜ PS 刚硬\n侧基极性 ｜ 极性大、可形成氢键 ｜ 柔性差 ｜ PVA、尼龙\n温度 ｜ 升高 ｜ 柔性上升 ｜ —"},{"h":"五、链柔性：内旋转的难易","t":"链柔性来自单键的内旋转。键长和键角是固定的（碳碳键长约 0.154 nm，键角约 109.5 度），但相邻两个键可以绕中间的键旋转，于是链能折叠成各种形状。旋转要克服位垒：位垒小则易旋转，链柔；位垒大则难旋转，链刚。\n影响柔性的因素归成四类。①主链结构：碳碳键、碳氧键、硅氧键的位垒小，柔性好，聚硅氧烷的 Tg 低到零下 120 度；芳环、杂环、双键使链刚硬，如聚酰亚胺、聚苯。②侧基：小侧基（甲基）影响小，大侧基（苯环）增加位垒使链刚；但柔性长侧基反而降低 Tg。③分子间作用力：氢键与极性基使链互相粘住，柔性下降。④温度：升温使位垒相对降低，柔性上升。\n注意区分链柔性与材料柔软。一条柔顺的链如果结晶度高，材料照样是硬的。这是简答题常见的陷阱。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"影响链柔性的因素（简答、论述）"},{"id":"gaowu01n08","label":"支化与交联对性能的影响（简答、选择）","stars":4,"point":"支化降 Tg 与密度，交联提 Tg 与强度","imgs":["img/map/m134.jpg","img/map/m135.jpg","img/map/m136.jpg"],"quiz":[{"id":"gaowu01-024","type":"essay","match":true},{"id":"gaowu01-022","type":"short","match":true},{"id":"gaowu01-020","type":"short","match":true}],"notes":[{"h":"表 2　构造形态对性能的影响","t":"形态 ｜ 结构特征 ｜ 性能变化 ｜ 典型例子\n线形 ｜ 无分支，可溶可熔 ｜ 结晶性好、可加工 ｜ HDPE、等规 PP\n支化 ｜ 主链带长短支链 ｜ 密度与结晶度下降，柔软透明 ｜ LDPE、乙丙橡胶\n交联 ｜ 链间以化学键连成网 ｜ 不溶不熔，Tg 升高，弹性好 ｜ 硫化橡胶、固化环氧\n星形 ｜ 一个核心引出多条臂 ｜ 粘度低、支化度高 ｜ 星形 SBS\n梯型 ｜ 双链并行的刚性结构 ｜ 耐高温、高模量 ｜ 梯形聚合物\n图 1　高分子的结构层次：近程结构与远程结构的划分（北化《高分子物理》期末复习总结）\n图 2　链结构的基本要素：化学组成、连接方式与构型（北化《高分子物理》期末复习总结）\n图 3　构型与构象的区别：能否靠单键旋转相互转变（北化《高分子物理》期末复习总结）"},{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"支化与交联对性能的影响（简答、选择）"},{"id":"gaowu01n09","label":"共聚物的序列结构（选择、简答）","stars":3,"point":"无规、交替、嵌段、接枝","imgs":["img/map/m137.jpg","img/map/m138.jpg"],"quiz":[{"id":"gaowu01-024","type":"essay","match":true},{"id":"gaowu01-020","type":"short","match":true},{"id":"gaowu01-009","type":"fill","match":true}],"notes":[{"h":"三、近程结构：链上原子怎么连","t":"近程结构包含四件事：一是结构单元的化学组成；二是连接方式，即头尾、头头、尾尾；三是侧基的构型（立构，见高化第 7 章）；四是链的构造形态，即线形、支化、交联、星形、梯型。这四项一旦生成就改不了，除非断键。\n连接方式为什么要管？因为头头连接的缺陷会打断链的规整性，使结晶能力下降。自由基聚合中头头结构约占百分之一二，这就是自由基产物结晶度往往低于配位聚合产物的原因之一。\n支化是最容易被忽视的一项。高压法低密度聚乙烯主链上带大量长短支链，支链妨碍链堆砌，所以密度低（约 0.92）、结晶度低、柔软透明；低压法高密度聚乙烯基本是线形，密度可达 0.96、刚硬。同一种单体、同一种化学组成，只因为支化不同，性能差出一大截，这是结构决定性能最干净的例证。\n交联则相反：它把链锁成网，链段运动受限，Tg 升高、强度与耐热性提高，但材料失去流动性，不能再熔融加工。橡胶的硫化就是控制交联度的工艺。"},{"h":"一、本章坐标：一切性能的起点","t":"高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。\n逻辑链：① 近程结构（组成、连接方式、构型、支化与交联） → ② 远程结构（分子量、分子量分布、构象） → ③ 链的柔性（单键内旋转的难易，由近程结构决定） → ④ 统计尺寸（均方末端距、回转半径、等效链段） → ⑤ 性能接口（Tg、结晶能力、橡胶弹性、熔体粘度）读法：读法：本章每个概念都可以问一句它可变吗。构型不可变（要断键），构象可变（单键旋转）；支化不可变，聚集态可变。这一问就是选择题的判据。\n命题口径高物部分在 866 中占分与高化相当，本章常以名词解释（构型与构象、链段、等效自由连接链）、选择（刚性因子、构象类型）、简答（为什么 PE 与等规 PP 模量差 7 倍）出现。概念题多、计算少，属于背清楚就能拿分的章节。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"共聚物的序列结构（选择、简答）"},{"id":"gaowu01n10","label":"典型链构象（填空、选择）","stars":4,"point":"溶液无规线团，晶区平面锯齿或螺旋","imgs":[],"quiz":[{"id":"gaowu01-011","type":"fill","match":true},{"id":"gaowu01-024","type":"essay","match":true},{"id":"gaowu01-006","type":"term","match":true}],"notes":[{"h":"八、易错清单与自测","t":"★★★　能用一句话区分构型与构象，并举两个例子\n★★★　能说出近程结构与远程结构各包含什么\n★★★　能写出自由连接链与自由旋转链的均方末端距关系\n★★★　能解释 PE 与等规 PP 沿 C 轴模量差 7 倍的原因\n★★　能说明支化与交联对 Tg、密度、加工性的影响\n★★　能用刚性因子解释 PAN、芳纶为什么刚\n★★　能说出链段、等效自由连接链的定义与用途\n★　能列举三种典型链构象及其出现场合\n与下一章的接口本章的无规线团是第 2 章高分子溶液的直接前提：溶液里链是线团，线团的大小决定粘度与沉降，才引出 θ 状态、特性粘数与 GPC。读完本章马上读溶液章，逻辑是连着的。"},{"h":"四、构型与构象：一字之差，天壤之别","t":"构型指链上取代基在空间的固定排布，例如全同、间同、无规，以及顺式、反式。要改变构型必须打断化学键、重新成键，所以构型是写死的。\n构象指围绕单键内旋转所形成的空间形态。它不需要断键，只需克服内旋转位垒，因此常温下就能快速互变。一条链在溶液里同时存在无数构象，我们只能用统计方法描述它。\n这个概念几乎年年考，因为一句话就能判：题目说加热后由全同变间同，一定错，那要断键；题目说拉伸后链由无规线团变伸展，一定对，那是构象变化。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"典型链构象（填空、选择）"}],"logic":{"question":"一条高分子链具有哪些结构层次？链为什么柔、柔到何种程度？","role":"高物的结构起点：近程结构决定内旋转与链柔性，远程结构用统计尺寸描述，再通往溶液和聚集态。","input":"高化的组成、构型、支化/交联和共聚序列","output":"构型/构象、链段、柔顺性指标及均方末端距","prev":null,"next":"gaowu02","links":[{"cid":"gaohua07","text":"立构规整性在这里归入构型，在高物第五章影响结晶"},{"cid":"gaowu04","text":"链柔性是 Tg 与链段运动的结构基础"}],"focus":["近程/远程结构与构型/构象","内旋转、链段及柔性影响因素","均方末端距、回转半径、等效自由连接链","刚性因子、特征比等柔顺性参数"],"common":["辨析构型与构象并举例","比较结构因素对链柔性的影响","计算自由连接链/等效链的末端距或链段长度","选择能表征柔顺性的参数并说明理由"],"examRefs":["past2023-004","past2022-003","past2021-002","past2021-005","past2021-013"]},"examRefs":["past2023-004","past2022-003","past2021-002","past2021-005","past2021-013"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":10,"examRefs":5,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu02":{"title":"高分子溶液","subject":"gaowu","nodes":[{"id":"gaowu02n01","label":"溶解过程的两个阶段（简答、名词解释）","stars":4,"point":"先溶胀（凝胶）后溶解，交联体只能溶胀","imgs":["img/map/m139.jpg","img/map/m140.jpg","img/map/m141.jpg"],"quiz":[{"id":"gaowu02-022","type":"short","match":true},{"id":"gaowu02-024","type":"essay","match":true},{"id":"gaowu02-009","type":"fill","match":true}],"notes":[{"h":"【真题 3】结晶聚合物尼龙在常温下能溶于甲酚，解释原因。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 1 题第（3）问（附标准答案）\n参考答案与给分点：甲酚与尼龙的酰胺基之间能形成氢键，溶剂与结晶聚合物中非晶区的强烈作用产生大量热，此热量足以破坏晶格，使结晶部分熔融，随后链被溶剂包围而溶解。给分点：氢键作用 1 分、破坏晶格并使晶区熔融 2 分。\n【真题 4】聚丙烯酸与聚丙烯酰胺都是极性聚合物，为什么两者共混时不相容？请从热力学与动力学两方面说明。\n来源：四川大学 866（2023 年真题解析）·简答题第 7 题\n参考答案与给分点：热力学上：相容要求混合自由能小于零。两者的混合熵都很小（聚合物的构象数远少于同数目小分子），无法抵消焓项；而羧基与酰胺基的氢键给体—受体匹配不好，链段间的偶极排斥使混合焓为正，即相互作用参数大于 0.5，故混合自由能为正，体系倾向于相分离。动力学上：两条高分子链的相互扩散速度极慢、缠结使界面难以充分混合，一旦发生相分离就难以再均化，因此即使理论上存在亚稳区，实际也表现为不相容。判断手段可用溶解度参数比较、观察是否出现两个 Tg、以及电镜下的两相形态。给分点：混合熵小与焓为正各 2 分，动力学扩散慢 2 分，判断方法 1 分。"},{"h":"表 2　溶解的三个层次","t":"阶段 ｜ 现象 ｜ 分子层面的变化 ｜ 能否继续\n溶胀 ｜ 体积膨胀、变软、成凝胶 ｜ 溶剂进入链间，链段被撑开，但链未脱离网络 ｜ 线形聚合物可继续\n溶解 ｜ 完全分散成均相溶液 ｜ 链间作用被完全取代，链自由分散 ｜ 达成平衡\n只溶胀不溶解 ｜ 交联体体积增大但保持形状 ｜ 网络被化学键固定 ｜ 到溶胀平衡为止\n图 1　高分子溶液的溶解过程与溶胀平衡（北化《高分子物理》期末复习总结）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"溶解过程的两个阶段（简答、名词解释）"},{"id":"gaowu02n02","label":"溶剂选择的依据（简答、选择）","stars":4,"point":"相似相溶、溶解度参数相近、氢键","imgs":[],"quiz":[{"id":"gaowu02-023","type":"calc","match":true},{"id":"gaowu02-006","type":"term","match":true},{"id":"gaowu02-003","type":"tf","match":true}],"notes":[{"h":"一、本章坐标：唯一能把一条链拿出来量的地方","t":"聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。\n逻辑链：① 溶解过程（先溶胀后溶解，交联体只溶胀） → ② 溶剂选择（相似相溶 + 溶解度参数相近） → ③ 热力学（Flory-Huggins 混合自由能，链段与溶剂的作用） → ④ θ 状态（链段与溶剂作用恰好抵消，链取无扰尺寸） → ⑤ 特性粘数（稀溶液粘度与分子量、链尺寸的关系） → ⑥ 延伸应用（GPC、溶胀平衡、共混相容性）读法：读法：本章的关键词是“抵消”。θ 状态下，链段之间的排斥被溶剂抵消，链的尺寸只由自身几何决定，于是才有了无扰尺寸与标定曲线。\n命题口径866 常考 θ 状态的定义与意义、特性粘数与分子量的关系（Mark-Houwink 方程）、溶胀平衡、共混相容性。2023 年简答第一题就把 θ 状态与 GPC 普适标定绑在一起问，说明这一章的考点是“概念 + 应用”组合式。"},{"h":"三、溶解：不是“一泡就化”","t":"小分子溶于水是几分钟的事，聚合物溶解要几小时甚至几天，因为链又长又缠。过程分两阶段：先溶胀——溶剂分子钻进链间，体系体积膨胀、变成凝胶，此时链还没有脱离网络；再溶解——溶胀到一定程度后链间作用被完全拆开，整条链进入溶液。\n交联聚合物永远走不到第二步：网络被化学键锁住，只能溶胀不能溶解。溶胀平衡时的体积比由交联度决定——交联点间分子量越大（交联越稀），网络越松，能吸的溶剂越多，平衡时聚合物所占体积分数越小。这条规律北化期末填空第 5 题就在考。\n溶剂选择的经验规则是相似相溶：非极性聚合物用非极性溶剂（PE 用二甲苯、PS 用甲苯），极性聚合物用极性溶剂（PVA 用水、尼龙用甲酚或甲酸）。更定量的判据是溶解度参数相近原则：两者的溶度参数越接近，混合焓越小，越易溶解。氢键也是关键——尼龙能溶于甲酚，正是甲酚与酰胺基形成氢键，拆散了链间的氢键网络。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"溶剂选择的依据（简答、选择）"},{"id":"gaowu02n03","label":"Flory-Huggins混合自由能（简答、论述","stars":3,"point":"混合熵小于理想混合，混合焓决定相容","imgs":["img/map/m142.jpg","img/map/m143.jpg"],"quiz":[{"id":"gaowu02-023","type":"calc","match":true},{"id":"gaowu02-004","type":"tf","match":true},{"id":"gaowu02-014","type":"fill","match":true}],"notes":[{"h":"一、本章坐标：唯一能把一条链拿出来量的地方","t":"聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。\n逻辑链：① 溶解过程（先溶胀后溶解，交联体只溶胀） → ② 溶剂选择（相似相溶 + 溶解度参数相近） → ③ 热力学（Flory-Huggins 混合自由能，链段与溶剂的作用） → ④ θ 状态（链段与溶剂作用恰好抵消，链取无扰尺寸） → ⑤ 特性粘数（稀溶液粘度与分子量、链尺寸的关系） → ⑥ 延伸应用（GPC、溶胀平衡、共混相容性）读法：读法：本章的关键词是“抵消”。θ 状态下，链段之间的排斥被溶剂抵消，链的尺寸只由自身几何决定，于是才有了无扰尺寸与标定曲线。\n命题口径866 常考 θ 状态的定义与意义、特性粘数与分子量的关系（Mark-Houwink 方程）、溶胀平衡、共混相容性。2023 年简答第一题就把 θ 状态与 GPC 普适标定绑在一起问，说明这一章的考点是“概念 + 应用”组合式。"},{"h":"四、θ 状态：整章的核心","t":"Flory-Huggins 理论把混合自由能写成熵项与焓项之和。聚合物的混合熵远小于同数目小分子的混合熵（因为链段被键连在一起，不能独立排布），所以焓项的符号就变得极其关键：χ 大于 0.5 时混合焓为正，链段互相排斥，链蜷缩；χ 小于 0.5 时链舒展。\n当 χ 恰好等于 0.5 时，链段之间的排斥与链段—溶剂之间的亲和恰好抵消，链的尺寸只由自身几何决定，与任何分子间作用无关。这个状态叫 θ 状态，对应的温度叫 θ 温度，对应的溶剂叫 θ 溶剂。此时测得的尺寸就是无扰尺寸，由它算出的分子量最接近真实。\nθ 状态为什么重要？因为它是唯一的“参照态”。有了它，才能把不同溶剂、不同温度下测到的尺寸归一化，得到与分子结构有关的普适参数（如特征比、刚性因子）。GPC 的普适标定也是这个思路：用已知分子量的窄分布标样，在特定溶剂与温度下建立淋洗体积与分子量的关系，再借“流体力学体积”把不同聚合物换算到同一条曲线上。\n图 2　高分子稀溶液的链尺寸与特性粘数的关系（北化《高分子物理》期末复习总结）\n答题模板问 θ 状态，按四层答：①定义（χ 等于 0.5，过量化学位为零）；②现象（链取无扰尺寸，尺寸与溶剂无关）；③意义（提供参照态，可测无扰尺寸与分子结构参数）；④应用（GPC 普适标定、Mark-Houwink 方程的标定）。四层就是满分答案。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Flory-Huggins 混合自由能（简答、论述）"},{"id":"gaowu02n04","label":"θ温度与θ溶剂（名词解释、简答）","stars":5,"point":"过量化学位为零，链取无扰尺寸","imgs":["img/map/m144.jpg"],"quiz":[{"id":"gaowu02-006","type":"term","match":true},{"id":"gaowu02-023","type":"calc","match":true},{"id":"gaowu02-020","type":"short","match":true}],"notes":[{"h":"【真题 3】结晶聚合物尼龙在常温下能溶于甲酚，解释原因。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 1 题第（3）问（附标准答案）\n参考答案与给分点：甲酚与尼龙的酰胺基之间能形成氢键，溶剂与结晶聚合物中非晶区的强烈作用产生大量热，此热量足以破坏晶格，使结晶部分熔融，随后链被溶剂包围而溶解。给分点：氢键作用 1 分、破坏晶格并使晶区熔融 2 分。\n【真题 4】聚丙烯酸与聚丙烯酰胺都是极性聚合物，为什么两者共混时不相容？请从热力学与动力学两方面说明。\n来源：四川大学 866（2023 年真题解析）·简答题第 7 题\n参考答案与给分点：热力学上：相容要求混合自由能小于零。两者的混合熵都很小（聚合物的构象数远少于同数目小分子），无法抵消焓项；而羧基与酰胺基的氢键给体—受体匹配不好，链段间的偶极排斥使混合焓为正，即相互作用参数大于 0.5，故混合自由能为正，体系倾向于相分离。动力学上：两条高分子链的相互扩散速度极慢、缠结使界面难以充分混合，一旦发生相分离就难以再均化，因此即使理论上存在亚稳区，实际也表现为不相容。判断手段可用溶解度参数比较、观察是否出现两个 Tg、以及电镜下的两相形态。给分点：混合熵小与焓为正各 2 分，动力学扩散慢 2 分，判断方法 1 分。"},{"h":"一、本章坐标：唯一能把一条链拿出来量的地方","t":"聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。\n逻辑链：① 溶解过程（先溶胀后溶解，交联体只溶胀） → ② 溶剂选择（相似相溶 + 溶解度参数相近） → ③ 热力学（Flory-Huggins 混合自由能，链段与溶剂的作用） → ④ θ 状态（链段与溶剂作用恰好抵消，链取无扰尺寸） → ⑤ 特性粘数（稀溶液粘度与分子量、链尺寸的关系） → ⑥ 延伸应用（GPC、溶胀平衡、共混相容性）读法：读法：本章的关键词是“抵消”。θ 状态下，链段之间的排斥被溶剂抵消，链的尺寸只由自身几何决定，于是才有了无扰尺寸与标定曲线。\n命题口径866 常考 θ 状态的定义与意义、特性粘数与分子量的关系（Mark-Houwink 方程）、溶胀平衡、共混相容性。2023 年简答第一题就把 θ 状态与 GPC 普适标定绑在一起问，说明这一章的考点是“概念 + 应用”组合式。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"θ 温度与 θ 溶剂（名词解释、简答）"},{"id":"gaowu02n05","label":"无扰尺寸与无扰状态的意义（简答）","stars":4,"point":"排除链段间作用，得到纯几何尺寸","imgs":["img/map/m145.jpg","img/map/m146.jpg","img/map/m147.jpg"],"quiz":[{"id":"gaowu02-002","type":"tf","match":true},{"id":"gaowu02-023","type":"calc","match":true},{"id":"gaowu02-008","type":"term","match":true}],"notes":[{"h":"一、本章坐标：唯一能把一条链拿出来量的地方","t":"聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。\n逻辑链：① 溶解过程（先溶胀后溶解，交联体只溶胀） → ② 溶剂选择（相似相溶 + 溶解度参数相近） → ③ 热力学（Flory-Huggins 混合自由能，链段与溶剂的作用） → ④ θ 状态（链段与溶剂作用恰好抵消，链取无扰尺寸） → ⑤ 特性粘数（稀溶液粘度与分子量、链尺寸的关系） → ⑥ 延伸应用（GPC、溶胀平衡、共混相容性）读法：读法：本章的关键词是“抵消”。θ 状态下，链段之间的排斥被溶剂抵消，链的尺寸只由自身几何决定，于是才有了无扰尺寸与标定曲线。\n命题口径866 常考 θ 状态的定义与意义、特性粘数与分子量的关系（Mark-Houwink 方程）、溶胀平衡、共混相容性。2023 年简答第一题就把 θ 状态与 GPC 普适标定绑在一起问，说明这一章的考点是“概念 + 应用”组合式。"},{"h":"四、θ 状态：整章的核心","t":"Flory-Huggins 理论把混合自由能写成熵项与焓项之和。聚合物的混合熵远小于同数目小分子的混合熵（因为链段被键连在一起，不能独立排布），所以焓项的符号就变得极其关键：χ 大于 0.5 时混合焓为正，链段互相排斥，链蜷缩；χ 小于 0.5 时链舒展。\n当 χ 恰好等于 0.5 时，链段之间的排斥与链段—溶剂之间的亲和恰好抵消，链的尺寸只由自身几何决定，与任何分子间作用无关。这个状态叫 θ 状态，对应的温度叫 θ 温度，对应的溶剂叫 θ 溶剂。此时测得的尺寸就是无扰尺寸，由它算出的分子量最接近真实。\nθ 状态为什么重要？因为它是唯一的“参照态”。有了它，才能把不同溶剂、不同温度下测到的尺寸归一化，得到与分子结构有关的普适参数（如特征比、刚性因子）。GPC 的普适标定也是这个思路：用已知分子量的窄分布标样，在特定溶剂与温度下建立淋洗体积与分子量的关系，再借“流体力学体积”把不同聚合物换算到同一条曲线上。\n图 2　高分子稀溶液的链尺寸与特性粘数的关系（北化《高分子物理》期末复习总结）\n答题模板问 θ 状态，按四层答：①定义（χ 等于 0.5，过量化学位为零）；②现象（链取无扰尺寸，尺寸与溶剂无关）；③意义（提供参照态，可测无扰尺寸与分子结构参数）；④应用（GPC 普适标定、Mark-Houwink 方程的标定）。四层就是满分答案。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"无扰尺寸与无扰状态的意义（简答）"},{"id":"gaowu02n06","label":"特性粘数的定义与Mark-Houwink方程（计","stars":5,"point":"[η] = K M 的 α 次方","imgs":["img/map/m148.jpg","img/map/m149.jpg"],"quiz":[{"id":"gaowu02-014","type":"fill","match":true},{"id":"gaowu02-023","type":"calc","match":true},{"id":"gaowu02-004","type":"tf","match":true}],"notes":[{"h":"表 3　Mark-Houwink 方程的三种情形","t":"α 值 ｜ 链形态 ｜ 溶剂性质 ｜ 典型体系\n0.5 ｜ 无扰线团 ｜ θ 溶剂 ｜ PS 在环己烷中 34 度\n0.5 至 0.8 ｜ 舒展线团 ｜ 良溶剂 ｜ PS 在甲苯中\n接近 1 ｜ 近伸直链 ｜ 极良溶剂或刚性链 ｜ 芳纶在浓硫酸中\n图 3　特性粘数与分子量的双对数关系（Mark-Houwink 标定）（北化《高分子物理》期末复习总结）"},{"h":"五、特性粘数：一条链在溶液里有多“占地方”","t":"稀溶液的粘度比纯溶剂高，高出的部分与聚合物占据的流体力学体积有关。定义相对粘度、增比粘度，再外推到浓度为零，得到特性粘数 [η]，单位是体积与质量之比（mL/g 或 dL/g）。\n特性粘数与分子量的关系是 Mark-Houwink 方程：[η] = K
