"cards":[{"id":"past2023-001","type":"mcq","q":"关于线性缩聚反应，下列说法正确的是","a":"C、D。反应后期体系黏度大、小分子不易排出，但延长反应时间仍能继续提高聚合度（A 错）；后期只需减压排出小分子，不必再高温高压（B 错）；缩聚可暂时停在低/中聚合度阶段，再继续反应（C 对）；聚合初期单体很快转成二聚体、三聚体等低聚物，单体几乎全部消耗（D 对）。","stars":3,"sec":"一、选择题（每题 2 分）","num":1,"ord":1,"src":"真题","year":2023,"options":["反应后期，即使延长反应时间，聚合度变化也不明显","反应后期，仍需要高温高压，去除小分子","反应可暂时停止在中聚合度阶段","聚合初期，单体几乎全部形成低聚物"],"key":"CD"},{"id":"past2023-002","type":"mcq","q":"聚酰胺反应平衡常数 K=400，等摩尔配比时，反应程度与数均聚合度约为","a":"B。封闭体系等摩尔缩聚 Xn=√K+1=21，p=(Xn−1)/Xn≈0.95。","stars":3,"sec":"一、选择题（每题 2 分）","num":2,"ord":2,"src":"真题","year":2023,"options":["p=0.94，Xn=5","p=0.95，Xn=21","p=0.95，Xn=25","p=0.97，Xn=21"],"key":"B"},{"id":"past2023-003","type":"short","q":"聚四氟乙烯熔点高的最主要原因是什么？\nA 分子量大　B 分子是螺旋结构　C 分子是平面锯齿结构　D 含有分子间氢键\n（回忆版原题选项，机构答案给 D，存疑）","a":"原题 D「含有分子间氢键」不成立：PTFE 分子中没有 H，不能形成这种氢键。PTFE 的高熔点主要应从链的高度对称规整、较高结晶度，以及螺旋链在熔融时构象变化较小、熔融熵较低来理解；强 C—F 键更多直接对应化学稳定性和热稳定性，不能简单等同于“键能大所以熔点高”。PTFE 晶体中的链确为螺旋构象，但“是螺旋结构”本身也不是充分原因。回忆版若没有合适选项，应在作答中说明上述原理，而不是选 D。","stars":3,"sec":"一、选择题（每题 2 分）","num":3,"ord":3,"src":"真题","year":2023,"reviewed":true},{"id":"past2023-004","type":"mcq","q":"下列可以使分子链柔性减小、刚性增大的有","a":"B、C、D、E。主链含孤立双键（如聚丁二烯）使链更柔顺，A 错；侧基引入苯环体积大、位阻大，链刚性增大，B 对；极性取代基增大分子间作用力与内旋转位垒，C 对；交联限制链段运动，D 对；氢键（如尼龙、纤维素）增大分子间作用力，E 对。","stars":3,"sec":"一、选择题（每题 2 分）","num":4,"ord":4,"src":"真题","year":2023,"options":["含有孤立双键","含有苯环","含有极性取代基","分子交联","氢键"],"key":"BCDE"},{"id":"past2023-005","type":"mcq","q":"用 NaOH 中和聚丙烯酸时，溶液黏度的变化是","a":"C。随中和度增大，链上 —COOH 变成 —COO⁻，分子链由卷曲变伸展、流体力学体积增大，黏度上升；中和度再增大时离子强度升高、反离子屏蔽电荷，链重新卷曲，黏度下降。","stars":3,"sec":"一、选择题（每题 2 分）","num":5,"ord":5,"src":"真题","year":2023,"options":["先增大，后不变","先减小，后增大","先增大，后减小","先减小，后增大"],"key":"C"},{"id":"past2023-006","type":"mcq","q":"膜渗透压法实验中，用 π/C 对 C 作图，下列能使斜率变大的有","a":"按通常采用的 UCST 型高分子稀溶液模型，命题预期为 A、D：π/c=RT/Mn+RT·A2·c，斜率与第二维里系数 A2 成正比；升温使溶剂趋良、A2 增大，χ减小也使 A2 增大，分子量主要改变截距。校订提示：‘升温必使 A2 增大’并非所有体系的普适规律，LCST 或复杂相互作用体系可能不同；原题未给温区，严格说 A 有条件，D 才是模型无关性更强的判断。","stars":3,"sec":"一、选择题（每题 2 分）","num":6,"ord":6,"src":"真题","year":2023,"options":["温度升高","温度减小","分子量增大","高分子和溶液的相互作用参数减小"],"key":"AD","reviewed":true},{"id":"past2023-007","type":"mcq","q":"下列单体中，因含有活泼氢而不能进行阴离子聚合的是","a":"B。丙烯酸含 —COOH 活泼氢，会与阴离子活性中心（如丁基锂）发生质子转移而终止链，故不能用阴离子聚合。","stars":3,"sec":"一、选择题（每题 2 分）","num":7,"ord":7,"src":"真题","year":2023,"options":["异丁烯","丙烯酸","丙烯酸甲酯","丙烯腈"],"key":"B"},{"id":"past2023-008","type":"mcq","q":"下列措施中，可以减少聚合物蠕变的有","a":"A、C。蠕变是链段运动与分子链滑移的累积：提高分子链刚性使链段难以运动（A 对）；轻度交联形成网络阻止分子链滑移（C 对）；升温加速链段运动、延长外力作用时间都会使蠕变更明显（B、D 错）。","stars":3,"sec":"一、选择题（每题 2 分）","num":8,"ord":8,"src":"真题","year":2023,"options":["分子链的刚性增大","温度升高","轻度交联","延长外力作用时间"],"key":"AC"},{"id":"past2023-009","type":"short","q":"比较下列说法中聚合物前后性能差异并说明理由：\n（1）聚丙烯注塑成型时，加入与不加入成核剂，晶粒尺寸和透明度；\n（2）交联聚合物与未交联聚合物的溶解特性；\n（3）聚氯乙烯中加入与不加入增塑剂，力学损耗峰所对应的温度。","a":"（1）加成核剂提高成核密度、加快结晶成核速率，球晶晶粒变细；晶粒尺寸小于可见光波长（约几百纳米以下）时散射减弱，材料由不透明变半透明/透明。\n（2）溶解是分子链向溶剂扩散、达到分子级混合；交联后分子链间由化学键连接成网络，只能溶胀不能溶解，交联度很高时几乎不溶胀，呈固体。\n（3）增塑剂是小分子，插入分子链间削弱分子间作用力、增大链段活动能力，使 Tg 下降，力学损耗峰（tanδ 峰）向低温移动。","stars":4,"sec":"三、简答题","num":2,"ord":102,"src":"真题","year":2023},{"id":"past2023-010","type":"short","q":"缩聚产物分子量分布理论上不超过 2，但实际有偏差；近期有人发现缩聚反应也可呈「活性聚合」特征。以聚酰胺为例，写出聚合物分子量与引发剂、单体浓度之间的关系，并分析其聚合反应特征。","a":"Xn =(M0 − Mt)/C（M0 为单体初始浓度，Mt 为 t 时刻单体浓度，C 为活性中心浓度）。\n活性聚合四大特征：①大分子带活性末端，可继续引发单体聚合；②聚合度与「单体浓度/起始引发剂浓度」之比成正比；③分子量随转化率线性增长；④所有链同时增长、增长链数不变，分子量分布窄（接近泊松分布）。\n因此与逐步聚合「先高转化率才高分子量、分布宽（≤2）」不同，这类体系表现出类活性聚合的分子量与转化率同步线性增长。","stars":5,"sec":"三、简答题","num":3,"ord":103,"src":"真题","year":2023},{"id":"past2023-011","type":"short","q":"高分子是典型黏弹性材料，力学性质随时间变化称为力学松弛。请列举两种力学松弛的典型现象，并解释其分子运动机理。","a":"①蠕变：恒温、恒定小外力下形变随时间增大的现象（如挂着的橡胶雨衣越拉越长）。曲线分三段：瞬时形变（键长键角变化，符合虎克定律，可回复）→ 高弹形变（链段运动使卷曲链舒展，随时间增大，可回复）→ 黏性流动（分子链间滑移，不可回复）。\n②应力松弛：恒定形变下内部应力随时间衰减（如拉长的橡皮筋收缩力越来越小）。机理：被拉伸时分子链处于不平衡构象，通过链段运动沿外力方向重排、过渡到平衡构象，内应力逐步耗散；交联体系只能松弛到一定水平，未交联体系可松弛到零。","stars":4,"sec":"三、简答题","num":4,"ord":104,"src":"真题","year":2023},{"id":"past2023-012","type":"short","q":"苯乙烯与醋酸乙烯酯共聚：r1=55，r2=0.02，Q1=1.0，Q2=0.026，e1=0.8，e2=−0.22。（1）能否用自由基共聚得到两种单体相对含量都较高的共聚物？（2）在正在反应的苯乙烯体系中加入醋酸乙烯酯会发生什么？","a":"（1）不能得到两种单体含量都较高且组成均匀的共聚物。r1=55、r2=0.02，说明苯乙烯自由基强烈偏向与苯乙烯增长，而醋酸乙烯酯链自由基与苯乙烯交叉增长的相对倾向很强；Q、e 差异也支持二者共聚能力差异大。初始共聚物会高度富集苯乙烯，并随单体消耗发生明显组成漂移，不能据此期待 1:1 均匀共聚。\n（2）在正在反应的苯乙烯体系中加入醋酸乙烯酯，不会立刻得到均匀共聚物；醋酸乙烯酯消耗很慢，体系仍主要进行苯乙烯增长。后期在苯乙烯大量消耗、条件合适时才可能出现更多醋酸乙烯酯参与的增长，因此产物具有显著不均匀性。\n校订：不能写成‘严格先后得到两种均聚物’或‘PS 与 PVAc 的嵌段产物’——该体系并非活性顺序加料，交叉增长虽少但并非绝对为零，也不会自动形成受控嵌段。","stars":4,"sec":"三、简答题","num":5,"ord":105,"src":"真题","year":2023,"reviewed":true},{"id":"past2023-013","type":"short","q":"GPC 测分子量时，若没有待测试样的聚合物标样，但有其他聚合物的标准试样，能否用它标定待测聚合物的分子量？如何测定？还需知道哪些参数？","a":"可以。思路是「用流体力学体积做通用标定」：①用一系列窄分布标样做 GPC，得到淋出体积 Ve 与 lg(M·[η]) 的通用标定曲线；②测待测试样在相同条件下的淋出体积；③由 Mark–Houwink 方程 [η]=KM^α（需知道待测试样与标样各自的 K、α）换算流体力学体积，把通用曲线转换成待测试样的 lgM–Ve 曲线，即得分子量及分布。\n需知道的参数：待测聚合物与标样的 K、α（Mark–Houwink 常数）、测试温度与溶剂、标样分子量及分布。","stars":4,"sec":"三、简答题","num":6,"ord":106,"src":"真题","year":2023},{"id":"past2023-014","type":"short","q":"聚苯乙烯强度、硬度较大但冲击强度差，简述原因，并设计两类提高冲击韧性的方法（不可过多降低模量与强度），说明增韧原理。","a":"原因：主链带苯环侧基，位阻大、链刚性大，强度硬度高；但受冲击时链段来不及运动、无法通过形变吸收能量，故脆、冲击强度差。\n两类方法：①物理共混——加入橡胶粒子（如 HIPS 中丁二烯橡胶相）；②化学改性——在 PS 主链上接枝 PB 链段（接枝共聚）。\n原理：PB 相与 PS 相发生相分离，橡胶粒子分散在 PS 基体中；受冲击时两相界面作为应力集中点诱发大量银纹，银纹扩展消耗大量能量；橡胶粒子尺寸适当时可及时终止银纹、阻止其发展成裂纹，从而在保持较高模量与强度的同时大幅提高冲击韧性。","stars":5,"sec":"三、简答题","num":7,"ord":107,"src":"真题","year":2023},{"id":"past2023-015","type":"short","q":"有人认为「乳液聚合和悬浮聚合都能制备聚合物微球，所以聚合机理相同」。这种说法是否正确？请解释。","a":"不正确。\n悬浮聚合：靠机械剪切与分散剂把单体分散成液滴，油溶性引发剂在液滴内引发，每个液滴相当于一个本体聚合微反应器，产物粒径较大（几十至几百微米）。\n乳液聚合：水溶性引发剂在水相引发，按胶束成核（或液滴成核、水相成核）机理成核，单体经水相扩散进入胶束/胶粒内增长，靠乳化剂稳定胶粒，可得亚微米级微球；存在「成核—增长—终止」三阶段，速率与粒子数关系符合 Smith–Ewart 理论。\n两者成核场所、引发剂类型、粒子稳定方式均不同，故机理不同。","stars":4,"sec":"三、简答题","num":8,"ord":108,"src":"真题","year":2023},{"id":"past2023-016","type":"essay","q":"为研究丙烯酸自由基聚合的微观动力学，用 AIBN 引发溶液聚合：测得 lnRp 对 ln[I] 呈线性、斜率 1/2；固定引发剂后 lnRp 对 ln[M] 呈线性、斜率 1。\n（1）判断是否符合「稳态、分子量很大、等活性」三假定，说明依据；\n（2）单体浓度较高时体系变黏成果冻状，这是什么现象、原因何在，此时微观动力学是否成立？\n（3）要同时提高聚合速率与聚合度，应采取什么聚合方法，说明理由。","a":"（1）实验斜率与 Rp=kp(fkd/kt)^(1/2)[I]^(1/2)[M] 相符，支持在该实验区间内使用稳态、等活性及长链近似；但外部速率级数只是证据，不能把三个假定理解为被独立、绝对证明。\n（2）高浓度后体系黏度增大，双基终止受扩散控制、kt显著下降，自由基寿命和浓度上升，出现自动加速（凝胶效应），并伴随放热集中。此时原有稳态条件被破坏，不能继续机械套用原方程。\n（3）若题意是在传统聚合方法中选择，乳液聚合可利用胶粒隔离降低不同粒子内自由基的双基终止机会，从而兼顾较高 Rp 与高分子量。ATRP/RAFT 等可控自由基方法主要用于控制链长和分布，不必然提高 Rp，也不表示完全无终止；答题时不要把两条机理混为一谈。","stars":5,"sec":"四、论述题（每题 20 分）","num":1,"ord":201,"src":"真题","year":2023,"reviewed":true},{"id":"past2023-017","type":"essay","q":"结晶聚合物的结晶形态与结晶度会影响力学性能和耐热性。请分析聚合物结构、加工外场因素对结晶速率、结晶形态、熔点的影响，并写出两种测定结晶动力学的方法及原理。","a":"①结晶速率：结构上链结构越简单、对称性与规整性越高、链柔性越大，结晶越快；同种聚合物分子量越大，熔体黏度大、链段向晶核扩散困难，结晶变慢。外场：存在最佳结晶温度（高温利于生长、低温利于成核，速率在某一温度出现极大值）；外力/取向使分子链沿力方向排列加速结晶（如天然橡胶拉伸结晶）；小分子液体渗入无定形区起诱导结晶作用；加成核剂加快成核。\n②结晶形态：极稀溶液缓冷得单晶；浓溶液或熔体结晶得球晶；浓度大、温度低或分子量大易得树枝晶；强流动场下得串晶；高温高压下得伸直链晶体。快速冷却来不及结晶或得到不完善晶体，缓慢退火可得结晶度高、完善的晶体。\n③熔点：增大分子间作用力（引入极性基、氢键、环状结构）与提高链刚性可提高 Tm；对称性、规整性高者熔融时构象变化小、Tm 高；共聚物中交替共聚使 Tm 骤降，嵌段共聚各段基本保持各自 Tm。\n④测结晶动力学：膨胀计法——结晶伴随体积收缩，测不同时刻体积（比容）变化，用 Avrami 方程 1−X(t)=exp(−kt^n) 求 k、n；DSC 法——测不同时间（或不同降温速率）的结晶峰，把峰面积积分换算成相对结晶度 X(t)，作 X(t)–t 曲线并用 Avrami 方程求结晶速率常数与 Avrami 指数。","stars":5,"sec":"四、论述题（每题 20 分）","num":2,"ord":202,"src":"真题","year":2023}],"reading":[],"imp":3.8,"hot":9},{"id":"past2022","no":2,"name":"2022 年真题（回忆版）","title":"2022","cards":[{"id":"past2022-001","type":"mcq","q":"下列聚合物晶体中，分子链处于平面锯齿构象的有","a":"A、C。构象由分子内、分子间作用力共同决定，取能量最低者。PE 全反式平面锯齿位能最低；POM 主链引入氧原子，旁式构象能量更低而成螺旋；PA（尼龙）受分子内氢键强烈影响，仍取平面锯齿并靠氢键平行排列成片；PTFE 因 F 原子半径大，呈扭转的螺旋构象。","stars":3,"sec":"一、选择题（每题 2 分）","num":1,"ord":1,"src":"真题","year":2022,"options":["聚乙烯","聚甲醛","尼龙","聚四氟乙烯"],"key":"AC"},{"id":"past2022-002","type":"mcq","q":"下列关于聚合物材料力学性质描述正确的有","a":"C。A 错：HDPE 结晶度高，拉伸强度、模量高于 LDPE，但冲击强度（韧性）反而下降。B 错：分子量增大强度提高，但拉伸强度趋于某极限值（冲击强度则持续增大）。C 对：分子间作用力越大，破坏分子间作用所需的力越大，强度越高。D 错：结晶度高、球晶尺寸大时缺陷多，冲击强度下降。","stars":3,"sec":"一、选择题（每题 2 分）","num":2,"ord":2,"src":"真题","year":2022,"options":["HDPE 的拉伸强度比 LDPE 高，冲击性能也比 LDPE 高","分子量越高，强度越高，当分子量达到一定临界值，强度增幅不明显","聚合物分子间作用力越大，强度越高","结晶度越高，球晶尺寸越大，材料的冲击强度越高"],"key":"C"},{"id":"past2022-003","type":"mcq","q":"以下哪些参数可以表征聚合物链的柔顺性","a":"B、D。空间位阻参数（刚性因子）、链段长度、无扰尺寸、极限特征比均可表征柔顺性；均方末端距与分子量有关、绝对数值不能直接比较，内旋转位垒只是影响因素之一，不作表征参数。","stars":3,"sec":"一、选择题（每题 2 分）","num":3,"ord":3,"src":"真题","year":2022,"options":["均方末端距","空间位阻参数","内旋转位垒","链段的长度"],"key":"BD"},{"id":"past2022-004","type":"mcq","q":"聚合物挤出成型时，产生熔体破碎的原因是","a":"A。剪切速率过大时，流道内各位置受到的剪切不同，熔体弹性回复不均匀，弹性形变差异累积导致挤出物表面畸变乃至破碎（鲨鱼皮、竹节状、螺旋畸变）。","stars":3,"sec":"一、选择题（每题 2 分）","num":4,"ord":4,"src":"真题","year":2022,"options":["熔体弹性应变回复不均匀","熔体粘度过小","大分子链取向程度低","分子量太高"],"key":"A"},{"id":"past2022-005","type":"mcq","q":"分子量相同的线形与支化聚合物，GPC 中先被淋洗出来的是","a":"B。分子量相同时，支化分子流体力学体积小、可进入凝胶微孔，淋出体积大、后被淋出；线形分子流体力学体积大，先被淋出。","stars":3,"sec":"一、选择题（每题 2 分）","num":5,"ord":5,"src":"真题","year":2022,"options":["支化聚合物","线性聚合物","同时淋出","不确定"],"key":"B"},{"id":"past2022-006","type":"short","q":"向聚苯乙烯中分别添加（1）芳香烃油、（2）丁苯橡胶、（3）玻璃纤维，描述性能变化，并在同一坐标系下画出温度—形变曲线。","a":"（1）芳香烃油对 PS 起增塑作用：增加自由体积、提高链段活动能力，使 Tg 降低、模量和强度通常下降，低温韧性与加工流动性改善。温度—形变曲线的转变区向低温移动，不应把 Tg 写成‘峰’。\n（2）丁苯橡胶形成分散橡胶相，可通过诱发银纹/剪切屈服和橡胶变形耗能，提高冲击韧性；多相体系会显示各相自己的转变，PS 相的 Tg 不会简单地‘整体右移’。\n（3）玻璃纤维主要提高模量、强度、尺寸稳定性与耐热变形能力，同时常使断裂伸长率和无缺口冲击韧性下降（具体还受界面与缺口条件影响）。玻纤通常不改变 PS 本体的本征 Tg，曲线主要体现高弹平台模量提高、黏流受抑，不能笼统画成‘软化温度右移’。","stars":5,"sec":"三、简要回答","num":1,"ord":101,"src":"真题","year":2022,"reviewed":true},{"id":"past2022-007","type":"short","q":"以苯乙烯为微球主体、聚乙烯醇为聚合物臂，设计合成该聚合物微球的实验思路并写出反应式。","a":"思路（「grafting-from」）：①分散/乳液聚合制得表面带引发或链转移基团的 PS 微球（如用 KPS 制备、表面保留 —SO4⁻/—OH 或用带 ATRP 引发基的单体共聚）；②将微球分散于水中，加入醋酸乙烯酯（VAc）与引发剂进行种子乳液聚合，PVA 臂在微球表面接枝增长；③再醇解使 PVAc 臂转化为聚乙烯醇臂（NaOH/甲醇醇解）。\n反应式要点：KPS 引发 St → PS 微球（表面带活性点）；表面活性点引发 VAc → PS-g-PVAc；醇解 PS-g-PVAc + nCH3OH → PS-g-PVA + nCH3COOCH3。\n也可写「先合成带端基的 PVA 大分子单体，再与 St 共聚（grafting-through）」。","stars":4,"sec":"三、简要回答","num":2,"ord":102,"src":"真题","year":2022},{"id":"past2022-008","type":"short","q":"氯乙烯能否进行阴离子、阳离子聚合？为什么？合成 PVC 时为何把转化率控制在 80% 以下？PVC 耐热性有何特点？","a":"①工业上氯乙烯主要采用自由基聚合。不能只用‘氯原子诱导与共轭完全抵消’一句话概括；还要结合活性中心稳定性、链转移和具体反应条件判断。②转化率控制在约 80% 以下主要是工艺与树脂质量控制：高转化率时散热和自动加速问题更突出，同时单体大量消耗后继续延长反应会影响颗粒结构与树脂质量，并增加后处理负担；不能把原因写成‘转化率越高，向单体链转移越多’。PVC 聚合度通常主要通过聚合温度控制，因为向单体链转移重要。③PVC 热稳定性较差，受热易脱 HCl 并形成共轭多烯序列而变色、性能下降；加工需配合热稳定剂，并通过配方和工艺控制加工窗口。","stars":5,"sec":"三、简要回答","num":3,"ord":103,"src":"真题","year":2022,"reviewed":true},{"id":"past2022-009","type":"short","q":"聚丙烯抽丝时牵伸比相同，分别用冷水和 363 K 热水冷却，再把两种丝都加热到 363 K，哪种收缩率大？说明理由。","a":"冷水冷却的丝收缩率大。抽丝牵伸使分子链取向，取向与解取向同时进行：热水冷却时链段运动快、解取向快，取向结构大量丧失，再加热时收缩小；冷水（冰水）快速冻结链段运动，取向结构被保留，再加热到 363 K 时链段解冻发生解取向，收缩率大。","stars":4,"sec":"三、简要回答","num":4,"ord":104,"src":"真题","year":2022},{"id":"past2022-010","type":"short","q":"研究熔融缩聚（聚酯）反应动力学、测定聚合活化能：简述实验步骤与数据处理方法。","a":"实验步骤：在多个恒定温度下进行等基团数熔融缩聚，定时取样，用端基分析等测定 Xn；同时保持小分子排出条件一致，避免副反应和配比漂移。数据处理必须先确定动力学条件：外加酸催化、二级反应时常用 Xn=1+2kC0t，以 Xn 对 t 作图；自催化、三级反应的理想式常写为 Xn²=1+2kC0²t，应以 Xn² 对 t 作图。不能不分条件都写成‘Xn 对 t 的斜率就是 k’。由各温度下相应直线求 k，再作 ln k 对 1/T 图，按 Arrhenius 方程由斜率 −Ea/R 求表观活化能。","stars":4,"sec":"三、简要回答","num":5,"ord":105,"src":"真题","year":2022,"reviewed":true},{"id":"past2022-011","type":"short","q":"有无规、全同、间同三种聚丙烯，描述其结构特点，并在同一坐标系画出比容—温度曲线（升温）与 DSC 曲线（降温），标出特征温度。","a":"结构：无规 PP 的甲基无规分布在主链两侧，立构规整度低、不结晶（或结晶度极低），为无定形、橡胶状；全同 PP 的甲基全在同一侧，立构规整度高、可高度结晶（Tm≈165 ℃，α 晶），强度、耐热好；间同 PP 甲基相间分布在两侧，规整度较高、可结晶但熔点较低（约 130–150 ℃）、晶体不同。\n曲线要点：升温比容—温度曲线上，无规 PP 只在 Tg（约 −10 ℃）处出现比容拐点、无 Tm 台阶；全同与间同 PP 在 Tm 处比容陡增（全同 PP 的 Tm 更高）；DSC 降温曲线上，全同 PP 结晶峰温度最高、峰最尖，间同次之，无规 PP 基本无结晶峰。","stars":5,"sec":"三、简要回答","num":6,"ord":106,"src":"真题","year":2022},{"id":"past2022-012","type":"short","q":"有四种自由基共聚的 F1–f1 曲线。若要控制共聚产物具有任意需要且较均一的平均组成，应分别采取什么办法？","a":"核心是让单体组成在反应过程中保持恒定，使瞬间组成恒定：\n①恒比点投料（r1<1、r2<1 且有恒比点时）：按恒比点组成投料，共聚物组成与转化率无关，始终均一。\n②控制转化率的一次投料法：r1>1、r2<1 且以 M1 为主时，按适当配比一次投料，反应到一定转化率即停止（转化率不宜高），使组成漂移不大。\n③补加活泼单体法（半连续/滴加法）：以 M2 为主或要求高转化率时，在聚合过程中不断补加消耗快的活泼单体，维持单体组成恒定。\n④无恒比点的 r1>1、r2>1 体系：只能用低转化率一次投料并即时补加，或改用连续加料共聚。","stars":5,"sec":"四、论述题","num":1,"ord":201,"src":"真题","year":2022},{"id":"past2022-013","type":"essay","q":"举例说明聚合物熔体粘弹性（至少 3 种）与本体粘弹性（至少 3 种）的表现，阐述其分子机理，以及如何消除粘弹性给制品带来的影响。","a":"熔体黏弹性：①爬杆效应——旋转剪切产生法向应力差；②挤出胀大——口模内储存的弹性形变在出口回复；③熔体破裂——高剪切下入口/口模应力集中、滑移—黏附和弹性失稳等引起畸变。本体黏弹性：蠕变、应力松弛、滞后/内耗，共同根源是链段运动需要时间，材料同时储存弹性能并耗散能量。\n改善措施必须与现象对应：熔体破裂可降低剪切速率、提高口模温度、优化入口角和流道、使用加工助剂；挤出胀大可优化口模长径比、温度和牵引；蠕变可提高链刚性、适度交联或增强、降低使用温度和应力。校订：‘提高分子量可消除熔体破裂’不是通用办法，提高分子量往往还会提高黏度和弹性；‘远离 Tg’也不能笼统解决所有松弛问题，应按实际使用温区设计。","stars":5,"sec":"四、论述题","num":2,"ord":202,"src":"真题","year":2022,"reviewed":true}],"reading":[],"imp":4.0,"hot":8},{"id":"past2021","no":3,"name":"2021 年真题","title":"2021","cards":[{"id":"past2021-001","type":"mcq","q":"能对自由基聚合和阳离子聚合产生阻聚作用，而对阴离子聚合没有阻聚作用的是","a":"A。苯醌是自由基捕获剂，可终止自由基链并可与阳离子活性中心作用；对阴离子聚合无明显阻聚（阴离子引发剂可直接与单体反应），故选苯醌。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":1,"ord":1,"src":"真题","year":2021,"options":["苯醌","氧气","水","DPPH"],"key":"A"},{"id":"past2021-002","type":"mcq","q":"以下现象可以用「聚合物存在链段运动」来解释的有","a":"A、C。溶胀是溶剂分子渗入使链段运动、分子链舒展的过程；受力时的高弹形变来自链段由卷曲到伸展的运动，二者都由链段运动解释。熔体黏度极大、熔融时存在熔限分别与分子链缠结/整体运动、结晶完善程度有关。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":2,"ord":2,"src":"真题","year":2021,"options":["聚合物泡在溶剂中会发生溶胀","聚合物熔体粘度非常大","聚合物受力时可发生弹性形变","聚合物熔融时存在「熔限」"],"key":"AC"},{"id":"past2021-003","type":"mcq","q":"下列聚合物的晶体中，分子链处于平面锯齿构象的有","a":"B、C、D。PA66 受分子内氢键影响取平面锯齿；HDPE 全反式平面锯齿位能最低；POM 主链氧原子使旁式更稳定，应成螺旋——但按机构答案 POM 列入（与 2022 年同题答案为「PE、POM」互相矛盾）。PTFE 因 F 半径大呈螺旋构象，肯定不选。\n保守作答：选 PA66、HDPE（本题选项口径下机构答案 B、C、D）。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":3,"ord":3,"src":"真题","year":2021,"options":["PTFE","PA66","HDPE","POM"],"key":"BCD"},{"id":"past2021-004","type":"short","q":"下列关于聚合物材料力学性质描述正确的是（ ）\nA HDPE 的拉伸强度比 LDPE 高，冲击强度也比 LDPE 高\nB 分子量越高强度越高，达到临界值后增幅不明显\nC 分子间作用力越大，强度越高\nD 结晶度越高、球晶尺寸越大，冲击强度越高\n（机构答案给 A、C，存疑）","a":"正确答案应为 C（按高物教材口径）。\nA 错：HDPE 结晶度高，拉伸强度、模量高，但冲击强度比 LDPE 低（韧性差）。\nB 只对一半：强度随分子量提高而增大，拉伸强度趋近极限值，但冲击强度会持续增大，故作为「正确描述」不严密。\nC 对：分子间作用力越大，破坏分子间结合所需能量越大，强度越高。\nD 错：球晶尺寸越大，缺陷越多，冲击强度越低。\n注：2021 年机构版答案给 A、C，与 2022 年同题（答案 C）矛盾，建议以 C 为准，若考场上见到此题可写 C 并说明 A 中「冲击强度也更高」不成立。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":4,"ord":4,"src":"真题","year":2021},{"id":"past2021-005","type":"short","q":"以下哪些参数可以表征聚合物链的柔顺性（ ）\nA 均方末端距　B 空间位阻参数　C 内旋转位垒　D 链段的长短\n（机构答案给 D）","a":"常用表征参数有五个：链段长度（Kuhn 链段长）、空间位阻参数（刚性因子 σ）、无扰尺寸、极限特征比、刚性分子的构象持续长度。\n因此 D（链段长短）正确；B（空间位阻参数 = 刚性因子）同样属于标准参数，按教材口径也应选。A 均方末端距数值随分子量变化、不能直接比较；C 内旋转位垒只是柔顺性的物理来源，不作表征参数。\n结论：严格作答应选 B、D；机构答案仅给 D，属口径差异，考试时若为单选优先 D。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":5,"ord":5,"src":"真题","year":2021},{"id":"past2021-006","type":"mcq","q":"RAFT 聚合体系：单体 1.00 g（M=500），AIBN 1.2 mg（M=164），链转移剂 3.50 mg（M=263），单体转化率 60% 时，聚合物理论分子量约为","a":"C。Mn = Conv×(W/n) + M_RAFT，其中 n 取 RAFT 试剂摩尔数（假设全部参与、活性中心数等于 RAFT 分子数）：n=3.50 mg/263≈1.33×10⁻⁵ mol，Mn≈0.60×1.00 g /1.33×10⁻⁵ mol +263≈45 000。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":6,"ord":6,"src":"真题","year":2021,"options":["75000","140000","45000","82000"],"key":"C"},{"id":"past2021-007","type":"mcq","q":"下列单体中，因具有活泼氢而不能发生阴离子聚合的是","a":"B。丙烯酸含 —COOH 活泼氢，会与阴离子活性中心发生质子转移而终止，故不能阴离子聚合。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":7,"ord":7,"src":"真题","year":2021,"options":["异丁烯","丙烯酸","丙烯酸甲酯","丙烯腈"],"key":"B"},{"id":"past2021-008","type":"mcq","q":"下列关于活性聚合的描述中，不正确的是","a":"D。活性/可控聚合的关键是快速且尽量同时引发、增长链数近似恒定、不可逆终止和链转移受到抑制，因此‘易转移’明显错误。B 的分子量随转化率线性增长、C 的窄分布是理想条件下的典型特征。校订 A：一级动力学通常指 ln([M]0/[M]) 与时间呈线性，或者说 Rp 对单体浓度为一级；并不是‘聚合速率与时间呈线性关系’。若 A 的括号内表述按字面理解，A 也不严谨。理想活性聚合也不宜绝对化为‘慢增长’，准确说法是引发相对于增长足够快、各链近似同步开始。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":8,"ord":8,"src":"真题","year":2021,"options":["聚合满足一级动力学行为，即聚合速率与时间呈线性关系","具有预期的聚合度，即数均分子量与单体转化率呈线性关系","分子量分布窄，服从泊松（Poisson）分布","聚合特点为快引发，快增长，易转移，难终止"],"key":"D","reviewed":true},{"id":"past2021-009","type":"mcq","q":"下列聚合物拉伸强度最低的是","a":"A。LDPE 支化多、结晶度低（约 40–50%），分子链堆砌松散，拉伸强度最低（约 10 MPa）；HDPE、PC、锦纶均明显更高。","stars":3,"sec":"一、选择题（每题 2 分，共 18 分）","num":9,"ord":9,"src":"真题","year":2021,"options":["LDPE","HDPE","PC","锦纶"],"key":"A"},{"id":"past2021-010","type":"short","q":"完成反应方程式并注明条件、指出聚合机理：甲苯二异氰酸酯（TDI）与二端羟基聚乙二醇合成聚氨酯。","a":"反应：m OCN–Ar–NCO + m HO–(CH2CH2O)n–H → 逐步加成生成 —NHCOO— 连接的聚氨酯（可写成 [—CO–NH–Ar–NH–CO–O–(CH2CH2O)n—] 重复单元）。\n条件：无水、60–80 ℃，可加二月桂酸二丁基锡催化。\n机理：异氰酸酯 —NCO 与羟基 —OH 的逐步加成（氢转移加成），无小分子析出，属逐步聚合（不是缩聚）。","stars":4,"sec":"二、完成反应方程式（每题 4 分，共 12 分）","num":1,"ord":101,"src":"真题","year":2021},{"id":"past2021-011","type":"short","q":"完成反应方程式并指出机理：甲基丙烯酸甲酯自由基聚合时的链终止反应。","a":"两种终止方式：\n①偶合终止：两条增长链自由基末端碳相互结合成键，~CH2–C(CH3)(COOCH3)· + ·C(CH3)(COOCH3)–CH2~ → 一个大分子（聚合度加倍）。\n②歧化终止：一条链末端自由基夺取另一条链上 β-氢（ tertiary H），一条生成末端双键、另一条生成饱和端基，两条链各得一个死分子。\n机理：双基终止（扩散控制），PMMA 在 60 ℃ 以上以歧化为主。","stars":4,"sec":"二、完成反应方程式（每题 4 分，共 12 分）","num":2,"ord":102,"src":"真题","year":2021},{"id":"past2021-012","type":"short","q":"完成反应方程式并指出机理：苯乙烯—马来酸酐共聚物的合成。","a":"反应：n CH2=CH–Ph + n (CH–CO)2O → 交替共聚物 [–CH2–CH(Ph)–CH(CO)–CH(CO)–O–]n（马来酸酐单元开环成五元环结构）。\n条件：AIBN 或 BPO 引发，60–80 ℃，甲苯/丁酮等溶剂，马来酸酐与苯乙烯按 1:1 投料。\n机理：自由基交替共聚——马来酸酐缺电子（r1≈0）、苯乙烯供电子（r2≈0），二者只能交叉增长，形成严格交替结构；产物不溶于一般溶剂、耐热性好。","stars":4,"sec":"二、完成反应方程式（每题 4 分，共 12 分）","num":3,"ord":103,"src":"真题","year":2021},{"id":"past2021-013","type":"short","q":"请分别举例说明高分子链柔顺性、单烯加成均聚产物与共聚产物、立构规整性、二烯类高聚物的顺反异构、聚合物的支化结构对高聚物结晶能力的影响（不要使用重复例子）。","a":"①柔顺性越好越易结晶：聚乙烯链柔顺、结晶度可达 60–90%。\n②均聚物分子链只含一种结构单元、链结构规整，一般易结晶（PE）；但自由基聚合的 PS 因头头/尾尾与支化等结构不规整，不能结晶。共聚物：无规共聚会破坏链规整性而失去结晶能力（乙丙橡胶）；嵌段共聚各段可分别结晶（SBS 中 PS 段）；交替共聚物规整时可结晶（苯乙烯—马来酸酐交替）。\n③立构规整性高易结晶：全同 PP、间同 PP 可结晶，无规 PP 不能。\n④二烯类顺反异构：反式聚异戊二烯（古塔波胶）规整可结晶，顺式聚异戊二烯（天然橡胶）不能结晶，呈橡胶态。\n⑤支化：支化程度越低越易结晶，HDPE 近线形结晶度高，LDPE 支化多、结晶度低。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":1,"ord":201,"src":"真题","year":2021},{"id":"past2021-014","type":"short","q":"「聚合物刷」是聚合物链一端固定在基面、连接密度很高时链垂直于基面排列的拓扑结构。请设计制备高连接密度聚合物刷的实验方案，要求所有垂直排列链的 A 段尽可能等高，写出主要步骤与必要反应式。","a":"思路：用「grafting-from」+ 活性聚合保证 A 段等长。\n①基面活化：硅片/玻璃用 Piranha 液清洗后用 3-氨丙基三乙氧基硅烷（APTES）或 KH560 改性，引入 —NH2/环氧基。\n②固定引发点：把 ATRP 引发剂（如 2-溴异丁酰溴）与表面 —NH2/—OH 反应，形成高密度单分子层引发点（密度决定刷的接枝密度）。\n③A 段等长：在表面进行活性/可控聚合（ATRP 或阴离子聚合），因快引发、链数恒定，所有链同步增长，A 段长度一致（时间控制聚合度）。\n④末端官能化：用带羧基/环氧的终止剂（如溴代乙酸或 KH560）终止，使 A 段末端带 —COOH/环氧。\n⑤接 B 段：由 A 段末端活性基再引发第二种单体（或与带端基的 B 链偶联），得到 A-b-B 刷。\n⑥表征：椭圆偏振/原子力测膜厚、XPS 与接触角验证化学组成。\n关键：先用阴离子活性聚合制备等长 A 段（如 sec-BuLi 引发苯乙烯，活性末端聚合度由 [M]/[I] 决定），再通过端基反应（—COOH + KH560 硅烷偶联）把 A 段固定到基面。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":2,"ord":202,"src":"真题","year":2021},{"id":"past2021-015","type":"short","q":"三嵌段共聚物 M-S-M（M=PMMA，S=PS）：固定 S 段聚合度、增大两侧 M 段聚合度时，在苯中 S 段的均方末端距升高，为什么？换成丙酮溶剂还有这种变化吗？已知溶度参数：PS≈8.7–9.5、PMMA≈9.0–9.5、苯 9.15、丙酮 10。","a":"①在苯中：苯是 PMMA 的良溶剂，PMMA 段充分溶剂化而伸展膨胀；位于 S 段两端的 M 段因溶剂化产生体积排斥（空间排斥），对 S 段两端施加张力，把 S 段拉伸。M 段聚合度增大→体积与排斥力增大→S 段均方末端距上升。\n②换成丙酮则不会。丙酮对 PS 与 PMMA 都是劣溶剂：PMMA 在丙酮中蜷缩，M 段对 S 段产生的是收缩力而非排斥；M 段变长只会使收缩力增大，S 段均方末端距不再升高（甚至下降）。\n判断依据：比较溶度参数——苯（9.15）与 PMMA（9.0–9.5）接近，为良溶剂；丙酮（10）远离 PS（8.7–9.5）与 PMMA 的有效区间，为劣溶剂。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":3,"ord":203,"src":"真题","year":2021},{"id":"past2021-016","type":"short","q":"为提高缩聚与自由基聚合产物的聚合度，分别以一个聚合反应实例说明应采取哪些具体手段，并说明原因。","a":"A 缩聚（以 PET 为例）：①充分搅拌、减压（或通惰性气）排出小分子，使平衡向正方向移动；②原料纯化，避免单官能杂质造成封端；③严格等摩尔（1:1）配比，避免某一单体过量导致提前封端；④适当延长反应时间、后期升高温度（在抑制副反应的范围内）提高反应程度。\nB 自由基聚合（以 PS 为例）：①原料与溶剂纯化，减少杂质引发的链终止/链转移；②适当降低引发剂浓度，减少活性中心数目、提高每条链的聚合度；③适当降低温度，减小链转移常数与终止速率；④选择链转移常数小的溶剂或本体聚合；⑤控制转化率、避免高温下的链转移（也可用活性自由基聚合得到窄分布高分子量）。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":4,"ord":204,"src":"真题","year":2021},{"id":"past2021-017","type":"short","q":"画出下列曲线并在图中标出特征参数，再用虚线示意括号内参数改变时曲线的变化：\n（1）有机玻璃（PMMA，Tg=100 ℃，Tf=200 ℃）在 −20 ℃、80 ℃、150 ℃ 下的应力—应变曲线；\n（2）部分结晶 PET（Tg=75 ℃，Tm=230 ℃）缓慢降温与快速降温过程中的比容—温度曲线。","a":"（1）−20 ℃（Tg 以下，玻璃态）：曲线近似直线，斜率大（高模量），断裂伸长很小，脆性断裂。80 ℃（Tg 与 Tf 之间，高弹态）：起始模量小，出现很长的平台（高弹形变，可达数百 %），断裂伸长最大、应力低。150 ℃（接近 Tf，黏流态）：几乎无弹性平台，应力很低即发生流动，形变随应力迅速增大。虚线示意：温度升高→曲线整体下移、平台变长。\n（2）缓慢降温：比容沿熔体直线下降，在 Tm（230 ℃）处出现明显转折并陡降（结晶放出体积），之后沿晶体线继续下降，室温比容低（结晶度高）。快速降温：熔体直线延伸越过 Tm 而不结晶（过冷），在 Tg（75 ℃）附近出现转折后转为玻璃态直线，室温比容高（结晶度低）。虚线示意即另一条降温路径。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":5,"ord":205,"src":"真题","year":2021},{"id":"past2021-018","type":"short","q":"已知苯乙烯 r1=0.52、甲基丙烯酸甲酯 r2=0.46。（1）讨论两单体自由基共聚所得共聚物组成随转化率增加的变化趋势；（2）要合成 MMA—St 嵌段共聚物，从 ATRP、RAFT、阴离子聚合、阳离子聚合中选出适用方法并解释。","a":"（1）恒比点 F1=f1=r2/(r1+r2)=0.46/(0.52+0.46)≈0.47（换算成 St 摩尔分数约 0.47；按另一口径 (1−r2)/(2−r1−r2)=0.54，即 St:MMA≈0.54）。r1<1、r2<1，有恒比点。三种情况：投料组成低于恒比点时，随转化率增大 F1 下降；高于恒比点时，随转化率增大 F1 上升；恒比点投料时 F1 恒定不变。（组成漂移方向都是「远离恒比点」——消耗快的单体先被耗尽。）\n（2）ATRP、RAFT 与阴离子聚合均适用，阳离子聚合不适用（St 与 MMA 都不是易阳离子聚合单体，且 MMA 的酯基会被阳离子活性中心进攻）。理由：St、MMA 都是共轭单体，ATRP 中可生成稳定自由基、增长可控；RAFT 适用范围广、对单体纯度要求低；二者均有活性末端，可顺序加料得嵌段。阴离子聚合（如 sec-BuLi 在 THF、−78 ℃ 先聚 St 再加 MMA）可得窄分布嵌段，工业上 SBS 及 MMA-St 嵌段常用此法。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":6,"ord":206,"src":"真题","year":2021},{"id":"past2021-019","type":"short","q":"某企业购入两批 MMA 原料，制成 PMMA 样条后性能有差异。技术人员怀疑是分子量或分子量分布不同。请设计实验确认，并简述原理与过程。","a":"用凝胶渗透色谱（GPC/SEC）一次同时测得分子量与分子量分布。\n原理：色谱柱填充带微孔的凝胶，聚合物溶液从柱顶淋入。流体力学体积大的分子可进入的孔少、路径短，先被淋出；体积小的分子进入孔内、路径长，后被淋出。淋出体积与分子量（流体力学体积）呈一一对应，用窄分布标样标定即可得 Mn、Mw 及分布指数 Mw/Mn。\n过程：①PMMA 溶于 THF（或 DMF），配成约 1–2 mg/mL 溶液、过 0.45 μm 滤膜；②以 THF 为流动相，流速 1 mL/min、柱温 35 ℃，进样；③记录淋出曲线，用 PS 标样标定曲线 + Mark–Houwink 换算（PMMA 的 K、α）得到分子量与分布。\n判据：若两批 Mn 相近但 Mw/Mn 差异大→分布差异；若分布相近而 Mn 明显不同→分子量差异。可辅以黏度法（测 [η] 求 Mv）与 DSC 测 Tg 佐证。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":7,"ord":207,"src":"真题","year":2021},{"id":"past2021-020","type":"short","q":"口罩核心过滤层是聚丙烯熔喷布（纤维直径 0.5–10 μm）。①熔喷用 PP 树脂对分子量及分子量分布有什么要求，为什么？②常规 Ziegler–Natta 催化体系制得 PP 的重均分子量约 3×10⁵–7×10⁵，能否满足？③若不能满足，可用哪些方法改性（至少两种并说明依据）？","a":"①要求：分子量分布要窄（利于稳定牵伸、成细纤维、减少并丝）；分子量要适当低（熔指高、熔体流动性好），才能在高速热气流下被牵伸成超细纤维。分布宽会出现「高分量拉不动、低分量断丝」。\n②Mn 偏高的常规 Z-N PP（Mw≈3×10⁵–7×10⁵）熔指太低（通常 <5 g/10min），喷丝困难、纤维粗，一般不能满足熔喷要求（熔喷料熔指常在 800–1500 g/10min 量级）。\n③改性方法：a. 化学降解法（可控流变）——在双螺杆挤出机中加入有机过氧化物（如 DCP）使 PP 发生 β 断链降解，降低分子量、窄化分布、提高熔指；b. 物理降解法——超声降解、高温热降解/螺杆强剪切降解；c. 选用茂金属催化剂直接聚合得到窄分布、低分子量的熔喷专用料；d. 共混改性——与低分子量/高熔指 PP 或降解 PP 共混调节熔指。","stars":5,"sec":"三、简要回答（每题 10 分，共 80 分）","num":8,"ord":208,"src":"真题","year":2021},{"id":"past2021-021","type":"essay","q":"2011 年 Leibler 等在 Science 发表「以动态共价键实现热固性树脂的自修复与再塑」。请根据网络重排（A 图）画出该材料与传统热固性树脂的应力松弛曲线（同一坐标系），解释差异、预测松弛模量对温度的依赖（WLF/Arrhenius），并给出原理分析；再根据 B 图的化学结构变化分析网络重排的化学机制，并提出一种加速重排的化学手段。","a":"①应力松弛曲线：两者起始模量相近，传统热固性树脂只能松弛到一个较高的平台（残余应力高）；含动态键的材料可继续松弛、最终降到接近零（低于传统树脂），曲线在长时间侧明显下移。\n②原因：动态共价键可断裂—重组，交联网络能拓扑重排，分子内应力通过键交换被耗散，形成内应力更低的稳态；传统树脂交联网络不可断裂，链段只能做有限调整。\n③温度依赖：松弛模量 E(t,T) 可用 Arrhenius 或 WLF 描述——键交换是化学活化过程，速率随温度按 Arrhenius 增大（ln τ 与 1/T 线性）；在 Tg 附近链段运动控制时可用 WLF 时温等效。温度升高或时间延长都使应力下降（时温等效）。\n④化学机制：网络重排由酯交换反应（羟基/羧基与酯键的酯交换，或 β-羟基酯的交换）实现，交联点被「切开—重组」，网络拓扑改变而交联密度不变。\n⑤加速手段：升高温度；加入酯交换催化剂（如 Zn(OAc)2、1,5,7-三氮杂双环[4.4.0]癸-5-烯 TBD、Ti(OiPr)4 等 Lewis 酸/碱催化剂）；也可引入更多羟基以提高交换速率。","stars":5,"sec":"四、论述题（每题 20 分，共 40 分）","num":1,"ord":301,"src":"真题","year":2021},{"id":"past2021-022","type":"essay","q":"已知聚丁二烯（Tg=−70 ℃，溶度参数 16.0–16.6）与聚苯乙烯（Tg=100 ℃，溶度参数 17.4–19.0）。A 为 PS 与顺丁橡胶共混物（20:80 质量比），B 为苯乙烯—丁二烯无规共聚物，C 为 SBS 嵌段共聚物（平均组成与共混物相同）。画出 A、B、C 在 −100 ℃～+120 ℃ 范围内可能的力学损耗—温度曲线（标出特征温度范围），并详述三者性能差异及原因。","a":"①tanδ–T 曲线：在 Tg 以下链段冻结、损耗小；Tg 区链段运动摩擦最大，出现 tanδ 峰；进入高弹态后 tanδ 下降。\nA（共混）：两组分部分相容、界面互容，出现一个介于 PB（−70 ℃）与 PS（100 ℃）之间的宽峰，因 PB 占 80%，峰偏低温（约 −40～−20 ℃）。\nB（无规共聚）：完全均相，只有一个 Tg（丁苯橡胶约 −50～−60 ℃），tanδ 峰单一、较宽。\nC（SBS 嵌段）：两相分离，出现两个峰，分别接近 PB（−70 ℃）与 PS（100 ℃），PS 峰较窄（硬段玻璃化），且高温侧峰对应硬段。\n②性能差异：A 为增韧 PS（HIPS 类），抗冲击性、加工流动性好，但透明性差、耐热有限；B 为丁苯橡胶，常温处于高弹态，弹性、回弹、耐磨、耐水好，强度低，需硫化；C 为热塑性弹性体，兼具橡胶弹性与热塑性加工性（PS 硬段起物理交联、PB 软段提供弹性），可反复加工回收，但耐热与耐溶剂性受硬段限制。\n③原因：共混/共聚/嵌段的相分离尺度不同——A 部分相容、B 完全均相、C 强相分离，决定了 Tg 峰数目与力学行为。","stars":5,"sec":"四、论述题（每题 20 分，共 40 分）","num":2,"ord":302,"src":"真题","year":2021}],"reading":[],"imp":4.0,"hot":13}]}],"map":{"chapters":{"gaohua01":{"title":"绪论","subject":"gaohua","nodes":[{"id":"gaohua01n01","label":"高分子的定义与分子量界限（选择、名词解释）","stars":2,"point":"相对分子质量约大于 1 万，且分子量不均一","imgs":["img/map/m001.jpg","img/map/m002.jpg"],"quiz":[{"id":"gaohua01-025","type":"calc","match":true},{"id":"gaohua01-026","type":"essay","match":true},{"id":"gaohua01-023","type":"short","match":true}],"notes":[{"h":"表 3　常用聚合物的重复单元分子量与聚合度换算","t":"聚合物 ｜ 单体 ｜ M₀（重复单元） ｜ Mn 与 DP 的关系式\n聚乙烯 PE ｜ 乙烯 ｜ 28 ｜ Mn = 28 × DP\n聚苯乙烯 PS ｜ 苯乙烯 ｜ 104 ｜ Mn = 104 × DP\n聚甲基丙烯酸甲酯 PMMA ｜ MMA ｜ 100 ｜ Mn = 100 × DP\n聚氯乙烯 PVC ｜ 氯乙烯 ｜ 62.5 ｜ Mn = 62.5 × DP\n尼龙 66 ｜ 己二胺 + 己二酸 ｜ 226（已脱去 2 分子水） ｜ Mn = 226 × DP\n聚对苯二甲酸乙二酯 PET ｜ 乙二醇 + 对苯二甲酸 ｜ 192（已脱去 2 分子水） ｜ Mn = 192 × DP\n易错提醒把“链节”当成“链段”。链节是结构上的重复单元，链段是高分子物理里能独立运动的最小单元，两者数量级差几百倍。名词解释写混，直接丢分。"},{"h":"六、分子量与分布：第一章就要建立“分布”意识","t":"聚合物的分子量不是一个数，而是一个分布。原因是聚合过程中每一条链的引发时刻、增长次数、终止时刻都不同，缩聚里更是随机缩合。于是同一个牌号的聚乙烯，分子量从几万到几十万都有。这就逼出了四种平均分子量。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"高分子的定义与分子量界限（选择、名词解释）"},{"id":"gaohua01n02","label":"单体、结构单元、重复单元、链节、单体单元（名词解","stars":4,"point":"加聚三者合一，缩聚结构单元不等于重复单元","imgs":["img/map/m003.jpg","img/map/m004.jpg","img/map/m005.jpg"],"quiz":[{"id":"gaohua01-025","type":"calc","match":true},{"id":"gaohua01-006","type":"term","match":true},{"id":"gaohua01-013","type":"fill","match":true}],"notes":[{"h":"表 3　常用聚合物的重复单元分子量与聚合度换算","t":"聚合物 ｜ 单体 ｜ M₀（重复单元） ｜ Mn 与 DP 的关系式\n聚乙烯 PE ｜ 乙烯 ｜ 28 ｜ Mn = 28 × DP\n聚苯乙烯 PS ｜ 苯乙烯 ｜ 104 ｜ Mn = 104 × DP\n聚甲基丙烯酸甲酯 PMMA ｜ MMA ｜ 100 ｜ Mn = 100 × DP\n聚氯乙烯 PVC ｜ 氯乙烯 ｜ 62.5 ｜ Mn = 62.5 × DP\n尼龙 66 ｜ 己二胺 + 己二酸 ｜ 226（已脱去 2 分子水） ｜ Mn = 226 × DP\n聚对苯二甲酸乙二酯 PET ｜ 乙二醇 + 对苯二甲酸 ｜ 192（已脱去 2 分子水） ｜ Mn = 192 × DP\n易错提醒把“链节”当成“链段”。链节是结构上的重复单元，链段是高分子物理里能独立运动的最小单元，两者数量级差几百倍。名词解释写混，直接丢分。"},{"h":"三、从单体到聚合物：五个名词必须分清","t":"教材给的定义彼此咬合，孤立背会串味。先用一句话把关系立起来：单体是原料，结构单元是单体进入链后留下的那部分，重复单元是链上重复出现的最小片段，链节就是重复单元的另一种叫法，单体单元指与单体组成完全相同、只是电子结构变了的重复单元。\n为什么要分这么细？因为缩聚时一个重复单元由两个不同单体各贡献一半，此时“结构单元数”是“重复单元数”的两倍，聚合度的两种算法就分岔了。这是计算题最常见的失分点。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"单体、结构单元、重复单元、链节、单体单元（名词解释、简答、计算前置）"},{"id":"gaohua01n03","label":"聚合度DP与聚合度Xn的区别（计算、简答）","stars":3,"point":"DP 以重复单元计，Xn 以单体单元计","imgs":["img/map/m006.jpg","img/map/m007.jpg"],"quiz":[{"id":"gaohua01-025","type":"calc","match":true},{"id":"gaohua01-026","type":"essay","match":true},{"id":"gaohua01-002","type":"tf","match":true}],"notes":[{"h":"表 3　常用聚合物的重复单元分子量与聚合度换算","t":"聚合物 ｜ 单体 ｜ M₀（重复单元） ｜ Mn 与 DP 的关系式\n聚乙烯 PE ｜ 乙烯 ｜ 28 ｜ Mn = 28 × DP\n聚苯乙烯 PS ｜ 苯乙烯 ｜ 104 ｜ Mn = 104 × DP\n聚甲基丙烯酸甲酯 PMMA ｜ MMA ｜ 100 ｜ Mn = 100 × DP\n聚氯乙烯 PVC ｜ 氯乙烯 ｜ 62.5 ｜ Mn = 62.5 × DP\n尼龙 66 ｜ 己二胺 + 己二酸 ｜ 226（已脱去 2 分子水） ｜ Mn = 226 × DP\n聚对苯二甲酸乙二酯 PET ｜ 乙二醇 + 对苯二甲酸 ｜ 192（已脱去 2 分子水） ｜ Mn = 192 × DP\n易错提醒把“链节”当成“链段”。链节是结构上的重复单元，链段是高分子物理里能独立运动的最小单元，两者数量级差几百倍。名词解释写混，直接丢分。"},{"h":"【真题 2】简述影响线形缩聚聚合度的主要因素和影响方向。","t":"来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·简答题第 2 题（节选，附标准答案）\n参考答案与给分点：四点：①单体配比，等当量时聚合度最大，任一组分过量都会封端使 Xn 下降；②小分子残余量，及时排出小分子、降低其残留，平衡右移，Xn 上升；③反应程度 P，P 越大 Xn 越大；④平衡常数 K，K 越大 Xn 越大。给分点按四条各 1 分。答题时要写出方向（上升或下降），只写因素不给分。\n【真题 3】氯乙烯的聚合能通过阴离子聚合实现吗？阳离子呢？自由基呢？为什么？合成聚氯乙烯时为什么一般控制转化率低于 80%？\n来源：四川大学 866（2022 年回忆版）·简答题第 3 题（附参考解析）\n参考答案与给分点：只能用自由基聚合。氯乙烯的取代基氯是吸电子基，但存在 p-π 共轭使吸电子性减弱，且碳氯键极性大、易被离子进攻，阴离子与阳离子引发都会优先发生取代或消除等副反应，得不到规整的高分子。控制转化率低于 80% 的原因：转化率过高时单体浓度下降、体系粘度上升，链转移与支化加重，且残留单体在后续脱除时易引起降解，产品质量下降。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"聚合度 DP 与聚合度 Xn 的区别（计算、简答）"},{"id":"gaohua01n04","label":"Carothers分类与Flory分类（选择、填","stars":4,"point":"一套按组成变化，一套按机理，不能混用","imgs":["img/map/m008.jpg","img/map/m009.jpg","img/map/m010.jpg"],"quiz":[],"notes":[{"h":"4.1　Carothers 分类：看组成变没变","t":"Carothers 按“反应前后原子组成是否变化”分：有小分子析出的叫缩聚，没有小分子析出、组成不变的叫加聚。后来发现有些反应组成不变却仍是逐步进行（如二异氰酸酯与二醇生成聚氨酯），于是补出“聚加成”一类，教材把它并入逐步聚合处理。\n所以判断标准不是“有没有水脱出”，而是“链是不是一步一步长”。这句话是本章最值钱的一句，直接决定后面动力学用哪个模型。"},{"h":"4.2　Flory 分类：看机理","t":"Flory 按机理分逐步聚合与连锁聚合。连锁聚合有明确的引发、增长、终止三个基元反应，活性中心（自由基或离子）寿命极短，链瞬间长成；逐步聚合没有任何“引发—终止”的仪式，任何两个带官能团的分子都能反应，链靠缩合慢慢变长，分子量要等反应程度逼近 1 才起来。\n图 2　按反应机理分类（Flory 分类法）：逐步与连锁的判定依据（北化《高分子化学·重点内容》课件）\n图 3　连锁聚合与逐步聚合在同一坐标下的比较：转化率曲线与分子量曲线方向相反（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Carothers 分类与 Flory 分类（选择、填空、简答）"},{"id":"gaohua01n05","label":"连锁与逐步聚合的六项差别（简答、论述）","stars":4,"point":"转化率与分子量随时间的走势完全相反","imgs":["img/map/m011.jpg","img/map/m012.jpg","img/map/m013.jpg"],"quiz":[{"id":"gaohua01-015","type":"mcq","match":true},{"id":"gaohua01-012","type":"fill","match":true},{"id":"gaohua01-018","type":"mcq","match":true}],"notes":[{"h":"表 4　连锁与逐步聚合的六项差别（简答必背）","t":"比较项 ｜ 连锁聚合 ｜ 逐步聚合\n参与反应的主体 ｜ 单体只与活性中心反应 ｜ 任何两个带官能团的分子都能反应\n活性中心 ｜ 有，自由基或离子，寿命短 ｜ 无，只有官能团\n基元反应 ｜ 引发、增长、终止、转移四步 ｜ 只有一步缩合或加成，无引发终止\n转化率随时间 ｜ 逐渐升高，是时间的函数 ｜ 几分钟内即达 90% 以上，与时间几乎无关\n分子量随时间 ｜ 在稳态下基本不变，与时间无关 ｜ 随反应程度缓慢增大，需 P 接近 1\n分子量分布 ｜ 较宽，d 约 2 至 5 ｜ Flory 最可几分布，d 约等于 2\n这六条不要死背，用一句话串：连锁是“链一次性长成”，逐步是“分子慢慢并大”。所有差别都是这句话的推论。答题时先写这句话，再展开六条，评卷给分点就踩全了。"},{"h":"九、易错清单与自测","t":"★★★　能不看笔记说出结构单元、重复单元、链节的三个定义，并举加聚与缩聚各一例\n★★★　能默写连锁与逐步聚合的六项差别，并用一句话串起来\n★★★　能写出 Mn、Mw 的公式，并说明为什么 Mw 恒大于 Mn\n★★　能说出开环聚合为什么按机理算连锁，聚氨酯为什么算逐步\n★★　能默写至少 10 个常用缩写及其单体\n★★　能独立算出“质量分数各 50%、分子量 10 万与 20 万”的 Mn、Mw、d\n★　知道 PVA 不能由乙烯醇直接聚合，能默写醇解反应式\n★　能复述高分子科学的三条主线（合成、结构性能、加工）\n复盘方式读完先别做题，合上讲义用 3 分钟把“逻辑链”写一遍；写不出来说明只是看懂了字，没形成结构。再打开表 1，对着星数补漏，最后做第 15 页后的作业。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"连锁与逐步聚合的六项差别（简答、论述）"},{"id":"gaohua01n06","label":"开环聚合的归属（选择、判断）","stars":3,"point":"组成上像加成，机理上是连锁","imgs":["img/map/m014.jpg"],"quiz":[{"id":"gaohua01-026","type":"essay","match":true},{"id":"gaohua01-004","type":"tf","match":true},{"id":"gaohua01-010","type":"fill","match":true}],"notes":[{"h":"表 4　连锁与逐步聚合的六项差别（简答必背）","t":"比较项 ｜ 连锁聚合 ｜ 逐步聚合\n参与反应的主体 ｜ 单体只与活性中心反应 ｜ 任何两个带官能团的分子都能反应\n活性中心 ｜ 有，自由基或离子，寿命短 ｜ 无，只有官能团\n基元反应 ｜ 引发、增长、终止、转移四步 ｜ 只有一步缩合或加成，无引发终止\n转化率随时间 ｜ 逐渐升高，是时间的函数 ｜ 几分钟内即达 90% 以上，与时间几乎无关\n分子量随时间 ｜ 在稳态下基本不变，与时间无关 ｜ 随反应程度缓慢增大，需 P 接近 1\n分子量分布 ｜ 较宽，d 约 2 至 5 ｜ Flory 最可几分布，d 约等于 2\n这六条不要死背，用一句话串：连锁是“链一次性长成”，逐步是“分子慢慢并大”。所有差别都是这句话的推论。答题时先写这句话，再展开六条，评卷给分点就踩全了。"},{"h":"4.3　三个必须分清的特例","t":"第一个特例是开环聚合。环氧乙烷开环后组成不变（只是环打开了），按组成变化看像加聚；但它的增长靠活性中心逐个插入，机理是标准的连锁。教材把它单列一章，正是因为它同时踩在两套分类上。判断时以机理为准，答“连锁聚合”并说明理由。\n第二个特例是聚氨酯。它由二异氰酸酯与二醇加成而成，不脱小分子，但链是逐步长的，所以属于逐步聚合（聚加成）。\n第三个特例是聚乙烯醇。它不能由乙烯醇单体直接聚合（乙烯醇极不稳定，会立刻互变异构为乙醛），工业上先聚醋酸乙烯酯再醇解。这条常以反应式题出现，也常作为“聚合物化学反应”一章的引子。\n判别三步法（考场直接用）第一步问有没有小分子脱出——有则偏缩聚，无则继续看；第二步问链是不是由活性中心一次性长成——是则连锁，否则逐步；第三步用特征反查：转化率很快就到 90% 以上、分子量却迟迟不涨的，一定是逐步。三步走完再写结论，比凭印象判断稳。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"开环聚合的归属（选择、判断）"},{"id":"gaohua01n07","label":"聚合物命名四法与常用缩写（填空、选择、反应式命名","stars":3,"point":"PVA 不是由乙烯醇聚合而来","imgs":["img/map/m015.jpg","img/map/m016.jpg"],"quiz":[{"id":"gaohua01-024","type":"short","match":true},{"id":"gaohua01-005","type":"tf","match":true},{"id":"gaohua01-009","type":"fill","match":true}],"notes":[{"h":"五、命名与缩写：填空和反应式题的得分点","t":"命名有四条路：来源命名（聚 + 单体名）、结构命名（按链上特征基团）、商品名或俗名（如涤纶、尼龙、有机玻璃）、英文缩写。教材反复强调的命名原则是“既表明结构特征，又反映与原料单体的联系”，因为很多聚合物两者并不同名。\n图 4　常见聚合物的结构式与英文缩写（PMMA、PVAc、PET）（北化《高分子化学·重点内容》课件）"},{"h":"表 3　常用聚合物的重复单元分子量与聚合度换算","t":"聚合物 ｜ 单体 ｜ M₀（重复单元） ｜ Mn 与 DP 的关系式\n聚乙烯 PE ｜ 乙烯 ｜ 28 ｜ Mn = 28 × DP\n聚苯乙烯 PS ｜ 苯乙烯 ｜ 104 ｜ Mn = 104 × DP\n聚甲基丙烯酸甲酯 PMMA ｜ MMA ｜ 100 ｜ Mn = 100 × DP\n聚氯乙烯 PVC ｜ 氯乙烯 ｜ 62.5 ｜ Mn = 62.5 × DP\n尼龙 66 ｜ 己二胺 + 己二酸 ｜ 226（已脱去 2 分子水） ｜ Mn = 226 × DP\n聚对苯二甲酸乙二酯 PET ｜ 乙二醇 + 对苯二甲酸 ｜ 192（已脱去 2 分子水） ｜ Mn = 192 × DP\n易错提醒把“链节”当成“链段”。链节是结构上的重复单元，链段是高分子物理里能独立运动的最小单元，两者数量级差几百倍。名词解释写混，直接丢分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"聚合物命名四法与常用缩写（填空、选择、反应式命名）"},{"id":"gaohua01n08","label":"数均、重均、粘均、Z均分子量（计算、简答）","stars":4,"point":"高价项权重依次升高，Mw 恒大于 Mn","imgs":["img/map/m017.jpg","img/map/m018.jpg","img/map/m019.jpg"],"quiz":[{"id":"gaohua01-025","type":"calc","match":true},{"id":"gaohua01-026","type":"essay","match":true},{"id":"gaohua01-024","type":"short","match":true}],"notes":[{"h":"表 6　四种平均分子量与常用测定方法","t":"名称 ｜ 定义式 ｜ 权重特点 ｜ 常用测定\n数均 Mn ｜ ΣNiMi / ΣNi ｜ 按分子个数平均，小分子权重大 ｜ 端基分析、膜渗透、蒸气压渗透\n重均 Mw ｜ ΣNiMi² / ΣNiMi ｜ 按质量加权，大分子权重大 ｜ 光散射、超速离心\nZ 均 Mz ｜ ΣNiMi³ / ΣNiMi² ｜ 更高次矩，对最大的链最敏感 ｜ 超速离心沉降\n粘均 Mv ｜ （ΣWiMi^α）^(1/α) ｜ 介于 Mn 与 Mw 之间 ｜ 乌氏粘度计测特性粘数\n恒等关系要背下来：Mn < Mv < Mw < Mz。多分散系数 d = Mw / Mn，d 越大分布越宽。阴离子活性聚合接近单分散，d 可小到 1.05；缩聚按 Flory 分布，d 约等于 2；自由基聚合因终止与转移并存，d 常在 2 到 5；配位聚合视催化剂与工艺，常在 2 到 8。\n例题（必做）：某聚苯乙烯试样中，分子量 10 万的链占总质量 50%，分子量 20 万的链占 50%，求 Mn、Mw 与 d。\n解：按质量分数算，先换成摩尔分数。设总质量 100 g，则两种链的质量各 50 g，物质的量分别为 50/10 万与 50/20 万，即 5×10⁻⁴ mol 与 2.5×10⁻⁴ mol。Mn = 100 g / (7.5×10⁻⁴ mol) = 13.3 万；Mw = 0.5×10 万 + 0.5×20 万 = 15 万；d = 15 / 13.3 = 1.13。\n计算陷阱题目给“质量分数”时不能直接代入 Mn 的公式，必须先转成摩尔数；给“摩尔分数”时才能直接算 Mn。反过来，算 Mw 时用质量分数最省事。看到“质量分数”三个字，先停一秒。"},{"h":"一、本章坐标：绪论只回答四个问题","t":"绪论不是背定义的章节，它是整门课的坐标系。后面每一章都在给这四个问题补细节：一是什么叫高分子、它的链由什么单元重复而成；二是这一步聚合属于哪一类反应；三是链的长短（聚合度）怎么算；四是链的长短不一致（分子量分布）会带来什么后果。把这四问的顺序记住，第二章到第八章就是往里填机理。\n逻辑链：① 单体与聚合反应的类型（先判断是逐步还是连锁，决定后面用哪套动力学） → ② 链的结构描述（结构单元、重复单元、链节、聚合度） → ③ 分子量与分布（数均、重均、粘均与多分散系数） → ④ 性能与加工（同一聚合物因分子量不同而性能不同，接口通向高分子物理）读法：链条上的箭头都不是并列关系：反应类型决定了链怎么长，链怎么长决定了分子量分布的形状，分布形状又决定了熔体粘度和力学性能。答题时按这条链走，不会漏点。\n川大命题口径绪论在 866 中很少单独出大题，但它以两种方式反复出现：一是选择题里让你判断某聚合物属于逐步还是连锁（如 PET 与 PMMA 的对比）；二是简答、论述题的开头要你先下定义、先分类。所以本章的目标不是“看完”，而是“能在 30 秒内对一个陌生聚合物说清它的反应类型、重复单元和聚合度算法”。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"数均、重均、粘均、Z 均分子量（计算、简答）"},{"id":"gaohua01n09","label":"多分散系数d（计算、简答）","stars":3,"point":"阴离子活性聚合接近 1，缩聚约等于 2","imgs":[],"quiz":[{"id":"gaohua01-007","type":"term","match":true},{"id":"gaohua01-012","type":"fill","match":true},{"id":"gaohua01-020","type":"short","match":true}],"notes":[{"h":"表 6　四种平均分子量与常用测定方法","t":"名称 ｜ 定义式 ｜ 权重特点 ｜ 常用测定\n数均 Mn ｜ ΣNiMi / ΣNi ｜ 按分子个数平均，小分子权重大 ｜ 端基分析、膜渗透、蒸气压渗透\n重均 Mw ｜ ΣNiMi² / ΣNiMi ｜ 按质量加权，大分子权重大 ｜ 光散射、超速离心\nZ 均 Mz ｜ ΣNiMi³ / ΣNiMi² ｜ 更高次矩，对最大的链最敏感 ｜ 超速离心沉降\n粘均 Mv ｜ （ΣWiMi^α）^(1/α) ｜ 介于 Mn 与 Mw 之间 ｜ 乌氏粘度计测特性粘数\n恒等关系要背下来：Mn < Mv < Mw < Mz。多分散系数 d = Mw / Mn，d 越大分布越宽。阴离子活性聚合接近单分散，d 可小到 1.05；缩聚按 Flory 分布，d 约等于 2；自由基聚合因终止与转移并存，d 常在 2 到 5；配位聚合视催化剂与工艺，常在 2 到 8。\n例题（必做）：某聚苯乙烯试样中，分子量 10 万的链占总质量 50%，分子量 20 万的链占 50%，求 Mn、Mw 与 d。\n解：按质量分数算，先换成摩尔分数。设总质量 100 g，则两种链的质量各 50 g，物质的量分别为 50/10 万与 50/20 万，即 5×10⁻⁴ mol 与 2.5×10⁻⁴ mol。Mn = 100 g / (7.5×10⁻⁴ mol) = 13.3 万；Mw = 0.5×10 万 + 0.5×20 万 = 15 万；d = 15 / 13.3 = 1.13。\n计算陷阱题目给“质量分数”时不能直接代入 Mn 的公式，必须先转成摩尔数；给“摩尔分数”时才能直接算 Mn。反过来，算 Mw 时用质量分数最省事。看到“质量分数”三个字，先停一秒。"},{"h":"一、本章坐标：绪论只回答四个问题","t":"绪论不是背定义的章节，它是整门课的坐标系。后面每一章都在给这四个问题补细节：一是什么叫高分子、它的链由什么单元重复而成；二是这一步聚合属于哪一类反应；三是链的长短（聚合度）怎么算；四是链的长短不一致（分子量分布）会带来什么后果。把这四问的顺序记住，第二章到第八章就是往里填机理。\n逻辑链：① 单体与聚合反应的类型（先判断是逐步还是连锁，决定后面用哪套动力学） → ② 链的结构描述（结构单元、重复单元、链节、聚合度） → ③ 分子量与分布（数均、重均、粘均与多分散系数） → ④ 性能与加工（同一聚合物因分子量不同而性能不同，接口通向高分子物理）读法：链条上的箭头都不是并列关系：反应类型决定了链怎么长，链怎么长决定了分子量分布的形状，分布形状又决定了熔体粘度和力学性能。答题时按这条链走，不会漏点。\n川大命题口径绪论在 866 中很少单独出大题，但它以两种方式反复出现：一是选择题里让你判断某聚合物属于逐步还是连锁（如 PET 与 PMMA 的对比）；二是简答、论述题的开头要你先下定义、先分类。所以本章的目标不是“看完”，而是“能在 30 秒内对一个陌生聚合物说清它的反应类型、重复单元和聚合度算法”。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"多分散系数 d（计算、简答）"},{"id":"gaohua01n10","label":"高分子科学的学科结构（论述铺垫）","stars":1,"point":"合成、结构与性能、加工三条主线","imgs":[],"quiz":[{"id":"gaohua01-025","type":"calc","match":true},{"id":"gaohua01-026","type":"essay","match":true},{"id":"gaohua01-021","type":"short","match":true}],"notes":[{"h":"七、把高分子化学接到高分子物理上","t":"绪论最后一步是把两门课接起来。高化负责“怎么造出这条链”，高物负责“这条链为什么表现出这种性能”。接口在结构上：近程结构（构型、取代基、头尾）决定链的柔性，远程结构（分子量、分布、支化、构象）决定堆砌方式，堆砌方式决定分子运动能力，分子运动能力决定玻璃化温度、结晶、力学与电学行为。\n逻辑链：① 近程结构（构型、侧基体积与极性） → ② 远程结构（分子量、分布、支化与交联） → ③ 聚集态与分子运动（Tg、Tm、松弛时间谱） → ④ 宏观性能（模量、强度、韧性、介电损耗）读法：这条链在高物第一、四、五、六章各展开一次。做题时凡问“为什么性能变了”，都从这条链上找位置：是结构变了，还是运动能力变了，还是聚集态变了。\n举一个 2023 年真题的用法：问“为什么聚苯乙烯强度高但很脆，如何增韧”。按链条走，答案自然是：侧基苯环使链刚性大（近程）→ 链段运动困难、无法通过形变吸收冲击能（运动）→ 材料硬而脆（性能）。增韧的思路就是引入能诱发银纹、又能中止银纹扩展的橡胶相。同样的链条，高物第六章还要再用一次。"},{"h":"九、易错清单与自测","t":"★★★　能不看笔记说出结构单元、重复单元、链节的三个定义，并举加聚与缩聚各一例\n★★★　能默写连锁与逐步聚合的六项差别，并用一句话串起来\n★★★　能写出 Mn、Mw 的公式，并说明为什么 Mw 恒大于 Mn\n★★　能说出开环聚合为什么按机理算连锁，聚氨酯为什么算逐步\n★★　能默写至少 10 个常用缩写及其单体\n★★　能独立算出“质量分数各 50%、分子量 10 万与 20 万”的 Mn、Mw、d\n★　知道 PVA 不能由乙烯醇直接聚合，能默写醇解反应式\n★　能复述高分子科学的三条主线（合成、结构性能、加工）\n复盘方式读完先别做题，合上讲义用 3 分钟把“逻辑链”写一遍；写不出来说明只是看懂了字，没形成结构。再打开表 1，对着星数补漏，最后做第 15 页后的作业。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"高分子科学的学科结构（论述铺垫）"}],"logic":{"question":"高分子是什么？链由什么单元组成、按什么机理长大、链长如何表示？","role":"全书的概念坐标系：先统一术语和分类，后面各章才谈机理、结构与性能。","input":"小分子单体、官能团与双键","output":"链结构术语＋逐步/连锁分类＋聚合度与平均分子量","prev":null,"next":"gaohua02","links":[{"cid":"gaohua03","text":"连锁机理是逐步聚合之外的另一条主线"},{"cid":"gaowu03","text":"本章的平均分子量概念，在高物中落实为测定方法"}],"focus":["结构单元、重复单元、链节与单体单元的辨析","Carothers 与 Flory 两套分类及开环聚合归属","DP 与 Xn、Mn/Mw/Mv 及多分散系数"],"common":["用具体聚合物辨析结构单元、重复单元和单体单元","比较连锁聚合与逐步聚合，并判断特殊反应归属","由重复单元分子量和聚合度计算 Mn，比较不同平均分子量"],"examRefs":[]},"examRefs":[],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":9,"examRefs":0,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua02":{"title":"逐步聚合反应","subject":"gaohua","nodes":[{"id":"gaohua02n01","label":"官能度与平均官能度的计算（计算、填空）","stars":4,"point":"等量时按分子数平均，不等量时按少的官能团算","imgs":["img/map/m020.jpg","img/map/m021.jpg","img/map/m022.jpg"],"quiz":[{"id":"gaohua02-007","type":"term","match":true},{"id":"gaohua02-025","type":"calc","match":true},{"id":"gaohua02-002","type":"tf","match":true}],"notes":[{"h":"三、官能度：决定线形还是体形","t":"官能度 f 是一个单体分子上能参与聚合的官能团的数目。二醇、二酸 f = 2，甘油 f = 3，季戊四醇 f = 4。规则很硬：平均官能度 f 等于 2 时只能得到线形或支化链，大于 2 就一定会交联成网。这不是经验，是拓扑约束——链要无限延伸，每个单元平均必须提供两条“生长方向”。\n平均官能度的算法分两种情形，这是计算题的第一道坎：\n情形一，两种官能团等物质的量：f = ΣNi·fi / ΣNi，即按分子数加权直接平均。例如 1 mol 甘油（f = 3）与 1.5 mol 邻苯二甲酸酐（f = 2），ΣNi = 2.5 mol，ΣNi·fi = 1×3 + 1.5×2 = 6，f = 2.4。\n情形二，两种官能团不等量：f = 2 ×（较少那一类官能团的总物质的量）/ ΣNi。为什么要乘 2？因为多出来的官能团找不到配对对象，等于浪费，真正能形成链的只有成对的那部分。这一步如果算错，凝胶点必然跟着错。\n图 1　反应的逐步性：链的增长靠官能团之间的逐步缩合，无引发与终止（北化《高分子化学·重点内容》课件）\n再看一个常见的坑：单官能团化合物（如苯甲酸、甲醇）的 f = 1。它不能延长链，只能封端，所以它不参与 f 的平均计算意义上的“增长”，但恰恰是控制分子量的关键手段。题目给“加入少量醋酸”，八成是考端基封锁。"},{"h":"九、真题与期末题演练","t":"【真题 1】按照逐步聚合分子链形状分类，尼龙 46 和脲醛树脂分别是（　）和（　）结构；酸催化酚醛树脂预聚物属于（　）预聚物，碱催化酚醛树脂的预聚物则属于（　）预聚物。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·填空题第 6 题（附标准答案）\n参考答案与给分点：线形、体形；结构预聚物、无规预聚物。给分点：四个空各 0.5 分。判据是平均官能度——尼龙 46 由丁二胺与己二酸构成，两者 f 均为 2，故线形；脲醛树脂由尿素（f = 4）与甲醛缩合，必然体形。\n【真题 2】研究熔融聚合的聚酯反应的聚合动力学，为测定聚合活化能，请简述实验步骤并说明数据处理。\n来源：四川大学 866（2022 年回忆版）·简答题第 5 题\n参考答案与给分点：步骤：①在装有搅拌、测温与真空/惰性气路的反应器中加入对苯二甲酸与乙二醇（或 PET 预聚物），升温熔融；②在恒定温度下开始计时，每隔一定时间取样，用端基滴定或粘度法测该时刻的相对分子质量并换算成反应程度 P；③改变温度（至少三到四个温度点，如 260、270、280、290 ℃）重复上述实验，每个温度下得到一组 P–t 数据。数据处理：对外加酸催化体系用 1/(1 - P) 对 t 作图，直线斜率为 k；对自催化体系用 1/(1 - P)² 对 t 作图；再由 ln k 对 1/T 作图，直线斜率为 -Ea/R，从而求出活化能 Ea。给分点：装置与取样、P 的测定方法、两种积分式的选择、Arrhenius 作图四部分。\n【真题 3】1 mol aAa 与 1 mol bBb 缩聚，若制备体形缩聚产品，按 Carothers 方法计算凝胶点为 0.80 时需加入多少摩尔多官能化合物？\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·计算题第 2 题（第 3 问，附标准答案）\n参考答案与给分点：由 Pc = 2/f 得 f = 2/Pc = 2/0.8 = 2.5。设加入的多官能化合物（f = 3）为 x mol，则总分子数 ΣNi = 2 + x，总官能团数 = 1×2 + 1×2 + 3x，故 f = (4 + 3x)/(2 + x) = 2.5，解得 x = 0.667 mol。给分点：写出 Pc = 2/f、正确列出平均官能度表达式、解方程三部分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"官能度与平均官能度的计算（计算、填空）"},{"id":"gaohua02n02","label":"反应程度P与Xn=1/(1-P)（计算）","stars":4,"point":"2-2 体系等当量缩聚的基本式","imgs":["img/map/m023.jpg","img/map/m024.jpg","img/map/m025.jpg"],"quiz":[{"id":"gaohua02-006","type":"term","match":true},{"id":"gaohua02-026","type":"essay","match":true},{"id":"gaohua02-001","type":"tf","match":true}],"notes":[{"h":"四、线形缩聚：P 决定一切","t":"以二元酸与二元醇的等当量缩聚为例。设起始官能团总数为 N0，反应到某时刻剩余 N 个，则反应程度 P = (N0 - N)/N0。链的数目等于剩余官能团数的一半（每个分子有两个端基），所以体系中的分子数 Nm = N/2。\n于是数均聚合度（以结构单元数计）Xn = N0 / Nm = 2N0 / N = 2/(1 - P)。若以重复单元（链节）计，DP = 1/(1 - P)。教材在讨论 2-2 体系时常用后一式，答题时要先声明口径。\n这个公式带来一个非常重要的直觉：P = 0.99 时 DP 只有 100，P = 0.999 时才有 1000。也就是说，缩聚要得到真正的高分子量，反应程度必须做到千分之一以内的残留。工业上“高温、高真空、长时间、催化剂”四件套，全部是为了把最后那 1% 啃下来。\n图 2　典型缩聚反应式：二元胺与二元酰氯合成芳纶 1414（Kevlar，杜邦），二元胺与二酰氯脱去 (2n−1) HCl；双酚 A 与光气合成聚碳酸酯，同样脱去 HCl（北化《高分子化学·重点内容》课件第 7.2 节「逐步聚合反应式」）\n图 3　逐步加成聚合（聚加成）反应式：以二异氰酸酯与二元醇加成生成聚氨酯为代表，无小分子副产物析出（北化《高分子化学·重点内容》课件第 7.2 节「逐步聚合反应式」）\n三类逐步聚合反应的通用式（考点要求能区分是否析出小分子）：①缩聚　~COOH + HO~ → ~COO~ + H₂O（析出小分子，酯化；酸与胺则析出 HCl 或水）；②聚加成　~N=C=O + HO~ → ~NH—COO~（无小分子析出，聚氨酯即此类）；③逐步加成与缩聚的关键区别就在于有无小分子副产物，以及反应是否靠基团的加成而非缩合。\n两条最常考的具体缩聚式（自测清单要求默写，照抄不出错）：①PET（涤纶）　n HOOC—C₆H₄—COOH + n HO—CH₂CH₂—OH → —(OC—C₆H₄—COO—CH₂CH₂—O)—n + 2n H₂O（对苯二甲酸 + 乙二醇，酯化缩聚，工业上常用酯交换法先做 BHET 再缩聚）；②尼龙 66　n HOOC(CH₂)₄COOH + n H₂N(CH₂)₆NH₂ → —(OC(CH₂)₄CONH(CH₂)₆NH)—n + 2n H₂O（己二酸 + 己二胺，成盐后熔融缩聚）。注意两条式的副产物都是 2n H₂O，若题目用二元酰氯代替二元酸则改为脱 (2n−1) HCl。\n答题金句“缩聚后期每提高一个数量级的反应程度，分子量才提高一个数量级。”这句话可以解释为什么缩聚反应对设备（真空度、搅拌、传热）的要求远高于加聚。"},{"h":"表 2　缩聚聚合度的三个常用公式","t":"条件 ｜ 公式 ｜ 适用与说明\n等当量、2-2 体系 ｜ DP = 1/(1 - P)，Xn = 2/(1 - P) ｜ 最基础，题目给“等物质的量”时直接代\n配比 r ≤ 1 ｜ Xn = (1 + r)/(1 + r - 2rP) ｜ r 用官能团数之比，不是质量比\n加单官能团封端 ｜ r = Na/(Nb + 2Nb′)，Xn = (1 + r)/(1 + r - 2rP) ｜ 封端剂只封一头，故为 2Nb′\n平衡缩聚、密闭体系 ｜ Xn = √(K/(P·nw)) ｜ nw 为小分子物质的量，需与 K 配套\n例题：1 mol 的 aAa 与 1 mol 的 bBb 进行缩聚，K = 400，采用开放体系，若要把平均聚合度控制在 150、反应程度 0.995，需加入多少摩尔单官能团化合物 Cb？（北京化工大学期末题原题）\n解：由 Xn = (1 + r)/(1 + r - 2rP) 反解 r。150 = (1 + r)/(1 + r - 0.995·2r)，整理得 r = 0.9967。再由 r = Na/(Nb + 2Nb′) = 1/(1 + 2Nb′) 得 Nb′ ≈ 0.0033 mol。答题时必须写出 r 的定义式，否则过程分拿不到。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"反应程度 P 与 Xn = 1/(1-P)（计算）"},{"id":"gaohua02n03","label":"端基封锁与配比r（计算、简答）","stars":4,"point":"Xn 有上限，由 r 决定","imgs":[],"quiz":[{"id":"gaohua02-025","type":"calc","match":true},{"id":"gaohua02-002","type":"tf","match":true},{"id":"gaohua02-026","type":"essay","match":true}],"notes":[{"h":"一、本章坐标：一条链是怎么“并”出来的","t":"逐步聚合和高物里的“分子量”概念是同一件事的两面：这里决定链有多长，那里决定链长了以后性能怎么变。所以本章的每个公式都在回答同一个问题——在什么条件下链才能长到足够长？答案集中在三个旋钮：反应程度 P、官能团配比 r、以及小分子副产物能不能及时排走。\n逻辑链：① 单体与官能度（f = 2 才能线形，f > 2 必然交联） → ② 逐步缩合（任何两个带官能团的分子都能反应，无活性中心） → ③ 反应程度 P（P 逼近 1 才有高分子量） → ④ 配比与封端（r 略小于 1 就把 Xn 锁死在上限） → ⑤ 体型化与凝胶（f > 2 时在凝胶点突然变成网络） → ⑥ 实施方法（熔融、溶液、界面、固相，决定小分子能否排出）读法：读法：本章所有公式都是这条链上某一环的定量表达。P 是“反应了没有”，r 是“配比对不对”，排小分子是“平衡会不会右移”。做题先定位题目在问哪一环，再选公式。\n命题口径逐步聚合在 866 里是计算题与简答题的双重富矿：缩聚 Xn 的计算、凝胶点的 Carothers 估算、端基封锁的配比设计几乎年年出现；简答则集中在“为什么缩聚要高温、高真空、长时间”和“界面缩聚为什么能突破平衡限制”。"},{"h":"三、官能度：决定线形还是体形","t":"官能度 f 是一个单体分子上能参与聚合的官能团的数目。二醇、二酸 f = 2，甘油 f = 3，季戊四醇 f = 4。规则很硬：平均官能度 f 等于 2 时只能得到线形或支化链，大于 2 就一定会交联成网。这不是经验，是拓扑约束——链要无限延伸，每个单元平均必须提供两条“生长方向”。\n平均官能度的算法分两种情形，这是计算题的第一道坎：\n情形一，两种官能团等物质的量：f = ΣNi·fi / ΣNi，即按分子数加权直接平均。例如 1 mol 甘油（f = 3）与 1.5 mol 邻苯二甲酸酐（f = 2），ΣNi = 2.5 mol，ΣNi·fi = 1×3 + 1.5×2 = 6，f = 2.4。\n情形二，两种官能团不等量：f = 2 ×（较少那一类官能团的总物质的量）/ ΣNi。为什么要乘 2？因为多出来的官能团找不到配对对象，等于浪费，真正能形成链的只有成对的那部分。这一步如果算错，凝胶点必然跟着错。\n图 1　反应的逐步性：链的增长靠官能团之间的逐步缩合，无引发与终止（北化《高分子化学·重点内容》课件）\n再看一个常见的坑：单官能团化合物（如苯甲酸、甲醇）的 f = 1。它不能延长链，只能封端，所以它不参与 f 的平均计算意义上的“增长”，但恰恰是控制分子量的关键手段。题目给“加入少量醋酸”，八成是考端基封锁。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"端基封锁与配比 r（计算、简答）"},{"id":"gaohua02n04","label":"缩聚动力学（外加酸与自催化）（计算、简答）","stars":3,"point":"二级与三级反应的积分式不同","imgs":["img/map/m026.jpg","img/map/m027.jpg"],"quiz":[{"id":"gaohua02-011","type":"fill","match":true},{"id":"gaohua02-004","type":"tf","match":true},{"id":"gaohua02-019","type":"short","match":true}],"notes":[{"h":"六、缩聚动力学：两条积分曲线","t":"缩聚的速率由官能团之间的碰撞决定，所以是典型的二级反应：-dC/dt = kC²。若外加酸催化（如对甲苯磺酸），k 恒定，积分得 1/(1 - P) = 1 + C0·k·t，即 DP 随时间线性增长——注意是 DP 线性，不是 P 线性。\n若不加外酸、靠二元酸自身提供的氢离子自催化，速率与羧酸浓度成正比，反应变成三级：-dC/dt = kC³，积分得 1/(1 - P)² = 1 + 2C0²·k·t。两条曲线形状不同，考计算时必须先判断体系属于哪一类。\n平衡常数的影响更致命。缩聚是缩合反应，有水或氯化氢生成。密闭体系里小分子越积越多，平衡很快停在半路，Xn 被压在低水平。开放体系边反应边抽走小分子，才能把 P 推到 0.999。这里的关系式是 Xn = √(K/(P·nw))，nw 是残留小分子的物质的量——注意是平方根关系，所以要把 Xn 提高 10 倍，nw 必须降到 1/100。这个数量级关系是论述题的高分点。"},{"h":"表 3　缩聚动力学与平衡的四个关系式","t":"体系 ｜ 速率或平衡式 ｜ 积分结果 ｜ 变量含义\n外加酸催化 ｜ -dC/dt = kC² ｜ 1/(1 - P) = 1 + C0kt ｜ k 为表观速率常数\n自催化 ｜ -dC/dt = kC³ ｜ 1/(1 - P)² = 1 + 2C0²kt ｜ 羧酸自身提供 H+\n密闭平衡 ｜ Xn = √(K/(P·nw)) ｜ — ｜ nw 为水的物质的量\n开放平衡 ｜ Xn = √(K/(P·nw))，nw 由抽真空维持很小 ｜ — ｜ 工业上靠真空或惰性气体带水\n简答模板问“为什么缩聚要高温、高真空、长时间”，按三点答：高温提高 k 并促小分子逸出；高真空把 nw 压到极小，使 Xn ∝ 1/√nw 得以放大；长时间保证 P 能逼近 1。三点各对应一个公式，答完即满分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"缩聚动力学（外加酸与自催化）（计算、简答）"},{"id":"gaohua02n05","label":"平衡常数与小分子排出（简答、论述）","stars":4,"point":"Xn 与 K、残留水含量的平方根关系","imgs":["img/map/m028.jpg","img/map/m029.jpg","img/map/m030.jpg"],"quiz":[{"id":"gaohua02-026","type":"essay","match":true},{"id":"gaohua02-022","type":"short","match":true},{"id":"gaohua02-024","type":"short","match":true}],"notes":[{"h":"表 3　缩聚动力学与平衡的四个关系式","t":"体系 ｜ 速率或平衡式 ｜ 积分结果 ｜ 变量含义\n外加酸催化 ｜ -dC/dt = kC² ｜ 1/(1 - P) = 1 + C0kt ｜ k 为表观速率常数\n自催化 ｜ -dC/dt = kC³ ｜ 1/(1 - P)² = 1 + 2C0²kt ｜ 羧酸自身提供 H+\n密闭平衡 ｜ Xn = √(K/(P·nw)) ｜ — ｜ nw 为水的物质的量\n开放平衡 ｜ Xn = √(K/(P·nw))，nw 由抽真空维持很小 ｜ — ｜ 工业上靠真空或惰性气体带水\n简答模板问“为什么缩聚要高温、高真空、长时间”，按三点答：高温提高 k 并促小分子逸出；高真空把 nw 压到极小，使 Xn ∝ 1/√nw 得以放大；长时间保证 P 能逼近 1。三点各对应一个公式，答完即满分。"},{"h":"六、缩聚动力学：两条积分曲线","t":"缩聚的速率由官能团之间的碰撞决定，所以是典型的二级反应：-dC/dt = kC²。若外加酸催化（如对甲苯磺酸），k 恒定，积分得 1/(1 - P) = 1 + C0·k·t，即 DP 随时间线性增长——注意是 DP 线性，不是 P 线性。\n若不加外酸、靠二元酸自身提供的氢离子自催化，速率与羧酸浓度成正比，反应变成三级：-dC/dt = kC³，积分得 1/(1 - P)² = 1 + 2C0²·k·t。两条曲线形状不同，考计算时必须先判断体系属于哪一类。\n平衡常数的影响更致命。缩聚是缩合反应，有水或氯化氢生成。密闭体系里小分子越积越多，平衡很快停在半路，Xn 被压在低水平。开放体系边反应边抽走小分子，才能把 P 推到 0.999。这里的关系式是 Xn = √(K/(P·nw))，nw 是残留小分子的物质的量——注意是平方根关系，所以要把 Xn 提高 10 倍，nw 必须降到 1/100。这个数量级关系是论述题的高分点。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"平衡常数与小分子排出（简答、论述）"},{"id":"gaohua02n06","label":"凝胶点Carothers方程（计算）","stars":4,"point":"Pc = 2/f，f 为平均官能度","imgs":["img/map/m031.jpg","img/map/m032.jpg","img/map/m033.jpg"],"quiz":[{"id":"gaohua02-007","type":"term","match":true},{"id":"gaohua02-003","type":"tf","match":true},{"id":"gaohua02-012","type":"fill","match":true}],"notes":[{"h":"表 4　两种凝胶点算法的比较","t":"方法 ｜ 公式 ｜ 假设 ｜ 结果特点\nCarothers ｜ Pc = 2/f ｜ 官能团等活性、无分子内成环 ｜ 偏高，用于估算\nFlory 统计法 ｜ Pc = 1/√(r + rρ(f - 2)) ｜ 按支化概率统计 ｜ 更接近实测，用于配方\n预聚物还分两类，填空题常考：无规预聚物（官能团分布随机，如碱催化酚醛树脂）与结构预聚物（官能团位于链端、结构明确，如酸催化酚醛树脂、环氧树脂）。前者固化时交联点随机，后者交联点可控，性能更稳定。"},{"h":"七、体形缩聚与凝胶点","t":"当平均官能度大于 2，链不会一直线形延伸，而会在某个时刻突然连成一张网：粘度骤增、出现不溶不熔的凝胶，这个时刻对应的反应程度叫凝胶点 Pc。凝胶点之前叫预聚物阶段，之后叫固化阶段。工业上做酚醛、醇酸、环氧，都是先做到预聚物再成型固化。\nCarothers 法用一个极简的假设：Xn 趋于无穷时发生凝胶。由 Xn = 2/(2 - fP)，令 Xn → ∞ 得\nPc = 2/f，f 为平均官能度。这个方法简单但偏高，因为它假设所有官能团等活性、且忽略了分子内的成环。\nFlory 统计法考虑了支化概率，公式为 Pc = 1/√(r + r·ρ(f - 2))，其中 r 为官能团配比，ρ 为支化单元上官能团占总官能团的分数，f 为支化单体的官能度。算出来的 Pc 通常低于 Carothers 值，更接近实测。答题时两者的适用条件要写清：Carothers 适合快速估算与判断，Flory 适合精确设计配方。\n图 4　体形缩聚的理论凝胶要点：Xn 趋于无穷与凝胶点的对应（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"凝胶点 Carothers 方程（计算）"},{"id":"gaohua02n07","label":"凝胶点Flory统计法（计算、简答）","stars":3,"point":"考虑支化概率，结果比 Carothers 更准","imgs":[],"quiz":[{"id":"gaohua02-007","type":"term","match":true},{"id":"gaohua02-003","type":"tf","match":true},{"id":"gaohua02-012","type":"fill","match":true}],"notes":[{"h":"七、体形缩聚与凝胶点","t":"当平均官能度大于 2，链不会一直线形延伸，而会在某个时刻突然连成一张网：粘度骤增、出现不溶不熔的凝胶，这个时刻对应的反应程度叫凝胶点 Pc。凝胶点之前叫预聚物阶段，之后叫固化阶段。工业上做酚醛、醇酸、环氧，都是先做到预聚物再成型固化。\nCarothers 法用一个极简的假设：Xn 趋于无穷时发生凝胶。由 Xn = 2/(2 - fP)，令 Xn → ∞ 得\nPc = 2/f，f 为平均官能度。这个方法简单但偏高，因为它假设所有官能团等活性、且忽略了分子内的成环。\nFlory 统计法考虑了支化概率，公式为 Pc = 1/√(r + r·ρ(f - 2))，其中 r 为官能团配比，ρ 为支化单元上官能团占总官能团的分数，f 为支化单体的官能度。算出来的 Pc 通常低于 Carothers 值，更接近实测。答题时两者的适用条件要写清：Carothers 适合快速估算与判断，Flory 适合精确设计配方。\n图 4　体形缩聚的理论凝胶要点：Xn 趋于无穷与凝胶点的对应（北化《高分子化学·重点内容》课件）"},{"h":"表 4　两种凝胶点算法的比较","t":"方法 ｜ 公式 ｜ 假设 ｜ 结果特点\nCarothers ｜ Pc = 2/f ｜ 官能团等活性、无分子内成环 ｜ 偏高，用于估算\nFlory 统计法 ｜ Pc = 1/√(r + rρ(f - 2)) ｜ 按支化概率统计 ｜ 更接近实测，用于配方\n预聚物还分两类，填空题常考：无规预聚物（官能团分布随机，如碱催化酚醛树脂）与结构预聚物（官能团位于链端、结构明确，如酸催化酚醛树脂、环氧树脂）。前者固化时交联点随机，后者交联点可控，性能更稳定。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"凝胶点 Flory 统计法（计算、简答）"},{"id":"gaohua02n08","label":"无规预聚物与结构预聚物（填空、简答）","stars":3,"point":"酚醛分酸碱两种催化，环氧属结构预聚物","imgs":["img/map/m034.jpg","img/map/m035.jpg"],"quiz":[{"id":"gaohua02-008","type":"term","match":true},{"id":"gaohua02-014","type":"fill","match":true},{"id":"gaohua02-019","type":"short","match":true}],"notes":[{"h":"表 4　两种凝胶点算法的比较","t":"方法 ｜ 公式 ｜ 假设 ｜ 结果特点\nCarothers ｜ Pc = 2/f ｜ 官能团等活性、无分子内成环 ｜ 偏高，用于估算\nFlory 统计法 ｜ Pc = 1/√(r + rρ(f - 2)) ｜ 按支化概率统计 ｜ 更接近实测，用于配方\n预聚物还分两类，填空题常考：无规预聚物（官能团分布随机，如碱催化酚醛树脂）与结构预聚物（官能团位于链端、结构明确，如酸催化酚醛树脂、环氧树脂）。前者固化时交联点随机，后者交联点可控，性能更稳定。"},{"h":"九、真题与期末题演练","t":"【真题 1】按照逐步聚合分子链形状分类，尼龙 46 和脲醛树脂分别是（　）和（　）结构；酸催化酚醛树脂预聚物属于（　）预聚物，碱催化酚醛树脂的预聚物则属于（　）预聚物。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·填空题第 6 题（附标准答案）\n参考答案与给分点：线形、体形；结构预聚物、无规预聚物。给分点：四个空各 0.5 分。判据是平均官能度——尼龙 46 由丁二胺与己二酸构成，两者 f 均为 2，故线形；脲醛树脂由尿素（f = 4）与甲醛缩合，必然体形。\n【真题 2】研究熔融聚合的聚酯反应的聚合动力学，为测定聚合活化能，请简述实验步骤并说明数据处理。\n来源：四川大学 866（2022 年回忆版）·简答题第 5 题\n参考答案与给分点：步骤：①在装有搅拌、测温与真空/惰性气路的反应器中加入对苯二甲酸与乙二醇（或 PET 预聚物），升温熔融；②在恒定温度下开始计时，每隔一定时间取样，用端基滴定或粘度法测该时刻的相对分子质量并换算成反应程度 P；③改变温度（至少三到四个温度点，如 260、270、280、290 ℃）重复上述实验，每个温度下得到一组 P–t 数据。数据处理：对外加酸催化体系用 1/(1 - P) 对 t 作图，直线斜率为 k；对自催化体系用 1/(1 - P)² 对 t 作图；再由 ln k 对 1/T 作图，直线斜率为 -Ea/R，从而求出活化能 Ea。给分点：装置与取样、P 的测定方法、两种积分式的选择、Arrhenius 作图四部分。\n【真题 3】1 mol aAa 与 1 mol bBb 缩聚，若制备体形缩聚产品，按 Carothers 方法计算凝胶点为 0.80 时需加入多少摩尔多官能化合物？\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·计算题第 2 题（第 3 问，附标准答案）\n参考答案与给分点：由 Pc = 2/f 得 f = 2/Pc = 2/0.8 = 2.5。设加入的多官能化合物（f = 3）为 x mol，则总分子数 ΣNi = 2 + x，总官能团数 = 1×2 + 1×2 + 3x，故 f = (4 + 3x)/(2 + x) = 2.5，解得 x = 0.667 mol。给分点：写出 Pc = 2/f、正确列出平均官能度表达式、解方程三部分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"无规预聚物与结构预聚物（填空、简答）"},{"id":"gaohua02n09","label":"四种实施方法的比较（简答、论述）","stars":3,"point":"熔融最常用，界面能突破平衡","imgs":["img/map/m036.jpg","img/map/m037.jpg"],"quiz":[{"id":"gaohua02-024","type":"short","match":true},{"id":"gaohua02-017","type":"mcq","match":true}],"notes":[{"h":"表 5　逐步聚合实施方法比较","t":"方法 ｜ 要点 ｜ 优点 ｜ 局限\n熔融缩聚 ｜ 单体与催化剂直接加热熔融，后期高真空 ｜ 无溶剂、成本低、产品质量好 ｜ 要求耐高温、传热与搅拌困难\n溶液缩聚 ｜ 在惰性溶剂中进行，可共沸带水 ｜ 传热好、温度均匀 ｜ 溶剂回收成本高、污染\n界面缩聚 ｜ 两种单体分别溶于互不相溶的两相，在界面反应 ｜ 可在低温进行、能突破平衡限制 ｜ 只能用高活性单体（如酰氯），产量受限\n固相缩聚 ｜ 预聚物在固体状态下加热增粘 ｜ 提高分子量与纯度，用于瓶级 PET ｜ 时间长、需惰性气流\n界面缩聚为什么能突破平衡限制？因为反应在界面发生，生成的聚合物立刻离开反应区、小分子进入水相被碱中和，平衡被持续拉向右方；又因为两种单体分别处在两相，配比不必严格等当量也能得到高分子量——这是“配比锁死分子量”规律的一个著名例外，简答题常拿它做对比。"},{"h":"表 4　两种凝胶点算法的比较","t":"方法 ｜ 公式 ｜ 假设 ｜ 结果特点\nCarothers ｜ Pc = 2/f ｜ 官能团等活性、无分子内成环 ｜ 偏高，用于估算\nFlory 统计法 ｜ Pc = 1/√(r + rρ(f - 2)) ｜ 按支化概率统计 ｜ 更接近实测，用于配方\n预聚物还分两类，填空题常考：无规预聚物（官能团分布随机，如碱催化酚醛树脂）与结构预聚物（官能团位于链端、结构明确，如酸催化酚醛树脂、环氧树脂）。前者固化时交联点随机，后者交联点可控，性能更稳定。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"四种实施方法的比较（简答、论述）"},{"id":"gaohua02n10","label":"重要工业品种（PET、PA、PF、EP）（选择、","stars":2,"point":"合成路线要能默写","imgs":[],"quiz":[{"id":"gaohua02-026","type":"essay","match":true},{"id":"gaohua02-020","type":"short","match":true},{"id":"gaohua02-013","type":"fill","match":true}],"notes":[{"h":"十、易错清单与自测","t":"★★★　能写出三种 Xn 公式，并说明 r 用的是官能团数之比\n★★★　能解释 r = 0.99 时分子量为何锁在 199，且能举工业例子\n★★★　能默写 Carothers 与 Flory 两个凝胶点公式并说明差别\n★★★　能用 Xn ∝ 1/√nw 解释真空操作的必要性\n★★　能区分外加酸催化与自催化两条积分式\n★★　能说出四种实施方法的优缺点，并解释界面缩聚为何能突破平衡\n★★　能判断无规预聚物与结构预聚物的区别，并举工业品种\n★　能默写 PET 与尼龙 66 的缩聚反应式\n本章与前后章的关系向前接绪论的反应分类（逐步与连锁），向后接第八章的聚合物化学反应（缩聚产物可降解、可扩链）。做题时若遇到“为什么 PET 瓶级切片要用固相增粘”，答案仍在本章：提高分子量与降低乙醛残留。"},{"h":"四、线形缩聚：P 决定一切","t":"以二元酸与二元醇的等当量缩聚为例。设起始官能团总数为 N0，反应到某时刻剩余 N 个，则反应程度 P = (N0 - N)/N0。链的数目等于剩余官能团数的一半（每个分子有两个端基），所以体系中的分子数 Nm = N/2。\n于是数均聚合度（以结构单元数计）Xn = N0 / Nm = 2N0 / N = 2/(1 - P)。若以重复单元（链节）计，DP = 1/(1 - P)。教材在讨论 2-2 体系时常用后一式，答题时要先声明口径。\n这个公式带来一个非常重要的直觉：P = 0.99 时 DP 只有 100，P = 0.999 时才有 1000。也就是说，缩聚要得到真正的高分子量，反应程度必须做到千分之一以内的残留。工业上“高温、高真空、长时间、催化剂”四件套，全部是为了把最后那 1% 啃下来。\n图 2　典型缩聚反应式：二元胺与二元酰氯合成芳纶 1414（Kevlar，杜邦），二元胺与二酰氯脱去 (2n−1) HCl；双酚 A 与光气合成聚碳酸酯，同样脱去 HCl（北化《高分子化学·重点内容》课件第 7.2 节「逐步聚合反应式」）\n图 3　逐步加成聚合（聚加成）反应式：以二异氰酸酯与二元醇加成生成聚氨酯为代表，无小分子副产物析出（北化《高分子化学·重点内容》课件第 7.2 节「逐步聚合反应式」）\n三类逐步聚合反应的通用式（考点要求能区分是否析出小分子）：①缩聚　~COOH + HO~ → ~COO~ + H₂O（析出小分子，酯化；酸与胺则析出 HCl 或水）；②聚加成　~N=C=O + HO~ → ~NH—COO~（无小分子析出，聚氨酯即此类）；③逐步加成与缩聚的关键区别就在于有无小分子副产物，以及反应是否靠基团的加成而非缩合。\n两条最常考的具体缩聚式（自测清单要求默写，照抄不出错）：①PET（涤纶）　n HOOC—C₆H₄—COOH + n HO—CH₂CH₂—OH → —(OC—C₆H₄—COO—CH₂CH₂—O)—n + 2n H₂O（对苯二甲酸 + 乙二醇，酯化缩聚，工业上常用酯交换法先做 BHET 再缩聚）；②尼龙 66　n HOOC(CH₂)₄COOH + n H₂N(CH₂)₆NH₂ → —(OC(CH₂)₄CONH(CH₂)₆NH)—n + 2n H₂O（己二酸 + 己二胺，成盐后熔融缩聚）。注意两条式的副产物都是 2n H₂O，若题目用二元酰氯代替二元酸则改为脱 (2n−1) HCl。\n答题金句“缩聚后期每提高一个数量级的反应程度，分子量才提高一个数量级。”这句话可以解释为什么缩聚反应对设备（真空度、搅拌、传热）的要求远高于加聚。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"重要工业品种（PET、PA、PF、EP）（选择、反应式）"},{"label":"线形缩聚的分子量分布与类活性缩聚","stars":4,"point":"理想线形逐步聚合在等活性、无副反应等条件下服从最可几分布，高转化率时 Mw/Mn→2；若所有活性链同步增长且数恒定，则可出现分子量随转化率线性增长、分布变窄等类活性特征。","notesTitle":"真题补漏讲解","notes":[{"h":"先把“分布≤2”和“活性特征”分开","t":"普通线形缩聚的单体很快消失，二聚体、三聚体及更大分子彼此继续反应；在等活性、无环化和无副反应的理想条件下服从 Flory 最可几分布，p→1 时 Mw/Mn→2，而不是任何时刻、任何体系都恒等于 2。\n\n若特定催化/官能团体系使增长链数近似恒定、各链同步增长，且分子量随转化率线性增加，可表现出类活性聚合特征。答题必须写出适用条件，不能用活性阴离子的全部特征硬套所有缩聚。"}],"quiz":[{"id":"past2023-010","type":"short","match":true},{"id":"past2021-016","type":"short","match":true}],"added":true,"id":"gaohua02n11","imgs":[],"quizAudited":true,"fullLabel":"线形缩聚的分子量分布与类活性缩聚","importanceBasis":"已录2021—2023真题与课程体系补漏"}],"logic":{"question":"逐步聚合中，官能度、转化率、配比和平衡怎样决定分子量与凝胶？","role":"沿“官能团反应→链长增长→网络形成”推进，是缩聚计算与工业缩聚工艺的核心章。","input":"绪论的逐步聚合概念与官能团反应","output":"Xn 控制、平衡缩聚、凝胶点及实施方法","prev":"gaohua01","next":"gaohua03","links":[{"cid":"gaohua06","text":"活性阴离子提供另一种“可设计分子量”的对照"},{"cid":"gaowu03","text":"缩聚分子量及其分布由高物方法表征"}],"focus":["等基团数与非等基团数下的 Xn 计算","平衡常数、小分子排出与反应程度","Carothers/Flory 凝胶点及平均官能度"],"common":["由 p、r 或官能团过量计算 Xn，分析端基封锁","K、nw 与 Xn 的平衡缩聚计算及提高分子量措施","求凝胶点并比较两种凝胶点理论","线形缩聚分布宽度及类活性缩聚特征（真题补漏）"],"examRefs":["past2023-001","past2023-002","past2023-010","past2022-010","past2021-010","past2021-016"]},"examRefs":["past2023-001","past2023-002","past2023-010","past2022-010","past2021-010","past2021-016"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":1,"nodes":11,"withQuiz":11,"examRefs":6,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua03":{"title":"自由基聚合","subject":"gaohua","nodes":[{"id":"gaohua03n01","label":"连锁聚合的三个基元反应（简答、论述）","stars":4,"point":"引发、增长、终止，各有特征速率","imgs":["img/map/m038.jpg","img/map/m039.jpg","img/map/m040.jpg"],"quiz":[{"id":"gaohua03-021","type":"short","match":true},{"id":"gaohua03-023","type":"short","match":true},{"id":"gaohua03-018","type":"mcq","match":true}],"notes":[{"h":"一、本章坐标：四个基元反应决定两件事","t":"自由基聚合回答两个问题：反应有多快（Rp），链有多长（Xn）。这两个答案都来自同一组基元反应——引发、增长、终止、链转移。谁能改变这四步的相对速率，谁就同时改变了速率和分子量。整章的结构就是这句话的展开。\n逻辑链：① 引发（引发剂分解、引发效率 f、笼蔽效应） → ② 增长（单体逐个加到自由基上，kp 决定链长得快慢） → ③ 终止（偶合或歧化，kt 决定自由基寿命） → ④ 链转移（活性中心转移而不消失，决定实际分子量） → ⑤ 宏观动力学（稳态假设把四步合成 Rp 与 Xn 两个公式） → ⑥ 自动加速（中期粘度上升使 kt 骤降，公式失效）读法：读法：前四环是微观机理，第五环是把微观合成宏观，第六环是宏观公式失效的边界。所有简答题都在问“这四环里哪一环被改变了”。\n命题口径自由基聚合是 866 的核心：动力学方程推导、引发效率、自动加速、链转移与分子量控制几乎每年必考，且常以论述题出现（要求写出三个假设、推出 Rp ∝ [I]^0.5、再解释中期偏离）。这一章不能只“看懂”，必须能默写推导。"},{"h":"表 2　自由基聚合四个基元反应的速率与活化能","t":"基元反应 ｜ 速率表达式 ｜ 活化能（kJ/mol） ｜ 特征\n引发 ｜ Ri = 2f·kd[I] ｜ kd 约 120 至 150 ｜ 慢，控速步骤\n增长 ｜ Rp = kp[M][M·] ｜ kp 约 20 至 40 ｜ 极快，每次加成放热\n偶合终止 ｜ Rt,c = 2kt,c[M·]² ｜ kt 约 8 至 12 ｜ 生成一条链，分子量为 2ν\n歧化终止 ｜ Rt,d = 2kt,d[M·]² ｜ kt 约 15 至 20 ｜ 生成两条链，分子量为 ν"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"连锁聚合的三个基元反应（简答、论述）"},{"id":"gaohua03n02","label":"引发剂类型与分解反应式（填空、反应式）","stars":4,"point":"AIBN、BPO、KPS 及氧化还原体系","imgs":["img/map/m041.jpg","img/map/m042.jpg","img/map/m043.jpg"],"quiz":[{"id":"gaohua03-019","type":"short","match":true},{"id":"gaohua03-021","type":"short","match":true},{"id":"gaohua03-009","type":"fill","match":true}],"notes":[{"h":"一、本章坐标：四个基元反应决定两件事","t":"自由基聚合回答两个问题：反应有多快（Rp），链有多长（Xn）。这两个答案都来自同一组基元反应——引发、增长、终止、链转移。谁能改变这四步的相对速率，谁就同时改变了速率和分子量。整章的结构就是这句话的展开。\n逻辑链：① 引发（引发剂分解、引发效率 f、笼蔽效应） → ② 增长（单体逐个加到自由基上，kp 决定链长得快慢） → ③ 终止（偶合或歧化，kt 决定自由基寿命） → ④ 链转移（活性中心转移而不消失，决定实际分子量） → ⑤ 宏观动力学（稳态假设把四步合成 Rp 与 Xn 两个公式） → ⑥ 自动加速（中期粘度上升使 kt 骤降，公式失效）读法：读法：前四环是微观机理，第五环是把微观合成宏观，第六环是宏观公式失效的边界。所有简答题都在问“这四环里哪一环被改变了”。\n命题口径自由基聚合是 866 的核心：动力学方程推导、引发效率、自动加速、链转移与分子量控制几乎每年必考，且常以论述题出现（要求写出三个假设、推出 Rp ∝ [I]^0.5、再解释中期偏离）。这一章不能只“看懂”，必须能默写推导。"},{"h":"三、链引发：慢，且只有一部分有效","t":"引发分两步：引发剂先分解产生两个初级自由基，初级自由基再与第一个单体加成，生成单体自由基。第一步慢（活化能高），第二步快，所以整个引发的速率由分解步骤控制，这是“慢引发”的含义。\n常用引发剂分三类。第一类是热分解型，如偶氮二异丁腈（AIBN）在 60 至 80 ℃ 分解，放出氮气并生成两个自由基；过氧化二苯甲酰（BPO）受热均裂产生苯甲酰氧自由基，进一步脱羧成苯自由基。第二类是氧化还原型，如过硫酸钾与亚硫酸氢钠、或 BPO 与 N,N-二甲基苯胺，活化能低，可在室温甚至低温引发。第三类是光与辐射引发，靠紫外光直接激发或光敏剂。\n图 1　链引发两步反应式：第一步 I → 2R·（分解，吸热 105—150 kJ/mol，控速步骤）；第二步 R· + M → RM·（加成，放热 20—32 kJ/mol）（北化《高分子化学·重点内容》课件第 2.3.1 节）\n图 2　热分解型引发剂分解反应式：AIBN 均裂放出 N₂ 并生成 2 个氰基异丙基自由基；BPO 均裂生成 2 个苯甲酰氧自由基，无单体存在时进一步脱羧放出 CO₂（并非完全分解）（北化《高分子化学·重点内容》课件第 2.4.1.1 节）\n过硫酸钾（KPS，K₂S₂O₈）的水溶液分解式要能默写：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（受热，约 60—80 ℃）2 SO₄·⁻；SO₄·⁻ + H₂O → HSO₄⁻ + ·OH。可见 KPS 是水溶性引发剂，常用于乳液聚合与水溶液聚合，且分解产生的是硫酸根自由基与羟基自由基两种初级自由基。\n图 3　氧化还原引发体系反应式（水溶性）：H₂O₂ + Fe²⁺ → HO· + OH⁻ + Fe³⁺，活化能由 218 kJ/mol 降至 40 kJ/mol，可在 −10—20 ℃ 引发；还原剂过量时 HO· 会进一步与 Fe²⁺ 反应而失活，故还原剂用量一般少于氧化剂（北化《高分子化学·重点内容》课件第 2.4.1.2 节）\n衡量引发剂活性最实用的指标是半衰期 t1/2：在某一温度下引发剂浓度消耗一半所需的时间。60 ℃ 时 AIBN 的 t1/2 约 10 小时，属于“中速”；工业上选择引发剂要让 t1/2 与聚合时间同量级，否则要么引发不足、要么过早耗尽。\n引发效率 f 是真正引发链的自由基占全部分解自由基的比例。损失的主因是笼蔽效应：引发剂分子在溶剂或单体形成的“笼”中分解，两个初级自由基尚未扩散开就彼此结合或发生歧化，白白消耗。此外还有初级自由基向单体、溶剂、引发剂的转移消耗。因此 f 一般在 0.6 至 0.9，计算时不能当成 1。\n名词解释模板笼蔽效应：引发剂在溶液或本体中分解时，两个初级自由基被周围的溶剂或单体分子包围形成“笼子”，来不及扩散就相互结合而失活，使引发效率下降的现象。答题要写出“未扩散即失活”与“f 下降”两层意思。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"引发剂类型与分解反应式（填空、反应式）"},{"id":"gaohua03n03","label":"引发效率f与笼蔽效应（名词解释、简答）","stars":4,"point":"初级自由基被笼蔽消耗，f 常为 0.6 至 0.9","imgs":["img/map/m044.jpg"],"quiz":[{"id":"gaohua03-002","type":"tf","match":true},{"id":"gaohua03-006","type":"term","match":true},{"id":"gaohua03-026","type":"essay","match":true}],"notes":[{"h":"三、链引发：慢，且只有一部分有效","t":"引发分两步：引发剂先分解产生两个初级自由基，初级自由基再与第一个单体加成，生成单体自由基。第一步慢（活化能高），第二步快，所以整个引发的速率由分解步骤控制，这是“慢引发”的含义。\n常用引发剂分三类。第一类是热分解型，如偶氮二异丁腈（AIBN）在 60 至 80 ℃ 分解，放出氮气并生成两个自由基；过氧化二苯甲酰（BPO）受热均裂产生苯甲酰氧自由基，进一步脱羧成苯自由基。第二类是氧化还原型，如过硫酸钾与亚硫酸氢钠、或 BPO 与 N,N-二甲基苯胺，活化能低，可在室温甚至低温引发。第三类是光与辐射引发，靠紫外光直接激发或光敏剂。\n图 1　链引发两步反应式：第一步 I → 2R·（分解，吸热 105—150 kJ/mol，控速步骤）；第二步 R· + M → RM·（加成，放热 20—32 kJ/mol）（北化《高分子化学·重点内容》课件第 2.3.1 节）\n图 2　热分解型引发剂分解反应式：AIBN 均裂放出 N₂ 并生成 2 个氰基异丙基自由基；BPO 均裂生成 2 个苯甲酰氧自由基，无单体存在时进一步脱羧放出 CO₂（并非完全分解）（北化《高分子化学·重点内容》课件第 2.4.1.1 节）\n过硫酸钾（KPS，K₂S₂O₈）的水溶液分解式要能默写：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（受热，约 60—80 ℃）2 SO₄·⁻；SO₄·⁻ + H₂O → HSO₄⁻ + ·OH。可见 KPS 是水溶性引发剂，常用于乳液聚合与水溶液聚合，且分解产生的是硫酸根自由基与羟基自由基两种初级自由基。\n图 3　氧化还原引发体系反应式（水溶性）：H₂O₂ + Fe²⁺ → HO· + OH⁻ + Fe³⁺，活化能由 218 kJ/mol 降至 40 kJ/mol，可在 −10—20 ℃ 引发；还原剂过量时 HO· 会进一步与 Fe²⁺ 反应而失活，故还原剂用量一般少于氧化剂（北化《高分子化学·重点内容》课件第 2.4.1.2 节）\n衡量引发剂活性最实用的指标是半衰期 t1/2：在某一温度下引发剂浓度消耗一半所需的时间。60 ℃ 时 AIBN 的 t1/2 约 10 小时，属于“中速”；工业上选择引发剂要让 t1/2 与聚合时间同量级，否则要么引发不足、要么过早耗尽。\n引发效率 f 是真正引发链的自由基占全部分解自由基的比例。损失的主因是笼蔽效应：引发剂分子在溶剂或单体形成的“笼”中分解，两个初级自由基尚未扩散开就彼此结合或发生歧化，白白消耗。此外还有初级自由基向单体、溶剂、引发剂的转移消耗。因此 f 一般在 0.6 至 0.9，计算时不能当成 1。\n名词解释模板笼蔽效应：引发剂在溶液或本体中分解时，两个初级自由基被周围的溶剂或单体分子包围形成“笼子”，来不及扩散就相互结合而失活，使引发效率下降的现象。答题要写出“未扩散即失活”与“f 下降”两层意思。"},{"h":"一、本章坐标：四个基元反应决定两件事","t":"自由基聚合回答两个问题：反应有多快（Rp），链有多长（Xn）。这两个答案都来自同一组基元反应——引发、增长、终止、链转移。谁能改变这四步的相对速率，谁就同时改变了速率和分子量。整章的结构就是这句话的展开。\n逻辑链：① 引发（引发剂分解、引发效率 f、笼蔽效应） → ② 增长（单体逐个加到自由基上，kp 决定链长得快慢） → ③ 终止（偶合或歧化，kt 决定自由基寿命） → ④ 链转移（活性中心转移而不消失，决定实际分子量） → ⑤ 宏观动力学（稳态假设把四步合成 Rp 与 Xn 两个公式） → ⑥ 自动加速（中期粘度上升使 kt 骤降，公式失效）读法：读法：前四环是微观机理，第五环是把微观合成宏观，第六环是宏观公式失效的边界。所有简答题都在问“这四环里哪一环被改变了”。\n命题口径自由基聚合是 866 的核心：动力学方程推导、引发效率、自动加速、链转移与分子量控制几乎每年必考，且常以论述题出现（要求写出三个假设、推出 Rp ∝ [I]^0.5、再解释中期偏离）。这一章不能只“看懂”，必须能默写推导。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"引发效率 f 与笼蔽效应（名词解释、简答）"},{"id":"gaohua03n04","label":"链终止的偶合与歧化（选择、简答）","stars":3,"point":"偶合得 2ν，歧化得 ν","imgs":[],"quiz":[{"id":"gaohua03-012","type":"fill","match":true},{"id":"gaohua03-005","type":"tf","match":true}],"notes":[{"h":"四、链增长与链终止：一快一慢决定分子量","t":"增长是单体逐个加到链自由基末端，每次加成都放出约 20 至 35 kJ/mol 的聚合热，活化能低（约 20 至 40 kJ/mol），所以极快：一个自由基在不到一秒内可加上上千个单体。增长的方向性带来“头尾结构”，这是高物第一章讲构型时的伏笔。\n终止分两种。偶合是两个链自由基的独电子配对成键，把两条链连成一条，得到的分子量是动力学链长的 2 倍；歧化是一个自由基从另一个自由基的邻位碳上夺取氢（或反向夺取），生成两条死链，其中一条带不饱和端基，分子量等于动力学链长。两种方式的比例取决于温度与空间位阻：温度高、位阻大时歧化比例上升。\n图 4　链终止的两种方式：偶合终止与歧化终止的结构差别（课件含完整反应式与结构式）（北化《高分子化学·重点内容》课件第 2.3.3 节）\n反应式速记（考场直接写这三条）：①链增长　~M· + CH₂=CHX → ~M—CH₂—CHX·（每加成一个单体，放热 20—35 kJ/mol）；②偶合终止　2 ~M· → ~M—M~（两条链连成一条，聚合度等于两个自由基重复单元数之和，分子量为 2ν）；③歧化终止　2 ~M· → ~M—H + ~M=CHX（生成一条饱和链与一条带不饱和端基的链，分子量为 ν）。\n这里有一个容易被忽略的结论：终止速率常数 kt 比增长速率常数 kp 大 3 到 4 个数量级，但体系中自由基浓度极低（约 10⁻⁸ mol/L），所以每个自由基平均要增长上千次才碰到另一个自由基。这就是为什么“终止快”不等于“链短”。"},{"h":"十、易错清单与自测","t":"★★★　能不看书推出 Rp = kp[M](f·kd[I]/kt)^0.5，并写清三个假设\n★★★　能说清 0.5 次方的物理来源，并能用它判断实验数据是否异常\n★★★　能完整解释自动加速的四层内容\n★★★　能写出 1/Xn 的四项表达式并解释每项\n★★　能默写 AIBN、BPO、KPS 的分解反应式\n★★　能解释为什么 kt 比 kp 大几个数量级，链却仍然很长\n★★　能判断偶合与歧化对分子量的不同贡献\n★　能列出引发剂选择的依据（半衰期与聚合时间匹配）\n下一步本章是第 4 章（自由基共聚）的直接前提：共聚的组成方程用的是同样的稳态与等活性假设，只是把一种单体换成两种。读完本章立刻读第 4 章，能省一半力气。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"链终止的偶合与歧化（选择、简答）"},{"id":"gaohua03n05","label":"链转移的四种对象（计算、简答）","stars":4,"point":"向单体、溶剂、引发剂、大分子","imgs":[],"quiz":[{"id":"gaohua03-014","type":"fill","match":true},{"id":"gaohua03-017","type":"mcq","match":true},{"id":"gaohua03-002","type":"tf","match":true}],"notes":[{"h":"五、链转移：自由基没死，但链停长了","t":"链转移是自由基从另一个分子上夺取原子（通常是氢），自己变成稳定分子，同时把对方变成新的自由基。结果是：活性中心数量不变，但长链终止了，新链从零开始。所以链转移会降低分子量，却不降低聚合速率。\n四种转移对象各有常数：向单体转移（CM）、向溶剂转移（Cs）、向引发剂转移（Ci）、向大分子转移（导致支化）。工业上用十二烷基硫醇这类“分子量调节剂”就是故意利用向溶剂（或调节剂）转移，把分子量稳定控制在牌号要求。\n定量关系写成：1/Xn = 1/Xn0 + CM + Cs[S]/[M] + Ci[I]/[M]。其中 Xn0 是无转移时的聚合度。这条式子在计算题里几乎必用，也解释了为什么溶液聚合的分子量通常低于本体聚合——因为多了 Cs[S]/[M] 这一项。\n图 5　转化率对聚合速率与分子量的影响（MMA 本体聚合实测数据）（北化《高分子化学·重点内容》课件）"},{"h":"一、本章坐标：四个基元反应决定两件事","t":"自由基聚合回答两个问题：反应有多快（Rp），链有多长（Xn）。这两个答案都来自同一组基元反应——引发、增长、终止、链转移。谁能改变这四步的相对速率，谁就同时改变了速率和分子量。整章的结构就是这句话的展开。\n逻辑链：① 引发（引发剂分解、引发效率 f、笼蔽效应） → ② 增长（单体逐个加到自由基上，kp 决定链长得快慢） → ③ 终止（偶合或歧化，kt 决定自由基寿命） → ④ 链转移（活性中心转移而不消失，决定实际分子量） → ⑤ 宏观动力学（稳态假设把四步合成 Rp 与 Xn 两个公式） → ⑥ 自动加速（中期粘度上升使 kt 骤降，公式失效）读法：读法：前四环是微观机理，第五环是把微观合成宏观，第六环是宏观公式失效的边界。所有简答题都在问“这四环里哪一环被改变了”。\n命题口径自由基聚合是 866 的核心：动力学方程推导、引发效率、自动加速、链转移与分子量控制几乎每年必考，且常以论述题出现（要求写出三个假设、推出 Rp ∝ [I]^0.5、再解释中期偏离）。这一章不能只“看懂”，必须能默写推导。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"链转移的四种对象（计算、简答）"},{"id":"gaohua03n06","label":"三大假设与Rp方程（论述、计算）","stars":5,"point":"等活性、稳态、聚合度很大","imgs":[],"quiz":[{"id":"gaohua03-023","type":"short","match":true},{"id":"gaohua03-025","type":"calc","match":true},{"id":"gaohua03-026","type":"essay","match":true}],"notes":[{"h":"表 3　三个假设与两个方程的对应","t":"假设 ｜ 数学表达 ｜ 被推翻时的现象\n等活性 ｜ kp、kt 与链长无关 ｜ 链长差异大时 kt 下降，出现偏离\n稳态 ｜ d[M·]/dt = 0，Ri = Rt ｜ 引发极快或终止极慢时 [M·] 不恒定\n聚合度很大 ｜ Rp ≈ kp[M][M·] ｜ 引发剂浓度很高时引发消耗不可忽略\n推导书写顺序（考场照抄）①写三个假设并说明含义；②写四个基元反应的速率式；③用稳态条件解出 [M·]；④代入增长式得 Rp 方程；⑤说明与实验测得的 0.5 次方一致。少写第⑤步会被扣“结论与实验对照”的分。"},{"h":"六、动力学推导：三个假设与一个方程","t":"推导分三步，先把假设写清，再代速率式，最后做稳态近似。三个假设是：①自由基等活性，即链自由基不论长短，kp 与 kt 都相同；②稳态假设，引发产生的自由基与终止消耗的自由基相等，[M·] 恒定；③聚合度很大，即用于引发和转移消耗的单体可以忽略，Rp 近似等于增长速率。\n由稳态：Ri = Rt，2f·kd[I] = 2kt[M·]²，得 [M·] = √(f·kd[I]/kt)。代入增长速率 Rp = kp[M][M·]，得\nRp = kp[M](f·kd[I]/kt)^0.5　，即 Rp ∝ [M]·[I]^0.5。\n这个 0.5 次方是自由基聚合最著名的指纹：双分子终止导致引发剂浓度只以平方根影响速率。2023 年真题正是用 ln Rp 对 ln[I] 的斜率是否为 1/2 来判断体系是否符合微观动力学。\n动力学链长 ν 定义为每个活性中心从引发到消失所消耗的单体数，等于增长速率与引发速率之比：ν = Rp/Ri = kp[M]/(2√(f·kd·kt[I]))。分子量与 ν 的关系要看终止方式：偶合为主时 Xn = 2ν，歧化为主时 Xn = ν，两种并存时按比例加权。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"三大假设与 Rp 方程（论述、计算）"},{"id":"gaohua03n07","label":"动力学链长ν与聚合度（计算）","stars":4,"point":"ν 是每个自由基消耗的单体数","imgs":["img/map/m045.jpg","img/map/m046.jpg","img/map/m047.jpg"],"quiz":[{"id":"gaohua03-005","type":"tf","match":true},{"id":"gaohua03-007","type":"term","match":true},{"id":"gaohua03-026","type":"essay","match":true}],"notes":[{"h":"六、动力学推导：三个假设与一个方程","t":"推导分三步，先把假设写清，再代速率式，最后做稳态近似。三个假设是：①自由基等活性，即链自由基不论长短，kp 与 kt 都相同；②稳态假设，引发产生的自由基与终止消耗的自由基相等，[M·] 恒定；③聚合度很大，即用于引发和转移消耗的单体可以忽略，Rp 近似等于增长速率。\n由稳态：Ri = Rt，2f·kd[I] = 2kt[M·]²，得 [M·] = √(f·kd[I]/kt)。代入增长速率 Rp = kp[M][M·]，得\nRp = kp[M](f·kd[I]/kt)^0.5　，即 Rp ∝ [M]·[I]^0.5。\n这个 0.5 次方是自由基聚合最著名的指纹：双分子终止导致引发剂浓度只以平方根影响速率。2023 年真题正是用 ln Rp 对 ln[I] 的斜率是否为 1/2 来判断体系是否符合微观动力学。\n动力学链长 ν 定义为每个活性中心从引发到消失所消耗的单体数，等于增长速率与引发速率之比：ν = Rp/Ri = kp[M]/(2√(f·kd·kt[I]))。分子量与 ν 的关系要看终止方式：偶合为主时 Xn = 2ν，歧化为主时 Xn = ν，两种并存时按比例加权。"},{"h":"四、链增长与链终止：一快一慢决定分子量","t":"增长是单体逐个加到链自由基末端，每次加成都放出约 20 至 35 kJ/mol 的聚合热，活化能低（约 20 至 40 kJ/mol），所以极快：一个自由基在不到一秒内可加上上千个单体。增长的方向性带来“头尾结构”，这是高物第一章讲构型时的伏笔。\n终止分两种。偶合是两个链自由基的独电子配对成键，把两条链连成一条，得到的分子量是动力学链长的 2 倍；歧化是一个自由基从另一个自由基的邻位碳上夺取氢（或反向夺取），生成两条死链，其中一条带不饱和端基，分子量等于动力学链长。两种方式的比例取决于温度与空间位阻：温度高、位阻大时歧化比例上升。\n图 4　链终止的两种方式：偶合终止与歧化终止的结构差别（课件含完整反应式与结构式）（北化《高分子化学·重点内容》课件第 2.3.3 节）\n反应式速记（考场直接写这三条）：①链增长　~M· + CH₂=CHX → ~M—CH₂—CHX·（每加成一个单体，放热 20—35 kJ/mol）；②偶合终止　2 ~M· → ~M—M~（两条链连成一条，聚合度等于两个自由基重复单元数之和，分子量为 2ν）；③歧化终止　2 ~M· → ~M—H + ~M=CHX（生成一条饱和链与一条带不饱和端基的链，分子量为 ν）。\n这里有一个容易被忽略的结论：终止速率常数 kt 比增长速率常数 kp 大 3 到 4 个数量级，但体系中自由基浓度极低（约 10⁻⁸ mol/L），所以每个自由基平均要增长上千次才碰到另一个自由基。这就是为什么“终止快”不等于“链短”。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"动力学链长 ν 与聚合度（计算）"},{"id":"gaohua03n08","label":"温度与浓度对Rp、Xn的影响（简答、论述）","stars":4,"point":"综合活化能约 60 至 70 kJ/mol","imgs":["img/map/m048.jpg","img/map/m049.jpg","img/map/m050.jpg"],"quiz":[{"id":"gaohua03-025","type":"calc","match":true},{"id":"gaohua03-006","type":"term","match":true},{"id":"gaohua03-026","type":"essay","match":true}],"notes":[{"h":"七、温度、浓度与引发剂：三个旋钮的方向","t":"温度对 Rp 的影响由综合活化能决定：Ea(Rp) = Ep + Ed/2 - Et/2 ≈ 30 + 60 - 5 ≈ 63 kJ/mol（数量级），所以升温加速。温度对 Xn 的影响则由 Ea(Xn) = Ep - Ed/2 - Et/2 决定，约为 -60 kJ/mol，所以升温使分子量下降。这正是“升温快而短”的来源。\n引发剂浓度升高：Rp 按 0.5 次方上升，Xn 按 -0.5 次方下降。单体浓度升高：Rp 线性上升，Xn 也上升（因为 [M]/[M·] 增大）。这三个方向必须能直接说出来，简答题常以“要提高速率又不降低分子量，怎么办”设问，答案就是提高单体浓度、降低引发剂浓度、适当降温。"},{"h":"九、真题与期末题演练","t":"【真题 1】某自由基聚合体系测得 ln Rp 与 ln[I] 成线性、斜率为 1/2，ln Rp 与 ln[M] 成线性、斜率为 1。（1）说明该体系符合哪些假设；（2）随反应进行体系粘度增大，Rp 反而上升，解释原因；（3）提出三条提高分子量而不显著降低速率的措施。\n来源：四川大学 866（2023 年真题解析）·论述题第 1 题\n参考答案与给分点：（1）符合等活性、稳态、聚合度很大三个假设。斜率 1/2 来自双分子终止的稳态解，斜率 1 来自 Rp 对单体浓度的一次方依赖。（2）粘度增大使链段重排受阻、活性端基被包埋，双基终止困难，kt 下降、自由基寿命延长，而单体扩散基本不受影响、kp 不变，故 Rp 上升，同时分子量迅速增大，体系成胶状——即自动加速，此时微观动力学已不成立，进入宏观动力学范畴。（3）降低引发剂浓度、适当降低温度以减少链转移、选择合适溶剂以减弱向溶剂的链转移（或加入适量链转移剂并把控用量）。给分点：假设、机理、措施三块各占三分之一。\n【真题 2】在推导自由基聚合初期反应动力学方程时和二元共聚组成方程时都使用过的三个假设是（　）、（　）和（　）。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·填空题第 5 题（附标准答案）\n参考答案与给分点：自由基等活性假设、聚合度很大假设、稳态假设。给分点：三空各 0.5 分。注意题目问的是“都使用过”，所以不能答“忽略引发消耗”这类只在动力学中用的假设。\n【真题 3】用 BPO 引发 10 g 苯乙烯在 80 mL 环己烷中聚合，要提高聚合速率，可加入四氢呋喃、N,N-二甲基苯胺、甲苯、聚苯乙烯中的哪些？为什么？\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·简答题第 4 题（BPO 体系部分）\n参考答案与给分点：可加 N,N-二甲基苯胺与聚苯乙烯。前者与 BPO 组成氧化还原体系，活化能大幅降低，相同温度下自由基生成速率快，Rp 上升；后者提高体系粘度，使 kt 下降，产生凝胶效应而提速。四氢呋喃是极性溶剂，主要影响离子聚合的离子对状态，对自由基体系无此作用；甲苯只是稀释，反而降低速率。给分点：两种添加物各 2 分，机理各 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"温度与浓度对 Rp、Xn 的影响（简答、论述）"},{"id":"gaohua03n09","label":"自动加速现象（凝胶效应）（论述、简答）","stars":5,"point":"kt 下降、kp 不变，Rp 反而上升","imgs":[],"quiz":[{"id":"gaohua03-008","type":"term","match":true},{"id":"gaohua03-004","type":"tf","match":true},{"id":"gaohua03-006","type":"term","match":true}],"notes":[{"h":"八、自动加速：公式失效的那一刻","t":"聚合中期，单体与聚合物共存使体系粘度急剧上升。大分子链段运动受阻，两个链自由基靠近变难，kt 明显下降；而单体分子小、扩散仍容易，kp 基本不变。由 Rp = kp[M]√(f·kd[I]/kt) 可见，kt 下降使 Rp 反而上升，同时自由基寿命延长、分子量骤增，体系迅速变成“果冻”。这就是自动加速，也叫凝胶效应。\n图 6　自动加速现象的定义与判据：外界条件不变、仅由体系内部引起的加速（北化《高分子化学·重点内容》课件）\n自动加速不是好事。放热集中会造成局部过热、暴聚、产物不均一，甚至冲料。工业上的对策：降低引发剂浓度、分段升温、加强搅拌与传热、采用溶液或分散体系稀释粘度、必要时加入少量链转移剂抑制分子量暴涨。\n与此相对的是“沉淀效应”：在非均相体系（如丙烯腈在水中的沉淀聚合）中，聚合物一生成就析出，反应在颗粒内部进行，同样会出现加速，但机理是局部浓度富集而非单纯粘度。两者要分清：凝胶效应讲的是粘度，沉淀效应讲的是相分离。\n图 7　转化率与聚合速率的关系曲线：中期出现的速率回升即自动加速段（北化《高分子化学·重点内容》课件）\n论述题答题结构遇到“解释自动加速”，按四层写：①现象（Rp 反常上升、分子量骤增、体系成胶）；②原因（粘度上升 → kt 下降、kp 不变）；③判据（外界条件不变，故不是温度或浓度引起）；④影响与对策（局部过热、暴聚，用降引发剂、加强传热、加溶剂解决）。四层齐全才是满分答案。"},{"h":"九、真题与期末题演练","t":"【真题 1】某自由基聚合体系测得 ln Rp 与 ln[I] 成线性、斜率为 1/2，ln Rp 与 ln[M] 成线性、斜率为 1。（1）说明该体系符合哪些假设；（2）随反应进行体系粘度增大，Rp 反而上升，解释原因；（3）提出三条提高分子量而不显著降低速率的措施。\n来源：四川大学 866（2023 年真题解析）·论述题第 1 题\n参考答案与给分点：（1）符合等活性、稳态、聚合度很大三个假设。斜率 1/2 来自双分子终止的稳态解，斜率 1 来自 Rp 对单体浓度的一次方依赖。（2）粘度增大使链段重排受阻、活性端基被包埋，双基终止困难，kt 下降、自由基寿命延长，而单体扩散基本不受影响、kp 不变，故 Rp 上升，同时分子量迅速增大，体系成胶状——即自动加速，此时微观动力学已不成立，进入宏观动力学范畴。（3）降低引发剂浓度、适当降低温度以减少链转移、选择合适溶剂以减弱向溶剂的链转移（或加入适量链转移剂并把控用量）。给分点：假设、机理、措施三块各占三分之一。\n【真题 2】在推导自由基聚合初期反应动力学方程时和二元共聚组成方程时都使用过的三个假设是（　）、（　）和（　）。\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·填空题第 5 题（附标准答案）\n参考答案与给分点：自由基等活性假设、聚合度很大假设、稳态假设。给分点：三空各 0.5 分。注意题目问的是“都使用过”，所以不能答“忽略引发消耗”这类只在动力学中用的假设。\n【真题 3】用 BPO 引发 10 g 苯乙烯在 80 mL 环己烷中聚合，要提高聚合速率，可加入四氢呋喃、N,N-二甲基苯胺、甲苯、聚苯乙烯中的哪些？为什么？\n来源：北京化工大学《高分子化学》2015—2016 学年 A 卷·简答题第 4 题（BPO 体系部分）\n参考答案与给分点：可加 N,N-二甲基苯胺与聚苯乙烯。前者与 BPO 组成氧化还原体系，活化能大幅降低，相同温度下自由基生成速率快，Rp 上升；后者提高体系粘度，使 kt 下降，产生凝胶效应而提速。四氢呋喃是极性溶剂，主要影响离子聚合的离子对状态，对自由基体系无此作用；甲苯只是稀释，反而降低速率。给分点：两种添加物各 2 分，机理各 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"自动加速现象（凝胶效应）（论述、简答）"},{"id":"gaohua03n10","label":"分子量分布与聚合度控制（计算、简答）","stars":3,"point":"d 常为 2 至 5，转移剂可调分子量","imgs":["img/map/m051.jpg","img/map/m052.jpg"],"quiz":[{"id":"gaohua03-024","type":"short","match":true},{"id":"gaohua03-026","type":"essay","match":true},{"id":"gaohua03-023","type":"short","match":true}],"notes":[{"h":"四、链增长与链终止：一快一慢决定分子量","t":"增长是单体逐个加到链自由基末端，每次加成都放出约 20 至 35 kJ/mol 的聚合热，活化能低（约 20 至 40 kJ/mol），所以极快：一个自由基在不到一秒内可加上上千个单体。增长的方向性带来“头尾结构”，这是高物第一章讲构型时的伏笔。\n终止分两种。偶合是两个链自由基的独电子配对成键，把两条链连成一条，得到的分子量是动力学链长的 2 倍；歧化是一个自由基从另一个自由基的邻位碳上夺取氢（或反向夺取），生成两条死链，其中一条带不饱和端基，分子量等于动力学链长。两种方式的比例取决于温度与空间位阻：温度高、位阻大时歧化比例上升。\n图 4　链终止的两种方式：偶合终止与歧化终止的结构差别（课件含完整反应式与结构式）（北化《高分子化学·重点内容》课件第 2.3.3 节）\n反应式速记（考场直接写这三条）：①链增长　~M· + CH₂=CHX → ~M—CH₂—CHX·（每加成一个单体，放热 20—35 kJ/mol）；②偶合终止　2 ~M· → ~M—M~（两条链连成一条，聚合度等于两个自由基重复单元数之和，分子量为 2ν）；③歧化终止　2 ~M· → ~M—H + ~M=CHX（生成一条饱和链与一条带不饱和端基的链，分子量为 ν）。\n这里有一个容易被忽略的结论：终止速率常数 kt 比增长速率常数 kp 大 3 到 4 个数量级，但体系中自由基浓度极低（约 10⁻⁸ mol/L），所以每个自由基平均要增长上千次才碰到另一个自由基。这就是为什么“终止快”不等于“链短”。"},{"h":"五、链转移：自由基没死，但链停长了","t":"链转移是自由基从另一个分子上夺取原子（通常是氢），自己变成稳定分子，同时把对方变成新的自由基。结果是：活性中心数量不变，但长链终止了，新链从零开始。所以链转移会降低分子量，却不降低聚合速率。\n四种转移对象各有常数：向单体转移（CM）、向溶剂转移（Cs）、向引发剂转移（Ci）、向大分子转移（导致支化）。工业上用十二烷基硫醇这类“分子量调节剂”就是故意利用向溶剂（或调节剂）转移，把分子量稳定控制在牌号要求。\n定量关系写成：1/Xn = 1/Xn0 + CM + Cs[S]/[M] + Ci[I]/[M]。其中 Xn0 是无转移时的聚合度。这条式子在计算题里几乎必用，也解释了为什么溶液聚合的分子量通常低于本体聚合——因为多了 Cs[S]/[M] 这一项。\n图 5　转化率对聚合速率与分子量的影响（MMA 本体聚合实测数据）（北化《高分子化学·重点内容》课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"分子量分布与聚合度控制（计算、简答）"},{"label":"可控/活性自由基聚合：ATRP、RAFT 与理论分子量","stars":5,"point":"通过可逆钝化或简并转移降低自由活性链瞬时浓度、使多数链交替处于休眠/活性状态，从而获得可预期 Mn 和较窄分布；并不表示完全没有双基终止，也不必然提高聚合速率。","notesTitle":"真题补漏讲解","notes":[{"h":"ATRP 与 RAFT 的共同语言和区别","t":"共同目标：让大量链近似同步、间歇增长，分子量随转化率增加且分布较窄。普通自由基聚合仍会发生不可逆终止，可控自由基聚合只是显著降低其影响，不能写成“绝对无终止”。\n\nATRP：过渡金属配合物在低价/高价态间转移，建立 Pn—X 休眠种与 Pn· 活性种的可逆平衡。\nRAFT：链转移剂通过可逆加成—断裂链转移实现简并交换；理论 Mn 常按已转化单体质量除以 RAFT 试剂物质的量，再加 RAFT 残基摩尔质量。若引发剂产生的新链数不可忽略或试剂利用率并非 100%，需修正链数。\n\n它能控制链长和分布，不等于同时提高 Rp；若要“高速度＋高分子量”，乳液聚合的隔离效应是另一条机理。"}],"quiz":[{"id":"past2021-006","type":"mcq","match":true},{"id":"past2023-016","type":"essay","match":true},{"id":"past2021-008","type":"mcq","match":true}],"added":true,"id":"gaohua03n11","imgs":[],"quizAudited":true,"fullLabel":"可控/活性自由基聚合：ATRP、RAFT 与理论分子量","importanceBasis":"已录2021—2023真题与课程体系补漏"},{"label":"阻聚与缓聚：常见阻聚剂及机理判断","stars":4,"point":"阻聚使聚合在诱导期内基本停止，缓聚只降低速率；判断某种物质对不同聚合体系的作用，要看它捕获自由基、与离子活性中心反应，还是充当链转移剂。","notesTitle":"真题补漏讲解","notes":[{"h":"按活性中心判断，不死背一张表","t":"自由基聚合中，氧、苯醌、DPPH 等可通过捕获或消耗自由基产生阻聚/缓聚作用，但具体效果与体系、温度和浓度有关。离子聚合中，水、醇、酸等含活泼氢或能转移质子的杂质常使活性中心失活。\n\n同一物质对自由基、阳离子和阴离子体系的作用可以不同；选择题必须逐项核对活性中心，而不能把“对一种体系阻聚”推广为对所有体系阻聚。"}],"quiz":[{"id":"past2021-001","type":"mcq","match":true}],"added":true,"id":"gaohua03n12","imgs":[],"quizAudited":true,"fullLabel":"阻聚与缓聚：常见阻聚剂及机理判断","importanceBasis":"已录2021—2023真题与课程体系补漏"}],"logic":{"question":"自由基链怎样经历引发、增长、终止与转移？速率和分子量为何相互制约？","role":"连锁聚合的动力学主干；后续共聚和聚合方法都借用这里的活性中心与基元反应语言。","input":"连锁/逐步分类、自由基活性中心","output":"Rp 与 Xn 方程、链转移、自动加速及可控自由基接口","prev":"gaohua02","next":"gaohua04","links":[{"cid":"gaohua05","text":"乳液聚合用粒子隔离缓解速率与分子量矛盾"},{"cid":"gaohua06","text":"活性阴离子与可控自由基共同回答“如何设计链长”"}],"focus":["三基元反应与引发效率、笼蔽效应","稳态等活性假定、Rp 方程和动力学链长","链转移、终止方式及温度/浓度影响","自动加速与可控/活性自由基聚合"],"common":["推导并应用 Rp 方程，判断对 [I]、[M] 的级数","由 ν、终止方式和链转移求 Xn","解释凝胶效应及原微观动力学为何失效","ATRP/RAFT 的控制思路与理论 Mn 计算（真题补漏）","阻聚与缓聚的辨别（真题补漏）"],"examRefs":["past2023-016","past2022-008","past2021-001","past2021-006","past2021-011","past2021-016"]},"examRefs":["past2023-016","past2022-008","past2021-001","past2021-006","past2021-011","past2021-016"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":2,"nodes":12,"withQuiz":12,"examRefs":6,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaohua04":{"title":"自由基共聚合","subject":"gaohua","nodes":[{"id":"gaohua04n01","label":"竞聚率的定义与物理意义（名词解释、计算）","stars":4,"point":"k11/k12，衡量单体“自私”程度","imgs":["img/map/m053.jpg","img/map/m054.jpg","img/map/m055.jpg"],"quiz":[{"id":"gaohua04-020","type":"short","match":true},{"id":"gaohua04-006","type":"term","match":true},{"id":"gaohua04-007","type":"term","match":true}],"notes":[{"h":"一、本章坐标：两种单体的“性格”如何合成一条链","t":"均聚只能改分子量，共聚能改结构，所以工业上的重要牌号几乎都是共聚物：ABS 是丙烯腈-丁二烯-苯乙烯，丁苯橡胶是苯乙烯-丁二烯，EVA 是乙烯-醋酸乙烯酯。共聚的核心问题只有一个：两种单体谁更愿意跟自己玩、谁更愿意跟对方玩？这个“性格”就是竞聚率。\n逻辑链：① 竞聚率 r1、r2（同种加成与异种加成的速率之比） → ② 瞬时组成方程（由四个增长反应与稳态假设推出 F1 与 f1 的关系） → ③ 曲线形状（r1r2 决定恒比、交替还是无规） → ④ 转化率效应（单体消耗速度不同，组成随转化率漂移） → ⑤ 控制手段（恒比点投料、补加单体、连续聚合） → ⑥ Q-e 估算（用共振与极性预估未知体系的竞聚率）读法：读法：这条链的前半段是热力学与动力学（谁快），后半段是工程（怎么把组成稳定住）。考计算多半在前半段，考简答多半在后半段。\n命题口径共聚合是计算题的高频来源（给 r1、r2 与投料比求 F1，或给 F1 反求投料），简答则偏爱“恒比点”“为什么要补加单体”“Q-e 的物理意义与局限”。这一章的公式不多，但每一个都要能解释形状。"},{"h":"三、竞聚率：一个比值讲清两种单体的关系","t":"定义很朴素：r1 = k11/k12，即自由基 M1· 加到单体 M1 上与自己同类加成的速率，除以加到 M2 上交叉加成的速率。r1 大，说明 M1· 偏爱 M1；r1 小，说明它更愿意去接 M2。\n记住这个直觉：r 不是“活性”，而是“选择性”。两种单体都可能很活泼，但 r 描述的是相对偏好。所以考题常把 r 与 Q 值分开问。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"竞聚率的定义与物理意义（名词解释、计算）"},{"id":"gaohua04n02","label":"共聚组成微分方程的推导（论述、计算）","stars":5,"point":"四个增长反应 + 稳态假设","imgs":["img/map/m056.jpg","img/map/m057.jpg","img/map/m058.jpg"],"quiz":[{"id":"gaohua04-003","type":"tf","match":true},{"id":"gaohua04-022","type":"short","match":true},{"id":"gaohua04-018","type":"mcq","match":true}],"notes":[{"h":"四、组成微分方程：四个反应，一个稳态","t":"推导假设五个：①等活性，链自由基活性与链长无关；②稳态，两种自由基浓度恒定；③聚合度很大，引发与转移消耗的单体忽略；④无解聚；⑤反应不可逆。前三条与第 3 章一致，后两条是本章补充。\n体系里有四个增长反应：M1· + M1、M1· + M2、M2· + M1、M2· + M2，速率常数分别 k11、k12、k21、k22。对两种自由基分别写稳态方程，消去自由基浓度，得到\n四个增长反应式（必须能写出并标注速率常数）：①~M1· + M1 → ~M1·，R11 = k11[M1·][M1]；②~M1· + M2 → ~M2·，R12 = k12[M1·][M2]；③~M2· + M1 → ~M1·，R21 = k21[M2·][M1]；④~M2· + M2 → ~M2·，R22 = k22[M2·][M2]。竞聚率就是同种加成与异种加成之比：r1 = k11/k12，r2 = k22/k21。注意 r2 的分母是 k21（顺序容易记反）。\n图 2　二元共聚组成微分方程的两种等价写法：以摩尔浓度比表示（上）与以浓度比展开（下），推导时从四个增长反应的稳态方程出发（北化《高分子化学·重点内容》课件第 3.2 节）\nF1 = (r1·f1² + f1·f2)/(r1·f1² + 2f1·f2 + r2·f2²)\n其中 f1、f2 是投料时两种单体的摩尔分数，F1 是瞬间生成共聚物中 M1 的摩尔分数。这个式子只描述“某一瞬间”生成的共聚物，因此叫瞬时组成方程。转化率一高，f1 变了，F1 就跟着变——这是全章最容易被忽略的前提。\n计算步骤（照做不出错）第一步把投料摩尔比换成 f1、f2（f1 + f2 = 1）；第二步代入方程，注意分母三项的顺序别抄错；第三步检查结果是否在 0 到 1 之间，若不在说明代错；第四步若问“恒比点”，令 F1 = f1 反解 f1。"},{"h":"表 2　五种竞聚率组合与共聚行为","t":"情形 ｜ 条件 ｜ 曲线特征 ｜ 产物结构\n理想恒比共聚 ｜ r1 = r2 = 1 ｜ F1 = f1 的直线 ｜ 两种单元无规分布，组成等于投料比\n理想非恒比共聚 ｜ r1r2 = 1，r1 ≠ 1 ｜ 曲线与对角线相交于恒比点 ｜ 无规，但有恒比组成\n交替共聚 ｜ r1 = r2 = 0（或 r1r2 → 0） ｜ 曲线呈水平线 F1 = 0.5 ｜ 严格交替序列\n有恒比点的非理想共聚 ｜ r1 < 1、r2 < 1（r1r2 < 1） ｜ 曲线与对角线相交 ｜ 无规，组成随转化率漂移\n嵌段或接枝倾向 ｜ r1 > 1、r2 > 1（r1r2 > 1） ｜ 曲线呈 S 形 ｜ 出现长序列，实际体系少见\n图 1　共聚组成曲线小结：五种竞聚率组合对应的 F1–f1 曲线（北化《高分子化学·重点内容》课件）\n这五种情形不需要死记，画图即可推：把 F1 = f1 的对角线画出来，再看曲线在它上方还是下方。当 r1 很大、r2 很小时，曲线先在对角线上方、后穿过对角线到下方，中间那个交点就是恒比点。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"共聚组成微分方程的推导（论述、计算）"},{"id":"gaohua04n03","label":"五种r1、r2组合的曲线形状（选择、作图、简答）","stars":4,"point":"恒比、交替、无规、嵌段倾向","imgs":["img/map/m059.jpg","img/map/m060.jpg","img/map/m061.jpg"],"quiz":[{"id":"gaohua04-020","type":"short","match":true},{"id":"gaohua04-005","type":"tf","match":true},{"id":"gaohua04-009","type":"fill","match":true}],"notes":[{"h":"表 2　五种竞聚率组合与共聚行为","t":"情形 ｜ 条件 ｜ 曲线特征 ｜ 产物结构\n理想恒比共聚 ｜ r1 = r2 = 1 ｜ F1 = f1 的直线 ｜ 两种单元无规分布，组成等于投料比\n理想非恒比共聚 ｜ r1r2 = 1，r1 ≠ 1 ｜ 曲线与对角线相交于恒比点 ｜ 无规，但有恒比组成\n交替共聚 ｜ r1 = r2 = 0（或 r1r2 → 0） ｜ 曲线呈水平线 F1 = 0.5 ｜ 严格交替序列\n有恒比点的非理想共聚 ｜ r1 < 1、r2 < 1（r1r2 < 1） ｜ 曲线与对角线相交 ｜ 无规，组成随转化率漂移\n嵌段或接枝倾向 ｜ r1 > 1、r2 > 1（r1r2 > 1） ｜ 曲线呈 S 形 ｜ 出现长序列，实际体系少见\n图 1　共聚组成曲线小结：五种竞聚率组合对应的 F1–f1 曲线（北化《高分子化学·重点内容》课件）\n这五种情形不需要死记，画图即可推：把 F1 = f1 的对角线画出来，再看曲线在它上方还是下方。当 r1 很大、r2 很小时，曲线先在对角线上方、后穿过对角线到下方，中间那个交点就是恒比点。"},{"h":"十、易错清单与自测","t":"★★★　能默写 F1 的组成方程，并说清 f 与 F 的区别\n★★★　能画出五种竞聚率组合的曲线，并标出恒比点\n★★★　能用恒比点公式算出具体投料比\n★★★　能解释为什么转化率高时共聚物组成会漂移，并给出三种控制方法\n★★　能写出 Mayo-Lewis 法的作图思路，并说明为何要低转化率取样\n★★　能写出 Q-e 方程与 r1r2 = exp[-(e1 - e2)²]，并说明其含义\n★★　能列出单体与自由基的活性顺序，并解释为何相反\n★　能说出 ABS、SBR、EVA 的组成与主要用途\n与前后章的接口本章的稳态与等活性假设直接继承第 3 章；本章的序列结构结论（无规、交替、嵌段）会在高物第一章“链结构”和第五章“相容性”里再次用到。读高物时遇到“为什么两种聚合物不相容”，先想本章的极性差。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"五种 r1、r2 组合的曲线形状（选择、作图、简答）"},{"id":"gaohua04n04","label":"恒比点的计算与意义（计算、简答）","stars":4,"point":"F1 = f1 时组成不随转化率变","imgs":["img/map/m062.jpg","img/map/m063.jpg","img/map/m064.jpg"],"quiz":[{"id":"gaohua04-007","type":"term","match":true},{"id":"gaohua04-001","type":"tf","match":true},{"id":"gaohua04-003","type":"tf","match":true}],"notes":[{"h":"五、恒比点：唯一组成不漂移的配方","t":"令 F1 = f1，代入方程化简得\nf1(恒比) = (1 - r2)/(2 - r1 - r2)\n只有当 r1 < 1 且 r2 < 1 时，这个值才落在 0 到 1 之间，恒比点才有物理意义。在恒比点投料，生成的共聚物组成与剩余单体组成始终相同，因此无论转化率多高，组成都不变。工业上做丁苯橡胶、SAN 树脂时，常把配方设计在恒比点附近，就是为了避免“前段富 A、后段富 B”的不均一。\n图 3　共聚物组成随转化率的变化：曲线在对角线上方或下方意味着组成漂移（北化《高分子化学·重点内容》课件）\n如果配方无法落在恒比点怎么办？三条工艺路线：①一次性投料、控制转化率在较低水平（如 10% 至 20%）就停，取“瞬时组成”这一段；②连续补加活性大的单体，把 f1 维持在恒定值；③采用连续聚合或管式反应器，让物料停留时间短、组成近似恒定。这三条是简答题的标准答案。\n图 4　一次性投料法与补加单体法的组成控制比较（北化《高分子化学·重点内容》课件）"},{"h":"一、本章坐标：两种单体的“性格”如何合成一条链","t":"均聚只能改分子量，共聚能改结构，所以工业上的重要牌号几乎都是共聚物：ABS 是丙烯腈-丁二烯-苯乙烯，丁苯橡胶是苯乙烯-丁二烯，EVA 是乙烯-醋酸乙烯酯。共聚的核心问题只有一个：两种单体谁更愿意跟自己玩、谁更愿意跟对方玩？这个“性格”就是竞聚率。\n逻辑链：① 竞聚率 r1、r2（同种加成与异种加成的速率之比） → ② 瞬时组成方程（由四个增长反应与稳态假设推出 F1 与 f1 的关系） → ③ 曲线形状（r1r2 决定恒比、交替还是无规） → ④ 转化率效应（单体消耗速度不同，组成随转化率漂移） → ⑤ 控制手段（恒比点投料、补加单体、连续聚合） → ⑥ Q-e 估算（用共振与极性预估未知体系的竞聚率）读法：读法：这条链的前半段是热力学与动力学（谁快），后半段是工程（怎么把组成稳定住）。考计算多半在前半段，考简答多半在后半段。\n命题口径共聚合是计算题的高频来源（给 r1、r2 与投料比求 F1，或给 F1 反求投料），简答则偏爱“恒比点”“为什么要补加单体”“Q-e 的物理意义与局限”。这一章的公式不多，但每一个都要能解释形状。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"恒比点的计算与意义（计算、简答）"},{"id":"gaohua04n05","label":"转化率与组成漂移（简答、论述）","stars":4,"point":"活性大的单体先耗尽","imgs":["img/map/m065.jpg","img/map/m066.jpg","img/map/m067.jpg"],"quiz":[{"id":"gaohua04-023","type":"short","match":true},{"id":"gaohua04-001","type":"tf","match":true},{"id":"gaohua04-026","type":"essay","match":true}],"notes":[{"h":"五、恒比点：唯一组成不漂移的配方","t":"令 F1 = f1，代入方程化简得\nf1(恒比) = (1 - r2)/(2 - r1 - r2)\n只有当 r1 < 1 且 r2 < 1 时，这个值才落在 0 到 1 之间，恒比点才有物理意义。在恒比点投料，生成的共聚物组成与剩余单体组成始终相同，因此无论转化率多高，组成都不变。工业上做丁苯橡胶、SAN 树脂时，常把配方设计在恒比点附近，就是为了避免“前段富 A、后段富 B”的不均一。\n图 3　共聚物组成随转化率的变化：曲线在对角线上方或下方意味着组成漂移（北化《高分子化学·重点内容》课件）\n如果配方无法落在恒比点怎么办？三条工艺路线：①一次性投料、控制转化率在较低水平（如 10% 至 20%）就停，取“瞬时组成”这一段；②连续补加活性大的单体，把 f1 维持在恒定值；③采用连续聚合或管式反应器，让物料停留时间短、组成近似恒定。这三条是简答题的标准答案。\n图 4　一次性投料法与补加单体法的组成控制比较（北化《高分子化学·重点内容》课件）"},{"h":"一、本章坐标：两种单体的“性格”如何合成一条链","t":"均聚只能改分子量，共聚能改结构，所以工业上的重要牌号几乎都是共聚物：ABS 是丙烯腈-丁二烯-苯乙烯，丁苯橡胶是苯乙烯-丁二烯，EVA 是乙烯-醋酸乙烯酯。共聚的核心问题只有一个：两种单体谁更愿意跟自己玩、谁更愿意跟对方玩？这个“性格”就是竞聚率。\n逻辑链：① 竞聚率 r1、r2（同种加成与异种加成的速率之比） → ② 瞬时组成方程（由四个增长反应与稳态假设推出 F1 与 f1 的关系） → ③ 曲线形状（r1r2 决定恒比、交替还是无规） → ④ 转化率效应（单体消耗速度不同，组成随转化率漂移） → ⑤ 控制手段（恒比点投料、补加单体、连续聚合） → ⑥ Q-e 估算（用共振与极性预估未知体系的竞聚率）读法：读法：这条链的前半段是热力学与动力学（谁快），后半段是工程（怎么把组成稳定住）。考计算多半在前半段，考简答多半在后半段。\n命题口径共聚合是计算题的高频来源（给 r1、r2 与投料比求 F1，或给 F1 反求投料），简答则偏爱“恒比点”“为什么要补加单体”“Q-e 的物理意义与局限”。这一章的公式不多，但每一个都要能解释形状。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"转化率与组成漂移（简答、论述）"},{"id":"gaohua04n06","label":"组成控制的三条工艺路线（简答）","stars":3,"point":"恒比投料、补加、连续","imgs":["img/map/m068.jpg"],"quiz":[{"id":"gaohua04-013","type":"fill","match":true},{"id":"gaohua04-026","type":"essay","match":true},{"id":"gaohua04-023","type":"short","match":true}],"notes":[{"h":"五、恒比点：唯一组成不漂移的配方","t":"令 F1 = f1，代入方程化简得\nf1(恒比) = (1 - r2)/(2 - r1 - r2)\n只有当 r1 < 1 且 r2 < 1 时，这个值才落在 0 到 1 之间，恒比点才有物理意义。在恒比点投料，生成的共聚物组成与剩余单体组成始终相同，因此无论转化率多高，组成都不变。工业上做丁苯橡胶、SAN 树脂时，常把配方设计在恒比点附近，就是为了避免“前段富 A、后段富 B”的不均一。\n图 3　共聚物组成随转化率的变化：曲线在对角线上方或下方意味着组成漂移（北化《高分子化学·重点内容》课件）\n如果配方无法落在恒比点怎么办？三条工艺路线：①一次性投料、控制转化率在较低水平（如 10% 至 20%）就停，取“瞬时组成”这一段；②连续补加活性大的单体，把 f1 维持在恒定值；③采用连续聚合或管式反应器，让物料停留时间短、组成近似恒定。这三条是简答题的标准答案。\n图 4　一次性投料法与补加单体法的组成控制比较（北化《高分子化学·重点内容》课件）"},{"h":"四、组成微分方程：四个反应，一个稳态","t":"推导假设五个：①等活性，链自由基活性与链长无关；②稳态，两种自由基浓度恒定；③聚合度很大，引发与转移消耗的单体忽略；④无解聚；⑤反应不可逆。前三条与第 3 章一致，后两条是本章补充。\n体系里有四个增长反应：M1· + M1、M1· + M2、M2· + M1、M2· + M2，速率常数分别 k11、k12、k21、k22。对两种自由基分别写稳态方程，消去自由基浓度，得到\n四个增长反应式（必须能写出并标注速率常数）：①~M1· + M1 → ~M1·，R11 = k11[M1·][M1]；②~M1· + M2 → ~M2·，R12 = k12[M1·][M2]；③~M2· + M1 → ~M1·，R21 = k21[M2·][M1]；④~M2· + M2 → ~M2·，R22 = k22[M2·][M2]。竞聚率就是同种加成与异种加成之比：r1 = k11/k12，r2 = k22/k21。注意 r2 的分母是 k21（顺序容易记反）。\n图 2　二元共聚组成微分方程的两种等价写法：以摩尔浓度比表示（上）与以浓度比展开（下），推导时从四个增长反应的稳态方程出发（北化《高分子化学·重点内容》课件第 3.2 节）\nF1 = (r1·f1² + f1·f2)/(r1·f1² + 2f1·f2 + r2·f2²)\n其中 f1、f2 是投料时两种单体的摩尔分数，F1 是瞬间生成共聚物中 M1 的摩尔分数。这个式子只描述“某一瞬间”生成的共聚物，因此叫瞬时组成方程。转化率一高，f1 变了，F1 就跟着变——这是全章最容易被忽略的前提。\n计算步骤（照做不出错）第一步把投料摩尔比换成 f1、f2（f1 + f2 = 1）；第二步代入方程，注意分母三项的顺序别抄错；第三步检查结果是否在 0 到 1 之间，若不在说明代错；第四步若问“恒比点”，令 F1 = f1 反解 f1。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"组成控制的三条工艺路线（简答）"},{"id":"gaohua04n07","label":"竞聚率的测定方法（简答）","stars":3,"point":"Mayo-Lewis 截距斜率法","imgs":["img/map/m069.jpg"],"quiz":[{"id":"gaohua04-006","type":"term","match":true},{"id":"gaohua04-020","type":"short","match":true}],"notes":[{"h":"六、竞聚率怎么测：Mayo-Lewis 截距斜率法","t":"把组成方程改写成线性形式：r2 = (f1/f2)·[f1(F1 - 1)/(-F1)] - r1·(f1²/f2)·(1/-F1)... 教材常用的是把实验数据整理成 y = r1·x - r2 的形式，以 x 为横坐标、y 为纵坐标作图，直线斜率为 r1、截距为 -r2。多做几组不同投料比的实验，取低转化率样品（保证 f 不变），就能定出两个竞聚率。\n实验要点有两个：一是必须在低转化率下取样，否则 f 已经漂移，算出来的不是瞬时组成；二是要用多种投料比，单点无法定两个未知数。这两点常被写成简答题的“实验设计”部分。"},{"h":"三、竞聚率：一个比值讲清两种单体的关系","t":"定义很朴素：r1 = k11/k12，即自由基 M1· 加到单体 M1 上与自己同类加成的速率，除以加到 M2 上交叉加成的速率。r1 大，说明 M1· 偏爱 M1；r1 小，说明它更愿意去接 M2。\n记住这个直觉：r 不是“活性”，而是“选择性”。两种单体都可能很活泼，但 r 描述的是相对偏好。所以考题常把 r 与 Q 值分开问。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"竞聚率的测定方法（简答）"},{"id":"gaohua04n08","label":"Q-e方程与单体活性顺序（简答、论述）","stars":4,"point":"Q 表共振稳定，e 表极性","imgs":["img/map/m070.jpg","img/map/m071.jpg"],"quiz":[{
