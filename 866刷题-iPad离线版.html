0 L、浓度 1.25 mol·L⁻¹ 的苯乙烯—四氢呋喃溶液，体系含水 1×10⁻⁴ mol·L⁻¹。要制备聚合度为 800 的聚苯乙烯标样，需加入浓度 0.4 mol·L⁻¹ 的萘钠多少毫升？","a":"DP＝已聚合单体摩尔数／引发剂摩尔数（1 分）；单体总量 10×1.25＝12.5 mol，DP＝800 → 需引发剂 12.5／800＝0.015625 mol（2 分）；扣杂质水 1×10⁻⁴×10＝1×10⁻³ mol（2 分）；萘钠总量 0.016625 mol，体积＝0.016625／0.4＝0.04156 L≈41.6 mL（3 分）；说明双阴离子时用量减半（2 分）。","stars":5,"sec":"计算（10 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高化06 离子型聚合·计算（10 分）·第 1 题"},{"id":"gaohua06-026","type":"essay","q":"从引发剂、单体要求、温度、终止与转移四个方面，对比自由基、阴离子、阳离子三种聚合，并各举一个工业品种。\n错题归因（做完自己填）","a":"引发剂：自由基用偶氮／过氧，阴离子用碱金属或烷基锂，阳离子用路易斯酸＋助催化剂；单体：自由基看双键，阴离子要能稳定碳负离子，阳离子要能稳定碳正离子；温度：常温中温／低温／极低温；终止：速终止／无终止／易转移；品种：PMMA、SBS、丁基橡胶（每行 2 分，品种 2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化06 离子型聚合·论述（12 分）·第 1 题"},{"id":"gaohua06-p001","type":"point","q":"离子聚合的三大特征（填空、简答）","a":"快引发、快增长、难终止（阴离子无终止）","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 1 条）"},{"id":"gaohua06-p002","type":"point","q":"阴离子的引发体系（反应式、选择）","a":"碱金属、有机锂、萘钠、格氏试剂","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 2 条）"},{"id":"gaohua06-p003","type":"point","q":"离子对形态与溶剂极性（简答、论述）","a":"极性越大越松散，活性越高、立构越差","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 3 条）"},{"id":"gaohua06-p004","type":"point","q":"活性阴离子的条件与计算（计算、简答）","a":"Xn = n[M]/n[I]，需绝对无杂质","stars":5,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 4 条）"},{"id":"gaohua06-p005","type":"point","q":"SBS 三嵌段与热塑性弹性体（简答、制备题）","a":"苯乙烯-丁二烯-苯乙烯，两端硬中间软","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 5 条）"},{"id":"gaohua06-p006","type":"point","q":"阳离子的引发与共引发剂（填空、简答）","a":"Lewis 酸需质子源或卤代烃","stars":4,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 6 条）"},{"id":"gaohua06-p007","type":"point","q":"阳离子向单体转移与丁基橡胶（填空、简答）","a":"异丁烯-异戊二烯，阳离子共聚","stars":4,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 7 条）"},{"id":"gaohua06-p008","type":"point","q":"温度对离子聚合的影响（简答）","a":"低温有利：抑制转移、提高立构","stars":3,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 8 条）"},{"id":"gaohua06-p009","type":"point","q":"开环聚合的热力学驱动力（填空、简答）","a":"环张力，三四元环最强","stars":4,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 9 条）"},{"id":"gaohua06-p010","type":"point","q":"开环聚合的类型与品种（选择、制备）","a":"己内酰胺、环氧乙烷、THF、ROMP","stars":3,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化06 离子型聚合·二、考点星级总表（第 10 条）"},{"id":"gaohua06-t011","type":"fill","q":"从链引发角度来看，活性阴离子聚合、阳离子聚合、自由基聚合的链引发反应特征分别为（　）、（　）、（　）；由于活性中心的结构不同，链终止反应分别表现为（　）、（　）、（　）。","a":"快引发、快引发、慢引发；无终止、难终止、速终止。给分点：六空各 0.5 分。注意阴离子的“无终止”是相对杂质而言，题目问的是特征，答“不终止”或“无终止”均可。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化06 离子型聚合·九、真题与期末题演练"},{"id":"gaohua06-t012","type":"fill","q":"丁基橡胶是由（　）和（　）两种单体经（　）离子共聚合制备的；二元乙丙橡胶是（　）和（　）两种单体经配位共聚合制备的，其中（　）单体活性高。","a":"异丁烯、异戊二烯、阳；乙烯、丙烯、乙烯。给分点：六空各 0.5 分。补充：从序列结构看两者均为无规共聚物。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高化06 离子型聚合·九、真题与期末题演练"},{"id":"gaohua06-t013","type":"fill","q":"从热力学角度看，三、四元环状单体聚合的主要推动力是（　）；环氧丙烷和环丙烷进行开环聚合，其中（　）只能得到低聚物。","a":"环张力（ΔH）；环氧丙烷。给分点：两空各 0.5 分。原因是环氧丙烷增长链易发生向单体或分子内转移，链难以长到高分子量。","stars":5,"sec":"八、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高化06 离子型聚合·九、真题与期末题演练"},{"id":"gaohua06-t014","type":"short","q":"写出萘钠引发丁二烯聚合的引发反应式。","a":"萘钠解离出 Na⁺ 与萘自由基负离子；萘自由基负离子把电子转移给丁二烯，生成丁二烯自由基负离子；两个自由基负离子偶合，形成两端带负电的双负离子，随后向两侧增长。给分点 3 分：电子转移 1 分、自由基负离子 1 分、偶合成双负离子 1 分。","stars":5,"sec":"八、真题与期末题演练","num":113,"ord":913,"src":"真题","from":"分章节复习资料·高化06 离子型聚合·九、真题与期末题演练"}],"reading":["一、本章坐标：从“自由基”换成“离子”，规则全变","自由基带一个未成对电子，行为对称；离子带整电荷，必须与抗衡离子共存，于是“离子对”成了本章的枢纽概念。引发剂、溶剂极性、温度，都是通过改变离子对的紧密程度来改变速率与立构规整性的。","表 1　离子型聚合与开环聚合考点与重要度","三、离子对：一个被忽略但决定一切的变量","离子聚合的活性中心不是一个自由的碳正离子或碳负离子，而是与抗衡离子（反离子）靠静电作用绑在一起的“离子对”。按结合紧密程度分三态：紧密离子对（两者紧贴，活性最低）、松散离子对（隔着一层溶剂化分子）、自由离子（完全解离，活性最高）。","溶剂极性是关键。介电常数大的溶剂（如四氢呋喃、二氯甲烷）能把离子对拉开，活性上升、聚合速率加快；但同时立构选择性下降，因为自由离子没有空间约束。所以工业上做高顺式聚丁二烯时反而用非极性溶剂（己烷），让离子对保持紧密，立构才规整。","这条规律在第 3 章也出现过：向自由基体系加四氢呋喃不提速，因为自由基不带电荷；向阴离子体系加四氢呋喃则明显提速。北化的期末题就是拿这一点做对比，考你是否理解“离子对”这个概念的存在。","图 1　抗衡离子与离子对的存在对链增长的影响：同时影响速率与立构（北化《高分子化学·重点内容》课件）","四、阴离子聚合：唯一能做“精确制造”的聚合","阴离子聚合的引发剂有四类：碱金属（Na、Li）直接给电子；有机锂（正丁基锂）直接加成；萘钠这类芳香族自由基负离子，先给电子生成自由基负离子，再偶合成双负离子；格氏试剂（RMgX）。其中萘钠引发丁二烯是经典反应式题：","萘钠 → Na⁺ + 萘⁻·；萘⁻· + CH₂=CH—CH=CH₂ → ·CH₂—CH=CH—CH₂⁻Na⁺ → 偶合为 Na⁺⁻CH₂—CH=CH—CH₂—CH₂—CH=CH—CH₂⁻Na⁺","图 2　萘钠引发三步完整反应式：①Na 与萘在 THF 中发生电子转移，生成萘自由基负离子 Na⁺；②自由基负离子把电子转给苯乙烯，生成单体自由基负离子；③两个自由基偶合，生成两端带负电的双阴离子（北化《高分子化学·重点内容》课件第 4.2.2.1 节）","图 3　阴离子加成引发反应式：以正丁基锂（n-BuLi）为例，CH₃CH₂CH₂CH₂⁻Li⁺ + H₂C=CH(Ph) → n-BuCH₂—CH⁻(Ph)Li⁺（electron addition）；正丁基锂是最常用的阴离子聚合引发剂，可溶于非极性溶剂。同页还列有机金属化合物 MtR、格氏试剂 RMgX、金属氨基化合物 MtNH₂、烷氧阴离子 RO⁻／PhO⁻（北化《高分子化学·重点内容》课件第 4.2.2.2 节）","这条式的要点是“电子转移 + 偶合”，产物是一个两端都带负电的双负离子，两个方向同时增长。答题时少写偶合这一步，就会丢掉一半分。","阴离子聚合的特征可以概括为四个字：快、长、不终止、窄。快引发——引发速率远大于增长速率，所有链几乎同时开始；长增长——链一边长一边等单体；不终止——没有自发终止，也没有 disproportionation，只有杂质或人为加水才终止；窄分布——因为同时开始、同时结束，分子量分布接近泊松分布，d 可小到 1.05。","正因为“不终止”，才叫活性聚合：聚合结束后再加新单体，链会继续长。用这个性质可以做嵌段共聚物（SBS）、端基官能化聚合物（遥爪聚合物）、以及分子量精确的标样。","聚合度的计算极简单，因为引发剂分子数等于链数：Xn = n(单体)/n(引发剂)。工业上做窄分布 PS 标样就用这个式子反算引发剂用量。注意若体系含微量杂质（如水、醇），会先消耗掉一部分引发剂，实际 Xn 偏大，所以计算题常给出“含水 1×10⁻⁴ mol/L”这样的条件让你扣除。","例题（北化期末原题）：一次性投料 10 L、浓度 1.25 mol/L 的苯乙烯-四氢呋喃溶液（含水 1×10⁻⁴ mol/L），要制备聚合度 800 的 PS，需加浓度 0.4 mol/L 的萘钠多少毫升？","解：所需引发剂物质的量 = 单体总量/DP = 1.25×10/800 = 0.03125 mol；杂质水消耗的引发剂为 1×10⁻⁴×10 = 0.001 mol；合计 0.03225 mol；体积 = 0.03225/0.4 = 0.0806 L，即 80.6 mL。给分点在“扣除杂质”这一步——不扣就少 3%。","图 4　活性阴离子聚合：无终止、无转移，聚合结束后加单体可继续增长（北化《高分子化学·重点内容》课件）","图 5　热塑性弹性体 SBS 的三嵌段结构与相分离示意（北化《高分子化学·重点内容》课件）","SBS 的做法就是活性聚合的直接应用：先加苯乙烯聚合，得到 PS 段；再加丁二烯，长成 PB 段；再加苯乙烯，长出第二个 PS 段。产物两端是硬段 PS（形成玻璃态微区，起物理交联作用），中间是软段 PB（高弹），常温下像橡胶、加热可塑化，所以叫热塑性弹性体。","五、阳离子聚合：一手好牌，打得很难","阳离子引发需要“双组分”：主引发剂是 Lewis 酸（BF₃、AlCl₃、SnCl₄、TiCl₄），共引发剂是质子源（水、醇、氯化氢）或卤代烃（RCl）。两者先反应生成质子或碳正离子，再引发单体。所以“痕量水”在阳离子体系里不是杂质而是必需品——北化期末题专门给出“AlCl₃ + 痕量水”这个条件。","阳离子引发的反应式（以 BF₃/H₂O 引发异丁烯为例）：BF₃ + H₂O ⇌ H⁺[BF₃OH]⁻（生成质子酸）；H⁺[BF₃OH]⁻ + CH₂=C(CH₃)₂ → (CH₃)₃C⁺[BF₃OH]⁻（质子加到含氢多的碳上，生成叔碳正离子，稳定性最好）；随后叔碳正离子反复插入异丁烯，每次插入都再生叔碳正离子。三氯化铝体系同理：AlCl₃ + H₂O ⇌ H⁺[AlCl₃OH]⁻。","阳离子增长极快，但终止与转移也极容易。最致命的是向单体转移：增长链的碳正离子从单体上夺取氢（或质子），自己变成稳定分子，同时把单体变成新的碳正离子。异丁烯聚合就是典型——转移极快，常温下几乎只能得到低分子量产物，所以工业上必须在 −100 ℃ 左右低温聚合，才能得到丁基橡胶用的高分子量聚异丁烯。","丁基橡胶由异丁烯与少量异戊二烯（约 2% 至 3%）经阳离子共聚而成，引入的异戊二烯单元提供双键供后续硫化。这个配方要能默写，填空题常考“两种单体 + 机理”。","阳离子聚合还有一个特点：链转移后活性中心不消失，所以“难终止、易转移”。这与阴离子的“不终止、不转移”正好相反。答题时把这两句并排写，对比分就稳了。","图 6　阳离子聚合的特征：快引发、快增长、难终止、易转移（北化《高分子化学·重点内容》课件）","表 2　三种连锁聚合的特征对比（简答必背）","六、离子共聚：与自由基共聚不是一套规则","离子共聚的组成方程形式上与自由基相同，但物理含义不同：离子聚合中单体的反应性主要由“能否稳定生成的碳正或碳负离子”决定，而不是 Q-e 所描述的共振与极性。所以不能拿 Q-e 直接预测离子共聚的竞聚率。","离子共聚的选择性更强：往往一种单体极易聚合，另一种几乎不参与，导致组成严重偏离投料比。工业上有意利用这一点，例如丁基橡胶就是让异丁烯大量聚合、异戊二烯只少量嵌入。","七、开环聚合：环张力驱动的连锁反应","开环聚合是把环状单体打开、连成线形链。它的热力学判据是 ΔG = ΔH − TΔS < 0。开环后熵是减少的（混乱度下降），所以必须靠焓变来驱动——也就是环张力。三、四元环的键角偏离正常值大、张力大，ΔH 负得足够多，聚合容易；五、六元环张力小，热力学上常常“聚合不了”，甚至平衡偏向单体。七元环以上又因构象不利而重新变得可聚合，这就是“环张力随环大小起伏”的规律。","北化的一道填空正是这个点：三、四元环状单体聚合的主要推动力是环张力（ΔH）；环氧丙烷与环丙烷相比，环丙烷的碳碳键极难打开，而环氧丙烷的碳氧键极性大、易被进攻，但受侧基甲基的位阻与转移影响，通常只能得到低聚物。","按活性中心分，开环聚合有阴离子开环（环氧乙烷、环氧丙烷，用 KOH 或醇钾引发）、阳离子开环（四氢呋喃、己内酰胺用酸引发）、配位开环（己内酰胺水解或碱催化开环得尼龙 6）、以及开环易位聚合（ROMP，用 Grubbs 催化剂把环烯打开）。","开环聚合的三条必备反应式：①阴离子开环（环氧乙烷）　RO⁻K⁺ + n CH₂—CH₂—O（环）→ RO(CH₂CH₂O)n⁻K⁺；②己内酰胺碱催化开环　n 己内酰胺 → —(NH(CH₂)₅CO)—n（开环后无小分子析出，与尼龙 66 的缩聚形成对照）；③阳离子开环（四氢呋喃）　THF + H⁺ → HO(CH₂)₄⁺，再逐个插入 THF 环。","尼龙 6 与尼龙 66 的差别就出在这里：尼龙 66 是己二胺与己二酸的缩聚，尼龙 6 是己内酰胺开环后聚合。同样是聚酰胺，反应类型不同，这正是绪论“判别三步法”的实战检验。","【真题 1】从链引发角度来看，活性阴离子聚合、阳离子聚合、自由基聚合的链引发反应特征分别为（　）、（　）、（　）；由于活性中心的结构不同，链终止反应分别表现为（　）、（　）、（　）。","【真题 2】丁基橡胶是由（　）和（　）两种单体经（　）离子共聚合制备的；二元乙丙橡胶是（　）和（　）两种单体经配位共聚合制备的，其中（　）单体活性高。","【真题 3】从热力学角度看，三、四元环状单体聚合的主要推动力是（　）；环氧丙烷和环丙烷进行开环聚合，其中（　）只能得到低聚物。","【真题 4】写出萘钠引发丁二烯聚合的引发反应式。","★★★　能默写萘钠引发丁二烯的三步反应式","★★★　能用 Xn = n(单体)/n(引发剂) 计算，并记得扣除杂质","★★★　能说出三种离子对的形态及其对速率与立构的影响","★★★　能对比自由基、阴离子、阳离子的引发与终止特征","★★　能解释阳离子聚合为什么必须低温","★★　能写出丁基橡胶与乙丙橡胶的单体与机理","★★　能用 ΔG = ΔH − TΔS 解释三四元环为何易开环","★　能区分尼龙 6 与尼龙 66 的反应类型"],"imp":4.0,"hot":8},{"id":"gaohua07","no":7,"name ":"B．单活性中心、分布窄","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":4,"ord":404,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·选择（每题 2 分，共 8 分）·第 4 题","options":["活性低","单活性中心、分布窄","必须高温","不能做共聚"],"key":"B"},{"id":"gaohua07-019","type":"short","q":"写出四氯化钛与三乙基铝反应的三步（烷基化、还原、生成活性中心）。","a":"TiCl₄＋Al(C₂H₅)₃ → C₂H₅TiCl₃＋Al(C₂H₅)₂Cl（烷基化）；C₂H₅TiCl₃ → TiCl₃＋C₂H₆（或 C₂H₄＋H·，还原）；TiCl₃ 聚集成晶、表面留空位（每步 2 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":1,"ord":501,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·反应式与制备（每题 5 分，共 20 分）·第 1 题"},{"id":"gaohua07-020","type":"short","q":"写出丙烯配位聚合生成等规聚丙烯的链增长示意（标出空位与插入方向）。","a":"烯烃配位到空位 → 四中心过渡态 → 烷基迁移、链增长一个单元、空位重现 → 顺式插入故构型保持（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·反应式与制备（每题 5 分，共 20 分）·第 2 题"},{"id":"gaohua07-021","type":"short","q":"写出乙烯与丙烯配位共聚得乙丙橡胶的式子。","a":"n CH₂=CH₂ ＋ m CH₂=CHCH₃ → —[(CH₂CH₂)x(CH₂CHCH₃)y]n—，无规共聚（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·反应式与制备（每题 5 分，共 20 分）·第 3 题"},{"id":"gaohua07-022","type":"short","q":"写出乙烯与少量辛烯共聚得 POE 的式子（说明辛烯的作用）。","a":"乙烯与少量 1—辛烯共聚，辛烯的丁基成为短支链，降低密度、提高韧性（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":4,"ord":504,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·反应式与制备（每题 5 分，共 20 分）·第 4 题"},{"id":"gaohua07-023","type":"short","q":"为什么 Z-N 催化剂必须由两组分组成？单用主催化剂或单用助催化剂会怎样？","a":"主催化剂提供过渡金属与空位，但不能自生金属—碳键；助催化剂提供烷基并完成还原（4 分）；单用主催化剂无活性中心，单用助催化剂无烯烃配位场所（4 分）。","stars":4,"sec":"简答（每题 8 分，共 16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·简答（每题 8 分，共 16 分）·第 1 题"},{"id":"gaohua07-024","type":"short","q":"解释：为什么丙烯自由基聚合只能得到低分子量支化产物？","a":"自由基夺取烯丙位氢，生成稳定的烯丙基自由基，链不增长（4 分）；结果是低分子量支化产物，称死端聚合（1 分）。","stars":4,"sec":"简答（每题 8 分，共 16 分）","num":2,"ord":602,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·简答（每题 8 分，共 16 分）·第 2 题"},{"id":"gaohua07-025","type":"calc","q":"现有三种聚乙烯：A 密度 0.96、支化极少、熔点 135 ℃；B 密度 0.92、长支化多、熔点 110 ℃；C 密度 0.92、短支化可控、熔点 125 ℃。判断各自的生产方法与典型用途。","a":"A：HDPE，配位或铬系，支化少、结晶度高，做管材、瓶盖（3 分）；B：LDPE，高压自由基法，长支化多，做薄膜（3 分）；C：LLDPE，配位法加共聚单体，短支化可控，做拉伸膜（2 分）。","stars":5,"sec":"计算与分析（10 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·计算与分析（10 分）·第 1 题"},{"id":"gaohua07-026","type":"essay","q":"从活性、等规指数、是否脱灰、能否做特殊结构四个方面，论述 Z-N 催化剂的四代演进，并说明每一代解决的工程问题。\n错题归因（做完自己填）","a":"第一代：活性低、需脱灰；第二代：加第三组分，活性提高；第三代：MgCl₂ 载体，活性提高几十倍、等规指数＞98%、免脱灰；第四代：茂金属，单活性中心、分布窄、可做间规 PP 与环烯烃共聚（每代 2 分，共 8 分）；工程意义：降成本、提纯度、扩品种（2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化07 配位聚合·论述（12 分）·第 1 题"},{"id":"gaohua07-p001","type":"point","q":"全同、间同、无规立构的定义（名词解释、选择）","a":"看主链两侧甲基的排列是否规律","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 1 条）"},{"id":"gaohua07-p002","type":"point","q":"立构规整度与等规指数（名词解释、简答）","a":"规整单元所占的分数","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 2 条）"},{"id":"gaohua07-p003","type":"point","q":"顺反异构（聚二烯）（选择、简答）","a":"双键两侧基团的相对位置","stars":3,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 3 条）"},{"id":"gaohua07-p004","type":"point","q":"Z-N 催化剂的两组分及作用（简答、填空）","a":"主催化剂 TiCl₃/TiCl₄，助催化剂 AlEt₃","stars":5,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 4 条）"},{"id":"gaohua07-p005","type":"point","q":"三代 Z-N 催化剂的演进（简答）","a":"两组分、三组分、载体型、茂金属","stars":3,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 5 条）"},{"id":"gaohua07-p006","type":"point","q":"配位聚合与定向聚合的区别（名词解释、简答）","a":"配位指机理，定向指结果","stars":4,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 6 条）"},{"id":"gaohua07-p007","type":"point","q":"丙烯不能用自由基聚合的原因（简答）","a":"烯丙基氢易被夺，生成稳定自由基","stars":4,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 7 条）"},{"id":"gaohua07-p008","type":"point","q":"插入机理（空位与四中心过渡态）（简答、论述）","a":"Cossee-Arlman 机理","stars":3,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 8 条）"},{"id":"gaohua07-p009","type":"point","q":"茂金属催化剂的特点（简答）","a":"单活性中心、窄分布、立构可调","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 9 条）"},{"id":"gaohua07-p010","type":"point","q":"主要工业品种（填空、选择）","a":"HDPE、等规 PP、乙丙橡胶、顺丁","stars":2,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化07 配位聚合·二、考点星级总表（第 10 条）"},{"id":"gaohua07-t011","type":"fill","q":"丙烯不能进行自由基聚合的主要原因是（　）；配位聚合可以制备（　）和（　）两种立构规整聚丙烯；在提高配位聚合催化剂催化效率和定向能力的发展中，催化剂可分为（　）、（　）、（　）和茂金属催化剂等几种类型。","a":"自阻聚，即极易向单体转移、生成低活性的烯丙基自由基；全同立构、间同立构；两组分 Z-N 催化剂、三组分 Z-N 催化剂、载体型 Z-N 催化剂。给分点：六空各 0.5 分。答“不能生成稳定自由基”“易发生链转移”也可给分，但要点出烯丙基氢。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化07 配位聚合·九、真题与期末题演练"},{"id":"gaohua07-t012","type":"short","q":"为什么 Ziegler-Natta 催化剂必须由主催化剂与助催化剂等多个组分构成？各组分的功能是什么？","a":"主催化剂（TiCl₄ 或 TiCl₃）本身不能引发聚合，需要助催化剂（AlEt₃ 等烷基铝）先把 Ti 烷基化，再经还原生成低价态、表面带空位的活性中心；空位是烯烃配位的入口，故缺一不可。第三组分（给电子体）的作用是占据催化剂表面的非选择性位点、提高等规指数；载体（MgCl₂）的作用是使 TiCl₄ 高度分散、增大比表面积，从而大幅提高活性。答题要点：烷基化、还原、空位、给电子体的选择性、载体的分散作用，五点齐全为满分。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高化07 配位聚合·九、真题与期末题演练"}],"reading":["一、本章坐标：链长成什么形状，由催化剂说了算","前六章解决的是“链有多长”，本章解决“链长成什么形状”。同样是聚丙烯，无规立构的是不能做塑料的橡胶状物，等规立构的却是能做汽车保险杠的工程塑料。差别不在分子量，而在甲基在链上的排列方式。","表 1　配位聚合考点与重要度","三、立构：三种排列，三种材料","把聚乙烯的氢换成甲基，就得到聚丙烯。甲基在链上的排列方式有三种：全部排在主链平面同一侧，叫全同立构（等规）；交替排在两侧，叫间同立构；随机排布，叫无规立构。前两种是立构规整的，能结晶；第三种不能结晶，是橡胶状的无定形物。","衡量规整程度用立构规整度（等规指数），即规整单元占总单元的分数。工业等规 PP 的等规指数通常在 95% 以上，剩下 5% 的无规部分会影响透明性与韧性。这个数字要能说出来，简答题里常要求“说明等规指数对性能的影响”。","聚二烯还有一套异构：双键上的基团在同侧为顺式，在两侧为反式。顺式 1,4-聚丁二烯链规整、可结晶，是优良的轮胎胶；反式 1,4-聚异戊二烯就是天然橡胶的主要成分。注意区分“立构”与“顺反”——前者讲手性碳的构型，后者讲双键的几何。","图 1　配位聚合与定向聚合：立构规整性的来源（北化《高分子化学·重点内容》课件）","四、Ziegler-Natta 催化剂：两组分，各有分工","经典 Z-N 催化剂由两部分组成：主催化剂是第 IV 至 VI 族过渡金属化合物，工业上常用 TiCl₄ 或 TiCl₃；助催化剂是第 I 至 III 族金属的烷基化合物，常用三乙基铝 Al(C₂H₅)₃。两者一接触就生成具有空位的活性中心。","图 2　第一代 Ziegler-Natta 催化剂的组成式（课件通式）：主催化剂 Mt(IV–VIII)X（Mt 为 Ti、V、Cr、Mo、Co、Ni，X 为 Cl、Br、I；α-烯烃、环烯烃、二烯烃分别对应不同金属）+ 共催化剂 Mt(I–III)R（Mt 为 Li、Mg、Zn、Al，R 为 CH₃ 至 C₁₁H₂₃，应用最多的是 AlXₙR(3−n)）（北化《高分子化学·重点内容》课件第 5.3.1 节）","催化剂配制的反应式要能写出：TiCl₄ + Al(C₂H₅)₃ → C₂H₅TiCl₃ + Al(C₂H₅)₂Cl（烷基化）；随后 C₂H₅TiCl₃ → TiCl₃ + C₂H₅·（还原，生成低价态 Ti³⁺）；活性中心可写作 [TiCl₃⁺]—C₂H₅，其上的空位是烯烃配位的入口。","为什么必须两种组分？因为单靠 TiCl₄ 没有活性：它需要烷基铝把 Ti 烷基化，再经过还原，生成低价态（Ti³⁺ 或 Ti²⁺）且带空位的表面中心。空位是烯烃配位的入口，没有空位就没有配位聚合。这一条是“为什么催化剂要由多个组分组成”这类题的标准答案。","催化剂有三代演进：第一代是 TiCl₃–AlEt₃ 两组分，活性低、需脱灰；第二代加入第三组分（如醚、酯）提高立构选择性；第三代是载体型，把 TiCl₄ 负载在 MgCl₂ 上，活性提高几十倍，等规指数可达 98%，且可省去脱灰工序。第四代是茂金属与后过渡金属催化剂，属于“单活性中心”，每个中心结构相同，因此分子量分布极窄、立构可精确设计。","图 3　Ziegler-Natta 催化剂的组分与活性中心的形成（北化《高分子化学·重点内容》课件）","五、丙烯为什么不能自由基聚合","这是本章最常被问的一道“为什么”。丙烯的α-碳上有一个烯丙基氢，自由基极易夺取这个氢发生链转移，生成一个烯丙基自由基——它与双键共轭、非常稳定，几乎不再引发新链。结果是引发剂被白白消耗、链长不起来，甚至完全不聚。这就是“自阻聚”作用。","所以工业上做聚丙烯只能用配位聚合：催化剂把丙烯配位在金属空位上，插入时不会发生夺氢，链得以稳定增长。同理，异丁烯也只能阳离子聚合，因为它的叔碳自由基同样容易发生歧化终止。","这条规律可以总结成一句口诀：α-烯烃有烯丙基氢，自由基走不通，必须配位；异丁烯有叔氢，自由基也走不通，必须阳离子。","图 4　乙丙橡胶的配位共聚：乙烯与丙烯无规共聚，不能结晶故为弹性体（北化《高分子化学·重点内容》课件）","六、插入机理：空位、四中心、构型保持","Cossee-Arlman 机理把增长写成三步：①烯烃的双键与过渡金属的空位配位，形成π络合物；②在四中心过渡态中，烯烃的π键打开，与金属—碳键、空位同时作用，碳原子转移到链端；③金属上重新出现空位，等待下一个单体。","立构规整性从何而来？因为空位在催化剂表面的位置是固定的，每次插入后链的构型被“锁”在同一侧，于是得到全同；如果催化剂结构让空位交替出现在两侧，就得到间同。所以立构不是靠温度或溶剂，而是靠催化剂的空间结构——这也是“定向聚合”一词的来源。","两个概念要分清：配位聚合指“单体先与过渡金属配位再插入”这一机理；定向聚合指“产物立构规整”这一结果。配位聚合通常能定向，但定向聚合不一定都靠配位（例如某些自由基体系在低温下也有一定立构选择性）。答题时把这两句并排写，名词解释就满分了。","七、工业品种：催化剂一换，产品就换","表 3　配位聚合的主要工业品种","注意乙丙橡胶为什么是橡胶：乙烯与丙烯无规共聚后，链上不再有规整的重复序列，无法结晶，Tg 又低，所以常温下高弹。这与第 5 章的“共聚改结构”是同一思路，只是换了催化剂。","【真题 1】丙烯不能进行自由基聚合的主要原因是（　）；配位聚合可以制备（　）和（　）两种立构规整聚丙烯；在提高配位聚合催化剂催化效率和定向能力的发展中，催化剂可分为（　）、（　）、（　）和茂金属催化剂等几种类型。","【真题 2】为什么 Ziegler-Natta 催化剂必须由主催化剂与助催化剂等多个组分构成？各组分的功能是什么？","★★★　能用文字或简图说明全同、间同、无规的区别","★★★　能说出 Z-N 催化剂两组分的名称、作用与活性中心形成过程","★★★　能解释丙烯为什么不能自由基聚合，并给出正确替代路线","★★★　能区分配位聚合与定向聚合两个概念","★★　能说出三代催化剂的主要差别与等规指数范围","★★　能说明乙丙橡胶为什么是弹性体","★★　能区分立构异构与顺反异构","★　能举出四个配位聚合的工业品种"],"imp":3.6,"hot":5},{"id":"gaohua08","no":8,"name":"高化08 聚合物的化学反应","title":"聚合物的化学反应","cards":[{"id":"gaohua08-001","type":"tf","q":"聚乙烯醇可由乙烯醇单体聚合得到。","a":"错（1 分）。乙烯醇立即互变异构为乙醛，只能由 PVAc 醇解制得（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·判断并说明理 19","type":"short","q":"从单体写起，写出维尼纶的三步反应式（聚合、醇解、缩醛化），标出条件。","a":"n CH₂=CH(OCOCH₃) → PVAc（自由基聚合）；PVAc＋CH₃OH —NaOH→ PVA＋CH₃COOCH₃（醇解）；PVA＋HCHO —H⁺→ 聚乙烯醇缩甲醛（缩醛化）（每步 2 分，条件 2 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":1,"ord":501,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·反应式与制备（每题 5 分，共 20 分）·第 1 题"},{"id":"gaohua08-020","type":"short","q":"写出苯乙烯与二乙烯苯悬浮共聚得白球，再磺化得阳离子树脂的两步式。","a":"苯乙烯＋二乙烯苯 —BPO、悬浮→ 白球；白球＋H₂SO₄（或氯磺酸）→ 磺化阳离子树脂（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·反应式与制备（每题 5 分，共 20 分）·第 2 题"},{"id":"gaohua08-021","type":"short","q":"写出氯甲基化后胺化得阴离子树脂的两步式。","a":"白球＋氯甲醚 —ZnCl₂→ 氯甲基化；再＋三甲胺 → 季铵型阴离子树脂（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·反应式与制备（每题 5 分，共 20 分）·第 3 题"},{"id":"gaohua08-022","type":"short","q":"写出聚乙烯过氧化物交联的机理（三步）。","a":"DCP 受热分解生成自由基；夺聚乙烯链上的氢生成链自由基；两个链自由基偶合形成碳碳交联键（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":4,"ord":504,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·反应式与制备（每题 5 分，共 20 分）·第 4 题"},{"id":"gaohua08-023","type":"short","q":"影响聚合物化学反应性的物理因素有哪四点？各举一例说明。","a":"溶解度：聚合物难溶，反应只在表面（2 分）；结晶度：晶区反应慢（2 分）；交联度：交联高则试剂难进入（2 分）；位阻与几率效应：邻位基团影响下一个基团（2 分）。","stars":4,"sec":"简答（每题 8 分，共 16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·简答（每题 8 分，共 16 分）·第 1 题"},{"id":"gaohua08-024","type":"short","q":"硫化的作用是什么？为什么硫黄用量决定软硬？","a":"硫化把线形链连成网络，消除分子间滑移、赋予高弹性并提高强度（3 分）；硫用量少则交联密度低、软，多则硬（2 分）。","stars":4,"sec":"简答（每题 8 分，共 16 分）","num":2,"ord":602,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·简答（每题 8 分，共 16 分）·第 2 题"},{"id":"gaohua08-025","type":"calc","q":"某 PVA 样品醇解度为 88%，牌号标为 1788。（1）说明两个数字的含义；（2）若把醇解度提高到 99%，溶解性与耐水性如何变化？（3）为什么缩醛度做不到 100%？","a":"（1）17 为聚合度千位数（约 1700），88 为醇解度 88%（3 分）；（2）醇解度升高，羟基增多、氢键增强，水溶性下降、耐水性提高（3 分）；（3）缩醛化成环后邻位羟基活性下降，且存在几率效应，故缩醛度有上限（2 分）。","stars":5,"sec":"计算与分析（10 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·计算与分析（10 分）·第 1 题"},{"id":"gaohua08-026","type":"essay","q":"从乙烯出发，设计一条到维尼纶纤维的完整工艺链，说明每一步的反应类型、聚合度是否变化、为什么必须这样走。\n错题归因（做完自己填）","a":"①乙烯→醋酸乙烯酯（加成）；②VAc 自由基聚合得 PVAc（聚合度建立）；③醇解得 PVA（聚合度不变，侧基取代）；④缩醛化得聚乙烯醇缩甲醛（聚合度不变，环化）；⑤纺丝得维尼纶。必须这样走的原因：乙烯醇不能聚合，只能经 PVAc 迂回；缩醛化提高耐热水性与强度（每步 1.5 分，原因 2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化08 聚合物的化学反应·论述（12 分）·第 1 题"},{"id":"gaohua08-p001","type":"point","q":"影响反应性的物理与化学因素（简答、论述）","a":"两大因素，四个物理项，两个化学效应","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 1 条）"},{"id":"gaohua08-p002","type":"point","q":"几率效应与邻位基团效应（名词解释、简答）","a":"转化率上限约 86.5%","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 2 条）"},{"id":"gaohua08-p003","type":"point","q":"反应类型的三分法（选择、简答）","a":"聚合度不变、增大、减小","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 3 条）"},{"id":"gaohua08-p004","type":"point","q":"PVA 与维尼纶的合成（反应式、简答）","a":"先聚醋酸乙烯酯，再醇解、缩醛化","stars":5,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 4 条）"},{"id":"gaohua08-p005","type":"point","q":"离子交换树脂（简答、选择）","a":"交联度决定交换容量与溶胀","stars":3,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 5 条）"},{"id":"gaohua08-p006","type":"point","q":"橡胶硫化与聚乙烯交联（填空、简答）","a":"硫黄硫化、过氧化物交联、辐射交联","stars":4,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 6 条）"},{"id":"gaohua08-p007","type":"point","q":"热降解的三种方式（填空、简答）","a":"解聚、无规断链、侧基脱除","stars":5,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 7 条）"},{"id":"gaohua08-p008","type":"point","q":"老化与稳定化（简答）","a":"氧、光、热是主要外因","stars":3,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 8 条）"},{"id":"gaohua08-p009","type":"point","q":"接枝与嵌段共聚（简答、制备）","a":"先聚后接或先接后聚","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 9 条）"},{"id":"gaohua08-p010","type":"point","q":"功能高分子与回收（论述铺垫）","a":"高分子的“第二生命”","stars":2,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化08 聚合物的化学反应·二、考点星级总表（第 10 条）"},{"id":"gaohua08-t011","type":"fill","q":"聚甲基丙烯酸甲酯、聚乙烯、聚氯乙烯热降解的方式主要是（　）、（　）、（　）；丁苯橡胶采用（　）交联，聚乙烯采用（　）交联。","a":"解聚、无规断链、取代基脱除；硫化、过氧化物。给分点：五空各 0.5 分。判断依据是链自由基的稳定性与侧基是否存在：PMMA 有两个α-取代基、链自由基稳定故解聚；PE 无侧基故无规断链；PVC 有氯侧基故脱 HCl。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化08 聚合物的化学反应·九、真题与期末题演练"},{"id":"gaohua08-t012","type":"short","q":"与小分子化学反应相比，写出四点影响聚合物化学反应的主要因素。","a":"①物理因素中的溶解度：聚合物溶解性下降时，试剂难以进入链间，反应活性下降；②结晶性：结晶度越高，链段被固定，反应只能在晶区外或表面进行；③交联度：交联度越高，只能溶胀不能溶解，反应深度受限；④空间位阻：大体积试剂难以靠近官能团；⑤化学因素中的邻位基团效应：相邻基团已反应会改变邻近基团的活性；⑥几率效应：相邻基团需成对参与时，孤立基团无法反应，转化率有上限（约 86.5%）。答出四点即可，每点 1 分。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高化08 聚合物的化学反应·九、真题与期末题演练"},{"id":"gaohua08-t013","type":"short","q":"简述几率效应的含义。","a":"在由相邻官能团参与的无规、不可逆反应中，由于反应的随机性，总有一部分官能团的邻位基团已被反应或无法配对，使这些基团不能参与反应，因而转化率存在上限（教材给出的上限约为 86.5%）。它不是化学活性不足，而是统计几何约束造成的。给分点：无规不可逆 1 分，孤立基团不能配对 1 分，转化率上限 1 分。","stars":5,"sec":"八、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高化08 聚合物的化学反应·九、真题与期末题演练"}],"reading":["高化08　聚合物的化学反应","一、本章坐标：同一条链，为什么小分子能反应它却不能","第 3 章里自由基可以随便撞，本章里同样的官能团却“藏着不肯反应”。原因只有一个：聚合物是大分子，它的官能团被人链裹住、被结晶挡住、被交联锁死。所以本章的第一句话就是——聚合物的反应性，一半由官能团决定，一半由链的堆砌方式决定。","表 1　聚合物化学反应考点与重要度","三、反应性：先把“为什么慢”讲清楚","物理因素有四条。①溶解性：反应多在溶液或溶胀态进行，聚合物不溶就只能表面反应，转化率上不去。②结晶性：晶区里分子排列紧密、链段不能动，试剂进不去，所以结晶度高的聚合物反应慢且不均一。③交联度：交联把链锁成网络，只能溶胀不能溶解，反应深度受限。④空间位阻与相态：大体积试剂进不去，非均相体系反应更慢。","化学因素有两条，是名词解释的高频点。①邻位基团效应：相邻官能团已经反应后，会改变邻近基团的电子环境或空间环境，使其活性上升或下降；典型例子是聚甲基丙烯酸甲酯水解时，已水解的羧基会促进邻近酯基水解（协同效应）。②几率效应：在无规、不可逆的反应中，当相邻基团必须成对参与时，总有一些孤立基团找不到配对对象，于是转化率存在上限。教材给出的上限约 86.5%，这是统计规律，不是化学限制。","把这两条合起来看：邻位基团效应改变“反应快慢”，几率效应决定“能不能反应完”。答题时分别举例，不要混在一起。","图 1　影响聚合物化学反应性的因素：物理因素与化学因素（北化《高分子化学·重点内容》课件）","四、反应类型：聚合度变不变？","这个三分法是答题的骨架：题目问“维尼纶的制备属于哪类反应”，先答“聚合度基本不变的侧基反应”，再写反应式，评卷一眼就看到结构。","五、PVA 与维尼纶：一条不能走直线的合成路线","聚乙烯醇不能由乙烯醇单体聚合得到，因为乙烯醇会立刻互变异构为乙醛。工业路线是：先由醋酸乙烯酯自由基聚合得到聚醋酸乙烯酯（PVAc），再用甲醇或碱催化醇解（酯交换），把乙酰基换成羟基，得到 PVA。","第一步： n CH₂=CH—OCOCH₃ → —(CH₂—CH(OCOCH₃))—n","第二步（醇解）： —(CH₂—CH(OCOCH₃))—n + n CH₃OH → —(CH₂—CH(OH))—n + n CH₃COOCH₃","第三步（缩醛化）： PVA 与甲醛在酸催化下，相邻两个羟基成环缩醛，得到聚乙烯醇缩甲醛，即维尼纶。","为什么要缩醛化？因为纯 PVA 溶于水，不能做纤维。把部分羟基缩醛化后，亲水性下降、耐热水性提高，才能纺丝做维尼纶。这一步也解释了本章的核心命题：同一官能团，反应程度不同，性能天差地别。","图 2　PVA 的两步反应式（课件原式）：①n CH₂=CH—OCOCH₃ 经 BPO 引发溶液聚合得 PVAc；②PVAc 在 CH₃OH／NaOH 中醇解（酯交换）得 PVA；牌号「1788」「1799」即醇解度 88%、99% 的两个常用品级（北化《高分子化学·重点内容》课件第 9.2 节）","图 3　橡胶硫化的定义与要点（课件 9.3 交联反应）：硫化是把塑性高分子材料转变为弹性橡胶的过程；适用含双键橡胶（天然、顺丁、三元乙丙、丁苯、丁腈、丁基）；目的是消除分子间滑动造成的永久变形、显示高弹性；交联剂为硫黄或含硫化合物（北化《高分子化学·重点内容》课件第 9.3 节）","交联属于“聚合度增大”的反应。最常见的三个例子：橡胶的硫黄硫化（硫桥把两条链连起来，用量通常 1% 至 3%）；聚乙烯的过氧化物交联（用 DCP 分解产生的自由基夺氢，两个链自由基偶合）；以及辐射交联（高能射线直接产生链自由基）。","三种交联的反应式（按机理写，别只写过程）：①硫黄硫化　~CH₂—C(CH₃)=CH—CH₂~ + S₈ → ~CH₂—C(CH₃)—CH(Sₓ)—CH₂~（在双键的烯丙位生成多硫交联键）；②过氧化物交联　DCP → 2 RO·；~CH₂~ + RO· → ~CH·~ + ROH；2 ~CH·~ → ~CH—CH~（两条链自由基偶合，形成 C—C 交联）；③辐射交联　~CH₂~ →（高能射线）~CH·~ + H·，再按②的方式偶合。","交联度的控制极其关键。橡胶交联不足则强度低、永久变形大；交联过度则变硬变脆、失去弹性。聚乙烯电缆料交联后耐热性与耐环境应力开裂性显著提高，这就是交联聚乙烯（XLPE）能用于高压电缆的原因。","离子交换树脂则是“交联 + 官能团”的组合产品：苯乙烯与二乙烯基苯共聚得到交联网络（白球），再磺化得阳离子树脂，或氯甲基化后胺化得阴离子树脂。交联度决定树脂的溶胀程度与交换容量——交联度高则不易溶胀、容量大但交换速度慢。","图 4　离子交换树脂的合成反应式：苯乙烯 + 二乙烯苯经 BPO 引发悬浮聚合，得体形共聚物小球母体（白球）；再经磺化反应或氯甲基化反应——两者都是苯环上的取代反应——得到离子交换树脂（北化《高分子化学·重点内容》课件第 9.2 节）","七、降解：三种方式，三种结局","热降解是本章最常考的知识点，教材按机理分三类：","①解聚（depolymerization）：链端自由基逐个脱去单体，几乎全部变回单体。典型是聚甲基丙烯酸甲酯（PMMA），因为它有两个α-取代基，链自由基稳定、不易发生链转移，解聚成为主路径。所以 PMMA 可以热解回收单体。","②无规断链：链在随机位置断裂，产物是大小不一的片段，单体回收率很低。典型是聚乙烯，因为主链上没有易脱除的侧基，链自由基会随机夺氢断链。","③侧基脱除（取代基消除）：不先断主链，而是先脱去侧基并形成共轭双键。典型是聚氯乙烯，加热到 100 ℃ 以上就脱 HCl，主链逐步变成共轭多烯，颜色由白变黄变黑。这也是 PVC 加工必须加稳定剂的原因。","图 5　降解的三种方式与典型聚合物：解聚、无规断链、侧基脱除（北化《高分子化学·重点内容》课件）","除热降解外还有氧化降解（氧气与光共同作用，是户外老化的主因）、光降解（紫外光激发产生自由基）、水解降解（酯键、酰胺键遇水断裂，是可降解塑料的设计基础）与生物降解。答题时把“外因—机理—后果—对策”四段写全，比只列名词得分高。","【真题 1】聚甲基丙烯酸甲酯、聚乙烯、聚氯乙烯热降解的方式主要是（　）、（　）、（　）；丁苯橡胶采用（　）交联，聚乙烯采用（　）交联。","【真题 2】与小分子化学反应相比，写出四点影响聚合物化学反应的主要因素。","【真题 3】简述几率效应的含义。","★★★　能默写 PVA 与维尼纶的三步反应式，并说明为何不能由乙烯醇直接聚合","★★★　能说出影响反应性的四个物理因素与两个化学效应，并各举一例","★★★　能判断 PMMA、PE、PVC 的热降解方式并说明原因","★★★　能区分聚合度不变、增大、减小三类反应并举例","★★　能解释几率效应为什么给出 86.5% 这个上限","★★　能说明硫化与过氧化物交联的机理差别","★★　能解释离子交换树脂交联度与交换容量的关系","★　知道老化与稳定化的基本对策"],"imp":3.8,"hot":6}]},{"id":"gaowu","name":"高分子物理","short":"高物","color":"#1D4ED8","chapters":[{"id":"gaowu01","no":1,"name":"高物01 高分子链结构","title":"高分子链结构","cards":[{"id":"gaowu01-001","type":"tf","q":"构型可以通过单键内旋转改变，构象不能。","a":"错（2 分）。说反了：构型需断键才能改变，构象靠单键内旋转即可改变。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"错"},{"id":"gaowu01-002","type":"tf","q":"支化使高分子链的堆砌密度下降，因此 Tg 降低、结晶度降低。","a":"对（2 分）。支化破坏链的规整堆砌，自由体积增大、结晶受阻，故 Tg 与结晶度都下降。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"对"},{"id":"gaowu01-003","type":"tf","q":"链段是高分子链上能独立运动的最小单元，其长度随温度升高而变长。","a":"错（2 分）。链段长度由链的柔顺性决定，与温度无关；温度改变的是整链运动能力。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":3,"ord":103,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·判断并说明理由（每题 2 分，共 10 分）·第 3 题","verdict":"错"},{"id":"gaowu01-004","type":"tf","q":"无扰尺寸是θ条件下测得的，因此它随溶剂种类而变。","a":"错（2 分）。无扰尺寸在θ条件下消除排除体积效应，其值只由链结构决定，与溶剂种类无关。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":4,"ord":104,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·判断并说明理由（每题 2 分，共 10 分）·第 4 题","verdict":"错"},{"id":"gaowu01-005","type":"tf","q":"液晶态是兼具液体流动性与晶体各向异性的中间态。","a":"对（2 分）。液晶兼具流动性（液态）与各向异性（晶态）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":5,"ord":105,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·判断并说明理由（每题 2 分，共 10 分）·第 5 题","verdict":"对"},{"id":"gaowu01-006","type":"term","q":"构型与构象（各一句，写出改变方式与检测手段）。","a":"构型：取代基在链上的空间排列，需断键改变，用 NMR、X 射线判断（2 分）；构象：单键内旋转形成的空间形态，不断键即可改变，用红外、旋光等（2 分）。","stars":4,"sec":"概念解释（每题 4 分，共 12 分）","num":1,"ord":201,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·概念解释（每题 4 分，共 12 分）·第 1 题"},{"id":"gaowu01-007","type":"term","q":"链段（说明它与分子量的关系）。","a":"链上能独立运动的最小单元（2 分）；与分子量无关，只与柔顺性有关，分子量大到一定程度后链段长度不变（2 分）。","stars":4,"sec":"概念解释（每题 4 分，共 12 分）","num":2,"ord":202,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·概念解释 的是","a":"C．X 射线衍射","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":2,"ord":402,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·选择（每题 2 分，共 8 分）·第 2 题","options":["红外","核磁","X 射线衍射","旋光"],"key":"C"},{"id":"gaowu01-018","type":"mcq","q":"高分子链的柔顺性最好的是","a":"B．聚二甲基硅氧烷","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":3,"ord":403,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·选择（每题 2 分，共 8 分）·第 3 题","options":["聚乙烯","聚二甲基硅氧烷","聚苯乙烯","聚酰亚胺"],"key":"B"},{"id":"gaowu01-019","type":"mcq","q":"主链含芳杂环会使得","a":"C．耐热性提高","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":4,"ord":404,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·选择（每题 2 分，共 8 分）·第 4 题","options":["Tg 降低","柔顺性提高","耐热性提高","结晶度提高"],"key":"C"},{"id":"gaowu01-020","type":"short","q":"解释实验事实：同样分子量的聚乙烯与聚苯乙烯，聚乙烯室温下柔软而聚苯乙烯硬而脆。请从链结构说到宏观性能。","a":"PE：主链为 C—C 单键，无侧基、位阻小、柔顺性好，链易折叠结晶、模量低而柔（4 分）；PS：侧基苯环体积大、位阻大，链刚性大、不易结晶、室温下呈玻璃态硬而脆（4 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":1,"ord":501,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·简答（每题 8 分，共 24 分）·第 1 题"},{"id":"gaowu01-021","type":"short","q":"画出聚乙烯的平面锯齿构象与等规聚丙烯的三七螺旋构象，并说明为什么后者要螺旋。","a":"PE 画平面锯齿（全反式）；PP 画三七螺旋（每 3 个单元转 1 圈、上升 7 个单元高度）（4 分）；原因是甲基体积大，平面锯齿会使甲基重叠，螺旋可使甲基错开、能量最低（4 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·简答（每题 8 分，共 24 分）·第 2 题"},{"id":"gaowu01-022","type":"short","q":"为什么说“分子量相同、支化不同，性能可以差很多”？举两个性能差异。","a":"支化降低结晶度、降低密度与刚性；支化提高熔体流动性、便于加工（每点 4 分，需举出 PE 的 LDPE／HDPE 对比）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·简答（每题 8 分，共 24 分）·第 3 题"},{"id":"gaowu01-023","type":"calc","q":"某聚合物主链有 1000 个键，键长 0.154 nm，实测均方末端距为 189.6 nm²。（1）求自由旋转链的均方末端距；（2）求刚性因子 σ；（3）说明 σ 反映什么。","a":"＜h²＞f＝2nl²＝2×1000×(0.154 nm)²＝47.4 nm²（4 分）；σ＝(189.6／47.4)^0.5＝2.0（4 分）；σ 反映实际链相对自由旋转链的刚性程度，越大越刚性（2 分）。","stars":5,"sec":"计算（16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·计算（16 分）·第 1 题"},{"id":"gaowu01-024","type":"essay","q":"从“化学结构—构型—构象—链段—聚集态”这条链，论述为什么结构微小的差别会造成性能的巨大差别，并举两个例子（PE 与 PS、等规与无规 PP）。\n错题归因（做完自己填）","a":"化学结构决定可旋转键与位阻；构型决定链能否规整堆砌；构象决定链尺寸与柔顺性；链段决定运动单元；聚集态决定最终性能（每层 2 分）；PE 无侧基、可结晶、柔而韧；PS 侧基大、玻璃态、硬而脆；等规 PP 可结晶、强度高，无规 PP 无定形、软（每例 2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高物01 高分子链结构·论述（12 分）·第 1 题"},{"id":"gaowu01-p001","type":"point","q":"高分子的结构层次（近程与远程）（简答、名词解释）","a":"近程看化学连接，远程看空间构象","stars":4,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 1 条）"},{"id":"gaowu01-p002","type":"point","q":"构型与构象的区别（名词解释、选择）","a":"构型需断键才能变，构象靠单键旋转","stars":5,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 2 条）"},{"id":"gaowu01-p003","type":"point","q":"键长、键角与内旋转（简答）","a":"键长键角固定，内旋转决定柔性","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 3 条）"},{"id":"gaowu01-p004","type":"point","q":"链段与等效自由连接链（名词解释、计算）","a":"把真实链折算成 n 个长度为 l 的链段","stars":4,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 4 条）"},{"id":"gaowu01-p005","type":"point","q":"均方末端距与均方回转半径（计算、简答）","a":"自由连接链 nl 平方；自由旋转链约 2nl 平方","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 5 条）"},{"id":"gaowu01-p006","type":"point","q":"刚性因子与特征比（选择、简答）","a":"实测值与自由旋转值之比，越大越刚","stars":3,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 6 条）"},{"id":"gaowu01-p007","type":"point","q":"影响链柔性的因素（简答、论述）","a":"主链结构、侧基、分子间力、温度","stars":4,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 7 条）"},{"id":"gaowu01-p008","type":"point","q":"支化与交联对性能的影响（简答、选择）","a":"支化降 Tg 与密度，交联提 Tg 与强度","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 8 条）"},{"id":"gaowu01-p009","type":"point","q":"共聚物的序列结构（选择、简答）","a":"无规、交替、嵌段、接枝","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 9 条）"},{"id":"gaowu01-p010","type":"point","q":"典型链构象（填空、选择）","a":"溶液无规线团，晶区平面锯齿或螺旋","stars":4,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高物01 高分子链结构·二、考点星级总表（第 10 条）"},{"id":"gaowu01-t012","type":"short","q":"下列聚合物中刚性因子最大的是：A 聚乙烯　B 聚丙烯腈　C 聚氯乙烯　D 聚丙烯","a":"答 B。刚性因子反映实测无扰尺寸相对自由旋转链的增大倍数。聚丙烯腈的侧基是强极性的腈基，链间偶极作用强、内旋转位垒大，故最大；PE 主链最柔顺，最小；PVC 与 PP 居中。给分点：选对 2 分。","stars":5,"sec":"七、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高物01 高分子链结构·九、真题与期末题演练"},{"id":"gaowu01-t013","type":"short","q":"沿 C 轴拉伸，PE 的模量比等规 PP 的模量高 7 倍，解释原因。","a":"沿 C 轴方向，PE 的分子链为平面锯齿构象，链的伸展靠键长与键角的变化实现，键长键角是硬的，形变很小，故模量高；等规 PP 的分子链为螺旋构象，受力时可通过单键旋转使螺旋伸展，形变容易发生，故模量低。给分点：构象类型 1 分，形变机制 2 分。","stars":5,"sec":"七、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高物01 高分子链结构·九、真题与期末题演练"},{"id":"gaowu01-t014","type":"fill","q":"聚合物在溶液中通常呈（　）构象，在晶区中通常为（　）或（　）构象。","a":"无规线团；平面锯齿、螺旋。给分点：三空各 0.5 分。判据是环境：溶液里链自由，取熵最大的无规线团；晶区里链要密堆砌，取规整的平面锯齿（PE、PVA）或螺旋（等规 PP、PTFE）。","stars":5,"sec":"七、真题与期末题演练","num":113,"ord":913,"src":"真题","from":"分章节复习资料·高物01 高分子链结构·九、真题与期末题演练"}],"reading":["一、本章坐标：一切性能的起点","高物整门课在回答“结构决定性能”。这里的结构有两层：近程结构讲链上原子怎么连，远程结构讲整条链在空间里怎么摆。前者靠化学键固定，后者靠单键旋转改变。把这两层分清楚，后面 Tg、结晶、橡胶弹性才有落脚点。","表 1　高分子链结构考点与重要度","三、近程结构：链上原子怎么连","近程结构包含四件事：一是结构单元的化学组成；二是连接方式，即头尾、头头、尾尾；三是侧基的构型（立构，见高化第 7 章）；四是链的构造形态，即线形、支化、交联、星形、梯型。这四项一旦生成就改不了，除非断键。","连接方式为什么要管？因为头头连接的缺陷会打断链的规整性，使结晶能力下降。自由基聚合中头头结构约占百分之一二，这就是自由基产物结晶度往往低于配位聚合产物的原因之一。","支化是最容易被忽视的一项。高压法低密度聚乙烯主链上带大量长短支链，支链妨碍链堆砌，所以密度低（约 0.92）、结晶度低、柔软透明；低压法高密度聚乙烯基本是线形，密度可达 0.96、刚硬。同一种单体、同一种化学组成，只因为支化不同，性能差出一大截，这是结构决定性能最干净的例证。","交联则相反：它把链锁成网，链段运动受限，Tg 升高、强度与耐热性提高，但材料失去流动性，不能再熔融加工。橡胶的硫化就是控制交联度的工艺。","表 2　构造形态对性能的影响","图 1　高分子的结构层次：近程结构与远程结构的划分（北化《高分子物理》期末复习总结）","图 2　链结构的基本要素：化学组成、连接方式与构型（北化《高分子物理》期末复习总结）","图 3　构型与构象的区别：能否靠单键旋转相互转变（北化《高分子物理》期末复习总结）","四、构型与构象：一字之差，天壤之别","构型指链上取代基在空间的固定排布，例如全同、间同、无规，以及顺式、反式。要改变构型必须打断化学键、重新成键，所以构型是写死的。","构象指围绕单键内旋转所形成的空间形态。它不需要断键，只需克服内旋转位垒，因此常温下就能快速互变。一条链在溶液里同时存在无数构象，我们只能用统计方法描述它。","这个概念几乎年年考，因为一句话就能判：题目说加热后由全同变间同，一定错，那要断键；题目说拉伸后链由无规线团变伸展，一定对，那是构象变化。","链柔性来自单键的内旋转。键长和键角是固定的（碳碳键长约 0.154 nm，键角约 109.5 度），但相邻两个键可以绕中间的键旋转，于是链能折叠成各种形状。旋转要克服位垒：位垒小则易旋转，链柔；位垒大则难旋转，链刚。","影响柔性的因素归成四类。①主链结构：碳碳键、碳氧键、硅氧键的位垒小，柔性好，聚硅氧烷的 Tg 低到零下 120 度；芳环、杂环、双键使链刚硬，如聚酰亚胺、聚苯。②侧基：小侧基（甲基）影响小，大侧基（苯环）增加位垒使链刚；但柔性长侧基反而降低 Tg。③分子间作用力：氢键与极性基使链互相粘住，柔性下降。④温度：升温使位垒相对降低，柔性上升。","注意区分链柔性与材料柔软。一条柔顺的链如果结晶度高，材料照样是硬的。这是简答题常见的陷阱。","表 3　影响链柔性的因素与方向","六、统计尺寸：把一条乱麻量化","一条无规线团的链，两端距离随时在变，所以只能求平均值。最常用的是均方末端距（r 为两端点间距的平方的平均值）与均方回转半径（各质点到质心距离平方的平均值），两者对无规线团有回转半径的平方等于均方末端距的六分之一。","模型分三级。①自由连接链：假设每个键可任意取向、彼此无关，得均方末端距等于键数乘以键长的平方。②自由旋转链：允许内旋转但键角固定为 109.5 度，结果为 n l 平方乘 (1 加 cos 键角)/(1 减 cos 键角)，代入后约为自由连接链的 2 倍。③真实链：受位阻与分子间力限制，实际尺寸比自由旋转链还大，用刚性因子描述，它等于实测无扰尺寸与自由旋转链尺寸之比的平方根，数值越大越刚硬。","为了让真实链也能套用最简单的高斯统计，引入等效自由连接链：把整条链折成若干个长度为链段长度的独立单元，使均方末端距等于链段数乘以链段长度的平方。这里的链段长度就是链段这个概念的定量化身——链段不是真实存在的片段，而是把相关运动折算成一个独立单元。","表 4　三个模型与两个参数","【真题 1】下列聚合物中刚性因子最大的是：A 聚乙烯　B 聚丙烯腈　C 聚氯乙烯　D 聚丙烯","【真题 2】沿 C 轴拉伸，PE 的模量比等规 PP 的模量高 7 倍，解释原因。","【真题 3】聚合物在溶液中通常呈（　）构象，在晶区中通常为（　）或（　）构象。","★★★　能用一句话区分构型与构象，并举两个例子","★★★　能说出近程结构与远程结构各包含什么","★★★　能写出自由连接链与自由旋转链的均方末端距关系","★★★　能解释 PE 与等规 PP 沿 C 轴模量差 7 倍的原因","★★　能说明支化与交联对 Tg、密度、加工性的影响","★★　能用刚性因子解释 PAN、芳纶为什么刚","★★　能说出链段、等效自由连接链的定义与用途","★　能列举三种典型链构象及其出现场合"],"imp":3.9,"hot":8},{"id":"gaowu02","no":2,"name":"高物02 高分子溶液","title":"高分子溶液","cards":[{"id":"gaowu02-001","type":"tf","q":"高分子溶液是热力学稳定的真溶液。","a":"对（2 分）。高分子溶液是分子分散的热力学稳定体系，只是黏度高、扩散慢。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"对"},{"id":"gaowu02-002","type":"tf","q":"θ条件下第二维利系数为零，此时链处于无扰状态。","a":"对（2 分）。A2＝0 时排除体积效应消失，链尺寸为无扰尺寸。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"对"},{"id":"gaowu02-003","type":"tf","q":"交联聚合物在良溶剂中只能溶胀，不能溶解。","a":"对（2 分）。交联网络不能整体迁移，只能吸收溶剂膨胀到平衡。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":3,"ord":103,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·判断并说明理由（每题 2 分，共 10 分）·第 3 题","verdict":"对"},{"id":"gaowu02-004","type":"tf","q":"Huggins 参数 χ1 越大，溶剂越良。","a":"错（2 分）。χ1 越小，溶剂与聚合物作用越强、溶剂越良（χ1＜1/2 为良溶剂）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num" 空 2 分，共 14 分）·第 5 题"},{"id":"gaowu02-014","type":"fill","q":"特性粘数［η］与浓度关系的 Huggins 式为＿＿＿＿。","a":"ηsp/c＝［η］＋kH［η］²c。","stars":3,"sec":"填空（每空 2 分，共 14 分）","num":6,"ord":306,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·填空（每空 2 分，共 14 分）·第 6 题"},{"id":"gaowu02-015","type":"fill","q":"柔性链在良溶剂中呈＿＿＿＿构象，在θ溶剂中呈＿＿＿＿构象。","a":"伸展；无扰（高斯）。","stars":3,"sec":"填空（每空 2 分，共 14 分）","num":7,"ord":307,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·填空（每空 2 分，共 14 分）·第 7 题"},{"id":"gaowu02-016","type":"mcq","q":"下列最易溶解聚乙烯的是","a":"C．二甲苯（135 ℃）","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":1,"ord":401,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·选择（每题 2 分，共 8 分）·第 1 题","options":["水","乙醇","二甲苯（135 ℃）","丙酮"],"key":"C"},{"id":"gaowu02-017","type":"mcq","q":"A2＞0 说明","a":"B．溶剂为良溶剂","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":2,"ord":402,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·选择（每题 2 分，共 8 分）·第 2 题","options":["溶剂为θ溶剂","溶剂为良溶剂","溶剂为不良溶剂","已交联"],"key":"B"},{"id":"gaowu02-018","type":"mcq","q":"测定聚合物分子量时，θ条件的作用是","a":"B．消除排除体积效应","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":3,"ord":403,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·选择（每题 2 分，共 8 分）·第 3 题","options":["加快溶解","消除排除体积效应","提高黏度","防止降解"],"key":"B"},{"id":"gaowu02-019","type":"mcq","q":"下列不能溶解线形聚苯乙烯的是","a":"D．水","stars":3,"sec":"选择（每题 2 分，共 8 分）","num":4,"ord":404,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·选择（每题 2 分，共 8 分）·第 4 题","options":["苯","甲苯","四氢呋喃","水"],"key":"D"},{"id":"gaowu02-020","type":"short","q":"解释实验事实：网球场用的交联橡胶球放在甲苯中体积明显变大但不散开；而同种生胶放入甲苯则逐渐消失。","a":"交联橡胶：三维网络只能吸收溶剂溶胀，回缩力与渗透压平衡后停止，网络不破坏故不散开（4 分）；生胶：线形链无交联约束，溶剂化后分子链完全分散，最终消失（4 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":1,"ord":501,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·简答（每题 8 分，共 24 分）·第 1 题"},{"id":"gaowu02-021","type":"short","q":"为什么结晶聚合物比非晶聚合物难溶解？工业上怎样处理？","a":"结晶聚合物先要破坏晶格（熔化或溶解热），晶区链排列紧密、溶剂难进入，故溶解慢、常需高温（4 分）；工业上先造粒细化、升温至熔点附近、选用强溶剂并长时间搅拌（4 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·简答（每题 8 分，共 24 分）·第 2 题"},{"id":"gaowu02-022","type":"short","q":"说明溶解过程的两个阶段，并解释为什么高分子溶解比低分子慢得多。","a":"先溶胀（溶剂进入链间，体积膨胀）后溶解（链完全分散）（4 分）；高分子体积大、扩散系数小、混合熵小，故过程慢（4 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·简答（每题 8 分，共 24 分）·第 3 题"},{"id":"gaowu02-023","type":"calc","q":"某聚合物—溶剂体系，摩尔体积 V1＝100 cm³·mol⁻¹，Huggins 参数 χ1＝0.35。（1）求 A2；（2）判断溶剂良否；（3）若要达到θ状态，χ1 应为何值？","a":"A2＝(1/2－0.35)/100＝1.5×10⁻³ mol·cm⁻³（5 分）；A2＞0，为良溶剂（3 分）；θ状态需 χ1＝0.5（2 分）。","stars":5,"sec":"计算（16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·计算（16 分）·第 1 题"},{"id":"gaowu02-024","type":"essay","q":"从热力学（混合熵、混合焓）与分子运动两个角度，论述为什么高分子溶解慢、且交联后会停在溶胀阶段。\n错题归因（做完自己填）","a":"混合熵：高分子链节数多，混合熵远小于理想混合，靠熵驱动不足（4 分）；混合焓：需溶剂与链作用放热才有利（2 分）；分子运动：链扩散慢、黏度高，且溶解需先溶胀（2 分）；交联后网络受化学键约束，只能溶胀到平衡（2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高物02 高分子溶液·论述（12 分）·第 1 题"},{"id":"gaowu02-p001","type":"point","q":"溶解过程的两个阶段（简答、名词解释）","a":"先溶胀（凝胶）后溶解，交联体只能溶胀","stars":4,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 1 条）"},{"id":"gaowu02-p002","type":"point","q":"溶剂选择的依据（简答、选择）","a":"相似相溶、溶解度参数相近、氢键","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 2 条）"},{"id":"gaowu02-p003","type":"point","q":"Flory-Huggins 混合自由能（简答、论述）","a":"混合熵小于理想混合，混合焓决定相容","stars":3,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 3 条）"},{"id":"gaowu02-p004","type":"point","q":"θ 温度与 θ 溶剂（名词解释、简答）","a":"过量化学位为零，链取无扰尺寸","stars":5,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 4 条）"},{"id":"gaowu02-p005","type":"point","q":"无扰尺寸与无扰状态的意义（简答）","a":"排除链段间作用，得到纯几何尺寸","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 5 条）"},{"id":"gaowu02-p006","type":"point","q":"特性粘数的定义与 Mark-Houwink 方程（计算、简答）","a":"[η] = K M 的 α 次方","stars":5,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 6 条）"},{"id":"gaowu02-p007","type":"point","q":"溶胀平衡与交联度（计算、简答）","a":"交联点间分子量越大越易溶胀","stars":4,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 7 条）"},{"id":"gaowu02-p008","type":"point","q":"高分子共混的相容性（论述）","a":"混合焓为正故多数不相容","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 8 条）"},{"id":"gaowu02-p009","type":"point","q":"聚电解质与离聚物（选择）","a":"电离后链伸展，粘度反常","stars":2,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 9 条）"},{"id":"gaowu02-p010","type":"point","q":"溶液粘度与切变速率（简答）","a":"非牛顿性来自链的取向与解缠","stars":3,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高物02 高分子溶液·二、考点星级总表（第 10 条）"},{"id":"gaowu02-t012","type":"short","q":"何为 θ 状态？说明其在高分子物理研究中的意义，并结合 GPC 的普适标定说明其应用。","a":"θ 状态指在某一温度下，高分子稀溶液中链段之间的排斥作用与链段—溶剂之间的亲和作用恰好抵消，过量化学位为零，此时链的尺寸只由自身几何结构决定、与溶剂种类无关，所测尺寸即无扰尺寸，对应温度称 θ 温度、溶剂称 θ 溶剂。意义：提供了唯一的参照态，使不同溶剂、不同温度下测得的尺寸可以归一化，从而求出特征比、刚性因子等只与分子结构有关的参数。在 GPC 普适标定中，正是利用 θ 状态或标样在特定溶剂中的流体力学体积与分子量的关系，把不同聚合物换算到同一条标定曲线上，实现无标样时的分子量推算。给分点：定义 3 分、意义 3 分、GPC 应用 2 分。","stars":5,"sec":"七、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高物02 高分子溶液·九、真题与期末题演练"},{"id":"gaowu02-t013","type":"fill","q":"橡胶达溶胀平衡时，交联点之间的分子量越大，越（　）于溶胀，高聚物的体积分数越（　）。","a":"有（利）；小。给分点：两空各 0.5 分。原因是交联点间分子量越大即交联越稀，网络越松，能容纳的溶剂越多，故平衡时聚合物所占体积分数越小。","stars":5,"sec":"七、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高物02 高分子溶液·九、真题与期末题演练"},{"id":"gaowu02-t014","type":"short","q":"结晶聚合物尼龙在常温下能溶于甲酚，解释原因。","a":"甲酚与尼龙的酰胺基之间能形成氢键，溶剂与结晶聚合物中非晶区的强烈作用产生大量热，此热量足以破坏晶格，使结晶部分熔融，随后链被溶剂包围而溶解。给分点：氢键作用 1 分、破坏晶格并使晶区熔融 2 分。","stars":5,"sec":"七、真题与期末题演练","num":113,"ord":913,"src":"真题","from":"分章节复习资料·高物02 高分子溶液·九、真题与期末题演练"},{"id":"gaowu02-t015","type":"short","q":"聚丙烯酸与聚丙烯酰胺都是极性聚合物，为什么两者共混时不相容？请从热力学与动力学两方面说明。","a":"热力学上：相容要求混合自由能小于零。两者的混合熵都很小（聚合物的构象数远少于同数目小分子），无法抵消焓项；而羧基与酰胺基的氢键给体—受体匹配不好，链段间的偶极排斥使混合焓为正，即相互作用参数大于 0.5，故混合自由能为正，体系倾向于相分离。动力学上：两条高分子链的相互扩散速度极慢、缠结使界面难以充分混合，一旦发生相分离就难以再均化，因此即使理论上存在亚稳区，实际也表现为不相容。判断手段可用溶解度参数比较、观察是否出现两个 Tg、以及电镜下的两相形态。给分点：混合熵小与焓为正各 2 分，动力学扩散慢 2 分，判断方法 1 分。","stars":5,"sec":"七、真题与期末题演练","num":114,"ord":914,"src":"真题","from":"分章节复习资料·高物02 高分子溶液·九、真题与期末题演练"}],"reading":["一、本章坐标：唯一能把一条链拿出来量的地方","聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。","表 1　高分子溶液考点与重要度","三、溶解：不是“一泡就化”","小分子溶于水是几分钟的事，聚合物溶解要几小时甚至几天，因为链又长又缠。过程分两阶段：先溶胀——溶剂分子钻进链间，体系体积膨胀、变成凝胶，此时链还没有脱离网络；再溶解——溶胀到一定程度后链间作用被完全拆开，整条链进入溶液。","交联聚合物永远走不到第二步：网络被化学键锁住，只能溶胀不能溶解。溶胀平衡时的体积比由交联度决定——交联点间分子量越大（交联越稀），网络越松，能吸的溶剂越多，平衡时聚合物所占体积分数越小。这条规律北化期末填空第 5 题就在考。","溶剂选择的经验规则是相似相溶：非极性聚合物用非极性溶剂（PE 用二甲苯、PS 用甲苯），极性聚合物用极性溶剂（PVA 用水、尼龙用甲酚或甲酸）。更定量的判据是溶解度参数相近原则：两者的溶度参数越接近，混合焓越小，越易溶解。氢键也是关键——尼龙能溶于甲酚，正是甲酚与酰胺基形成氢键，拆散了链间的氢键网络。","图 1　高分子溶液的溶解过程与溶胀平衡（北化《高分子物理》期末复习总结）","Flory-Huggins 理论把混合自由能写成熵项与焓项之和。聚合物的混合熵远小于同数目小分子的混合熵（因为链段被键连在一起，不能独立排布），所以焓项的符号就变得极其关键：χ 大于 0.5 时混合焓为正，链段互相排斥，链蜷缩；χ 小于 0.5 时链舒展。","当 χ 恰好等于 0.5 时，链段之间的排斥与链段—溶剂之间的亲和恰好抵消，链的尺寸只由自身几何决定，与任何分子间作用无关。这个状态叫 θ 状态，对应的温度叫 θ 温度，对应的溶剂叫 θ 溶剂。此时测得的尺寸就是无扰尺寸，由它算出的分子量最接近真实。","θ 状态为什么重要？因为它是唯一的“参照态”。有了它，才能把不同溶剂、不同温度下测到的尺寸归一化，得到与分子结构有关的普适参数（如特征比、刚性因子）。GPC 的普适标定也是这个思路：用已知分子量的窄分布标样，在特定溶剂与温度下建立淋洗体积与分子量的关系，再借“流体力学体积”把不同聚合物换算到同一条曲线上。","图 2　高分子稀溶液的链尺寸与特性粘数的关系（北化《高分子物理》期末复习总结）","五、特性粘数：一条链在溶液里有多“占地方”","稀溶液的粘度比纯溶剂高，高出的部分与聚合物占据的流体力学体积有关。定义相对粘度、增比粘度，再外推到浓度为零，得到特性粘数 [η]，单位是体积与质量之比（mL/g 或 dL/g）。","特性粘数与分子量的关系是 Mark-Houwink 方程：[η] = K·M^α。α 在 0.5 到 0.8 之间，反映链在溶液中的形态：α 等于 0.5 对应 θ 状态（无扰线团），α 大于 0.5 表示链被溶剂撑开（良溶剂），α 接近 1 表示链几乎伸直（刚性棒）。所以测一个 α，就能判断溶剂好坏与链的刚性。","这条方程实际是“粘度法测分子量”的基础：先用一组已知分子量的标样在同样条件下测 [η]，作 lg[η] 对 lgM 的直线，定出 K 与 α，之后测未知样的 [η] 就能反算分子量。这就是北化期末选择题里“乌氏粘度计”的用途。","表 3　Mark-Houwink 方程的三种情形","图 3　特性粘数与分子量的双对数关系（Mark-Houwink 标定）（北化《高分子物理》期末复习总结）","六、共混相容性：为什么两种好料混不到一起","两种聚合物能不能混成均相，取决于混合自由能。由于聚合物的混合熵极小，几乎不能靠熵来“拉平”焓的正值，所以绝大多数聚合物对是不相容的。判定方法有三：溶解度参数相近、共混物出现单一 Tg（相容则只有一个 Tg，不相容则有两个）、以及相分离形态观察。","聚丙烯酸与聚丙烯酰胺就是典型的不相容对：两者都含极性基，但一个是羧基、一个是酰胺基，氢键给体与受体不匹配，且链段间的偶极作用使混合焓为正；动力学上，两条链相互扩散极慢，一旦相分离就难以再均化。所以从热力学与动力学两方面都不相容。","提高相容性的办法：加入嵌段或接枝共聚物作相容剂（一端与 A 相亲、一端与 B 相亲）、引入极性相互作用（氢键、离子键）、或用共聚改变化学组成。工业上 PP 与 EPDM 的增韧共混就是靠乙丙橡胶与 PP 的相近极性获得较好的界面粘结。","图 4　高分子熔体/溶液在剪切下的弹性效应（爬杆现象）（北化《高分子物理》期末复习课件）","【真题 1】何为 θ 状态？说明其在高分子物理研究中的意义，并结合 GPC 的普适标定说明其应用。","【真题 2】橡胶达溶胀平衡时，交联点之间的分子量越大，越（　）于溶胀，高聚物的体积分数越（　）。","【真题 3】结晶聚合物尼龙在常温下能溶于甲酚，解释原因。","【真题 4】聚丙烯酸与聚丙烯酰胺都是极性聚合物，为什么两者共混时不相容？请从热力学与动力学两方面说明。","★★★　能说清溶解的两阶段，并解释交联体为何只溶胀","★★★　能用 χ 等于 0.5 解释 θ 状态，并说出它的三层意义","★★★　能写出 Mark-Houwink 方程，并用 α 判断溶剂好坏与链刚性","★★★　能说出溶胀平衡与交联度的关系","★★　能列出三种判断共混相容性的方法","★★　能解释尼龙为什么溶于甲酚而不溶于水","★★　知道 GPC 普适标定的思路（流体力学体积）","★　能说出聚电解质溶液粘度反常的原因"],"imp":3.8,"hot":7},{"id":"gaowu03","no":3,"name":"高物03 分子量及其分布","title":"分子量及其分布","cards":[{"id":"gaowu03-001","type":"tf","q":"四种平均分子量中数均最大。","a":"错（2 分）。数均最小，重均次之，粘均居中，Z 均最大。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"错"},{"id":"gaowu03-002","type":"tf","q":"GPC 直接测得的是绝对分子量。","a":"错（2 分）。GPC 是相对法，需用标样标定；要绝对值需配光散射或粘度检测器。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"错"},{"id":"gaowu03-003","type":"tf","q":"端基分析法只适用于分子量较小的聚合物。","a":"对（2 分）。分子量大时端基占比太小，误差大，一般只适用于 Mn＜2 万。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":3,"ord":103,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·判断并说明理由（每题 2 分，共 10 分）·第 3 题","verdict":"对"},{"id":"gaowu03-004","type":"tf","q":"膜渗透压法测得的是重均分子量。","a":"错（2 分）。膜渗透压测数均，光散射测重均。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":4,"ord":104,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·判断并说明理由（每题 2 分，共 10 分）·第 4 题","verdict":"错"},{"id":"gaowu03-005","type":"tf","q":"多分散系数 d＝Mw／Mn，d 越接近 1 分布越窄。","a":"对（2 分）。d 反映分布宽窄，d＝1 为单分散。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":5,"ord":105,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·判断并说明理由（每题 2 分，共 10 分）·第 5 题","verdict":"对"},{"id":"gaowu03-006","type":"term","q":"数均与重均分子量（各写定义式，说明谁对大分子敏感）。","a":"Mn＝ΣNiMi／ΣNi（按分子数平均，对小分子敏感）；Mw＝ΣNiMi²／ΣNiMi（按重量平均，对大分子敏感）（各 2 分）。","stars":4,"sec":"概念解释（每题 4 分，共 12 分）","num":1,"ord":201,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·概念解释（每题 4 分，共 12 分）·第 1 题"}, ＝−4.036、a＝0.74，得 logM＝(0.1761＋4.036)／0.74＝5.69 → M＝4.9×10⁵（10 分）；介于 Mn 与 Mw 之间（2 分）。","stars":5,"sec":"计算（16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·计算（16 分）·第 1 题"},{"id":"gaowu03-024","type":"essay","q":"从加工与应用两方面，论述分子量及其分布对聚合物性能的影响，并说明“为什么高分子量的级分决定强度、低分子量级分决定流动性”。\n错题归因（做完自己填）","a":"分子量高，链缠结多、强度与耐热提高，但熔体黏度高、加工难；分布宽，低分子量级分增塑降黏、高分子量级分保证强度，但过宽易应力开裂、性能不均（每点 2 分）；强度由长链承担应力、缠结点多决定（2 分）；流动性由短链提供（2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高物03 分子量及其分布·论述（12 分）·第 1 题"},{"id":"gaowu03-p001","type":"point","q":"四种平均分子量的定义与大小关系（计算、简答）","a":"Mn 小于 Mv 小于 Mw 小于 Mz","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 1 条）"},{"id":"gaowu03-p002","type":"point","q":"数均与重均的权重差别（名词解释、计算）","a":"Mn 按个数加权，Mw 按质量加权","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 2 条）"},{"id":"gaowu03-p003","type":"point","q":"端基分析法（简答、选择）","a":"只适合分子量较小（小于 2 万）的线形物","stars":3,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 3 条）"},{"id":"gaowu03-p004","type":"point","q":"膜渗透压法（简答）","a":"绝对法测 Mn，依数性原理","stars":4,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 4 条）"},{"id":"gaowu03-p005","type":"point","q":"光散射法（简答）","a":"绝对法测 Mw，测散射光强与浓度、角度","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 5 条）"},{"id":"gaowu03-p006","type":"point","q":"粘度法（计算）","a":"相对法，需先用标样定 K 与 α","stars":4,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 6 条）"},{"id":"gaowu03-p007","type":"point","q":"GPC 的原理（论述、简答）","a":"体积排除，按流体力学体积分离","stars":5,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 7 条）"},{"id":"gaowu03-p008","type":"point","q":"GPC 的普适标定（简答）","a":"用流体力学体积把不同聚合物归一","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 8 条）"},{"id":"gaowu03-p009","type":"point","q":"多分散系数 d 与分布曲线（计算、简答）","a":"d 等于 Mw 比 Mn，缩聚约 2","stars":4,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 9 条）"},{"id":"gaowu03-p010","type":"point","q":"分子量对性能的影响（论述）","a":"Tg、强度、粘度都有一个临界值","stars":4,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高物03 分子量及其分布·二、考点星级总表（第 10 条）"},{"id":"gaowu03-t011","type":"short","q":"简述用 GPC 测定聚合物数均分子量、重均分子量、粘均分子量与多分散系数的实验步骤与数据处理方法。","a":"步骤：①将样品溶于合适溶剂并配成约 1 至 3 mg/mL 的稀溶液，经 0.45 微米滤膜过滤；②用一组已知分子量的窄分布标样，在同一柱、同一溶剂、同一流速与温度下进样，建立淋洗体积与分子量的标定曲线，若测定的是其他聚合物则用普适标定换算；③进样并用示差折光检测器记录信号，得到淋出曲线；④由标定曲线把淋洗体积换算成分子量、由信号强度换算成该级分的浓度，得到分子量分布曲线；⑤按定义式对分布积分，分别求得 Mn、Mw、Mz 与 d。粘均分子量需借助该体系在该溶剂与温度下的 Mark-Houwink 常数 K 与 α，由分布曲线按粘度平均的定义式换算。给分点：制样 1 分、标定 2 分、数据换算 2 分、积分求各平均值 2 分、Mv 的换算条件 1 分。","stars":5,"sec":"七、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高物03 分子量及其分布·九、真题与期末题演练"},{"id":"gaowu03-t012","type":"short","q":"根据统计方法的不同有多种平均分子量，其中最小的为：A 数均分子量　B 重均分子量　C Z 均分子量　D 粘均分子量","a":"答 A。因为加权次数依次升高（个数、质量、质量的平方），故 Mn 最小；粘均介于数均与重均之间，故 Mv 大于 Mn。给分点：选对 2 分。","stars":5,"sec":"七、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高物03 分子量及其分布·九、真题与期末题演练"},{"id":"gaowu03-t013","type":"fill","q":"对于相同分子量、不同分子量分布的聚合物流体，在低剪切速率下，分子量分布（　）的粘度高；在高剪切速率下，分子量分布（　）的粘度高。","a":"宽；窄。给分点：两空各 0.5 分。低剪切时宽分布的高分子量尾巴主导粘度；高剪切时切力使宽分布中的大分子先取向、解缠，粘度下降更多，故窄分布反而显得粘。","stars":5,"sec":"七、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高物03 分子量及其分布·九、真题与期末题演练"}],"reading":["一、本章坐标：为什么同一个牌号要报两个数","买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。","表 1　分子量与分布考点与重要度","三、四种平均分子量：四个矩","设第 i 种分子有 Ni 个、分子量为 Mi。数均 Mn 是总质量除以总个数，等价于按个数加权；重均 Mw 按质量加权，分子量大的链权重大；Z 均 Mz 按质量的平方加权，对最大的链最敏感；粘均 Mv 由溶液粘度定义，介于 Mn 与 Mw 之间。","因为加权次数依次升高，所以恒有 Mn 小于 Mv 小于 Mw 小于 Mz。当分布极窄（单分散）时四者相等；分布越宽，四者差距越大。北化期末的选择题问“哪种平均分子量最小”，答案就是数均。","例题：某试样中分子量 10 万的链占总质量 50%，20 万的占 50%，求 Mn、Mw、Mv 与 d。","解：设总质量 100 g，则两类链各 50 g，物质的量分别为 5×10 的负 4 次方 mol 与 2.5×10 的负 4 次方 mol，合计 7.5×10 的负 4 次方 mol。Mn 等于 100 g 除以该总量，得 13.3 万；Mw 等于质量加权平均，得 15 万；d 等于 15 比 13.3，约 1.13。Mv 介于两者之间，约为 14.6 万（按 α 等于 0.7 计算）。","表 2　四种平均分子量的比较","四、测定方法：绝对法与相对法","所谓绝对法，是不依赖标样、由基本原理直接得到分子量；相对法则必须先用已知标样标定。这个区分是简答题的常客。","端基分析法：测链端官能团的数目，除以样品质量即得每克链的摩尔数，取倒数就是 Mn。它是绝对法，但只适用于分子量不大（一般小于 2 万）、且每条链端基数目已知的线形聚合物。分子量一大，端基含量低到测不出来。","膜渗透压法：利用溶液的依数性，渗透压与溶质的摩尔浓度成正比，因此直接给出 Mn。它也是绝对法，适合 2 万到 100 万的范围，但小分子杂质会干扰，且平衡时间长。","光散射法：散射光强与分子的质量及尺寸有关，通过 Zimm 作图外推到零浓度、零角度，可同时得到 Mw 与回转半径。它是绝对法，测量范围最宽，是大分子量的首选。","粘度法：设备最简单，用乌氏粘度计测几个浓度下的流出时间，外推到零浓度得特性粘数，再由 Mark-Houwink 方程算 Mv。它是相对法，必须先定 K 与 α，但胜在快速、便宜，是工业最常用的方法。","凝胶渗透色谱（GPC，也称体积排除色谱）的原理不是“按分子量大小分开”，而是按流体力学体积分开。柱子内部填满多孔凝胶，大分子的流体力学体积大，进不去孔，只能从颗粒间隙流过，路程短、先出来；小分子能钻进孔里，路程长、后出来。所以淋出体积越大，分子量越小。","这个“按体积而非按质量”的机制带来一个好处：只要两种聚合物的流体力学体积相同，它们在柱子上的行为就相同。于是可以把一种聚合物的标定曲线换算给另一种聚合物使用，这就是普适标定。换算的桥梁是 Mark-Houwink 方程，因为流体力学体积正比于特性粘数与分子量的乘积。","测一套分子量分布的步骤：①样品溶解、过滤，配成稀溶液；②用一组窄分布标样建立淋洗体积与分子量的标定曲线（或做普适标定）；③进样，记录示差折光检测器的信号随淋洗体积的变化；④把信号换算成浓度、把淋洗体积换算成分子量，得到分布曲线；⑤对分布曲线积分，算出 Mn、Mw、Mz 与 d。","图 1　GPC 的分离原理：按流体力学体积（扩张体积）分离，同一保留时间对应同样大小的线团（北化《高分子物理》期末复习课件）","图 2　GPC 的标定曲线与分子量分布的计算（北化《高分子物理》期末复习总结）","图 3　分子量分布曲线与多分散系数的求法（北化《高分子物理》期末复习总结）","六、分布宽度与性能：不是越小越好","多分散系数 d 等于 Mw 比 Mn。缩聚产物按 Flory 最可几分布，d 约等于 2；自由基聚合因终止与转移并存，d 常在 2 到 5；阴离子活性聚合接近单分散，d 可小到 1.05；配位聚合视催化剂，常在 2 到 8。","分布对性能的影响是双向的。加工上，宽分布有利于“低分子量部分起增塑作用、高分子量部分提供强度”，所以挤出吹塑常用宽分布牌号；但宽分布也使熔体弹性变大、容易出现熔体破裂。力学上，低分子量尾巴会降低强度与耐应力开裂性，所以管材、纤维要求窄分布。","分子量本身也有一个门槛：当 Mn 超过某一临界值后，拉伸强度、冲击强度基本不再上升，但熔体粘度却继续按 3.4 次方增长。这个临界值通常在几万到十几万，工程上就是“够用就好，再高只是难加工”。","表 4　分子量与分布对性能的影响","【真题 1】简述用 GPC 测定聚合物数均分子量、重均分子量、粘均分子量与多分散系数的实验步骤与数据处理方法。","【真题 2】根据统计方法的不同有多种平均分子量，其中最小的为：A 数均分子量　B 重均分子量　C Z 均分子量　D 粘均分子量","【真题 3】对于相同分子量、不同分子量分布的聚合物流体，在低剪切速率下，分子量分布（　）的粘度高；在高剪切速率下，分子量分布（　）的粘度高。","★★★　能写出四种平均分子量的定义式，并证明 Mn 小于 Mw","★★★　能用质量分数数据算出 Mn、Mw、d","★★★　能说出哪种方法是绝对法、哪种是相对法，并各举一例","★★★　能完整叙述 GPC 的分离原理与普适标定思路","★★　能说明端基分析为什么只适合小分子量","★★　能解释 d 值对加工与力学性能的双向影响","★★　知道分子量超过临界值后强度趋平、粘度暴增的现象","★　能说出 Mv 为什么介于 Mn 与 Mw 之间"],"imp":4.1,"hot":9},{"id":"gaowu04","no":4,"name":"高物04 非晶态高聚物","title":"非晶态高聚物","cards":[{"id":"gaowu04-001","type":"tf","q" 种力学状态与两个转变温度（简答、画图）","a":"玻璃态、高弹态、黏流态，Tg 与 Tf","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 1 条）"},{"id":"gaowu04-p002","type":"point","q":"Tg 的本质（松弛过程而非相变）（名词解释、简答）","a":"链段运动冻结，随观测速率变化","stars":5,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 2 条）"},{"id":"gaowu04-p003","type":"point","q":"自由体积理论（论述、简答）","a":"Tg 时自由体积分数为常数（约 2.5%）","stars":5,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 3 条）"},{"id":"gaowu04-p004","type":"point","q":"WLF 方程与时温等效（计算、简答）","a":"Tg 附近黏度与时间的换算","stars":4,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 4 条）"},{"id":"gaowu04-p005","type":"point","q":"Tg 的测定方法（选择、简答）","a":"DSC 测热焓、DMA 测模量、膨胀计测体积","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 5 条）"},{"id":"gaowu04-p006","type":"point","q":"Tg 的影响因素（简答、论述）","a":"柔性、侧基、交联、增塑、分子量、共聚","stars":5,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 6 条）"},{"id":"gaowu04-p007","type":"point","q":"Tg 以下的次级转变（β 转变）（选择、简答）","a":"侧基或短链段运动，改善韧性","stars":3,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 7 条）"},{"id":"gaowu04-p008","type":"point","q":"Tg 与 Tm 的关系（简答）","a":"Tg 约等于三分之二 Tm（开尔文温标）","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 8 条）"},{"id":"gaowu04-p009","type":"point","q":"玻璃态的结构与老化（简答）","a":"非平衡态，物理老化使体积弛豫","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 9 条）"},{"id":"gaowu04-p010","type":"point","q":"高弹态的特征（简答）","a":"模量小、形变大、可回复、熵弹性","stars":4,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高物04 非晶态高聚物·二、考点星级总表（第 10 条）"},{"id":"gaowu04-t011","type":"short","q":"说明影响聚合物玻璃化转变温度的主要因素，并简述其作用机制。","a":"①主链柔性：主链键的内旋转位垒越小，链段越易运动，Tg 越低（硅橡胶 Tg 极低，聚酰亚胺极高）；②侧基：体积大、刚性的侧基阻碍内旋转、减少自由体积，使 Tg 升高；长而柔的烷基侧基起内增塑作用，使 Tg 先升后降；极性侧基因分子间作用增强使 Tg 升高；③交联：交联密度增大，链段活动空间减小，Tg 升高；④增塑剂：小分子插入链间，增加自由体积并屏蔽链间作用，Tg 显著降低；⑤分子量：分子量低时链端自由体积大，Tg 偏低，分子量增大到一定程度后 Tg 趋于定值；⑥共聚：无规共聚物 Tg 介于两组分之间（Fox 方程），嵌段不相容时出现两个 Tg；⑦压力与测试条件：压力增大压缩自由体积使 Tg 升高，升温速率加快或观测频率提高也使测得的 Tg 偏高。给分点：每项 1 分，机制说明每项 0.5 分，答满六项满分。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高物04 非晶态高聚物·九、真题与期末题演练"},{"id":"gaowu04-t012","type":"short","q":"下列方法中不能测定玻璃化温度的是：A 体膨胀计　B 差示扫描量热法　C 动态机械分析仪　D X 射线衍射仪","a":"答 D。体膨胀计测体积随温度的突变，DSC 测热焓台阶，DMA 测模量与损耗峰，三者都能定 Tg。X 射线衍射测的是晶体的周期性结构，非晶态没有衍射峰的变化规律可用来定 Tg，它测的是结晶度与晶型。给分点：选对 2 分。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高物04 非晶态高聚物·九、真题与期末题演练"},{"id":"gaowu04-t013","type":"fill","q":"自由体积理论认为，高聚物在玻璃化温度以下时，体积随温度升高而发生的膨胀是由于（　）。","a":"固有体积的膨胀。给分点：0.5 分。因为 Tg 以下自由体积已被冻结、不再增加，升温时体积的增加只来自分子自身占有体积的热膨胀；Tg 以上自由体积解冻，膨胀系数变大，曲线出现折点。","stars":5,"sec":"八、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高物04 非晶态高聚物·九、真题与期末题演练"}],"reading":["一、本章坐标：一条温度曲线管住三种状态","把一块非晶聚合物从低温缓慢升温，同时测它的形变或模量，会看到三段：低温玻璃态，硬而脆；中间高弹态，软而有弹性；高温黏流态，可以流动。中间那两个转折点就是 Tg 与 Tf。本章的核心就是把 Tg 说清楚：它是什么、怎么测、为什么会有、以及哪些因素能推动它。","表 1　非晶态与玻璃化转变考点与重要度","玻璃态下，链段被冻结，只有侧基、键长、键角能小幅振动，所以材料硬、脆、模量在 10 的 9 次方帕量级。温度升到 Tg，链段获得足够的活动能力，材料进入高弹态，模量掉到 10 的 6 次方帕量级，形变可达百分之几百并能回复。再升温到 Tf，整条链开始相对滑移，进入黏流态，形变不可回复。","三个关键区别要背清：玻璃态的形变是普弹形变（键长键角变化，瞬时、可回复）；高弹态的形变是高弹形变（链段舒展，可回复但有时滞）；黏流态的形变是塑性形变（整链滑移，不可回复）。这三种形变的叠加正是后面蠕变曲线的三段来源。","非晶聚合物的 Tg 与 Tf 之间那段就叫高弹态（橡胶态）。橡胶之所以能用，就是因为它被交联，Tf 被“取消”了，高弹态一直延伸到分解温度。","图 1　DMA 测得的模量随温度变化曲线：玻璃态、玻璃化转变区、高弹态与黏流态（北化《高分子物理》期末复习课件）","四、Tg 的本质：松弛，不是相变","一级相变（熔融、结晶）有确定的温度，因为两相自由能相等。Tg 没有确定值：升温快，链段来不及重排，要在更高温度才“跟上”，测得的 Tg 偏高；升温慢，测得的 Tg 偏低。同一聚合物，DSC 快扫与慢扫能差好几度。这就是“Tg 是松弛过程”的直接证据。","既然它是松弛过程，就有观测时间的含义：在极短时间内观察（高频动态测量），链段显得很“硬”，Tg 偏高；在长时间观察（低频），链段显得很“软”，Tg 偏低。所以 DMA 的频率扫描能给出与温度扫描等效的结果，这正是时温等效的物理基础。","图 2　差示扫描量热法（DSC）测 Tg：升温曲线上的基线台阶（“鼓包”为热焓松弛峰）（北化《高分子物理》期末复习课件）","五、自由体积理论：为什么冷却会把链段“冻住”","总体积由两部分组成：分子自身占据的体积与可以自由分布的空隙，即自由体积。温度升高，自由体积增大，链段有地方挪动；温度降低，自由体积被压缩到一定程度后不再减小（因为链段已被冻结，无法进一步密堆），此后体积收缩只靠占有体积的热收缩，膨胀系数变小。膨胀系数发生突变的那个温度，就是 Tg。","按这一理论，Tg 时自由体积分数是一个常数（常引用为 2.5%），所以 Tg 可以看作“等自由体积状态”。这个常数带来两个直接推论：①凡是能增加自由体积的因素（增塑剂、大侧基、共聚引入柔性单元）都会降低 Tg；②凡是能减少自由体积或限制链段活动的因素（交联、结晶、刚性侧基、极性作用）都会升高 Tg。","自由体积理论的贡献是把 Tg 从“神秘现象”变成“可计算的体积问题”，但它也有缺陷：它无法解释为什么 Tg 会随观测速率变化（因为它的自由体积分数被当作常数），也无法解释 Tg 以下的物理老化。这正是后续热力学理论与动力学理论要补的地方。","图 3　传统自由体积理论：总体积由占有体积与自由体积两部分组成（北化《高分子物理》期末复习课件）","六、Tg 的影响因素：一张必须背下来的清单","第一项，主链柔性。这是最根本的一项：主链越柔（碳碳单键、硅氧键、醚键），链段越易运动，Tg 越低。聚硅氧烷的 Tg 低到零下 120 度，聚酰亚胺高到 400 度以上。","第二项，侧基。侧基体积大（苯环、叔丁基）会阻碍内旋转、抬高 Tg；但长而柔的烷基侧基会起内增塑作用，反而降低 Tg，这就是“侧基碳数增加、Tg 先升后降”的原因。极性侧基因分子间作用增强也使 Tg 升高。","第三项，交联。交联把链锁住，链段活动空间变小，Tg 升高，且交联密度越大升高越多。定量上可用经验公式估算。","第四项，增塑。增塑剂是小分子，插进链间增加自由体积、削弱链间作用，Tg 显著降低。这是 PVC 加增塑剂做成软制品的原理。","第五项，分子量。分子量低时，链端多、末端自由体积大，Tg 偏低；分子量增大到一定程度后，链端效应被稀释，Tg 趋于定值（经验上约 2 万以上就基本不变）。","第六项，共聚与共混。无规共聚物的 Tg 介于两组分的 Tg 之间，可用 Fox 方程估算：1 比 Tg 等于两组分的质量分数分别除以各自 Tg 之和。嵌段共聚物若两段不相容，则出现两个 Tg。","表 3　Tg 影响因素一览","七、Tg 以下还有什么：次级转变","玻璃态不等于“完全冻结”。侧基、小链段、短支链仍能局部运动，这些运动在更低温度出现，称为次级转变（β、γ 转变），在 DMA 或介电谱上表现为小的损耗峰。","β 转变的工程意义很大：它对应局部的能量耗散机制，能吸收冲击能量。所以有些材料在 Tg 以下仍有不错的韧性，就是因为 β 转变温度正好在室温附近。PC 的韧性就得益于此。","反过来，物理老化也是 Tg 以下的常事：非晶态处于热力学非平衡，链段缓慢向更密堆的状态弛豫，体积、焓缓慢下降，材料变脆。这就是塑料件放久了变脆的原因，加热到 Tg 以上急冷可以“复位”。","【真题 1】说明影响聚合物玻璃化转变温度的主要因素，并简述其作用机制。","【真题 2】下列方法中不能测定玻璃化温度的是：A 体膨胀计　B 差示扫描量热法　C 动态机械分析仪　D X 射线衍射仪","【真题 3】自由体积理论认为，高聚物在玻璃化温度以下时，体积随温度升高而发生的膨胀是由于（　）。","★★★　能画出温度—形变曲线并标出三态两转变","★★★　能用一句话说明 Tg 为什么不是相变","★★★　能用自由体积理论解释 Tg，并给出等自由体积分数的推论","★★★　能分条说出 Tg 的六项影响因素及机制","★★　会用 WLF 方程做温度换算","★★　知道 Tg 与 Tm 的近似比例（开尔文温标约 2 比 3）","★★　能说明物理老化与 β 转变的工程意义","★　能说出三种 Tg 测定方法的原理"],"imp":4.2,"hot":8},{"id":"gaowu05","no":5,"name":"高物05 晶态高聚物","title":"晶态高聚物","cards":[{"id":"gaowu05-001","type":"tf","q":"球晶尺寸越大，聚合物的透明性越好。","a":"错（2 分）。球晶越大，光线在晶区与非晶区界面散射越强，透明性越差。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚物·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"错"},{"id":"gaowu05-002","type":"tf","q":"结晶度越高，熔点越高、强度越高。","a":"对（2 分）。结晶度高则片晶厚、分子间作用强，熔点与强度均提高，但脆性增大。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚 同样结晶度下球晶数目多、尺寸小到接近光波长以下，散射显著减弱，故透明（6 分）；结晶度与片晶结构不变，故强度变化不大（2 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":1,"ord":501,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚物·简答（每题 8 分，共 24 分）·第 1 题"},{"id":"gaowu05-021","type":"short","q":"说明影响聚合物熔点的四个因素，并各给一句机理。","a":"链刚性增大（分子间作用强、熔融需更多能量）→ 熔点高；结晶度／片晶厚度增大 → 熔点高；共聚或支化引入缺陷 → 熔点降低；分子量增大 → 熔点略升（每点 2 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚物·简答（每题 8 分，共 24 分）·第 2 题"},{"id":"gaowu05-022","type":"short","q":"画出结晶动力学曲线（结晶度—时间），标出三段并说明各段的控制因素。","a":"诱导期（成核控制）、生长期（生长控制，近似线性）、后期（碰撞与耗尽控制，速率下降）（每段 2 分，作图 2 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚物·简答（每题 8 分，共 24 分）·第 3 题"},{"id":"gaowu05-023","type":"calc","q":"某聚乙烯样品密度 0.94 g·cm⁻³，已知完全结晶相密度 1.00 g·cm⁻³、完全非晶相密度 0.85 g·cm⁻³。（1）求质量结晶度；（2）求体积结晶度；（3）说明为什么两者不等。","a":"Xc,m＝1.00×(0.94－0.85)／[0.94×(1.00－0.85)]＝0.09／0.141＝63.8%（5 分）；体积结晶度 Xc,v＝(ρ－ρa)／(ρc－ρa)＝0.09／0.15＝60%（4 分）；因为两相密度不同，质量分数与体积分数不等（3 分）。","stars":5,"sec":"计算（16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚物·计算（16 分）·第 1 题"},{"id":"gaowu05-024","type":"essay","q":"从结晶度、球晶尺寸、片晶厚度三个方面，论述结晶对聚合物力学性能、光学性能与热性能的影响，并说明加工上如何调控。\n错题归因（做完自己填）","a":"结晶度升高：模量与强度上升、断裂伸长下降、脆性增大（2 分）；球晶细化：透明度提高、冲击韧性改善（2 分）；片晶增厚：熔点与耐热提高（2 分）；加工调控：控制冷却速率与模温、加成核剂、拉伸取向、退火（4 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高物05 晶态高聚物·论述（12 分）·第 1 题"},{"id":"gaowu05-p001","type":"point","q":"结晶能力与结构规整性（简答、选择）","a":"规整、对称、无支化才易结晶","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 1 条）"},{"id":"gaowu05-p002","type":"point","q":"晶系与晶胞参数（填空、计算）","a":"七大晶系，晶胞密度可算","stars":3,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 2 条）"},{"id":"gaowu05-p003","type":"point","q":"结晶形态（单晶、球晶、串晶）（简答、识图）","a":"片晶是最基本单元，球晶最常见","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 3 条）"},{"id":"gaowu05-p004","type":"point","q":"球晶的黑十字与光性（选择、识图）","a":"正交偏振光下出现马尔他十字","stars":3,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 4 条）"},{"id":"gaowu05-p005","type":"point","q":"Avrami 方程与结晶动力学（计算、简答）","a":"结晶度随时间按指数规律上升","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 5 条）"},{"id":"gaowu05-p006","type":"point","q":"结晶速率与温度的关系（简答、作图）","a":"Tg 与 Tm 之间，中段速率最大","stars":5,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 6 条）"},{"id":"gaowu05-p007","type":"point","q":"结晶度的定义与三种测法（论述、计算）","a":"密度法、DSC 法、X 射线法","stars":5,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 7 条）"},{"id":"gaowu05-p008","type":"point","q":"熔点与熔限（简答）","a":"晶片厚度不一导致熔限","stars":5,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 8 条）"},{"id":"gaowu05-p009","type":"point","q":"Tm 的影响因素（简答、论述）","a":"柔性、侧基、氢键、共聚、取向","stars":5,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 9 条）"},{"id":"gaowu05-p010","type":"point","q":"取向与取向函数（简答）","a":"取向提高模量与强度，产生各向异性","stars":4,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高物05 晶态高聚物·二、考点星级总表（第 10 条）"},{"id":"gaowu05-t011","type":"short","q":"影响聚合物熔点的因素有哪些？请分别说明其作用机理。","a":"由 Tm 等于熔融焓除以熔融熵可知，凡增大熔融焓或减小熔融熵的因素都使 Tm 升高。①主链柔性：链越柔，熔融时构象熵增加越多，Tm 越低；主链含芳环、杂环或双键时 ΔS 小，Tm 高。②侧基：体积大的侧基使链难以堆砌、ΔH 减小，Tm 降低；极性侧基与氢键使分子间作用增强、ΔH 增大，Tm 升高（如尼龙、PVA）。③分子间作用力与氢键：作用越强，ΔH 越大，Tm 越高。④分子量：低分子量时端基多、ΔS 大，Tm 偏低，分子量增大后趋于定值。⑤共聚：无规共聚破坏结晶规整性、使晶片变薄，Tm 显著下降；嵌段或接枝共聚影响较小。⑥增塑剂与稀释剂：小分子进入晶格或增加体系熵，使 Tm 降低。⑦拉伸取向与退火：取向使链伸展、熔融熵减小，Tm 升高；退火使晶片增厚、完善，Tm 升高。给分点：热力学关系 2 分，六项因素各 1 分。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高物05 晶态高聚物·九、真题与期末题演练"},{"id":"gaowu05-t012","type":"short","q":"结晶聚合物在熔融过程中出现熔限，解释原因。","a":"答：结晶聚合物的晶格完善程度不同。晶片厚度有大有小、缺陷有多有少，薄的与不完善的晶片在较低温度就熔融，厚的与完善的要在更高温度才熔融，故熔融发生在一个温度区间而非单一温度。给分点：说明晶格完善程度不同 1 分，联系到厚度与缺陷 2 分。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高物05 晶态高聚物·九、真题与期末题演练"},{"id":"gaowu05-t013","type":"short","q":"聚对苯二甲酸乙二酯（PET）熔体迅速冷却，得到透明材料，解释原因。","a":"答：熔体迅速冷却时，链段来不及排入晶格，结晶被抑制，获得非晶（无定形）材料；非晶态没有晶区与非晶区的界面，光不被散射，故透明。若缓慢冷却则结晶，球晶尺寸大于光波长，产生散射而呈乳白色。给分点：来不及结晶 1 分，得到无定形材料 1 分，透明与否则对应散射 1 分。","stars":5,"sec":"八、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高物05 晶态高聚物·九、真题与期末题演练"},{"id":"gaowu05-t014","type":"essay","q":"欲用差示扫描量热法（DSC）测定某聚合物的结晶度，请写出完整实验步骤与数据处理方法。","a":"步骤：①取样 5 至 10 mg，置于铝坩埚中密封，另取空坩埚作参比；②以恒定升温速率（通常 10 度每分钟）从室温升至比熔点高 30 度以上，记录热流曲线；③先升温一次消除热历史，再以恒定速率降温至 Tg 以下使其结晶，然后第二次升温，取第二次升温曲线用于计算；④在熔融峰两侧作基线，积分峰面积得熔融焓；⑤用已知百分之百结晶的同类标样（如全同 PP、PE）的熔融焓作分母，样品熔融焓除以该值即得质量结晶度。数据处理中需注意：升温速率必须与标定一致；峰面积要扣除热焓松弛与氧化等干扰；若样品含多种晶型应分别积分再求和。给分点：取样与参比 1 分、升温程序与消除热历史 2 分、基线选取与积分 2 分、标样取值与计算 2 分、注意事项 1 分。","stars":5,"sec":"八、真题与期末题演练","num":113,"ord":913,"src":"真题","from":"分章节复习资料·高物05 晶态高聚物·九、真题与期末题演练"}],"reading":["一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。","表 1　晶态高聚物考点与重要度","三、结晶能力：先看链能不能排整齐","结晶的本质是链段在三维空间里周期性排列。所以第一要求是结构规整：化学组成一致、连接方式一致（头尾为主）、立构规整（全同或间同）。自由基聚合的 PE 支化多、头头结构多，结晶度只有百分之几十；配位聚合的 HDPE 线性好，结晶度可达 80% 以上。","第二要求是对称性。链的对称性越好，越容易找到密堆方式。聚乙烯全反式平面锯齿、晶胞对称，极易结晶；而聚苯乙烯侧基大、无规立构时根本不结晶（只有等规 PS 能结晶）。","第三是分子间作用力。氢键与极性基能帮助链锁在一起，形成稳定的晶格，所以尼龙、PVA 都能结晶，且熔点较高。","但要注意：能结晶不等于一定结晶。淬火（骤冷）会让链来不及排布，得到非晶态；缓慢冷却或退火才得到高结晶度。这就是同一牌号的 PET 既能吹成透明瓶（骤冷）又能做成结晶粒料（慢冷）的原因。","表 2　结晶能力的三项结构条件","四、结晶形态：从片晶到球晶","最基本的结晶单元是片晶：链折叠成厚度约 10 nm 的薄片，链轴垂直于片平面。片晶在极稀溶液中缓慢生长，可以长成规则的菱形单晶，这是证明“链折叠”假说的经典实验。","熔体中结晶得不到单晶，因为熔体粘度大、晶核多，片晶只能向四周辐射状生长，形成球晶。球晶直径通常 0.1 微米到 1 厘米，正交偏振光下呈马尔他黑十字，这是最常用的识别特征。球晶尺寸越大，材料越脆、越不透明；所以要靠成核剂与加工条件控制球晶尺寸。","在剪切或拉伸流场下，还会出现纤维状晶与串晶：伸直链先沿流动方向排列，再在其表面外延生长片晶。这类形态在注塑件的皮层很常见，是“皮芯结构”的来源。","图 1　聚合物晶体最简单形式——单晶：聚乙烯从极稀溶液中缓慢生长出的菱形片晶（北化《高分子物理》期末复习课件）","图 2　熔体结晶最常见的形态——球晶：直径 0.1 微米至 1 厘米，由纤维状晶片辐射生长（北化《高分子物理》期末复习课件）","五、结晶动力学：速度由温度决定","结晶分两步：成核与生长。成核有均相成核（靠自身涨落）与异相成核（靠杂质、界面、成核剂）。异相成核所需过冷度小、速度快，所以工业上大量使用成核剂来细化球晶。","结晶度随时间的变化用 Avrami 方程描述：某时刻的结晶度等于 1 减去 exp 的负（速率常数乘以时间的 n 次方），n 为 Avrami 指数，反映成核方式与生长维度。实验上取双对数作图，斜率为 n、截距给出速率常数，是最常见的处理方式。","结晶速率随温度呈钟形曲线：温度接近 Tm，过冷度小，成核难，速率低；温度接近 Tg，链段活动性差，生长难，速率也低；在这两者中间（通常 0.8 到 0.9 倍 Tm 附近）速率最大。这条“钟形曲线”是简答与作图的常客，一定要能画并能解释两端为什么慢。","图 3　结晶动力学：片晶增厚过程中的高度变化（h0 到 ht）与 Avrami 处理（北化《高分子物理》期末复习课件）","六、结晶度：三种测法要会写步骤","结晶度定义为晶区所占的质量分数（或体积分数）。测法有三类，原理各不相同。","密度法：结晶区密度高、非晶区密度低，测出样品密度后按混合规则反算体积结晶度。设备简单（密度梯度管），但要求知道两相的纯密度。","DSC 法：结晶部分熔融要吸热，测出熔融焓，除以百分之百结晶标准样的熔融焓，即得质量结晶度。升温速率要统一（通常 10 度每分钟），且要扣除热历史影响。","X 射线法：晶区有尖锐衍射峰、非晶区有弥散晕，分别积分两者的散射强度，其比值给出结晶度。它是结构上最直接的证据，可同时给出晶型与晶面间距。","图 4　取向态的定性判断：未取向的多晶（左）与取向后的纤维织构（右）（北化《高分子物理》期末复习课件）","七、熔点与熔限：为什么熔化是一个温度区间","热力学上，熔点由 Tm 等于 ΔH 除以 ΔS 决定：熔融焓越大、熔融熵越小，Tm 越高。链越刚、分子间作用越强，ΔH 大而 ΔS 小，Tm 高；链越柔，ΔS 大，Tm 低。","实测中聚合物没有单一熔点，而是一个温度区间（熔限），从开始熔融到完全熔融。原因是晶片厚度不等、完善程度不等：薄的、有缺陷的晶片先熔，厚的、完善的最后熔。这也解释了为什么退火（增厚晶片）会使熔点升高、熔限变窄。","Tm 的影响因素可直接列成一张清单：主链柔性（越柔 Tm 越低）、侧基（体积大降低 Tm，极性侧基升高 Tm）、氢键（升高 Tm，尼龙 66 达 265 度）、分子量（低分子量 Tm 偏低，高分子量趋于定值）、共聚（无规共聚显著降低 Tm，嵌段共聚影响小）、增塑与稀释（降低 Tm）、拉伸取向（升高 Tm）。","【真题 1】影响聚合物熔点的因素有哪些？请分别说明其作用机理。","【真题 2】结晶聚合物在熔融过程中出现熔限，解释原因。","【真题 3】聚对苯二甲酸乙二酯（PET）熔体迅速冷却，得到透明材料，解释原因。","【真题 4】欲用差示扫描量热法（DSC）测定某聚合物的结晶度，请写出完整实验步骤与数据处理方法。","★★★　能说出结晶能力的三项结构条件并举反例","★★★　能画结晶速率—温度钟形曲线并解释两端慢的原因","★★★　能写出 Avrami 方程与实验作图方法","★★★　能分条说明 Tm 的六项影响因素及机理","★★★　能完整写出 DSC 测结晶度的步骤","★★　能解释熔限的成因与退火的作用","★★　能说出球晶的黑十字特征与尺寸控制手段","★★　能说明结晶度对模量、强度、透明性的影响","★　知道取向对模量、强度与收缩率的影响"],"imp":4.3,"hot":8},{"id":"gaowu06","no":6,"name":"高物06 固体高聚物的力学性能","title":"固体高聚物的力学性能","cards":[{"id":"gaowu06-001","type":"tf","q":"高弹形变的泊松比约为 0.5，说明形变时体积基本不变。","a":"对（2 分）。泊松比 0.5 表示形变时体积不变，是理想橡胶行为。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"对"},{"id":"gaowu06-002","type":"tf","q":"银纹是材料内部已经断裂的裂缝，出现即失效。","a":"错（2 分）。银纹内部有取向的微纤连接两壁，仍能承载，是韧性的表现之一。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"错"},{"id":"gaowu06-003","type":"tf","q":"提高应变速率使聚合物更容易发生脆性断裂。","a":"对（2 分）。 低（低分子量 PE）（每例 2 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":1,"ord":501,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·简答（每题 8 分，共 24 分）·第 1 题"},{"id":"gaowu06-021","type":"short","q":"从断裂伸长、断裂能、银纹与剪切带、断口形貌、对缺口敏感性五个方面，对比脆性断裂与韧性断裂。","a":"断裂伸长：小／大；断裂能：低／高；银纹与剪切带：少／多；断口：光滑／粗糙（韧窝）；缺口敏感性：敏感／不敏感（每行 1.6 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·简答（每题 8 分，共 24 分）·第 2 题"},{"id":"gaowu06-022","type":"short","q":"解释实验事实：PP 在室温下冲击强度低，加入 15% EPDM 后冲击强度提高 5 倍，而拉伸强度下降约 20%。","a":"EPDM 粒子作为应力集中体，诱发大量银纹与剪切带，吸收冲击能（4 分）；同时橡胶相模量低、界面脱粘消耗能量（2 分）；橡胶体积分数使承载截面减小、整体模量与屈服强度下降（2 分）。","stars":4,"sec":"简答（每题 8 分，共 24 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·简答（每题 8 分，共 24 分）·第 3 题"},{"id":"gaowu06-023","type":"calc","q":"某硫化橡胶密度 1.0 g·cm⁻³，25 ℃ 时初始模量为 0.5 MPa。（1）按 E＝3ρRT／Mc 求交联点间分子量 Mc；（2）若交联度加倍（Mc 减半），模量变为多少？（3）说明温度升到 60 ℃ 时模量的变化方向。","a":"ρ＝1.0 g·cm⁻³＝1000 kg·m⁻³，T＝298 K（2 分）；Mc＝3ρRT／E＝3×1000×8.314×298／0.5×10⁶≈1.49×10⁴ g·mol⁻¹（6 分）；Mc 减半则 E 加倍＝1.0 MPa（2 分）；升温至 333 K，E 约增大 12%（2 分）。","stars":5,"sec":"计算（16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·计算（16 分）·第 1 题"},{"id":"gaowu06-024","type":"essay","q":"要为一个汽车保险杠选材：PP、PP＋EPDM、PP＋滑石粉。请从强度、韧性、刚性与成本四方面比较，并说明各自适用部位。\n错题归因（做完自己填）","a":"PP：强度与刚性较好、韧性差、成本低，用于非受力装饰件（2 分）；PP＋EPDM：韧性大幅提高、强度与刚性下降，用于保险杠主体、受力吸能部位（3 分）；PP＋滑石粉：刚性与耐热提高、韧性下降，用于仪表台骨架、支架（3 分）；成本：PP＜填充＜增韧（2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高物06 固体高聚物的力学性能·论述（12 分）·第 1 题"},{"id":"gaowu06-p001","type":"point","q":"三种典型应力—应变曲线（作图、简答）","a":"玻璃态脆、结晶态有屈服、橡胶态低模量大形变","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物06 固体高聚物的力学性能·二、考点星级总表（第 1 条）"},{"id":"gaowu06-p002","type":"point","q":"屈服与冷拉（颈缩）（名词解释、简答）","a":"屈服是塑性流动，冷拉是链段与晶片取向","stars":5,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物06 固体高聚物的力学性能·二、考点星级总表（第 2 条）"},{"id":"gaowu06-p003","type":"point","q":"断裂的 Griffith 理论与 K1C（简答、计算）","a":"裂纹尖端应力集中，K1C 是断裂韧性","stars":4," short","q":"说明聚合物的蠕变、应力松弛、滞后和内耗现象，并简要说明为什么聚合物具有这些现象。","a":"蠕变：在一定温度和较小的恒定应力下，材料的应变随时间增加而增大的现象。应力松弛：在恒定温度和形变保持不变的情况下，聚合物内部的应力随时间增加而逐渐衰减的现象。滞后：聚合物在交变应力作用下，应变落后于应力的现象。内耗：由于发生滞后现象，在每一循环变化中作为热损耗掉的能量。原因：高分子链可以通过链段运动使分子链重排或质心滑移，从而使应力松弛，因此出现蠕变与应力松弛；在交变应力下，链段运动受阻于内摩擦力，因此出现滞后与内耗。给分点：四个定义各 1.5 分，原因 2 分。","stars":5,"sec":"十、真题与期末题演练","num":113,"ord":913,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"},{"id":"gaowu06-t015","type":"short","q":"至少从 5 个方面对比总结脆性断裂与韧性断裂的区别。","a":"①屈服：脆性断裂不存在屈服，韧性断裂先屈服再断裂；②应力—应变曲线：脆性为线性的，韧性为非线性的；③断裂伸长率：脆性较小，韧性较大；④断裂面：脆性光滑，韧性粗糙；⑤断裂能：脆性较小，韧性较大；⑥应力分量：脆性由张应力分量引起，韧性由切应力分量引起。给分点：任选五项，每项 1 分（0.5 分对比 + 0.5 分说明）。","stars":5,"sec":"十、真题与期末题演练","num":114,"ord":914,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"},{"id":"gaowu06-t016","type":"short","q":"为改善聚丙烯的冲击性能，需选择一种橡胶增韧，现有三元乙丙橡胶与氯丁橡胶，应选哪种？说明原因并简述增韧机理。","a":"应选三元乙丙橡胶（EPDM）。原因是 EPDM 与 PP 极性相近、溶解度参数接近，相容性较好，界面粘结强；氯丁橡胶极性大，与 PP 不相容，界面易脱粘。增韧机理为银纹—剪切带机理：橡胶粒子作为应力集中体，在外力下引发周围基体的银纹与剪切带，二者吸收大量能量；同时橡胶粒子本身发生形变、终止银纹扩展，从而把脆性断裂转为韧性断裂。给分点：选择 1 分、原因 2 分、机理 3 分。","stars":5,"sec":"十、真题与期末题演练","num":115,"ord":915,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"},{"id":"gaowu06-t017","type":"calc","q":"硫化橡胶试样在 300 K 时用 15 N 拉力拉伸到初始长度的 2 倍，试样横截面为 30 mm×2 mm，橡胶密度为 950 kg/m³，求网链平均分子量 Mc。","a":"①应力：横截面积 30 毫米乘 2 毫米等于 6 乘 10 的负 5 次方平方米，σ 等于 15 除以该面积，得 2.5 乘 10 的 5 次方帕；②用橡胶弹性状态方程 σ 等于（密度乘以气体常数乘以温度除以 Mc）乘以（λ 减 1 比 λ 平方），λ 等于 2，括号内等于 2 减 0.25 等于 1.75；③代入得 Mc 等于 950 乘 8.314 乘 300 乘 1.75 除以 2.5 乘 10 的 5 次方，约 1.66 乘 10 的 4 次方克每摩尔。给分点：公式 2 分、推导 2 分、结果 2 分。","stars":5,"sec":"十、真题与期末题演练","num":116,"ord":916,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"},{"id":"gaowu06-t018","type":"calc","q":"某聚合物 140 度时黏度为 1 乘 10 的 5 次方帕秒（Tg 为 110 度），求 160 度时的黏度。","a":"用 WLF 方程 lg aT 等于负 17.44（T 减 Tg）除以 51.6 加（T 减 Tg）。140 度时：分子为 17.44 乘 30 等于 523.2，分母为 81.6，得 lg aT 约负 6.41；160 度时：分子为 17.44 乘 50 等于 872，分母为 101.6，得 lg aT 约负 8.58。两者之差为负 2.17，即 160 度黏度等于 10 的 5 次方乘 10 的负 2.17 次方，约 676 帕秒。给分点：公式 2 分、两步代入 2 分、结果 2 分。","stars":5,"sec":"十、真题与期末题演练","num":117,"ord":917,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"},{"id":"gaowu06-t019","type":"short","q":"画出非晶态聚合物与结晶聚合物的应力—应变曲线，说明各阶段特征，并指出银纹与剪切带在其中的作用。","a":"非晶脆性料（如 PS）曲线近似直线，无屈服，在断裂点突然下降，表现为脆性断裂。结晶料或韧性料（如 PE、尼龙）曲线先线性上升至屈服点，随后应力下降并出现颈缩，接着进入冷拉平台（细颈沿试样扩展、链段与晶片沿拉伸方向取向），冷拉结束后链被进一步拉伸，应力再次上升直至断裂。银纹与剪切带是两种耗能机制：银纹发生在平面应力状态，微纤桥接、垂直于外力，吸收能量但易转为裂纹；剪切带发生在平面应变状态，与外力约成 45 度，可稳定承载。二者在屈服与冷拉平台阶段大量产生，是把材料从脆性转为韧性断裂的关键。给分点：两条曲线各 2 分，阶段说明 2 分，两种机制的方位与作用 2 分。","stars":5,"sec":"十、真题与期末题演练","num":118,"ord":918,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"},{"id":"gaowu06-t020","type":"short","q":"印刷浆料为什么要求具有触变性？请结合剪切速率的变化说明其对印刷过程的作用。","a":"触变性指在等温条件下，体系受剪切时粘度随剪切速率升高而下降、静置后粘度又随时间恢复的现象，本质是内部结构（缠结、填料网络、氢键）被剪切破坏后又能重建。印刷时：刮刀或辊筒的高剪切使浆料粘度骤降，便于顺利通过网孔或转移、铺展，避免拉丝与堵网；印到基材后剪切消失，浆料静置，结构重建、粘度迅速回升，从而防止流挂、渗边与图案变形，保证边缘清晰与厚度均匀。因此触变性是“印得出去、又停得住”的关键。给分点：触变性的定义与机理 3 分，高剪切下的转移作用 2 分，静置后的抗流挂作用 2 分。","stars":5,"sec":"十、真题与期末题演练","num":119,"ord":919,"src":"真题","from":"分章节复习资料·高物06 固体高聚物的力学性能·九、真题与期末题演练"}],"reading":["高物06　固体高聚物的力学性能","一、本章坐标：一门课里最“工程”的一章","前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。","表 1　力学性能考点与重要度","三、应力—应变曲线：三种形状，三种机制","非晶玻璃态聚合物（如 PS、PMMA）在室温下拉伸，曲线几乎直线上升到断裂点，无屈服、无颈缩，断裂伸长率只有百分之几，属脆性断裂。这是链段被冻结、无法靠运动耗散能量的结果。","结晶聚合物（如 PE、尼龙）或 Tg 以下的韧性塑料会先出现屈服：应力升到屈服点后下降，同时试样出现细颈，随后细颈两端扩展、整个试样被拉细，应力—应变曲线出现平台，最后在冷拉完成后再上升直到断裂。冷拉的微观本质是链段与晶片沿拉伸方向取向。","橡胶则在极低应力下就给出巨大的形变（可达百分之几百），并且卸载后基本回复。它没有屈服，模量随温度升高而升高，这与金属、塑料完全相反，因为它不是能量弹性而是熵弹性。","图 1　屈服：拉伸过程中随应变增加，工程应力不升反降的现象（北化《高分子物理》期末复习课件）","四、断裂：从裂纹到 K1C","实际材料总有缺陷。Griffith 的思路是：裂纹扩展时释放的弹性能必须足以支付新生成的表面能，两者平衡给出临界条件。对聚合物，因为存在银纹、剪切带等耗能机制，实际断裂能远高于理论表面能，所以工程上用线弹性断裂力学的应力强度因子 K1C（断裂韧性）来表征抗裂纹扩展能力。","使用要点：裂纹越长，临界应力越低。北化 A 卷的填空题就考这个：已知 K1C 等于 0.80 兆帕乘以米的 0.5 次方、裂纹长 2.0 cm（即半长 a 为 1.0 cm），由 σ 等于 K1C 除以（Y 乘以 a 的 0.5 次方）、取 Y 约 1，得 σ 约 4.5 兆帕。","提高断裂韧性的途径有三：提高分子量与缠结密度（更多链被拉断而不是拔出）、引入能引发银纹或剪切带的第二相（橡胶增韧）、减少缺口与内应力（加工与设计）。","图 2　银纹：聚合物所特有，多出现在脆性高聚物中，方向垂直于拉伸方向（北化《高分子物理》期末复习课件）","五、银纹与剪切带：两大耗能机制","银纹不是裂纹。它内部仍由取向的微纤连接着两侧，微纤之间有空洞，所以能传播光线（呈银白色）、密度下降、但仍有承载能力。银纹面垂直于外力方向。银纹的产生要吸收大量能量，因此是重要的增韧机制；但银纹过多会合并成裂纹，最终导致断裂。","剪切带是局部剪切屈服区，链段沿剪切方向取向，面内密度基本不变、不散射光，方向与外力约呈 45 度。剪切带也能耗能，且不像银纹那样容易转成裂纹。","判断材料靠哪种机制耗能，看它的应力状态：平面应力（薄试样、有缺口）易生银纹，平面应变（厚试样）易生剪切带；温度低、速率快时倾向银纹，温度高、速率慢时倾向剪切带。","表 3　银纹与剪切带的区别","六、蠕变与应力松弛：时间一长，材料就“软”了","蠕变是在恒定温度与恒定应力下，形变随时间增大的现象。它的曲线分三段：第一段是普弹形变（键长键角，瞬时、可完全回复）；第二段是高弹形变（链段舒展，随时间发展、可回复但有滞后）；第三段是黏性形变（整链滑移，不可回复）。温度越高、应力越大、分子量越低，蠕变越明显；交联可完全抑制第三段。","应力松弛是在恒定形变下，应力随时间衰减的现象。原因是链段逐步重排，把初始的弹性应力“消化”掉。Maxwell 模型（弹簧与黏壶串联）能描述这一过程：应力按 exp 负 t 除以松弛时间的规律衰减，松弛时间等于黏度除以模量。","Kelvin（Voigt）模型是弹簧与黏壶并联，能描述交联聚合物的蠕变与回复：形变按 1 减 exp 的规律趋近平衡值，但给不出初始的普弹形变。所以常用四元件模型（Maxwell 与 Kelvin 串联）来完整描述蠕变的三段。","松弛时间 τ 是本章的核心参数：τ 大表示偏弹性（应力保持久），τ 小表示偏黏性（应力很快消失）。定义上，应力松弛到初始值的 36.8%（即 1/e）所需时间就是 τ；北化填空题把“松弛过程完成 63.2%”作为 τ 的另一种表述，两者等价。","图 3　蠕变曲线：普弹形变、高弹形变与黏性形变三段叠加（北化《高分子物理》期末复习课件）","七、动态力学：储能、损耗与内耗峰","在交变应力下，应变总是落后应力一个相位角 δ。把模量拆成两部分：与应变异相的部分叫储能模量（代表可储存的弹性能），与应变相差 90 度的部分叫损耗模量（代表每周期耗散的热）。两者之比的正切就是损耗因子。","内耗（力学损耗）随温度的变化在 Tg 附近出现峰值：Tg 以下链段冻住，形变很小、摩擦小，内耗低；Tg 以上链段自由，应变跟得上应力，内耗也低；恰在 Tg 附近，链段能动但体系粘度大，应变严重滞后，把弹性能大量转为热，内耗最大。这个峰既是测 Tg 的手段，也是阻尼材料的选材依据。","时温等效：高温下的短时间行为等价于低温下的长时间行为。把不同温度下测得的模量曲线沿对数时间轴水平平移，可拼成一条主曲线，平移量就是移动因子 aT。Tg 附近用 WLF 方程计算 aT；远离 Tg 用 Arrhenius 型。注意：温度从高温向低温变化时，aT 大于 1。","表 5　动态力学三量与温度的关系","八、橡胶弹性：唯一能算的一节","橡胶的高弹性是熵弹性：拉伸时链由蜷曲变伸展，构象数减少、熵降低，回缩的驱动力是熵增而不是内能。所以橡胶拉伸时放热（红外测温可测到温升），且模量随温度升高而增大——这两点与金属、塑料正好相反，是判断题的经典陷阱。","产生橡胶弹性的三个条件：长链（足够长的柔性链）、柔性链（Tg 远低于使用温度）、交联（形成网络防止整链滑移）。三者缺一不可，北化填空题正是这三条。","统计理论给出状态方程：σ 等于（密度乘以气体常数乘以温度除以交联点间分子量）乘以（伸长比减伸长比平方的倒数）。由此可以算交联密度，也可以验证“模量正比于温度”。","典型计算（北化 A 卷）：300 K 下，截面积 30 毫米乘 2 毫米的试样受 15 N 拉力拉伸到原长 2 倍，密度 950 千克每立方米。先算应力为 15 N 除以 6 乘 10 的负 5 次方平方米，得 2.5 乘 10 的 5 次方帕；伸长比 λ 为 2，括号内为 2 减 0.25 等于 1.75；代入解出交联点间分子量约 1.66 乘 10 的 4 次方克每摩尔。","聚合物熔体的流动曲线（粘度对剪切速率）分三区。第一牛顿区：剪切速率很低，缠结的生成与破坏达到动态平衡，缠结点数不变，粘度恒定，称零剪切粘度。假塑区：剪切速率升高，缠结破坏快于生成，缠结点减少，同时链沿流动方向取向，粘度随剪切速率上升而下降，服从幂律（n 小于 1）。第二牛顿区：剪切速率极高，缠结几乎全被破坏、取向已达极限，粘度再次恒定，称无穷剪切粘度。","分子量的影响很陡：超过临界缠结分子量后，零剪切粘度按分子量的 3.4 次方增长。分布的影响见第 3 章：低剪切下宽分布更粘，高剪切下窄分布更粘。","弹性效应是熔体独有的现象：爬杆（韦森堡效应）、挤出胀大（离模膨胀）、熔体破裂。它们都源于法向应力差，是“熔体不只是黏性流体，还储存弹性能”的直接证据。","【真题 1】说明聚合物的蠕变、应力松弛、滞后和内耗现象，并简要说明为什么聚合物具有这些现象。","【真题 2】至少从 5 个方面对比总结脆性断裂与韧性断裂的区别。","【真题 3】为改善聚丙烯的冲击性能，需选择一种橡胶增韧，现有三元乙丙橡胶与氯丁橡胶，应选哪种？说明原因并简述增韧机理。","【真题 4】硫化橡胶试样在 300 K 时用 15 N 拉力拉伸到初始长度的 2 倍，试样横截面为 30 mm×2 mm，橡胶密度为 950 kg/m³，求网链平均分子量 Mc。","【真题 5】某聚合物 140 度时黏度为 1 乘 10 的 5 次方帕秒（Tg 为 110 度），求 160 度时的黏度。","【真题 6】画出非晶态聚合物与结晶聚合物的应力—应变曲线，说明各阶段特征，并指出银纹与剪切带在其中的作用。","【真题 7】印刷浆料为什么要求具有触变性？请结合剪切速率的变化说明其对印刷过程的作用。","★★★　能画三种应力—应变曲线并说明机制","★★★　能对比银纹与剪切带五个方面","★★★　能默写蠕变、应力松弛、滞后、内耗四个定义","★★★　能用 Maxwell、Kelvin 模型解释松弛与蠕变","★★★　能用 WLF 方程做一次完整的温度换算计算","★★★　能用橡胶弹性状态方程算交联点间分子量","★★　能说出脆性断裂与韧性断裂的五项区别","★★　能解释内耗峰为什么出现在 Tg 附近","★　能画出熔体流动三区并说明各区机理"],"imp":4.6,"hot":13},{"id":"gaowu07","no":7,"name":"高物07 高聚物的电学性能","title":"高聚物的电学性能","cards":[{"id":"gaowu07-001","type":"tf","q":"聚合物极性越强，介电常数越大。","a":"对（2 分）。极性基团在电场中取向极化，εr 增大。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"对"},{"id":"gaowu07-002","type":"tf","q":"介电损耗只来自电导损耗，与极化无关。","a":"错（2 分）。介电损耗既包括电导损耗，也包括极化（松弛）损耗。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"错"},{"id":"gaowu07-003","type":"tf","q":"体积电阻率随温度升高而下降。","a":"对（2 分）。升温使离子迁移与链段运动增强，载流子迁移率提高，电阻率下降。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":3,"ord":103,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·判断并说明理由（每题 2 分，共 10 分）·第 3 题","verdict":"对"},{"id":"gaowu07-004","type":"tf","q":"聚合物都是绝缘体，不可能具有导电性。","a":"错（2 分）。共轭聚合物掺杂后、或加导电填料复合后可导电。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":4,"ord":104,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·判断并说明理由（每题 2 分，共 10 分）·第 4 题","verdict":"错"},{"id":"gaowu07-005","type":"tf","q":"表面电阻率低有利于抗静电。","a":"对（2 分）。表面电阻低使电荷迅速泄放，避免静电积累。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":5,"ord":105,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·判断并说明理由（每题 2 分  5 pF。（1）求介电常数 εr；（2）若把薄膜厚度减半，电容变为多少？（3）说明 εr 与厚度的关系。","a":"εr＝Cd／(ε0A)＝5×10⁻¹²×1×10⁻³／(8.85×10⁻¹²×1×10⁻⁴)＝5×10⁻¹⁵／8.85×10⁻¹⁶≈5.65（6 分）；厚度减半，C 加倍＝10 pF（4 分）；εr 是材料常数，与厚度无关，C 与厚度成反比（2 分）。","stars":5,"sec":"计算（16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·计算（16 分）·第 1 题"},{"id":"gaowu07-024","type":"essay","q":"从结构出发，论述如何得到“既绝缘又抗静电”的包装材料，并说明导电高分子与复合型导电的区别。\n错题归因（做完自己填）","a":"基体选非极性或弱极性树脂保证绝缘（εr 小、tanδ 低）（3 分）；加入少量导电填料（炭黑、碳纳米管）使其处于逾渗阈值以下，表面电阻降到 10⁶—10⁹ Ω 即可泄放静电而不导电（4 分）；导电高分子是靠共轭链掺杂载流子导电，复合型是靠填料网络搭接导电（3 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高物07 高聚物的电学性能·论述（12 分）·第 1 题"},{"id":"gaowu07-p001","type":"point","q":"四种极化的机制（简答、选择）","a":"电子、原子、取向、界面，速度依次变慢","stars":5,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 1 条）"},{"id":"gaowu07-p002","type":"point","q":"介电常数的定义与影响因素（简答、计算）","a":"极性越大、取向越易，介电常数越大","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 2 条）"},{"id":"gaowu07-p003","type":"point","q":"介电损耗与损耗角正切（简答、名词解释）","a":"偶极转向滞后，能量转为热","stars":5,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 3 条）"},{"id":"gaowu07-p004","type":"point","q":"介电损耗的温度与频率谱（简答、作图）","a":"Tg 附近出现损耗峰","stars":4,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 4 条）"},{"id":"gaowu07-p005","type":"point","q":"聚合物的导电性（简答、选择）","a":"多数为绝缘体，靠离子或掺杂电子导电","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 5 条）"},{"id":"gaowu07-p006","type":"point","q":"导电高分子与渗流阈值（简答）","a":"掺杂聚乙炔、复合材料的渗流","stars":3,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 6 条）"},{"id":"gaowu07-p007","type":"point","q":"击穿的三种类型（简答）","a":"热击穿、电击穿、放电击穿","stars":3,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 7 条）"},{"id":"gaowu07-p008","type":"point","q":"静电与抗静电（选择）","a":"表面电阻率、抗静电剂","stars":2,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 8 条）"},{"id":"gaowu07-p009","type":"point","q":"介电材料的应用（论述）","a":"电容器薄膜、绝缘、电磁屏蔽、压电","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高物07 高聚物的电学性能·二、考点星级总表（第 9 条）"},{"id":"gaowu07-t010","type":"fill","q":"在交变应变的作用下，材料的动态模量中（　）模量与应变同相，（　）模量与应变的相差为（　）。","a":"储能（实数）模量；损耗（虚数）模量；90 度（即 π/2）。给分点：三空各 0.5 分。储能模量代表每个周期可储存并释放的弹性能，损耗模量代表每周期耗散为热的部分，二者相差 90 度，正是它们构成复模量的实部与虚部。","stars":5,"sec":"八、真题与期末题演练","num":109,"ord":909,"src":"真题","from":"分章节复习资料·高物07 高聚物的电学性能·九、真题与期末题演练"},{"id":"gaowu07-t011","type":"fill","q":"松弛时间 τ 的定义为松弛过程完成（　）所需的时间，τ 越长表示（　）性越强；损耗角 δ 的定义是在交变应力作用下，应变（　）于应力的相位差，δ 越大表示（　）性越强。","a":"63.2%；弹；落后（滞后）；粘。给分点：四空各 0.5 分。应力松弛按指数规律衰减，衰减到初始应力的 1/e 即 36.8% 时，已经完成 63.2%，该时刻就是 τ。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高物07 高聚物的电学性能·九、真题与期末题演练"},{"id":"gaowu07-t012","type":"short","q":"为什么极性聚合物的介电损耗在 Tg 附近出现峰值？请与力学内耗峰作对照说明。","a":"答：介电损耗来自偶极转向滞后于电场。Tg 以下链段被冻结，偶极无法转向，损耗很小；Tg 以上链段自由、偶极转向几乎与电场同步，滞后小，损耗也小；恰在 Tg 附近，链段能够运动但体系粘度大、内摩擦强，偶极转向明显滞后，每周期把大量电能转为热，故出现损耗峰。这与力学内耗峰同源：后者是链段形变滞后于应力，两者都对应“链段能动但阻力大”的状态，峰位也都在 Tg 附近；低温侧的次级峰则对应侧基转动。给分点：机制 3 分，三个温区的对比 3 分，与内耗的对照 2 分。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高物07 高聚物的电学性能·九、真题与期末题演练"}],"reading":["高物07　高聚物的电学性能","一、本章坐标：链段运动在电场里的另一张“体检表”","本章看似独立，其实与第 4 章（玻璃化转变）、第 6 章（黏弹性）是同一套逻辑。在电场里，极性基团（偶极）要转向电场方向，这个过程同样需要链段配合、同样有松弛时间。所以介电损耗随温度的曲线与内耗曲线形状几乎一样，峰位也落在 Tg 附近。学这一章，最好的方法是“对照力学章来读”。","表 1　电学性能考点与重要度","三、极化：四种机制，四种速度","极化是介质在外电场下产生偶极矩的过程。按机制分四种，关键区别在于“响应快慢”。","①电子极化：原子核外的电子云相对原子核偏移，形成瞬时偶极。它极快（10 的负 15 次方秒），所有聚合物都有，贡献小、不随温度变化。②原子极化（离子极化）：正负离子或不同原子相对位移，速度稍慢（10 的负 13 次方秒），只在含极性键的聚合物中明显。③取向极化（偶极极化）：极性基团整体转向电场，速度最慢（10 的负 6 次方秒以上），受链段活动性控制，因此强烈依赖温度与频率——这是本章的核心。④界面极化（空间电荷极化）：在非均相体系（复合材料、含填料、含空隙）中，电荷在界面处堆积，速度最慢，常出现在低频。","图 1　原子极化：正负电荷中心相对位移形成诱导偶极（北化《高分子物理》期末复习课件）","四、介电常数：极化的宏观读数","介电常数（相对介电常数）定义为电容器充入该介质后电容增大的倍数，也等于真空中的电场强度与介质中电场强度之比。极化越强，介质削弱电场的能力越强，介电常数越大。","非极性聚合物（PE、PP、PTFE）只有电子与原子极化，介电常数小（约 2 到 2.5），且随频率与温度几乎不变，是优良的高频绝缘材料。极性聚合物（PVA、尼龙、酚醛）有取向极化，介电常数大（可达 4 到 10 以上），但随频率与温度变化剧烈。","频率的影响：频率很低时，四种极化都跟得上，介电常数最大；频率升高到取向极化跟不上时，取向极化退出，介电常数陡降一阶；再高到原子极化也跟不上，再降一阶。所以介电常数—频率曲线上有台阶，每个台阶对应一种极化的“退出”，台阶处正是损耗峰的位置。","温度的影响：升温使链段活动性提高，取向极化更容易，介电常数上升；但温度过高时热运动扰乱取向，介电常数又下降。对非极性聚合物，温度影响很小。","图 2　（相对）介电常数：长时通电达稳态后，电容增大（电场减弱）的倍数（北化《高分子物理》期末复习课件）","交变电场下，偶极转向总有一点跟不上电场的变化，于是产生相位差 δ。每周期有一部分电能不可逆地转为热，这就是介电损耗，用损耗角正切 tan δ 表示（也等于损耗模量与储能模量之比，与力学章的定义同构）。","损耗由两部分组成：一是电导损耗（漏电流发热），在低频与高温下显著；二是极化损耗（偶极转向滞后），在取向极化退出的频率段显著。工程上，高频绝缘材料要求 tan δ 极小（如 PTFE 约 10 的负 4 次方量级），而微波加热、焊接则要选 tan δ 大的材料。","介电损耗—温度曲线上，极性聚合物在 Tg 附近出现一个陡峭的峰，机制与内耗峰完全相同：Tg 以下偶极被冻住不能转向，损耗小；Tg 以上转向太快、几乎无滞后，损耗也小；Tg 附近能转但阻力大，滞后最大，损耗最大。此外在更低温还会出现次级转变对应的 β 峰（侧基转动）。","图 3　极性高聚物的介电常数与损耗随温度、频率的变化：Tg 附近出现损耗峰（北化《高分子物理》期末复习课件）","六、导电性：绝缘是常态，导电是特例","多数聚合物是优良绝缘体，体积电阻率在 10 的 14 次方欧姆厘米以上。它们的导电靠两类载流子：离子（来自杂质、增塑剂、抗静电剂、聚电解质解离）与电子（在共轭体系中）。","离子导电型：聚电解质、含锂盐的聚合物电解质（锂电池隔膜与固态电解质就是这类）。电导率随含水率与温度升高而增大，服从类似 Arrhenius 的自由体积与链段运动规律——因为离子迁移需要链段帮忙“开门”。","电子导电型：共轭聚合物经掺杂后导电，如碘掺杂的聚乙炔可达金属量级；聚苯胺、聚吡咯、聚噻吩是代表。它们的导电机理是共轭主链上的极化子与双极化子迁移，掺杂的作用是引入载流子并降低能隙。","复合材料导电：把炭黑、碳纳米管、金属粉填入绝缘聚合物，当填料含量达到渗流阈值时，填料形成贯通网络，电阻率骤降几个数量级。渗流阈值与填料形状有关：长径比越大（碳纳米管），阈值越低。","七、击穿与静电：工程上的两条红线","击穿是绝缘失效。分三型：热击穿——介质损耗发热大于散热，温度升高使损耗更大，正反馈直至熔穿，与电压作用时间有关；电击穿——电场直接使电子加速到足以电离分子，形成导电通道，时间极短（微秒级）；放电击穿——介质内部或表面的气体放电（如局部放电、树枝化），多见于高压电缆。","聚合物的耐电压与厚度、温度、频率、缺陷密切相关。薄膜电容器要求高纯度、无缺陷、薄而均匀，就是为了避免局部放电。","静电问题来自表面电阻率高、摩擦起电后电荷无处泄放。改性手段：加抗静电剂（表面活性剂型，靠吸湿形成导电水膜）、加导电填料、表面处理（电晕、等离子）。指标是表面电阻率降到 10 的 9 次方到 10 的 12 次方欧姆。","【真题 1】在交变应变的作用下，材料的动态模量中（　）模量与应变同相，（　）模量与应变的相差为（　）。","【真题 2】松弛时间 τ 的定义为松弛过程完成（　）所需的时间，τ 越长表示（　）性越强；损耗角 δ 的定义是在交变应力作用下，应变（　）于应力的相位差，δ 越大表示（　）性越强。","【真题 3】为什么极性聚合物的介电损耗在 Tg 附近出现峰值？请与力学内耗峰作对照说明。","★★★　能列出四种极化并说明快慢与温度依赖","★★★　能解释介电常数—频率曲线为什么有台阶","★★★　能说明介电损耗峰为什么出现在 Tg 附近","★★　能区分电导损耗与极化损耗","★★　能说出离子导电与电子导电的载流子与代表材料","★★　能解释导电复合材料的渗流阈值与长径比关系","★★　能说出三种击穿类型与特征","★　知道抗静电改性的三种手段"],"imp":3.7,"hot":5}]},{"id":"past","name":"历年真题","short":"真题","color":"#0F766E","chapters":[{"id":"past2023","no":1,"name":"2023 年真题","title":"2023",
