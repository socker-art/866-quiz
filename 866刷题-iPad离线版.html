·M^α。α 在 0.5 到 0.8 之间，反映链在溶液中的形态：α 等于 0.5 对应 θ 状态（无扰线团），α 大于 0.5 表示链被溶剂撑开（良溶剂），α 接近 1 表示链几乎伸直（刚性棒）。所以测一个 α，就能判断溶剂好坏与链的刚性。\n这条方程实际是“粘度法测分子量”的基础：先用一组已知分子量的标样在同样条件下测 [η]，作 lg[η] 对 lgM 的直线，定出 K 与 α，之后测未知样的 [η] 就能反算分子量。这就是北化期末选择题里“乌氏粘度计”的用途。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"特性粘数的定义与 Mark-Houwink 方程（计算、简答）"},{"id":"gaowu02n07","label":"溶胀平衡与交联度（计算、简答）","stars":4,"point":"交联点间分子量越大越易溶胀","imgs":["img/map/m150.jpg","img/map/m151.jpg"],"quiz":[{"id":"gaowu02-013","type":"fill","match":true},{"id":"gaowu02-007","type":"term","match":true},{"id":"gaowu02-024","type":"essay","match":true}],"notes":[{"h":"八、易错清单与自测","t":"★★★　能说清溶解的两阶段，并解释交联体为何只溶胀\n★★★　能用 χ 等于 0.5 解释 θ 状态，并说出它的三层意义\n★★★　能写出 Mark-Houwink 方程，并用 α 判断溶剂好坏与链刚性\n★★★　能说出溶胀平衡与交联度的关系\n★★　能列出三种判断共混相容性的方法\n★★　能解释尼龙为什么溶于甲酚而不溶于水\n★★　知道 GPC 普适标定的思路（流体力学体积）\n★　能说出聚电解质溶液粘度反常的原因\n高频错点把 θ 状态说成“链完全伸展”是大错。θ 状态是链被“抵消”到最自然的蜷曲状态，尺寸最小、最接近自由旋转链的估算，绝不是伸展。"},{"h":"一、本章坐标：唯一能把一条链拿出来量的地方","t":"聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。\n逻辑链：① 溶解过程（先溶胀后溶解，交联体只溶胀） → ② 溶剂选择（相似相溶 + 溶解度参数相近） → ③ 热力学（Flory-Huggins 混合自由能，链段与溶剂的作用） → ④ θ 状态（链段与溶剂作用恰好抵消，链取无扰尺寸） → ⑤ 特性粘数（稀溶液粘度与分子量、链尺寸的关系） → ⑥ 延伸应用（GPC、溶胀平衡、共混相容性）读法：读法：本章的关键词是“抵消”。θ 状态下，链段之间的排斥被溶剂抵消，链的尺寸只由自身几何决定，于是才有了无扰尺寸与标定曲线。\n命题口径866 常考 θ 状态的定义与意义、特性粘数与分子量的关系（Mark-Houwink 方程）、溶胀平衡、共混相容性。2023 年简答第一题就把 θ 状态与 GPC 普适标定绑在一起问，说明这一章的考点是“概念 + 应用”组合式。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"溶胀平衡与交联度（计算、简答）"},{"id":"gaowu02n08","label":"高分子共混的相容性（论述）","stars":4,"point":"混合焓为正故多数不相容","imgs":["img/map/m152.jpg","img/map/m153.jpg","img/map/m154.jpg"],"quiz":[{"id":"gaowu02-024","type":"essay","match":true},{"id":"gaowu02-022","type":"short","match":true},{"id":"gaowu02-001","type":"tf","match":true}],"notes":[{"h":"六、共混相容性：为什么两种好料混不到一起","t":"两种聚合物能不能混成均相，取决于混合自由能。由于聚合物的混合熵极小，几乎不能靠熵来“拉平”焓的正值，所以绝大多数聚合物对是不相容的。判定方法有三：溶解度参数相近、共混物出现单一 Tg（相容则只有一个 Tg，不相容则有两个）、以及相分离形态观察。\n聚丙烯酸与聚丙烯酰胺就是典型的不相容对：两者都含极性基，但一个是羧基、一个是酰胺基，氢键给体与受体不匹配，且链段间的偶极作用使混合焓为正；动力学上，两条链相互扩散极慢，一旦相分离就难以再均化。所以从热力学与动力学两方面都不相容。\n提高相容性的办法：加入嵌段或接枝共聚物作相容剂（一端与 A 相亲、一端与 B 相亲）、引入极性相互作用（氢键、离子键）、或用共聚改变化学组成。工业上 PP 与 EPDM 的增韧共混就是靠乙丙橡胶与 PP 的相近极性获得较好的界面粘结。\n图 4　高分子熔体/溶液在剪切下的弹性效应（爬杆现象）（北化《高分子物理》期末复习课件）"},{"h":"【真题 3】结晶聚合物尼龙在常温下能溶于甲酚，解释原因。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 1 题第（3）问（附标准答案）\n参考答案与给分点：甲酚与尼龙的酰胺基之间能形成氢键，溶剂与结晶聚合物中非晶区的强烈作用产生大量热，此热量足以破坏晶格，使结晶部分熔融，随后链被溶剂包围而溶解。给分点：氢键作用 1 分、破坏晶格并使晶区熔融 2 分。\n【真题 4】聚丙烯酸与聚丙烯酰胺都是极性聚合物，为什么两者共混时不相容？请从热力学与动力学两方面说明。\n来源：四川大学 866（2023 年真题解析）·简答题第 7 题\n参考答案与给分点：热力学上：相容要求混合自由能小于零。两者的混合熵都很小（聚合物的构象数远少于同数目小分子），无法抵消焓项；而羧基与酰胺基的氢键给体—受体匹配不好，链段间的偶极排斥使混合焓为正，即相互作用参数大于 0.5，故混合自由能为正，体系倾向于相分离。动力学上：两条高分子链的相互扩散速度极慢、缠结使界面难以充分混合，一旦发生相分离就难以再均化，因此即使理论上存在亚稳区，实际也表现为不相容。判断手段可用溶解度参数比较、观察是否出现两个 Tg、以及电镜下的两相形态。给分点：混合熵小与焓为正各 2 分，动力学扩散慢 2 分，判断方法 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"高分子共混的相容性（论述）"},{"id":"gaowu02n09","label":"聚电解质与离聚物（选择）","stars":4,"point":"电离后链伸展，粘度反常","imgs":[],"quiz":[],"notes":[{"h":"八、易错清单与自测","t":"★★★　能说清溶解的两阶段，并解释交联体为何只溶胀\n★★★　能用 χ 等于 0.5 解释 θ 状态，并说出它的三层意义\n★★★　能写出 Mark-Houwink 方程，并用 α 判断溶剂好坏与链刚性\n★★★　能说出溶胀平衡与交联度的关系\n★★　能列出三种判断共混相容性的方法\n★★　能解释尼龙为什么溶于甲酚而不溶于水\n★★　知道 GPC 普适标定的思路（流体力学体积）\n★　能说出聚电解质溶液粘度反常的原因\n高频错点把 θ 状态说成“链完全伸展”是大错。θ 状态是链被“抵消”到最自然的蜷曲状态，尺寸最小、最接近自由旋转链的估算，绝不是伸展。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"聚电解质与离聚物（选择）"},{"id":"gaowu02n10","label":"溶液粘度与切变速率（简答）","stars":3,"point":"非牛顿性来自链的取向与解缠","imgs":["img/map/m155.jpg","img/map/m156.jpg"],"quiz":[{"id":"gaowu02-006","type":"term","match":true},{"id":"gaowu02-001","type":"tf","match":true},{"id":"gaowu02-005","type":"tf","match":true}],"notes":[{"h":"一、本章坐标：唯一能把一条链拿出来量的地方","t":"聚合物在熔体里被邻居缠着，在固体里被晶格锁着，只有在稀溶液里它才是自由的一条链。所以分子量测定、链尺寸测定、GPC 全在溶液里做。本章就是把这条自由链的性质说清楚：它多大、它怎么溶、它什么时候最“理想”。\n逻辑链：① 溶解过程（先溶胀后溶解，交联体只溶胀） → ② 溶剂选择（相似相溶 + 溶解度参数相近） → ③ 热力学（Flory-Huggins 混合自由能，链段与溶剂的作用） → ④ θ 状态（链段与溶剂作用恰好抵消，链取无扰尺寸） → ⑤ 特性粘数（稀溶液粘度与分子量、链尺寸的关系） → ⑥ 延伸应用（GPC、溶胀平衡、共混相容性）读法：读法：本章的关键词是“抵消”。θ 状态下，链段之间的排斥被溶剂抵消，链的尺寸只由自身几何决定，于是才有了无扰尺寸与标定曲线。\n命题口径866 常考 θ 状态的定义与意义、特性粘数与分子量的关系（Mark-Houwink 方程）、溶胀平衡、共混相容性。2023 年简答第一题就把 θ 状态与 GPC 普适标定绑在一起问，说明这一章的考点是“概念 + 应用”组合式。"},{"h":"五、特性粘数：一条链在溶液里有多“占地方”","t":"稀溶液的粘度比纯溶剂高，高出的部分与聚合物占据的流体力学体积有关。定义相对粘度、增比粘度，再外推到浓度为零，得到特性粘数 [η]，单位是体积与质量之比（mL/g 或 dL/g）。\n特性粘数与分子量的关系是 Mark-Houwink 方程：[η] = K·M^α。α 在 0.5 到 0.8 之间，反映链在溶液中的形态：α 等于 0.5 对应 θ 状态（无扰线团），α 大于 0.5 表示链被溶剂撑开（良溶剂），α 接近 1 表示链几乎伸直（刚性棒）。所以测一个 α，就能判断溶剂好坏与链的刚性。\n这条方程实际是“粘度法测分子量”的基础：先用一组已知分子量的标样在同样条件下测 [η]，作 lg[η] 对 lgM 的直线，定出 K 与 α，之后测未知样的 [η] 就能反算分子量。这就是北化期末选择题里“乌氏粘度计”的用途。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"溶液粘度与切变速率（简答）"},{"label":"第二维里系数 A2、χ 与 θ 状态的统一判断","stars":5,"point":"A2 表征稀溶液中链段间有效排斥及高分子—溶剂相互作用；θ条件下 A2=0、排除体积效应消失、链取无扰尺寸。χ=1/2 是常见平均场判据，具体关系须注明所用模型。","notesTitle":"真题补漏讲解","notes":[{"h":"把 A2、χ、温度和链尺寸串成一条线","t":"膜渗透压稀溶液外推式可写为 π/c=RT(1/Mn+A2c+…)，所以 π/c 对 c 作图的斜率与 A2 有关，截距用于求 Mn。\n\n在常见 UCST 型体系中，溶剂变良通常表现为 A2 增大、链线团膨胀；θ条件时 A2=0，链取无扰尺寸；劣溶剂中 A2 可为负。Flory-Huggins 稀溶液理论常把 θ点与 χ=1/2 联系起来。\n\n温度影响不能无限推广：具有 LCST 或复杂相互作用的体系未必“升温一定使 A2 增大”。选择题若没有给温区，只能按命题采用的通常模型判断，并保留这一条件。"}],"quiz":[{"id":"past2023-006","type":"mcq","match":true}],"added":true,"id":"gaowu02n11","imgs":[],"quizAudited":true,"fullLabel":"第二维里系数 A2、χ 与 θ 状态的统一判断","importanceBasis":"已录2021—2023真题与课程体系补漏"}],"logic":{"question":"高分子与溶剂怎样相互作用？何时达到无扰状态，黏度与相容性如何变化？","role":"把孤立链放入溶剂：用混合自由能和排除体积解释溶胀、θ状态、无扰尺寸及共混相容性。","input":"链柔性、链统计尺寸、支化与交联","output":"溶解/溶胀、χ与A2、θ状态、特性黏数和相容性","prev":"gaowu01","next":"gaowu03","links":[{"cid":"gaowu03","text":"黏度法、渗透压和 GPC 都以合适溶液为前提"},{"cid":"gaohua08","text":"交联网络的溶胀平衡连接化学改性与物性测量"}],"focus":["溶解与溶胀、溶剂选择","Flory-Huggins 相互作用参数、A2 与 θ 状态","无扰尺寸与特性黏数、Mark-Houwink 方程","聚电解质黏度和共混相容性"],"common":["由 χ、A2 或温度判断溶剂优劣与链尺寸","解释 θ 溶剂/θ 温度和无扰状态的意义","用 Mark-Houwink 方程计算黏均分子量","解释聚电解质中和或加盐时的黏度变化","从混合自由能讨论共混相容与增容"],"examRefs":["past2023-005","past2023-006","past2021-015","past2021-022"]},"examRefs":["past2023-005","past2023-006","past2021-015","past2021-022"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":1,"nodes":11,"withQuiz":10,"examRefs":4,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu03":{"title":"分子量及其分布","subject":"gaowu","nodes":[{"id":"gaowu03n01","label":"四种平均分子量的定义与大小关系（计算、简答）","stars":5,"point":"Mn 小于 Mv 小于 Mw 小于 Mz","imgs":["img/map/m157.jpg","img/map/m158.jpg","img/map/m159.jpg"],"quiz":[{"id":"gaowu03-007","type":"term","match":true},{"id":"gaowu03-001","type":"tf","match":true},{"id":"gaowu03-009","type":"fill","match":true}],"notes":[{"h":"表 2　四种平均分子量的比较","t":"名称 ｜ 权重 ｜ 物理意义 ｜ 常用测定\n数均 Mn ｜ 个数 ｜ 按分子个数平均，小分子影响大 ｜ 端基、渗透压、GPC\n重均 Mw ｜ 质量 ｜ 按质量平均，大分子影响大 ｜ 光散射、GPC\nZ 均 Mz ｜ 质量的平方 ｜ 对最大的链最敏感 ｜ 超速离心、GPC\n粘均 Mv ｜ 按粘度定义 ｜ 介于 Mn 与 Mw 之间 ｜ 乌氏粘度计"},{"h":"三、四种平均分子量：四个矩","t":"设第 i 种分子有 Ni 个、分子量为 Mi。数均 Mn 是总质量除以总个数，等价于按个数加权；重均 Mw 按质量加权，分子量大的链权重大；Z 均 Mz 按质量的平方加权，对最大的链最敏感；粘均 Mv 由溶液粘度定义，介于 Mn 与 Mw 之间。\n因为加权次数依次升高，所以恒有 Mn 小于 Mv 小于 Mw 小于 Mz。当分布极窄（单分散）时四者相等；分布越宽，四者差距越大。北化期末的选择题问“哪种平均分子量最小”，答案就是数均。\n例题：某试样中分子量 10 万的链占总质量 50%，20 万的占 50%，求 Mn、Mw、Mv 与 d。\n解：设总质量 100 g，则两类链各 50 g，物质的量分别为 5×10 的负 4 次方 mol 与 2.5×10 的负 4 次方 mol，合计 7.5×10 的负 4 次方 mol。Mn 等于 100 g 除以该总量，得 13.3 万；Mw 等于质量加权平均，得 15 万；d 等于 15 比 13.3，约 1.13。Mv 介于两者之间，约为 14.6 万（按 α 等于 0.7 计算）。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"四种平均分子量的定义与大小关系（计算、简答）"},{"id":"gaowu03n02","label":"数均与重均的权重差别（名词解释、计算）","stars":4,"point":"Mn 按个数加权，Mw 按质量加权","imgs":[],"quiz":[{"id":"gaowu03-006","type":"term","match":true},{"id":"gaowu03-001","type":"tf","match":true},{"id":"gaowu03-004","type":"tf","match":true}],"notes":[{"h":"七、真题与期末题演练","t":"【真题 1】简述用 GPC 测定聚合物数均分子量、重均分子量、粘均分子量与多分散系数的实验步骤与数据处理方法。\n来源：四川大学 866（2023 年真题解析）·简答题第 6 题\n参考答案与给分点：步骤：①将样品溶于合适溶剂并配成约 1 至 3 mg/mL 的稀溶液，经 0.45 微米滤膜过滤；②用一组已知分子量的窄分布标样，在同一柱、同一溶剂、同一流速与温度下进样，建立淋洗体积与分子量的标定曲线，若测定的是其他聚合物则用普适标定换算；③进样并用示差折光检测器记录信号，得到淋出曲线；④由标定曲线把淋洗体积换算成分子量、由信号强度换算成该级分的浓度，得到分子量分布曲线；⑤按定义式对分布积分，分别求得 Mn、Mw、Mz 与 d。粘均分子量需借助该体系在该溶剂与温度下的 Mark-Houwink 常数 K 与 α，由分布曲线按粘度平均的定义式换算。给分点：制样 1 分、标定 2 分、数据换算 2 分、积分求各平均值 2 分、Mv 的换算条件 1 分。\n【真题 2】根据统计方法的不同有多种平均分子量，其中最小的为：A 数均分子量　B 重均分子量　C Z 均分子量　D 粘均分子量\n来源：北京化工大学《高分子物理》期末试题 A 卷·选择题第 10 题（附标准答案）\n参考答案与给分点：答 A。因为加权次数依次升高（个数、质量、质量的平方），故 Mn 最小；粘均介于数均与重均之间，故 Mv 大于 Mn。给分点：选对 2 分。\n【真题 3】对于相同分子量、不同分子量分布的聚合物流体，在低剪切速率下，分子量分布（　）的粘度高；在高剪切速率下，分子量分布（　）的粘度高。\n来源：北京化工大学《高分子物理》期末试题 A 卷·填空题第 14 题（附标准答案）\n参考答案与给分点：宽；窄。给分点：两空各 0.5 分。低剪切时宽分布的高分子量尾巴主导粘度；高剪切时切力使宽分布中的大分子先取向、解缠，粘度下降更多，故窄分布反而显得粘。"},{"h":"三、四种平均分子量：四个矩","t":"设第 i 种分子有 Ni 个、分子量为 Mi。数均 Mn 是总质量除以总个数，等价于按个数加权；重均 Mw 按质量加权，分子量大的链权重大；Z 均 Mz 按质量的平方加权，对最大的链最敏感；粘均 Mv 由溶液粘度定义，介于 Mn 与 Mw 之间。\n因为加权次数依次升高，所以恒有 Mn 小于 Mv 小于 Mw 小于 Mz。当分布极窄（单分散）时四者相等；分布越宽，四者差距越大。北化期末的选择题问“哪种平均分子量最小”，答案就是数均。\n例题：某试样中分子量 10 万的链占总质量 50%，20 万的占 50%，求 Mn、Mw、Mv 与 d。\n解：设总质量 100 g，则两类链各 50 g，物质的量分别为 5×10 的负 4 次方 mol 与 2.5×10 的负 4 次方 mol，合计 7.5×10 的负 4 次方 mol。Mn 等于 100 g 除以该总量，得 13.3 万；Mw 等于质量加权平均，得 15 万；d 等于 15 比 13.3，约 1.13。Mv 介于两者之间，约为 14.6 万（按 α 等于 0.7 计算）。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"数均与重均的权重差别（名词解释、计算）"},{"id":"gaowu03n03","label":"端基分析法（简答、选择）","stars":3,"point":"只适合分子量较小（小于 2 万）的线形物","imgs":["img/map/m160.jpg"],"quiz":[{"id":"gaowu03-003","type":"tf","match":true},{"id":"gaowu03-020","type":"short","match":true},{"id":"gaowu03-010","type":"fill","match":true}],"notes":[{"h":"四、测定方法：绝对法与相对法","t":"所谓绝对法，是不依赖标样、由基本原理直接得到分子量；相对法则必须先用已知标样标定。这个区分是简答题的常客。\n端基分析法：测链端官能团的数目，除以样品质量即得每克链的摩尔数，取倒数就是 Mn。它是绝对法，但只适用于分子量不大（一般小于 2 万）、且每条链端基数目已知的线形聚合物。分子量一大，端基含量低到测不出来。\n膜渗透压法：利用溶液的依数性，渗透压与溶质的摩尔浓度成正比，因此直接给出 Mn。它也是绝对法，适合 2 万到 100 万的范围，但小分子杂质会干扰，且平衡时间长。\n光散射法：散射光强与分子的质量及尺寸有关，通过 Zimm 作图外推到零浓度、零角度，可同时得到 Mw 与回转半径。它是绝对法，测量范围最宽，是大分子量的首选。\n粘度法：设备最简单，用乌氏粘度计测几个浓度下的流出时间，外推到零浓度得特性粘数，再由 Mark-Houwink 方程算 Mv。它是相对法，必须先定 K 与 α，但胜在快速、便宜，是工业最常用的方法。"},{"h":"八、易错清单与自测","t":"★★★　能写出四种平均分子量的定义式，并证明 Mn 小于 Mw\n★★★　能用质量分数数据算出 Mn、Mw、d\n★★★　能说出哪种方法是绝对法、哪种是相对法，并各举一例\n★★★　能完整叙述 GPC 的分离原理与普适标定思路\n★★　能说明端基分析为什么只适合小分子量\n★★　能解释 d 值对加工与力学性能的双向影响\n★★　知道分子量超过临界值后强度趋平、粘度暴增的现象\n★　能说出 Mv 为什么介于 Mn 与 Mw 之间\n一句话总结本章所有方法的差别，都是“测的是哪个矩”。Mn 靠依数性，Mw 靠散射，分布靠分离，粘度靠流体力学体积。记住这个对应，选择题不会错。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"端基分析法（简答、选择）"},{"id":"gaowu03n04","label":"膜渗透压法（简答）","stars":4,"point":"绝对法测 Mn，依数性原理","imgs":["img/map/m161.jpg","img/map/m162.jpg"],"quiz":[{"id":"gaowu03-004","type":"tf","match":true},{"id":"gaowu03-020","type":"short","match":true},{"id":"gaowu03-010","type":"fill","match":true}],"notes":[{"h":"四、测定方法：绝对法与相对法","t":"所谓绝对法，是不依赖标样、由基本原理直接得到分子量；相对法则必须先用已知标样标定。这个区分是简答题的常客。\n端基分析法：测链端官能团的数目，除以样品质量即得每克链的摩尔数，取倒数就是 Mn。它是绝对法，但只适用于分子量不大（一般小于 2 万）、且每条链端基数目已知的线形聚合物。分子量一大，端基含量低到测不出来。\n膜渗透压法：利用溶液的依数性，渗透压与溶质的摩尔浓度成正比，因此直接给出 Mn。它也是绝对法，适合 2 万到 100 万的范围，但小分子杂质会干扰，且平衡时间长。\n光散射法：散射光强与分子的质量及尺寸有关，通过 Zimm 作图外推到零浓度、零角度，可同时得到 Mw 与回转半径。它是绝对法，测量范围最宽，是大分子量的首选。\n粘度法：设备最简单，用乌氏粘度计测几个浓度下的流出时间，外推到零浓度得特性粘数，再由 Mark-Houwink 方程算 Mv。它是相对法，必须先定 K 与 α，但胜在快速、便宜，是工业最常用的方法。"},{"h":"一、本章坐标：为什么同一个牌号要报两个数","t":"买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。\n逻辑链：① 分布的存在（每条链的引发、增长、终止时刻不同） → ② 四种平均值（按个数、按质量、按更高次矩加权） → ③ 测定方法（端基、渗透压、光散射、粘度、GPC） → ④ 分布宽度（多分散系数 d 与分布曲线） → ⑤ 性能后果（Tg、强度、熔体粘度都对分布敏感）读法：读法：Mn 与 Mw 的差别不在公式，而在“谁权重更大”。Mn 让小分子说话，Mw 让大分子说话，所以 Mw 永远大于等于 Mn，两者之比就是分布宽度。\n命题口径本章既有计算（给分布算 Mn、Mw、d），也有简答（GPC 的原理与普适标定、四种方法各自的绝对性与相对性）。2023 年真题的第六题就是一整道 GPC 测分子量与分布的操作题，必须能按步骤写下来。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"膜渗透压法（简答）"},{"id":"gaowu03n05","label":"光散射法（简答）","stars":4,"point":"绝对法测 Mw，测散射光强与浓度、角度","imgs":[],"quiz":[{"id":"gaowu03-020","type":"short","match":true},{"id":"gaowu03-010","type":"fill","match":true}],"notes":[{"h":"四、测定方法：绝对法与相对法","t":"所谓绝对法，是不依赖标样、由基本原理直接得到分子量；相对法则必须先用已知标样标定。这个区分是简答题的常客。\n端基分析法：测链端官能团的数目，除以样品质量即得每克链的摩尔数，取倒数就是 Mn。它是绝对法，但只适用于分子量不大（一般小于 2 万）、且每条链端基数目已知的线形聚合物。分子量一大，端基含量低到测不出来。\n膜渗透压法：利用溶液的依数性，渗透压与溶质的摩尔浓度成正比，因此直接给出 Mn。它也是绝对法，适合 2 万到 100 万的范围，但小分子杂质会干扰，且平衡时间长。\n光散射法：散射光强与分子的质量及尺寸有关，通过 Zimm 作图外推到零浓度、零角度，可同时得到 Mw 与回转半径。它是绝对法，测量范围最宽，是大分子量的首选。\n粘度法：设备最简单，用乌氏粘度计测几个浓度下的流出时间，外推到零浓度得特性粘数，再由 Mark-Houwink 方程算 Mv。它是相对法，必须先定 K 与 α，但胜在快速、便宜，是工业最常用的方法。"},{"h":"一、本章坐标：为什么同一个牌号要报两个数","t":"买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。\n逻辑链：① 分布的存在（每条链的引发、增长、终止时刻不同） → ② 四种平均值（按个数、按质量、按更高次矩加权） → ③ 测定方法（端基、渗透压、光散射、粘度、GPC） → ④ 分布宽度（多分散系数 d 与分布曲线） → ⑤ 性能后果（Tg、强度、熔体粘度都对分布敏感）读法：读法：Mn 与 Mw 的差别不在公式，而在“谁权重更大”。Mn 让小分子说话，Mw 让大分子说话，所以 Mw 永远大于等于 Mn，两者之比就是分布宽度。\n命题口径本章既有计算（给分布算 Mn、Mw、d），也有简答（GPC 的原理与普适标定、四种方法各自的绝对性与相对性）。2023 年真题的第六题就是一整道 GPC 测分子量与分布的操作题，必须能按步骤写下来。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"光散射法（简答）"},{"id":"gaowu03n06","label":"粘度法（计算）","stars":4,"point":"相对法，需先用标样定 K 与 α","imgs":[],"quiz":[{"id":"gaowu03-020","type":"short","match":true},{"id":"gaowu03-010","type":"fill","match":true}],"notes":[{"h":"一、本章坐标：为什么同一个牌号要报两个数","t":"买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。\n逻辑链：① 分布的存在（每条链的引发、增长、终止时刻不同） → ② 四种平均值（按个数、按质量、按更高次矩加权） → ③ 测定方法（端基、渗透压、光散射、粘度、GPC） → ④ 分布宽度（多分散系数 d 与分布曲线） → ⑤ 性能后果（Tg、强度、熔体粘度都对分布敏感）读法：读法：Mn 与 Mw 的差别不在公式，而在“谁权重更大”。Mn 让小分子说话，Mw 让大分子说话，所以 Mw 永远大于等于 Mn，两者之比就是分布宽度。\n命题口径本章既有计算（给分布算 Mn、Mw、d），也有简答（GPC 的原理与普适标定、四种方法各自的绝对性与相对性）。2023 年真题的第六题就是一整道 GPC 测分子量与分布的操作题，必须能按步骤写下来。"},{"h":"三、四种平均分子量：四个矩","t":"设第 i 种分子有 Ni 个、分子量为 Mi。数均 Mn 是总质量除以总个数，等价于按个数加权；重均 Mw 按质量加权，分子量大的链权重大；Z 均 Mz 按质量的平方加权，对最大的链最敏感；粘均 Mv 由溶液粘度定义，介于 Mn 与 Mw 之间。\n因为加权次数依次升高，所以恒有 Mn 小于 Mv 小于 Mw 小于 Mz。当分布极窄（单分散）时四者相等；分布越宽，四者差距越大。北化期末的选择题问“哪种平均分子量最小”，答案就是数均。\n例题：某试样中分子量 10 万的链占总质量 50%，20 万的占 50%，求 Mn、Mw、Mv 与 d。\n解：设总质量 100 g，则两类链各 50 g，物质的量分别为 5×10 的负 4 次方 mol 与 2.5×10 的负 4 次方 mol，合计 7.5×10 的负 4 次方 mol。Mn 等于 100 g 除以该总量，得 13.3 万；Mw 等于质量加权平均，得 15 万；d 等于 15 比 13.3，约 1.13。Mv 介于两者之间，约为 14.6 万（按 α 等于 0.7 计算）。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"粘度法（计算）"},{"id":"gaowu03n07","label":"GPC的原理（论述、简答）","stars":5,"point":"体积排除，按流体力学体积分离","imgs":["img/map/m163.jpg"],"quiz":[{"id":"gaowu03-011","type":"fill","match":true},{"id":"gaowu03-020","type":"short","match":true},{"id":"gaowu03-021","type":"short","match":true}],"notes":[{"h":"五、GPC：本章的主角","t":"凝胶渗透色谱（GPC，也称体积排除色谱）的原理不是“按分子量大小分开”，而是按流体力学体积分开。柱子内部填满多孔凝胶，大分子的流体力学体积大，进不去孔，只能从颗粒间隙流过，路程短、先出来；小分子能钻进孔里，路程长、后出来。所以淋出体积越大，分子量越小。\n这个“按体积而非按质量”的机制带来一个好处：只要两种聚合物的流体力学体积相同，它们在柱子上的行为就相同。于是可以把一种聚合物的标定曲线换算给另一种聚合物使用，这就是普适标定。换算的桥梁是 Mark-Houwink 方程，因为流体力学体积正比于特性粘数与分子量的乘积。\n测一套分子量分布的步骤：①样品溶解、过滤，配成稀溶液；②用一组窄分布标样建立淋洗体积与分子量的标定曲线（或做普适标定）；③进样，记录示差折光检测器的信号随淋洗体积的变化；④把信号换算成浓度、把淋洗体积换算成分子量，得到分布曲线；⑤对分布曲线积分，算出 Mn、Mw、Mz 与 d。\n图 1　GPC 的分离原理：按流体力学体积（扩张体积）分离，同一保留时间对应同样大小的线团（北化《高分子物理》期末复习课件）\n图 2　GPC 的标定曲线与分子量分布的计算（北化《高分子物理》期末复习总结）\n图 3　分子量分布曲线与多分散系数的求法（北化《高分子物理》期末复习总结）\n常见追问问“GPC 能不能给出 Mv”，答：需要借助 Mark-Houwink 关系由分布曲线换算，因此必须知道该聚合物在该溶剂、该温度下的 K 与 α，否则只能给 Mn、Mw、Mz。"},{"h":"一、本章坐标：为什么同一个牌号要报两个数","t":"买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。\n逻辑链：① 分布的存在（每条链的引发、增长、终止时刻不同） → ② 四种平均值（按个数、按质量、按更高次矩加权） → ③ 测定方法（端基、渗透压、光散射、粘度、GPC） → ④ 分布宽度（多分散系数 d 与分布曲线） → ⑤ 性能后果（Tg、强度、熔体粘度都对分布敏感）读法：读法：Mn 与 Mw 的差别不在公式，而在“谁权重更大”。Mn 让小分子说话，Mw 让大分子说话，所以 Mw 永远大于等于 Mn，两者之比就是分布宽度。\n命题口径本章既有计算（给分布算 Mn、Mw、d），也有简答（GPC 的原理与普适标定、四种方法各自的绝对性与相对性）。2023 年真题的第六题就是一整道 GPC 测分子量与分布的操作题，必须能按步骤写下来。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"GPC 的原理（论述、简答）"},{"id":"gaowu03n08","label":"GPC的普适标定（简答）","stars":4,"point":"用流体力学体积把不同聚合物归一","imgs":[],"quiz":[{"id":"gaowu03-013","type":"fill","match":true},{"id":"gaowu03-011","type":"fill","match":true},{"id":"gaowu03-021","type":"short","match":true}],"notes":[{"h":"五、GPC：本章的主角","t":"凝胶渗透色谱（GPC，也称体积排除色谱）的原理不是“按分子量大小分开”，而是按流体力学体积分开。柱子内部填满多孔凝胶，大分子的流体力学体积大，进不去孔，只能从颗粒间隙流过，路程短、先出来；小分子能钻进孔里，路程长、后出来。所以淋出体积越大，分子量越小。\n这个“按体积而非按质量”的机制带来一个好处：只要两种聚合物的流体力学体积相同，它们在柱子上的行为就相同。于是可以把一种聚合物的标定曲线换算给另一种聚合物使用，这就是普适标定。换算的桥梁是 Mark-Houwink 方程，因为流体力学体积正比于特性粘数与分子量的乘积。\n测一套分子量分布的步骤：①样品溶解、过滤，配成稀溶液；②用一组窄分布标样建立淋洗体积与分子量的标定曲线（或做普适标定）；③进样，记录示差折光检测器的信号随淋洗体积的变化；④把信号换算成浓度、把淋洗体积换算成分子量，得到分布曲线；⑤对分布曲线积分，算出 Mn、Mw、Mz 与 d。\n图 1　GPC 的分离原理：按流体力学体积（扩张体积）分离，同一保留时间对应同样大小的线团（北化《高分子物理》期末复习课件）\n图 2　GPC 的标定曲线与分子量分布的计算（北化《高分子物理》期末复习总结）\n图 3　分子量分布曲线与多分散系数的求法（北化《高分子物理》期末复习总结）\n常见追问问“GPC 能不能给出 Mv”，答：需要借助 Mark-Houwink 关系由分布曲线换算，因此必须知道该聚合物在该溶剂、该温度下的 K 与 α，否则只能给 Mn、Mw、Mz。"},{"h":"一、本章坐标：为什么同一个牌号要报两个数","t":"买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。\n逻辑链：① 分布的存在（每条链的引发、增长、终止时刻不同） → ② 四种平均值（按个数、按质量、按更高次矩加权） → ③ 测定方法（端基、渗透压、光散射、粘度、GPC） → ④ 分布宽度（多分散系数 d 与分布曲线） → ⑤ 性能后果（Tg、强度、熔体粘度都对分布敏感）读法：读法：Mn 与 Mw 的差别不在公式，而在“谁权重更大”。Mn 让小分子说话，Mw 让大分子说话，所以 Mw 永远大于等于 Mn，两者之比就是分布宽度。\n命题口径本章既有计算（给分布算 Mn、Mw、d），也有简答（GPC 的原理与普适标定、四种方法各自的绝对性与相对性）。2023 年真题的第六题就是一整道 GPC 测分子量与分布的操作题，必须能按步骤写下来。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"GPC 的普适标定（简答）"},{"id":"gaowu03n09","label":"多分散系数d与分布曲线（计算、简答）","stars":4,"point":"d 等于 Mw 比 Mn，缩聚约 2","imgs":["img/map/m164.jpg","img/map/m165.jpg","img/map/m166.jpg"],"quiz":[{"id":"gaowu03-005","type":"tf","match":true},{"id":"gaowu03-019","type":"mcq","match":true},{"id":"gaowu03-024","type":"essay","match":true}],"notes":[{"h":"一、本章坐标：为什么同一个牌号要报两个数","t":"买塑料时供应商会给熔指，买橡胶时会给门尼粘度，但做研究时一定要报 Mn 与 Mw。原因是聚合物的分子量是一个分布，任何一个“平均值”都只是这个分布的一个矩。报一个数等于只说了身高不说体重，信息不全。\n逻辑链：① 分布的存在（每条链的引发、增长、终止时刻不同） → ② 四种平均值（按个数、按质量、按更高次矩加权） → ③ 测定方法（端基、渗透压、光散射、粘度、GPC） → ④ 分布宽度（多分散系数 d 与分布曲线） → ⑤ 性能后果（Tg、强度、熔体粘度都对分布敏感）读法：读法：Mn 与 Mw 的差别不在公式，而在“谁权重更大”。Mn 让小分子说话，Mw 让大分子说话，所以 Mw 永远大于等于 Mn，两者之比就是分布宽度。\n命题口径本章既有计算（给分布算 Mn、Mw、d），也有简答（GPC 的原理与普适标定、四种方法各自的绝对性与相对性）。2023 年真题的第六题就是一整道 GPC 测分子量与分布的操作题，必须能按步骤写下来。"},{"h":"五、GPC：本章的主角","t":"凝胶渗透色谱（GPC，也称体积排除色谱）的原理不是“按分子量大小分开”，而是按流体力学体积分开。柱子内部填满多孔凝胶，大分子的流体力学体积大，进不去孔，只能从颗粒间隙流过，路程短、先出来；小分子能钻进孔里，路程长、后出来。所以淋出体积越大，分子量越小。\n这个“按体积而非按质量”的机制带来一个好处：只要两种聚合物的流体力学体积相同，它们在柱子上的行为就相同。于是可以把一种聚合物的标定曲线换算给另一种聚合物使用，这就是普适标定。换算的桥梁是 Mark-Houwink 方程，因为流体力学体积正比于特性粘数与分子量的乘积。\n测一套分子量分布的步骤：①样品溶解、过滤，配成稀溶液；②用一组窄分布标样建立淋洗体积与分子量的标定曲线（或做普适标定）；③进样，记录示差折光检测器的信号随淋洗体积的变化；④把信号换算成浓度、把淋洗体积换算成分子量，得到分布曲线；⑤对分布曲线积分，算出 Mn、Mw、Mz 与 d。\n图 1　GPC 的分离原理：按流体力学体积（扩张体积）分离，同一保留时间对应同样大小的线团（北化《高分子物理》期末复习课件）\n图 2　GPC 的标定曲线与分子量分布的计算（北化《高分子物理》期末复习总结）\n图 3　分子量分布曲线与多分散系数的求法（北化《高分子物理》期末复习总结）\n常见追问问“GPC 能不能给出 Mv”，答：需要借助 Mark-Houwink 关系由分布曲线换算，因此必须知道该聚合物在该溶剂、该温度下的 K 与 α，否则只能给 Mn、Mw、Mz。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"多分散系数 d 与分布曲线（计算、简答）"},{"id":"gaowu03n10","label":"分子量对性能的影响（论述）","stars":4,"point":"Tg、强度、粘度都有一个临界值","imgs":["img/map/m167.jpg","img/map/m168.jpg","img/map/m169.jpg"],"quiz":[{"id":"gaowu03-024","type":"essay","match":true},{"id":"gaowu03-023","type":"calc","match":true},{"id":"gaowu03-006","type":"term","match":true}],"notes":[{"h":"表 4　分子量与分布对性能的影响","t":"性能 ｜ 随分子量升高 ｜ 随分布变宽 ｜ 工程含义\nTg ｜ 先升后平（约 2 万后趋于定值） ｜ 影响小 ｜ 低分子量增塑效应降低 Tg\n拉伸强度 ｜ 升高，超过临界值后趋平 ｜ 低分子量尾巴使强度下降 ｜ 管材、纤维要窄分布\n熔体粘度 ｜ 按 3.4 次方增长 ｜ 低剪切下更粘，高剪切下更易流动 ｜ 宽分布利于加工\n耐应力开裂 ｜ 升高 ｜ 下降 ｜ 瓶级 PET 要高分子量窄分布"},{"h":"六、分布宽度与性能：不是越小越好","t":"多分散系数 d 等于 Mw 比 Mn。缩聚产物按 Flory 最可几分布，d 约等于 2；自由基聚合因终止与转移并存，d 常在 2 到 5；阴离子活性聚合接近单分散，d 可小到 1.05；配位聚合视催化剂，常在 2 到 8。\n分布对性能的影响是双向的。加工上，宽分布有利于“低分子量部分起增塑作用、高分子量部分提供强度”，所以挤出吹塑常用宽分布牌号；但宽分布也使熔体弹性变大、容易出现熔体破裂。力学上，低分子量尾巴会降低强度与耐应力开裂性，所以管材、纤维要求窄分布。\n分子量本身也有一个门槛：当 Mn 超过某一临界值后，拉伸强度、冲击强度基本不再上升，但熔体粘度却继续按 3.4 次方增长。这个临界值通常在几万到十几万，工程上就是“够用就好，再高只是难加工”。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"分子量对性能的影响（论述）"}],"logic":{"question":"不同统计权重的平均分子量怎样测量？完整分布如何获得并影响性能？","role":"把绪论的分子量概念变成实验量：先区分 Mn/Mw/Mv，再选择端基、渗透、光散射、黏度和 GPC。","input":"平均分子量定义、聚合物稀溶液","output":"绝对/相对测定方法、GPC 普适标定与分布—性能联系","prev":"gaowu02","next":"gaowu04","links":[{"cid":"gaowu02","text":"A2、θ状态和 Mark-Houwink 是渗透压与黏度法的理论基础"},{"cid":"gaowu06","text":"分子量及分布继续影响熔体流动性、强度和韧性"}],"focus":["Mn/Mw/Mv 的权重与大小关系","各测定方法的原理、对象和绝对/相对属性","GPC 体积排除机理与普适标定","分布宽度与加工/使用性能"],"common":["由级分数据计算 Mn、Mw 与 d","比较渗透压、光散射和黏度法得到哪种平均分子量","解释 GPC 淋出顺序并用 M·[η] 做普适标定","设计实验鉴别两批样品的分子量及分布差异"],"examRefs":["past2023-013","past2022-005","past2021-019","past2021-020"]},"examRefs":["past2023-013","past2022-005","past2021-019","past2021-020"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":10,"examRefs":4,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu04":{"title":"非晶态高聚物","subject":"gaowu","nodes":[{"id":"gaowu04n01","label":"三种力学状态与两个转变温度（简答、画图）","stars":5,"point":"玻璃态、高弹态、黏流态，Tg 与 Tf","imgs":["img/map/m170.jpg","img/map/m171.jpg","img/map/m172.jpg"],"quiz":[{"id":"gaowu04-009","type":"fill","match":true},{"id":"gaowu04-001","type":"tf","match":true},{"id":"gaowu04-024","type":"essay","match":true}],"notes":[{"h":"三、三种状态与两个转变","t":"玻璃态下，链段被冻结，只有侧基、键长、键角能小幅振动，所以材料硬、脆、模量在 10 的 9 次方帕量级。温度升到 Tg，链段获得足够的活动能力，材料进入高弹态，模量掉到 10 的 6 次方帕量级，形变可达百分之几百并能回复。再升温到 Tf，整条链开始相对滑移，进入黏流态，形变不可回复。\n三个关键区别要背清：玻璃态的形变是普弹形变（键长键角变化，瞬时、可回复）；高弹态的形变是高弹形变（链段舒展，可回复但有时滞）；黏流态的形变是塑性形变（整链滑移，不可回复）。这三种形变的叠加正是后面蠕变曲线的三段来源。\n非晶聚合物的 Tg 与 Tf 之间那段就叫高弹态（橡胶态）。橡胶之所以能用，就是因为它被交联，Tf 被“取消”了，高弹态一直延伸到分解温度。\n图 1　DMA 测得的模量随温度变化曲线：玻璃态、玻璃化转变区、高弹态与黏流态（北化《高分子物理》期末复习课件）"},{"h":"一、本章坐标：一条温度曲线管住三种状态","t":"把一块非晶聚合物从低温缓慢升温，同时测它的形变或模量，会看到三段：低温玻璃态，硬而脆；中间高弹态，软而有弹性；高温黏流态，可以流动。中间那两个转折点就是 Tg 与 Tf。本章的核心就是把 Tg 说清楚：它是什么、怎么测、为什么会有、以及哪些因素能推动它。\n逻辑链：① 现象（模量或热焓在某一温度区间陡变） → ② 本质（链段运动被冻结与解冻的临界点，属松弛过程） → ③ 理论（自由体积理论、热力学理论、动力学理论） → ④ 测量（DSC、DMA、膨胀计、介电谱） → ⑤ 影响因素（主链柔性、侧基、交联、增塑、分子量、共聚） → ⑥ 应用（橡胶的 T g 要低于使用温度，塑料的 T g 要高于使用温度）读法：读法：Tg 不是热力学上的“相变点”，因为它随测量速率变化。这一点决定了后面所有讨论：说 Tg 时必须说清测量条件。\n命题口径本章是 866 的绝对重点，2023 年简答第八题直接问 Tg 的影响因素。答题要求能分条写五到六项，并说明每项的作用机制（自由体积、链段活动性），只列名词不给分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"三种力学状态与两个转变温度（简答、画图）"},{"id":"gaowu04n02","label":"Tg的本质（松弛过程而非相变）（名词解释、简答）","stars":5,"point":"链段运动冻结，随观测速率变化","imgs":["img/map/m173.jpg","img/map/m174.jpg"],"quiz":[{"id":"gaowu04-021","type":"short","match":true},{"id":"gaowu04-022","type":"short","match":true},{"id":"gaowu04-014","type":"fill","match":true}],"notes":[{"h":"四、Tg 的本质：松弛，不是相变","t":"一级相变（熔融、结晶）有确定的温度，因为两相自由能相等。Tg 没有确定值：升温快，链段来不及重排，要在更高温度才“跟上”，测得的 Tg 偏高；升温慢，测得的 Tg 偏低。同一聚合物，DSC 快扫与慢扫能差好几度。这就是“Tg 是松弛过程”的直接证据。\n既然它是松弛过程，就有观测时间的含义：在极短时间内观察（高频动态测量），链段显得很“硬”，Tg 偏高；在长时间观察（低频），链段显得很“软”，Tg 偏低。所以 DMA 的频率扫描能给出与温度扫描等效的结果，这正是时温等效的物理基础。\n图 2　差示扫描量热法（DSC）测 Tg：升温曲线上的基线台阶（“鼓包”为热焓松弛峰）（北化《高分子物理》期末复习课件）"},{"h":"一、本章坐标：一条温度曲线管住三种状态","t":"把一块非晶聚合物从低温缓慢升温，同时测它的形变或模量，会看到三段：低温玻璃态，硬而脆；中间高弹态，软而有弹性；高温黏流态，可以流动。中间那两个转折点就是 Tg 与 Tf。本章的核心就是把 Tg 说清楚：它是什么、怎么测、为什么会有、以及哪些因素能推动它。\n逻辑链：① 现象（模量或热焓在某一温度区间陡变） → ② 本质（链段运动被冻结与解冻的临界点，属松弛过程） → ③ 理论（自由体积理论、热力学理论、动力学理论） → ④ 测量（DSC、DMA、膨胀计、介电谱） → ⑤ 影响因素（主链柔性、侧基、交联、增塑、分子量、共聚） → ⑥ 应用（橡胶的 T g 要低于使用温度，塑料的 T g 要高于使用温度）读法：读法：Tg 不是热力学上的“相变点”，因为它随测量速率变化。这一点决定了后面所有讨论：说 Tg 时必须说清测量条件。\n命题口径本章是 866 的绝对重点，2023 年简答第八题直接问 Tg 的影响因素。答题要求能分条写五到六项，并说明每项的作用机制（自由体积、链段活动性），只列名词不给分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Tg 的本质（松弛过程而非相变）（名词解释、简答）"},{"id":"gaowu04n03","label":"自由体积理论（论述、简答）","stars":5,"point":"Tg 时自由体积分数为常数（约 2.5%）","imgs":["img/map/m175.jpg","img/map/m176.jpg"],"quiz":[{"id":"gaowu04-007","type":"term","match":true},{"id":"gaowu04-024","type":"essay","match":true}],"notes":[{"h":"五、自由体积理论：为什么冷却会把链段“冻住”","t":"总体积由两部分组成：分子自身占据的体积与可以自由分布的空隙，即自由体积。温度升高，自由体积增大，链段有地方挪动；温度降低，自由体积被压缩到一定程度后不再减小（因为链段已被冻结，无法进一步密堆），此后体积收缩只靠占有体积的热收缩，膨胀系数变小。膨胀系数发生突变的那个温度，就是 Tg。\n按这一理论，Tg 时自由体积分数是一个常数（常引用为 2.5%），所以 Tg 可以看作“等自由体积状态”。这个常数带来两个直接推论：①凡是能增加自由体积的因素（增塑剂、大侧基、共聚引入柔性单元）都会降低 Tg；②凡是能减少自由体积或限制链段活动的因素（交联、结晶、刚性侧基、极性作用）都会升高 Tg。\n自由体积理论的贡献是把 Tg 从“神秘现象”变成“可计算的体积问题”，但它也有缺陷：它无法解释为什么 Tg 会随观测速率变化（因为它的自由体积分数被当作常数），也无法解释 Tg 以下的物理老化。这正是后续热力学理论与动力学理论要补的地方。\n图 3　传统自由体积理论：总体积由占有体积与自由体积两部分组成（北化《高分子物理》期末复习课件）"},{"h":"一、本章坐标：一条温度曲线管住三种状态","t":"把一块非晶聚合物从低温缓慢升温，同时测它的形变或模量，会看到三段：低温玻璃态，硬而脆；中间高弹态，软而有弹性；高温黏流态，可以流动。中间那两个转折点就是 Tg 与 Tf。本章的核心就是把 Tg 说清楚：它是什么、怎么测、为什么会有、以及哪些因素能推动它。\n逻辑链：① 现象（模量或热焓在某一温度区间陡变） → ② 本质（链段运动被冻结与解冻的临界点，属松弛过程） → ③ 理论（自由体积理论、热力学理论、动力学理论） → ④ 测量（DSC、DMA、膨胀计、介电谱） → ⑤ 影响因素（主链柔性、侧基、交联、增塑、分子量、共聚） → ⑥ 应用（橡胶的 T g 要低于使用温度，塑料的 T g 要高于使用温度）读法：读法：Tg 不是热力学上的“相变点”，因为它随测量速率变化。这一点决定了后面所有讨论：说 Tg 时必须说清测量条件。\n命题口径本章是 866 的绝对重点，2023 年简答第八题直接问 Tg 的影响因素。答题要求能分条写五到六项，并说明每项的作用机制（自由体积、链段活动性），只列名词不给分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"自由体积理论（论述、简答）"},{"id":"gaowu04n04","label":"WLF方程与时温等效（计算、简答）","stars":4,"point":"Tg 附近黏度与时间的换算","imgs":[],"quiz":[{"id":"gaowu04-023","type":"calc","match":true},{"id":"gaowu04-011","type":"fill","match":true},{"id":"gaowu04-015","type":"fill","match":true}],"notes":[{"h":"九、易错清单与自测","t":"★★★　能画出温度—形变曲线并标出三态两转变\n★★★　能用一句话说明 Tg 为什么不是相变\n★★★　能用自由体积理论解释 Tg，并给出等自由体积分数的推论\n★★★　能分条说出 Tg 的六项影响因素及机制\n★★　会用 WLF 方程做温度换算\n★★　知道 Tg 与 Tm 的近似比例（开尔文温标约 2 比 3）\n★★　能说明物理老化与 β 转变的工程意义\n★　能说出三种 Tg 测定方法的原理\n与后续章节的接口本章的松弛时间与 WLF 方程，在第 6 章黏弹性里会被反复使用：蠕变、应力松弛、动态模量、时温等效全部建立在“温度改变就是时间平移”这个前提上。所以本章 WLF 必须算熟。"},{"h":"表 2　Tg 的三种解释","t":"理论 ｜ 核心论点 ｜ 能解释什么 ｜ 局限\n自由体积理论 ｜ Tg 时自由体积分数为常数（约 2.5%） ｜ 增塑、交联、压力的影响 ｜ 不能解释速率依赖与老化\n热力学理论 ｜ Tg 是构象熵趋于零的临界点 ｜ Tg 与 Tm 的定量关系 ｜ 实际链段无法达到熵为零\n动力学理论 ｜ 链段松弛时间达到观测时间尺度即冻结 ｜ 速率、频率、老化 ｜ 需要额外的松弛参数\nWLF 方程Tg 附近，温度每升高十余度，黏度与松弛时间就下降一个数量级以上，用 WLF 方程描述：lg aT 等于负 C1（T 减 Tg）除以 C2 加（T 减 Tg），通用常数 C1 取 17.44、C2 取 51.6（摄氏温标）。超出 Tg 以上约 100 度后改用 Arrhenius 型。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"WLF 方程与时温等效（计算、简答）"},{"id":"gaowu04n05","label":"Tg的测定方法（选择、简答）","stars":4,"point":"DSC 测热焓、DMA 测模量、膨胀计测体积","imgs":["img/map/m177.jpg"],"quiz":[{"id":"gaowu04-016","type":"mcq","match":true},{"id":"gaowu04-014","type":"fill","match":true},{"id":"gaowu04-023","type":"calc","match":true}],"notes":[{"h":"八、真题与期末题演练","t":"【真题 1】说明影响聚合物玻璃化转变温度的主要因素，并简述其作用机制。\n来源：四川大学 866（2023 年真题解析）·简答题第 8 题\n参考答案与给分点：①主链柔性：主链键的内旋转位垒越小，链段越易运动，Tg 越低（硅橡胶 Tg 极低，聚酰亚胺极高）；②侧基：体积大、刚性的侧基阻碍内旋转、减少自由体积，使 Tg 升高；长而柔的烷基侧基起内增塑作用，使 Tg 先升后降；极性侧基因分子间作用增强使 Tg 升高；③交联：交联密度增大，链段活动空间减小，Tg 升高；④增塑剂：小分子插入链间，增加自由体积并屏蔽链间作用，Tg 显著降低；⑤分子量：分子量低时链端自由体积大，Tg 偏低，分子量增大到一定程度后 Tg 趋于定值；⑥共聚：无规共聚物 Tg 介于两组分之间（Fox 方程），嵌段不相容时出现两个 Tg；⑦压力与测试条件：压力增大压缩自由体积使 Tg 升高，升温速率加快或观测频率提高也使测得的 Tg 偏高。给分点：每项 1 分，机制说明每项 0.5 分，答满六项满分。\n【真题 2】下列方法中不能测定玻璃化温度的是：A 体膨胀计　B 差示扫描量热法　C 动态机械分析仪　D X 射线衍射仪\n来源：北京化工大学《高分子物理》期末试题 A 卷·选择题第 7 题（附标准答案）\n参考答案与给分点：答 D。体膨胀计测体积随温度的突变，DSC 测热焓台阶，DMA 测模量与损耗峰，三者都能定 Tg。X 射线衍射测的是晶体的周期性结构，非晶态没有衍射峰的变化规律可用来定 Tg，它测的是结晶度与晶型。给分点：选对 2 分。\n【真题 3】自由体积理论认为，高聚物在玻璃化温度以下时，体积随温度升高而发生的膨胀是由于（　）。\n来源：北京化工大学《高分子物理》期末试题 A 卷·填空题第 3 题（附标准答案）\n参考答案与给分点：固有体积的膨胀。给分点：0.5 分。因为 Tg 以下自由体积已被冻结、不再增加，升温时体积的增加只来自分子自身占有体积的热膨胀；Tg 以上自由体积解冻，膨胀系数变大，曲线出现折点。"},{"h":"九、易错清单与自测","t":"★★★　能画出温度—形变曲线并标出三态两转变\n★★★　能用一句话说明 Tg 为什么不是相变\n★★★　能用自由体积理论解释 Tg，并给出等自由体积分数的推论\n★★★　能分条说出 Tg 的六项影响因素及机制\n★★　会用 WLF 方程做温度换算\n★★　知道 Tg 与 Tm 的近似比例（开尔文温标约 2 比 3）\n★★　能说明物理老化与 β 转变的工程意义\n★　能说出三种 Tg 测定方法的原理\n与后续章节的接口本章的松弛时间与 WLF 方程，在第 6 章黏弹性里会被反复使用：蠕变、应力松弛、动态模量、时温等效全部建立在“温度改变就是时间平移”这个前提上。所以本章 WLF 必须算熟。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Tg 的测定方法（选择、简答）"},{"id":"gaowu04n06","label":"Tg的影响因素（简答、论述）","stars":5,"point":"柔性、侧基、交联、增塑、分子量、共聚","imgs":["img/map/m178.jpg","img/map/m179.jpg","img/map/m180.jpg"],"quiz":[{"id":"gaowu04-014","type":"fill","match":true},{"id":"gaowu04-024","type":"essay","match":true},{"id":"gaowu04-016","type":"mcq","match":true}],"notes":[{"h":"六、Tg 的影响因素：一张必须背下来的清单","t":"第一项，主链柔性。这是最根本的一项：主链越柔（碳碳单键、硅氧键、醚键），链段越易运动，Tg 越低。聚硅氧烷的 Tg 低到零下 120 度，聚酰亚胺高到 400 度以上。\n第二项，侧基。侧基体积大（苯环、叔丁基）会阻碍内旋转、抬高 Tg；但长而柔的烷基侧基会起内增塑作用，反而降低 Tg，这就是“侧基碳数增加、Tg 先升后降”的原因。极性侧基因分子间作用增强也使 Tg 升高。\n第三项，交联。交联把链锁住，链段活动空间变小，Tg 升高，且交联密度越大升高越多。定量上可用经验公式估算。\n第四项，增塑。增塑剂是小分子，插进链间增加自由体积、削弱链间作用，Tg 显著降低。这是 PVC 加增塑剂做成软制品的原理。\n第五项，分子量。分子量低时，链端多、末端自由体积大，Tg 偏低；分子量增大到一定程度后，链端效应被稀释，Tg 趋于定值（经验上约 2 万以上就基本不变）。\n第六项，共聚与共混。无规共聚物的 Tg 介于两组分的 Tg 之间，可用 Fox 方程估算：1 比 Tg 等于两组分的质量分数分别除以各自 Tg 之和。嵌段共聚物若两段不相容，则出现两个 Tg。"},{"h":"表 3　Tg 影响因素一览","t":"因素 ｜ 变化 ｜ Tg 变化 ｜ 机制\n主链柔性 ｜ 柔性增加（硅氧键、醚键） ｜ 降低 ｜ 内旋转位垒小\n侧基体积 ｜ 大体积刚性侧基 ｜ 升高 ｜ 阻碍内旋转，减少自由体积\n侧基长度 ｜ 长而柔的烷基 ｜ 先升后降 ｜ 内增塑效应\n交联 ｜ 交联密度增加 ｜ 升高 ｜ 链段活动受限\n增塑剂 ｜ 加入 ｜ 显著降低 ｜ 增加自由体积、屏蔽链间作用\n分子量 ｜ 增大 ｜ 升高后趋平 ｜ 链端自由体积被稀释\n共聚 ｜ 无规共聚 ｜ 介于两者之间（Fox 方程） ｜ 组成平均效应\n压力 ｜ 增大 ｜ 升高 ｜ 压缩自由体积"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Tg 的影响因素（简答、论述）"},{"id":"gaowu04n07","label":"Tg以下的次级转变（β转变）（选择、简答）","stars":3,"point":"侧基或短链段运动，改善韧性","imgs":["img/map/m181.jpg"],"quiz":[{"id":"gaowu04-001","type":"tf","match":true},{"id":"gaowu04-010","type":"fill","match":true},{"id":"gaowu04-009","type":"fill","match":true}],"notes":[{"h":"七、Tg 以下还有什么：次级转变","t":"玻璃态不等于“完全冻结”。侧基、小链段、短支链仍能局部运动，这些运动在更低温度出现，称为次级转变（β、γ 转变），在 DMA 或介电谱上表现为小的损耗峰。\nβ 转变的工程意义很大：它对应局部的能量耗散机制，能吸收冲击能量。所以有些材料在 Tg 以下仍有不错的韧性，就是因为 β 转变温度正好在室温附近。PC 的韧性就得益于此。\n反过来，物理老化也是 Tg 以下的常事：非晶态处于热力学非平衡，链段缓慢向更密堆的状态弛豫，体积、焓缓慢下降，材料变脆。这就是塑料件放久了变脆的原因，加热到 Tg 以上急冷可以“复位”。"},{"h":"三、三种状态与两个转变","t":"玻璃态下，链段被冻结，只有侧基、键长、键角能小幅振动，所以材料硬、脆、模量在 10 的 9 次方帕量级。温度升到 Tg，链段获得足够的活动能力，材料进入高弹态，模量掉到 10 的 6 次方帕量级，形变可达百分之几百并能回复。再升温到 Tf，整条链开始相对滑移，进入黏流态，形变不可回复。\n三个关键区别要背清：玻璃态的形变是普弹形变（键长键角变化，瞬时、可回复）；高弹态的形变是高弹形变（链段舒展，可回复但有时滞）；黏流态的形变是塑性形变（整链滑移，不可回复）。这三种形变的叠加正是后面蠕变曲线的三段来源。\n非晶聚合物的 Tg 与 Tf 之间那段就叫高弹态（橡胶态）。橡胶之所以能用，就是因为它被交联，Tf 被“取消”了，高弹态一直延伸到分解温度。\n图 1　DMA 测得的模量随温度变化曲线：玻璃态、玻璃化转变区、高弹态与黏流态（北化《高分子物理》期末复习课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Tg 以下的次级转变（β 转变）（选择、简答）"},{"id":"gaowu04n08","label":"Tg与Tm的关系（简答）","stars":4,"point":"Tg 约等于三分之二 Tm（开尔文温标）","imgs":["img/map/m182.jpg","img/map/m183.jpg","img/map/m184.jpg"],"quiz":[{"id":"gaowu04-006","type":"term","match":true},{"id":"gaowu04-015","type":"fill","match":true},{"id":"gaowu04-019","type":"mcq","match":true}],"notes":[{"h":"表 2　Tg 的三种解释","t":"理论 ｜ 核心论点 ｜ 能解释什么 ｜ 局限\n自由体积理论 ｜ Tg 时自由体积分数为常数（约 2.5%） ｜ 增塑、交联、压力的影响 ｜ 不能解释速率依赖与老化\n热力学理论 ｜ Tg 是构象熵趋于零的临界点 ｜ Tg 与 Tm 的定量关系 ｜ 实际链段无法达到熵为零\n动力学理论 ｜ 链段松弛时间达到观测时间尺度即冻结 ｜ 速率、频率、老化 ｜ 需要额外的松弛参数\nWLF 方程Tg 附近，温度每升高十余度，黏度与松弛时间就下降一个数量级以上，用 WLF 方程描述：lg aT 等于负 C1（T 减 Tg）除以 C2 加（T 减 Tg），通用常数 C1 取 17.44、C2 取 51.6（摄氏温标）。超出 Tg 以上约 100 度后改用 Arrhenius 型。"},{"h":"九、易错清单与自测","t":"★★★　能画出温度—形变曲线并标出三态两转变\n★★★　能用一句话说明 Tg 为什么不是相变\n★★★　能用自由体积理论解释 Tg，并给出等自由体积分数的推论\n★★★　能分条说出 Tg 的六项影响因素及机制\n★★　会用 WLF 方程做温度换算\n★★　知道 Tg 与 Tm 的近似比例（开尔文温标约 2 比 3）\n★★　能说明物理老化与 β 转变的工程意义\n★　能说出三种 Tg 测定方法的原理\n与后续章节的接口本章的松弛时间与 WLF 方程，在第 6 章黏弹性里会被反复使用：蠕变、应力松弛、动态模量、时温等效全部建立在“温度改变就是时间平移”这个前提上。所以本章 WLF 必须算熟。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Tg 与 Tm 的关系（简答）"},{"id":"gaowu04n09","label":"玻璃态的结构与老化（简答）","stars":3,"point":"非平衡态，物理老化使体积弛豫","imgs":[],"quiz":[{"id":"gaowu04-014","type":"fill","match":true},{"id":"gaowu04-006","type":"term","match":true},{"id":"gaowu04-001","type":"tf","match":true}],"notes":[{"h":"一、本章坐标：一条温度曲线管住三种状态","t":"把一块非晶聚合物从低温缓慢升温，同时测它的形变或模量，会看到三段：低温玻璃态，硬而脆；中间高弹态，软而有弹性；高温黏流态，可以流动。中间那两个转折点就是 Tg 与 Tf。本章的核心就是把 Tg 说清楚：它是什么、怎么测、为什么会有、以及哪些因素能推动它。\n逻辑链：① 现象（模量或热焓在某一温度区间陡变） → ② 本质（链段运动被冻结与解冻的临界点，属松弛过程） → ③ 理论（自由体积理论、热力学理论、动力学理论） → ④ 测量（DSC、DMA、膨胀计、介电谱） → ⑤ 影响因素（主链柔性、侧基、交联、增塑、分子量、共聚） → ⑥ 应用（橡胶的 T g 要低于使用温度，塑料的 T g 要高于使用温度）读法：读法：Tg 不是热力学上的“相变点”，因为它随测量速率变化。这一点决定了后面所有讨论：说 Tg 时必须说清测量条件。\n命题口径本章是 866 的绝对重点，2023 年简答第八题直接问 Tg 的影响因素。答题要求能分条写五到六项，并说明每项的作用机制（自由体积、链段活动性），只列名词不给分。"},{"h":"三、三种状态与两个转变","t":"玻璃态下，链段被冻结，只有侧基、键长、键角能小幅振动，所以材料硬、脆、模量在 10 的 9 次方帕量级。温度升到 Tg，链段获得足够的活动能力，材料进入高弹态，模量掉到 10 的 6 次方帕量级，形变可达百分之几百并能回复。再升温到 Tf，整条链开始相对滑移，进入黏流态，形变不可回复。\n三个关键区别要背清：玻璃态的形变是普弹形变（键长键角变化，瞬时、可回复）；高弹态的形变是高弹形变（链段舒展，可回复但有时滞）；黏流态的形变是塑性形变（整链滑移，不可回复）。这三种形变的叠加正是后面蠕变曲线的三段来源。\n非晶聚合物的 Tg 与 Tf 之间那段就叫高弹态（橡胶态）。橡胶之所以能用，就是因为它被交联，Tf 被“取消”了，高弹态一直延伸到分解温度。\n图 1　DMA 测得的模量随温度变化曲线：玻璃态、玻璃化转变区、高弹态与黏流态（北化《高分子物理》期末复习课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"玻璃态的结构与老化（简答）"},{"id":"gaowu04n10","label":"高弹态的特征（简答）","stars":4,"point":"模量小、形变大、可回复、熵弹性","imgs":["img/map/m185.jpg"],"quiz":[{"id":"gaowu04-018","type":"mcq","match":true}],"notes":[{"h":"一、本章坐标：一条温度曲线管住三种状态","t":"把一块非晶聚合物从低温缓慢升温，同时测它的形变或模量，会看到三段：低温玻璃态，硬而脆；中间高弹态，软而有弹性；高温黏流态，可以流动。中间那两个转折点就是 Tg 与 Tf。本章的核心就是把 Tg 说清楚：它是什么、怎么测、为什么会有、以及哪些因素能推动它。\n逻辑链：① 现象（模量或热焓在某一温度区间陡变） → ② 本质（链段运动被冻结与解冻的临界点，属松弛过程） → ③ 理论（自由体积理论、热力学理论、动力学理论） → ④ 测量（DSC、DMA、膨胀计、介电谱） → ⑤ 影响因素（主链柔性、侧基、交联、增塑、分子量、共聚） → ⑥ 应用（橡胶的 T g 要低于使用温度，塑料的 T g 要高于使用温度）读法：读法：Tg 不是热力学上的“相变点”，因为它随测量速率变化。这一点决定了后面所有讨论：说 Tg 时必须说清测量条件。\n命题口径本章是 866 的绝对重点，2023 年简答第八题直接问 Tg 的影响因素。答题要求能分条写五到六项，并说明每项的作用机制（自由体积、链段活动性），只列名词不给分。"},{"h":"三、三种状态与两个转变","t":"玻璃态下，链段被冻结，只有侧基、键长、键角能小幅振动，所以材料硬、脆、模量在 10 的 9 次方帕量级。温度升到 Tg，链段获得足够的活动能力，材料进入高弹态，模量掉到 10 的 6 次方帕量级，形变可达百分之几百并能回复。再升温到 Tf，整条链开始相对滑移，进入黏流态，形变不可回复。\n三个关键区别要背清：玻璃态的形变是普弹形变（键长键角变化，瞬时、可回复）；高弹态的形变是高弹形变（链段舒展，可回复但有时滞）；黏流态的形变是塑性形变（整链滑移，不可回复）。这三种形变的叠加正是后面蠕变曲线的三段来源。\n非晶聚合物的 Tg 与 Tf 之间那段就叫高弹态（橡胶态）。橡胶之所以能用，就是因为它被交联，Tf 被“取消”了，高弹态一直延伸到分解温度。\n图 1　DMA 测得的模量随温度变化曲线：玻璃态、玻璃化转变区、高弹态与黏流态（北化《高分子物理》期末复习课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"高弹态的特征（简答）"}],"logic":{"question":"链段运动如何产生玻璃态、高弹态和黏流态？Tg 为什么随时间和测量条件变化？","role":"用“运动单元＋松弛时间”解释非晶聚合物的温度谱，为结晶、力学和介电松弛提供共同时间尺度。","input":"链柔性、分子量与无扰链运动","output":"三态两转变、Tg、自由体积、时温等效与高弹性","prev":"gaowu03","next":"gaowu05","links":[{"cid":"gaowu06","text":"WLF 与松弛时间是蠕变、应力松弛和动态损耗的基础"},{"cid":"gaowu07","text":"介电损耗峰同样对应偶极/链段松弛"}],"focus":["三态两转变与温度—形变曲线","Tg 的松弛本质、自由体积和影响因素","WLF 方程、时温等效和次级转变","Tg 与 Tm 的区别及联系"],"common":["画温度—形变曲线并标出 Tg、Tf","从自由体积和链段运动解释增塑、交联、分子量对 Tg 的影响","用 WLF/时温等效换算不同温度或频率下的行为","比较非晶与晶态样品的转变曲线"],"examRefs":["past2023-009","past2022-006","past2022-011","past2021-017","past2021-020"]},"examRefs":["past2023-009","past2022-006","past2022-011","past2021-017","past2021-020"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":10,"examRefs":5,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu05":{"title":"晶态高聚物","subject":"gaowu","nodes":[{"id":"gaowu05n01","label":"结晶能力与结构规整性（简答、选择）","stars":5,"point":"规整、对称、无支化才易结晶","imgs":["img/map/m186.jpg"],"quiz":[{"id":"gaowu05-023","type":"calc","match":true},{"id":"gaowu05-024","type":"essay","match":true},{"id":"gaowu05-006","type":"term","match":true}],"notes":[{"h":"表 2　结晶能力的三项结构条件","t":"条件 ｜ 具体要求 ｜ 反例 ｜ 后果\n结构规整 ｜ 组成、连接方式、立构一致 ｜ 无规 PS、无规 PP ｜ 不能结晶\n链对称 ｜ 主链构象简单、侧基小 ｜ 大侧基聚合物 ｜ 结晶度低\n分子间作用 ｜ 氢键、极性基 ｜ 非极性且支化多 ｜ 晶格不稳定、Tm 低"},{"h":"三、结晶能力：先看链能不能排整齐","t":"结晶的本质是链段在三维空间里周期性排列。所以第一要求是结构规整：化学组成一致、连接方式一致（头尾为主）、立构规整（全同或间同）。自由基聚合的 PE 支化多、头头结构多，结晶度只有百分之几十；配位聚合的 HDPE 线性好，结晶度可达 80% 以上。\n第二要求是对称性。链的对称性越好，越容易找到密堆方式。聚乙烯全反式平面锯齿、晶胞对称，极易结晶；而聚苯乙烯侧基大、无规立构时根本不结晶（只有等规 PS 能结晶）。\n第三是分子间作用力。氢键与极性基能帮助链锁在一起，形成稳定的晶格，所以尼龙、PVA 都能结晶，且熔点较高。\n但要注意：能结晶不等于一定结晶。淬火（骤冷）会让链来不及排布，得到非晶态；缓慢冷却或退火才得到高结晶度。这就是同一牌号的 PET 既能吹成透明瓶（骤冷）又能做成结晶粒料（慢冷）的原因。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"结晶能力与结构规整性（简答、选择）"},{"id":"gaowu05n02","label":"晶系与晶胞参数（填空、计算）","stars":3,"point":"七大晶系，晶胞密度可算","imgs":["img/map/m187.jpg","img/map/m188.jpg"],"quiz":[],"notes":[{"h":"表 1　晶态高聚物考点与重要度","t":"考点 ｜ 星级 ｜ 常见题型 ｜ 一句话要点\n结晶能力与结构规整性 ｜ ★★★★★ ｜ 简答、选择 ｜ 规整、对称、无支化才易结晶\n晶系与晶胞参数 ｜ ★★★ ｜ 填空、计算 ｜ 七大晶系，晶胞密度可算\n结晶形态（单晶、球晶、串晶） ｜ ★★★★ ｜ 简答、识图 ｜ 片晶是最基本单元，球晶最常见\n球晶的黑十字与光性 ｜ ★★★ ｜ 选择、识图 ｜ 正交偏振光下出现马尔他十字\nAvrami 方程与结晶动力学 ｜ ★★★★ ｜ 计算、简答 ｜ 结晶度随时间按指数规律上升\n结晶速率与温度的关系 ｜ ★★★★★ ｜ 简答、作图 ｜ Tg 与 Tm 之间，中段速率最大\n结晶度的定义与三种测法 ｜ ★★★★★ ｜ 论述、计算 ｜ 密度法、DSC 法、X 射线法\n熔点与熔限 ｜ ★★★★★ ｜ 简答 ｜ 晶片厚度不一导致熔限\nTm 的影响因素 ｜ ★★★★★ ｜ 简答、论述 ｜ 柔性、侧基、氢键、共聚、取向\n取向与取向函数 ｜ ★★★★ ｜ 简答 ｜ 取向提高模量与强度，产生各向异性"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"晶系与晶胞参数（填空、计算）"},{"id":"gaowu05n03","label":"结晶形态（单晶、球晶、串晶）（简答、识图）","stars":4,"point":"片晶是最基本单元，球晶最常见","imgs":["img/map/m189.jpg","img/map/m190.jpg"],"quiz":[{"id":"gaowu05-009","type":"fill","match":true},{"id":"gaowu05-024","type":"essay","match":true},{"id":"gaowu05-023","type":"calc","match":true}],"notes":[{"h":"四、结晶形态：从片晶到球晶","t":"最基本的结晶单元是片晶：链折叠成厚度约 10 nm 的薄片，链轴垂直于片平面。片晶在极稀溶液中缓慢生长，可以长成规则的菱形单晶，这是证明“链折叠”假说的经典实验。\n熔体中结晶得不到单晶，因为熔体粘度大、晶核多，片晶只能向四周辐射状生长，形成球晶。球晶直径通常 0.1 微米到 1 厘米，正交偏振光下呈马尔他黑十字，这是最常用的识别特征。球晶尺寸越大，材料越脆、越不透明；所以要靠成核剂与加工条件控制球晶尺寸。\n在剪切或拉伸流场下，还会出现纤维状晶与串晶：伸直链先沿流动方向排列，再在其表面外延生长片晶。这类形态在注塑件的皮层很常见，是“皮芯结构”的来源。\n图 1　聚合物晶体最简单形式——单晶：聚乙烯从极稀溶液中缓慢生长出的菱形片晶（北化《高分子物理》期末复习课件）\n图 2　熔体结晶最常见的形态——球晶：直径 0.1 微米至 1 厘米，由纤维状晶片辐射生长（北化《高分子物理》期末复习课件）"},{"h":"一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","t":"聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。\n逻辑链：① 结晶能力（结构规整性、对称性、分子间力） → ② 结晶形态（片晶、球晶、纤维状晶） → ③ 结晶动力学（成核与生长，Avrami 方程，温度窗口） → ④ 结晶度（密度、DSC、X 射线三种测法） → ⑤ 熔点与熔限（晶片厚度与完善程度决定 Tm） → ⑥ 取向（取向函数、各向异性、性能提升）读法：读法：本章所有“为什么”都能回到两句话：能不能排整齐（结构），有没有时间排整齐（动力学）。答题时先说结构，再说动力学。\n命题口径本章是 866 的高频出题区。2023 年简答第五题问 Tm 的影响因素，论述第二题问用 DSC 测结晶度的步骤，说明“影响因素 + 方法步骤”是本章的标准考法，必须能分条背出。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"结晶形态（单晶、球晶、串晶）（简答、识图）"},{"id":"gaowu05n04","label":"球晶的黑十字与光性（选择、识图）","stars":3,"point":"正交偏振光下出现马尔他十字","imgs":["img/map/m191.jpg"],"quiz":[{"id":"gaowu05-010","type":"fill","match":true},{"id":"gaowu05-007","type":"term","match":true},{"id":"gaowu05-024","type":"essay","match":true}],"notes":[{"h":"四、结晶形态：从片晶到球晶","t":"最基本的结晶单元是片晶：链折叠成厚度约 10 nm 的薄片，链轴垂直于片平面。片晶在极稀溶液中缓慢生长，可以长成规则的菱形单晶，这是证明“链折叠”假说的经典实验。\n熔体中结晶得不到单晶，因为熔体粘度大、晶核多，片晶只能向四周辐射状生长，形成球晶。球晶直径通常 0.1 微米到 1 厘米，正交偏振光下呈马尔他黑十字，这是最常用的识别特征。球晶尺寸越大，材料越脆、越不透明；所以要靠成核剂与加工条件控制球晶尺寸。\n在剪切或拉伸流场下，还会出现纤维状晶与串晶：伸直链先沿流动方向排列，再在其表面外延生长片晶。这类形态在注塑件的皮层很常见，是“皮芯结构”的来源。\n图 1　聚合物晶体最简单形式——单晶：聚乙烯从极稀溶液中缓慢生长出的菱形片晶（北化《高分子物理》期末复习课件）\n图 2　熔体结晶最常见的形态——球晶：直径 0.1 微米至 1 厘米，由纤维状晶片辐射生长（北化《高分子物理》期末复习课件）"},{"h":"九、易错清单与自测","t":"★★★　能说出结晶能力的三项结构条件并举反例\n★★★　能画结晶速率—温度钟形曲线并解释两端慢的原因\n★★★　能写出 Avrami 方程与实验作图方法\n★★★　能分条说明 Tm 的六项影响因素及机理\n★★★　能完整写出 DSC 测结晶度的步骤\n★★　能解释熔限的成因与退火的作用\n★★　能说出球晶的黑十字特征与尺寸控制手段\n★★　能说明结晶度对模量、强度、透明性的影响\n★　知道取向对模量、强度与收缩率的影响\n易混点结晶度、取向度、结晶完善度是三件不同的事。结晶度是“有多少晶”，完善度是“晶好不好”，取向度是“链朝不朝一个方向”。三者都会影响性能，但测法完全不同，答题不能混用。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"球晶的黑十字与光性（选择、识图）"},{"id":"gaowu05n05","label":"Avrami方程与结晶动力学（计算、简答）","stars":4,"point":"结晶度随时间按指数规律上升","imgs":["img/map/m192.jpg","img/map/m193.jpg","img/map/m194.jpg"],"quiz":[{"id":"gaowu05-013","type":"fill","match":true},{"id":"gaowu05-008","type":"term","match":true},{"id":"gaowu05-022","type":"short","match":true}],"notes":[{"h":"五、结晶动力学：速度由温度决定","t":"结晶分两步：成核与生长。成核有均相成核（靠自身涨落）与异相成核（靠杂质、界面、成核剂）。异相成核所需过冷度小、速度快，所以工业上大量使用成核剂来细化球晶。\n结晶度随时间的变化用 Avrami 方程描述：某时刻的结晶度等于 1 减去 exp 的负（速率常数乘以时间的 n 次方），n 为 Avrami 指数，反映成核方式与生长维度。实验上取双对数作图，斜率为 n、截距给出速率常数，是最常见的处理方式。\n结晶速率随温度呈钟形曲线：温度接近 Tm，过冷度小，成核难，速率低；温度接近 Tg，链段活动性差，生长难，速率也低；在这两者中间（通常 0.8 到 0.9 倍 Tm 附近）速率最大。这条“钟形曲线”是简答与作图的常客，一定要能画并能解释两端为什么慢。\n图 3　结晶动力学：片晶增厚过程中的高度变化（h0 到 ht）与 Avrami 处理（北化《高分子物理》期末复习课件）\n一句话记法结晶速率曲线的两侧，一侧是“核难生”（高温），一侧是“链难动”（低温），中间才是“又生又长”。"},{"h":"一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","t":"聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。\n逻辑链：① 结晶能力（结构规整性、对称性、分子间力） → ② 结晶形态（片晶、球晶、纤维状晶） → ③ 结晶动力学（成核与生长，Avrami 方程，温度窗口） → ④ 结晶度（密度、DSC、X 射线三种测法） → ⑤ 熔点与熔限（晶片厚度与完善程度决定 Tm） → ⑥ 取向（取向函数、各向异性、性能提升）读法：读法：本章所有“为什么”都能回到两句话：能不能排整齐（结构），有没有时间排整齐（动力学）。答题时先说结构，再说动力学。\n命题口径本章是 866 的高频出题区。2023 年简答第五题问 Tm 的影响因素，论述第二题问用 DSC 测结晶度的步骤，说明“影响因素 + 方法步骤”是本章的标准考法，必须能分条背出。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Avrami 方程与结晶动力学（计算、简答）"},{"id":"gaowu05n06","label":"结晶速率与温度的关系（简答、作图）","stars":5,"point":"Tg 与 Tm 之间，中段速率最大","imgs":["img/map/m195.jpg","img/map/m196.jpg","img/map/m197.jpg"],"quiz":[{"id":"gaowu05-004","type":"tf","match":true},{"id":"gaowu05-019","type":"mcq","match":true},{"id":"gaowu05-011","type":"fill","match":true}],"notes":[{"h":"五、结晶动力学：速度由温度决定","t":"结晶分两步：成核与生长。成核有均相成核（靠自身涨落）与异相成核（靠杂质、界面、成核剂）。异相成核所需过冷度小、速度快，所以工业上大量使用成核剂来细化球晶。\n结晶度随时间的变化用 Avrami 方程描述：某时刻的结晶度等于 1 减去 exp 的负（速率常数乘以时间的 n 次方），n 为 Avrami 指数，反映成核方式与生长维度。实验上取双对数作图，斜率为 n、截距给出速率常数，是最常见的处理方式。\n结晶速率随温度呈钟形曲线：温度接近 Tm，过冷度小，成核难，速率低；温度接近 Tg，链段活动性差，生长难，速率也低；在这两者中间（通常 0.8 到 0.9 倍 Tm 附近）速率最大。这条“钟形曲线”是简答与作图的常客，一定要能画并能解释两端为什么慢。\n图 3　结晶动力学：片晶增厚过程中的高度变化（h0 到 ht）与 Avrami 处理（北化《高分子物理》期末复习课件）\n一句话记法结晶速率曲线的两侧，一侧是“核难生”（高温），一侧是“链难动”（低温），中间才是“又生又长”。"},{"h":"一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","t":"聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。\n逻辑链：① 结晶能力（结构规整性、对称性、分子间力） → ② 结晶形态（片晶、球晶、纤维状晶） → ③ 结晶动力学（成核与生长，Avrami 方程，温度窗口） → ④ 结晶度（密度、DSC、X 射线三种测法） → ⑤ 熔点与熔限（晶片厚度与完善程度决定 Tm） → ⑥ 取向（取向函数、各向异性、性能提升）读法：读法：本章所有“为什么”都能回到两句话：能不能排整齐（结构），有没有时间排整齐（动力学）。答题时先说结构，再说动力学。\n命题口径本章是 866 的高频出题区。2023 年简答第五题问 Tm 的影响因素，论述第二题问用 DSC 测结晶度的步骤，说明“影响因素 + 方法步骤”是本章的标准考法，必须能分条背出。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"结晶速率与温度的关系（简答、作图）"},{"id":"gaowu05n07","label":"结晶度的定义与三种测法（论述、计算）","stars":5,"point":"密度法、DSC 法、X 射线法","imgs":["img/map/m198.jpg"],"quiz":[{"id":"gaowu05-024","type":"essay","match":true},{"id":"gaowu05-017","type":"mcq","match":true},{"id":"gaowu05-023","type":"calc","match":true}],"notes":[{"h":"六、结晶度：三种测法要会写步骤","t":"结晶度定义为晶区所占的质量分数（或体积分数）。测法有三类，原理各不相同。\n密度法：结晶区密度高、非晶区密度低，测出样品密度后按混合规则反算体积结晶度。设备简单（密度梯度管），但要求知道两相的纯密度。\nDSC 法：结晶部分熔融要吸热，测出熔融焓，除以百分之百结晶标准样的熔融焓，即得质量结晶度。升温速率要统一（通常 10 度每分钟），且要扣除热历史影响。\nX 射线法：晶区有尖锐衍射峰、非晶区有弥散晕，分别积分两者的散射强度，其比值给出结晶度。它是结构上最直接的证据，可同时给出晶型与晶面间距。\n图 4　取向态的定性判断：未取向的多晶（左）与取向后的纤维织构（右）（北化《高分子物理》期末复习课件）"},{"h":"一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","t":"聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。\n逻辑链：① 结晶能力（结构规整性、对称性、分子间力） → ② 结晶形态（片晶、球晶、纤维状晶） → ③ 结晶动力学（成核与生长，Avrami 方程，温度窗口） → ④ 结晶度（密度、DSC、X 射线三种测法） → ⑤ 熔点与熔限（晶片厚度与完善程度决定 Tm） → ⑥ 取向（取向函数、各向异性、性能提升）读法：读法：本章所有“为什么”都能回到两句话：能不能排整齐（结构），有没有时间排整齐（动力学）。答题时先说结构，再说动力学。\n命题口径本章是 866 的高频出题区。2023 年简答第五题问 Tm 的影响因素，论述第二题问用 DSC 测结晶度的步骤，说明“影响因素 + 方法步骤”是本章的标准考法，必须能分条背出。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"结晶度的定义与三种测法（论述、计算）"},{"id":"gaowu05n08","label":"熔点与熔限（简答）","stars":5,"point":"晶片厚度不一导致熔限","imgs":[],"quiz":[{"id":"gaowu05-011","type":"fill","match":true},{"id":"gaowu05-021","type":"short","match":true},{"id":"gaowu05-002","type":"tf","match":true}],"notes":[{"h":"七、熔点与熔限：为什么熔化是一个温度区间","t":"热力学上，熔点由 Tm 等于 ΔH 除以 ΔS 决定：熔融焓越大、熔融熵越小，Tm 越高。链越刚、分子间作用越强，ΔH 大而 ΔS 小，Tm 高；链越柔，ΔS 大，Tm 低。\n实测中聚合物没有单一熔点，而是一个温度区间（熔限），从开始熔融到完全熔融。原因是晶片厚度不等、完善程度不等：薄的、有缺陷的晶片先熔，厚的、完善的最后熔。这也解释了为什么退火（增厚晶片）会使熔点升高、熔限变窄。\nTm 的影响因素可直接列成一张清单：主链柔性（越柔 Tm 越低）、侧基（体积大降低 Tm，极性侧基升高 Tm）、氢键（升高 Tm，尼龙 66 达 265 度）、分子量（低分子量 Tm 偏低，高分子量趋于定值）、共聚（无规共聚显著降低 Tm，嵌段共聚影响小）、增塑与稀释（降低 Tm）、拉伸取向（升高 Tm）。"},{"h":"表 3　熔点与熔限","t":"项目 ｜ 要点\n热力学关系 ｜ Tm 等于熔融焓除以熔融熵\n熔限的成因 ｜ 晶片厚度分布与完善程度差异\n退火的作用 ｜ 晶片增厚、缺陷减少，Tm 升高、熔限变窄\n共聚的影响 ｜ 无规共聚破坏规整性，Tm 明显下降；嵌段共聚影响小\n取向的影响 ｜ 拉伸使链伸直、熵降低，Tm 升高"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"熔点与熔限（简答）"},{"id":"gaowu05n09","label":"Tm的影响因素（简答、论述）","stars":5,"point":"柔性、侧基、氢键、共聚、取向","imgs":["img/map/m199.jpg","img/map/m200.jpg","img/map/m201.jpg"],"quiz":[{"id":"gaowu05-024","type":"essay","match":true},{"id":"gaowu05-021","type":"short","match":true},{"id":"gaowu05-014","type":"fill","match":true}],"notes":[{"h":"一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","t":"聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。\n逻辑链：① 结晶能力（结构规整性、对称性、分子间力） → ② 结晶形态（片晶、球晶、纤维状晶） → ③ 结晶动力学（成核与生长，Avrami 方程，温度窗口） → ④ 结晶度（密度、DSC、X 射线三种测法） → ⑤ 熔点与熔限（晶片厚度与完善程度决定 Tm） → ⑥ 取向（取向函数、各向异性、性能提升）读法：读法：本章所有“为什么”都能回到两句话：能不能排整齐（结构），有没有时间排整齐（动力学）。答题时先说结构，再说动力学。\n命题口径本章是 866 的高频出题区。2023 年简答第五题问 Tm 的影响因素，论述第二题问用 DSC 测结晶度的步骤，说明“影响因素 + 方法步骤”是本章的标准考法，必须能分条背出。"},{"h":"【真题 1】影响聚合物熔点的因素有哪些？请分别说明其作用机理。","t":"来源：四川大学 866（2023 年真题解析）·简答题第 5 题\n参考答案与给分点：由 Tm 等于熔融焓除以熔融熵可知，凡增大熔融焓或减小熔融熵的因素都使 Tm 升高。①主链柔性：链越柔，熔融时构象熵增加越多，Tm 越低；主链含芳环、杂环或双键时 ΔS 小，Tm 高。②侧基：体积大的侧基使链难以堆砌、ΔH 减小，Tm 降低；极性侧基与氢键使分子间作用增强、ΔH 增大，Tm 升高（如尼龙、PVA）。③分子间作用力与氢键：作用越强，ΔH 越大，Tm 越高。④分子量：低分子量时端基多、ΔS 大，Tm 偏低，分子量增大后趋于定值。⑤共聚：无规共聚破坏结晶规整性、使晶片变薄，Tm 显著下降；嵌段或接枝共聚影响较小。⑥增塑剂与稀释剂：小分子进入晶格或增加体系熵，使 Tm 降低。⑦拉伸取向与退火：取向使链伸展、熔融熵减小，Tm 升高；退火使晶片增厚、完善，Tm 升高。给分点：热力学关系 2 分，六项因素各 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Tm 的影响因素（简答、论述）"},{"id":"gaowu05n10","label":"取向与取向函数（简答）","stars":4,"point":"取向提高模量与强度，产生各向异性","imgs":["img/map/m202.jpg","img/map/m203.jpg"],"quiz":[{"id":"gaowu05-015","type":"fill","match":true},{"id":"gaowu05-005","type":"tf","match":true}],"notes":[{"h":"一、本章坐标：从“能不能结晶”到“结晶得多快多完善”","t":"聚合物结晶要同时满足两个条件：结构上能规整排列，动力学上给得及时间。前者决定“能不能”，后者决定“多不多”。顺下来的逻辑是：结构规整性 → 结晶能力 → 结晶形态 → 结晶动力学（速度与温度）→ 结晶度 → 熔点与熔限 → 性能。\n逻辑链：① 结晶能力（结构规整性、对称性、分子间力） → ② 结晶形态（片晶、球晶、纤维状晶） → ③ 结晶动力学（成核与生长，Avrami 方程，温度窗口） → ④ 结晶度（密度、DSC、X 射线三种测法） → ⑤ 熔点与熔限（晶片厚度与完善程度决定 Tm） → ⑥ 取向（取向函数、各向异性、性能提升）读法：读法：本章所有“为什么”都能回到两句话：能不能排整齐（结构），有没有时间排整齐（动力学）。答题时先说结构，再说动力学。\n命题口径本章是 866 的高频出题区。2023 年简答第五题问 Tm 的影响因素，论述第二题问用 DSC 测结晶度的步骤，说明“影响因素 + 方法步骤”是本章的标准考法，必须能分条背出。"},{"h":"【真题 1】影响聚合物熔点的因素有哪些？请分别说明其作用机理。","t":"来源：四川大学 866（2023 年真题解析）·简答题第 5 题\n参考答案与给分点：由 Tm 等于熔融焓除以熔融熵可知，凡增大熔融焓或减小熔融熵的因素都使 Tm 升高。①主链柔性：链越柔，熔融时构象熵增加越多，Tm 越低；主链含芳环、杂环或双键时 ΔS 小，Tm 高。②侧基：体积大的侧基使链难以堆砌、ΔH 减小，Tm 降低；极性侧基与氢键使分子间作用增强、ΔH 增大，Tm 升高（如尼龙、PVA）。③分子间作用力与氢键：作用越强，ΔH 越大，Tm 越高。④分子量：低分子量时端基多、ΔS 大，Tm 偏低，分子量增大后趋于定值。⑤共聚：无规共聚破坏结晶规整性、使晶片变薄，Tm 显著下降；嵌段或接枝共聚影响较小。⑥增塑剂与稀释剂：小分子进入晶格或增加体系熵，使 Tm 降低。⑦拉伸取向与退火：取向使链伸展、熔融熵减小，Tm 升高；退火使晶片增厚、完善，Tm 升高。给分点：热力学关系 2 分，六项因素各 1 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"取向与取向函数（简答）"}],"logic":{"question":"链怎样排列成晶？成核、生长、取向和晶体完善程度怎样决定结晶度与熔融？","role":"加入长程有序：把链规整性接到结晶动力学、球晶形态、熔点及后续力学响应。","input":"链构型与规整性、链段运动和温度谱","output":"结晶能力/速率/形态/结晶度、Tm 与取向","prev":"gaowu04","next":"gaowu06","links":[{"cid":"gaohua07","text":"全同/间同等立构规整性是结晶能力的合成前提"},{"cid":"gaowu06","text":"结晶度、球晶尺寸和取向共同影响力学与透明性"}],"focus":["结构规整性与结晶能力","球晶等形态、黑十字与 Avrami 方程","结晶速率—温度曲线和结晶度测定","Tm/熔限、影响因素及取向函数"],"common":["画结晶速率—温度曲线并解释极大值","用膨胀计/DSC 数据求 Avrami 参数或结晶度","分析成核剂、冷却和牵伸对晶粒、透明度与收缩的影响","比较不同立构 PP 的结晶和 DSC 行为"],"examRefs":["past2023-003","past2023-009","past2023-017","past2022-001","past2022-009","past2022-011","past2021-003","past2021-017"]},"examRefs":["past2023-003","past2023-009","past2023-017","past2022-001","past2022-009","past2022-011","past2021-003","past2021-017"],"sourceNodeCount":10,"audit":{"sourceNodes":10,"added":0,"nodes":10,"withQuiz":9,"examRefs":8,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu06":{"title":"固体高聚物的力学性能","subject":"gaowu","nodes":[{"id":"gaowu06n01","label":"三种典型应力—应变曲线（作图、简答）","stars":5,"point":"玻璃态脆、结晶态有屈服、橡胶态低模量大形变","imgs":["img/map/m204.jpg","img/map/m205.jpg","img/map/m206.jpg"],"quiz":[{"id":"gaowu06-006","type":"term","match":true},{"id":"gaowu06-020","type":"short","match":true},{"id":"gaowu06-008","type":"term","match":true}],"notes":[{"h":"三、应力—应变曲线：三种形状，三种机制","t":"非晶玻璃态聚合物（如 PS、PMMA）在室温下拉伸，曲线几乎直线上升到断裂点，无屈服、无颈缩，断裂伸长率只有百分之几，属脆性断裂。这是链段被冻结、无法靠运动耗散能量的结果。\n结晶聚合物（如 PE、尼龙）或 Tg 以下的韧性塑料会先出现屈服：应力升到屈服点后下降，同时试样出现细颈，随后细颈两端扩展、整个试样被拉细，应力—应变曲线出现平台，最后在冷拉完成后再上升直到断裂。冷拉的微观本质是链段与晶片沿拉伸方向取向。\n橡胶则在极低应力下就给出巨大的形变（可达百分之几百），并且卸载后基本回复。它没有屈服，模量随温度升高而升高，这与金属、塑料完全相反，因为它不是能量弹性而是熵弹性。\n图 1　屈服：拉伸过程中随应变增加，工程应力不升反降的现象（北化《高分子物理》期末复习课件）"},{"h":"表 2　三种典型拉伸行为","t":"类型 ｜ 典型材料 ｜ 曲线特征 ｜ 模量量级 ｜ 断裂方式\n脆性 ｜ PS、PMMA（Tg 以下） ｜ 近似直线，无屈服 ｜ 10 的 9 次方帕 ｜ 脆性断裂\n韧性（结晶或 Tg 以下韧性料） ｜ PE、尼龙、增韧 PVC ｜ 屈服—颈缩—冷拉平台—硬化 ｜ 10 的 8 次方帕 ｜ 韧性断裂\n橡胶态 ｜ 硫化天然橡胶 ｜ 低应力大形变，可回复 ｜ 10 的 6 次方帕 ｜ 一般不脆断"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"三种典型应力—应变曲线（作图、简答）"},{"id":"gaowu06n02","label":"屈服与冷拉（颈缩）（名词解释、简答）","stars":5,"point":"屈服是塑性流动，冷拉是链段与晶片取向","imgs":["img/map/m207.jpg","img/map/m208.jpg"],"quiz":[{"id":"gaowu06-022","type":"short","match":true}],"notes":[{"h":"【真题 2】至少从 5 个方面对比总结脆性断裂与韧性断裂的区别。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 4 题（附标准答案）\n参考答案与给分点：①屈服：脆性断裂不存在屈服，韧性断裂先屈服再断裂；②应力—应变曲线：脆性为线性的，韧性为非线性的；③断裂伸长率：脆性较小，韧性较大；④断裂面：脆性光滑，韧性粗糙；⑤断裂能：脆性较小，韧性较大；⑥应力分量：脆性由张应力分量引起，韧性由切应力分量引起。给分点：任选五项，每项 1 分（0.5 分对比 + 0.5 分说明）。\n【真题 3】为改善聚丙烯的冲击性能，需选择一种橡胶增韧，现有三元乙丙橡胶与氯丁橡胶，应选哪种？说明原因并简述增韧机理。\n来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 6 题（附标准答案）\n参考答案与给分点：应选三元乙丙橡胶（EPDM）。原因是 EPDM 与 PP 极性相近、溶解度参数接近，相容性较好，界面粘结强；氯丁橡胶极性大，与 PP 不相容，界面易脱粘。增韧机理为银纹—剪切带机理：橡胶粒子作为应力集中体，在外力下引发周围基体的银纹与剪切带，二者吸收大量能量；同时橡胶粒子本身发生形变、终止银纹扩展，从而把脆性断裂转为韧性断裂。给分点：选择 1 分、原因 2 分、机理 3 分。\n【真题 4】硫化橡胶试样在 300 K 时用 15 N 拉力拉伸到初始长度的 2 倍，试样横截面为 30 mm×2 mm，橡胶密度为 950 kg/m³，求网链平均分子量 Mc。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 1 题（附标准答案）\n参考答案与给分点：①应力：横截面积 30 毫米乘 2 毫米等于 6 乘 10 的负 5 次方平方米，σ 等于 15 除以该面积，得 2.5 乘 10 的 5 次方帕；②用橡胶弹性状态方程 σ 等于（密度乘以气体常数乘以温度除以 Mc）乘以（λ 减 1 比 λ 平方），λ 等于 2，括号内等于 2 减 0.25 等于 1.75；③代入得 Mc 等于 950 乘 8.314 乘 300 乘 1.75 除以 2.5 乘 10 的 5 次方，约 1.66 乘 10 的 4 次方克每摩尔。给分点：公式 2 分、推导 2 分、结果 2 分。\n【真题 5】某聚合物 140 度时黏度为 1 乘 10 的 5 次方帕秒（Tg 为 110 度），求 160 度时的黏度。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 2 题（附标准答案）\n参考答案与给分点：用 WLF 方程 lg aT 等于负 17.44（T 减 Tg）除以 51.6 加（T 减 Tg）。140 度时：分子为 17.44 乘 30 等于 523.2，分母为 81.6，得 lg aT 约负 6.41；160 度时：分子为 17.44 乘 50 等于 872，分母为 101.6，得 lg aT 约负 8.58。两者之差为负 2.17，即 160…"},{"h":"三、应力—应变曲线：三种形状，三种机制","t":"非晶玻璃态聚合物（如 PS、PMMA）在室温下拉伸，曲线几乎直线上升到断裂点，无屈服、无颈缩，断裂伸长率只有百分之几，属脆性断裂。这是链段被冻结、无法靠运动耗散能量的结果。\n结晶聚合物（如 PE、尼龙）或 Tg 以下的韧性塑料会先出现屈服：应力升到屈服点后下降，同时试样出现细颈，随后细颈两端扩展、整个试样被拉细，应力—应变曲线出现平台，最后在冷拉完成后再上升直到断裂。冷拉的微观本质是链段与晶片沿拉伸方向取向。\n橡胶则在极低应力下就给出巨大的形变（可达百分之几百），并且卸载后基本回复。它没有屈服，模量随温度升高而升高，这与金属、塑料完全相反，因为它不是能量弹性而是熵弹性。\n图 1　屈服：拉伸过程中随应变增加，工程应力不升反降的现象（北化《高分子物理》期末复习课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"屈服与冷拉（颈缩）（名词解释、简答）"},{"id":"gaowu06n03","label":"断裂的Griffith理论与K1C（简答、计算）","stars":4,"point":"裂纹尖端应力集中，K1C 是断裂韧性","imgs":["img/map/m209.jpg","img/map/m210.jpg","img/map/m211.jpg"],"quiz":[{"id":"gaowu06-008","type":"term","match":true},{"id":"gaowu06-002","type":"tf","match":true},{"id":"gaowu06-013","type":"fill","match":true}],"notes":[{"h":"四、断裂：从裂纹到 K1C","t":"实际材料总有缺陷。Griffith 的思路是：裂纹扩展时释放的弹性能必须足以支付新生成的表面能，两者平衡给出临界条件。对聚合物，因为存在银纹、剪切带等耗能机制，实际断裂能远高于理论表面能，所以工程上用线弹性断裂力学的应力强度因子 K1C（断裂韧性）来表征抗裂纹扩展能力。\n使用要点：裂纹越长，临界应力越低。北化 A 卷的填空题就考这个：已知 K1C 等于 0.80 兆帕乘以米的 0.5 次方、裂纹长 2.0 cm（即半长 a 为 1.0 cm），由 σ 等于 K1C 除以（Y 乘以 a 的 0.5 次方）、取 Y 约 1，得 σ 约 4.5 兆帕。\n提高断裂韧性的途径有三：提高分子量与缠结密度（更多链被拉断而不是拔出）、引入能引发银纹或剪切带的第二相（橡胶增韧）、减少缺口与内应力（加工与设计）。\n图 2　银纹：聚合物所特有，多出现在脆性高聚物中，方向垂直于拉伸方向（北化《高分子物理》期末复习课件）"},{"h":"【真题 2】至少从 5 个方面对比总结脆性断裂与韧性断裂的区别。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 4 题（附标准答案）\n参考答案与给分点：①屈服：脆性断裂不存在屈服，韧性断裂先屈服再断裂；②应力—应变曲线：脆性为线性的，韧性为非线性的；③断裂伸长率：脆性较小，韧性较大；④断裂面：脆性光滑，韧性粗糙；⑤断裂能：脆性较小，韧性较大；⑥应力分量：脆性由张应力分量引起，韧性由切应力分量引起。给分点：任选五项，每项 1 分（0.5 分对比 + 0.5 分说明）。\n【真题 3】为改善聚丙烯的冲击性能，需选择一种橡胶增韧，现有三元乙丙橡胶与氯丁橡胶，应选哪种？说明原因并简述增韧机理。\n来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 6 题（附标准答案）\n参考答案与给分点：应选三元乙丙橡胶（EPDM）。原因是 EPDM 与 PP 极性相近、溶解度参数接近，相容性较好，界面粘结强；氯丁橡胶极性大，与 PP 不相容，界面易脱粘。增韧机理为银纹—剪切带机理：橡胶粒子作为应力集中体，在外力下引发周围基体的银纹与剪切带，二者吸收大量能量；同时橡胶粒子本身发生形变、终止银纹扩展，从而把脆性断裂转为韧性断裂。给分点：选择 1 分、原因 2 分、机理 3 分。\n【真题 4】硫化橡胶试样在 300 K 时用 15 N 拉力拉伸到初始长度的 2 倍，试样横截面为 30 mm×2 mm，橡胶密度为 950 kg/m³，求网链平均分子量 Mc。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 1 题（附标准答案）\n参考答案与给分点：①应力：横截面积 30 毫米乘 2 毫米等于 6 乘 10 的负 5 次方平方米，σ 等于 15 除以该面积，得 2.5 乘 10 的 5 次方帕；②用橡胶弹性状态方程 σ 等于（密度乘以气体常数乘以温度除以 Mc）乘以（λ 减 1 比 λ 平方），λ 等于 2，括号内等于 2 减 0.25 等于 1.75；③代入得 Mc 等于 950 乘 8.314 乘 300 乘 1.75 除以 2.5 乘 10 的 5 次方，约 1.66 乘 10 的 4 次方克每摩尔。给分点：公式 2 分、推导 2 分、结果 2 分。\n【真题 5】某聚合物 140 度时黏度为 1 乘 10 的 5 次方帕秒（Tg 为 110 度），求 160 度时的黏度。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 2 题（附标准答案）\n参考答案与给分点：用 WLF 方程 lg aT 等于负 17.44（T 减 Tg）除以 51.6 加（T 减 Tg）。140 度时：分子为 17.44 乘 30 等于 523.2，分母为 81.6，得 lg aT 约负 6.41；160 度时：分子为 17.44 乘 50 等于 872，分母为 101.6，得 lg aT 约负 8.58。两者之差为负 2.17，即 160…"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"断裂的 Griffith 理论与 K1C（简答、计算）"},{"id":"gaowu06n04","label":"银纹与剪切带的区别（简答、论述）","stars":5,"point":"银纹有微纤与空隙，垂直于外力；剪切带是剪切取向","imgs":[],"quiz":[{"id":"gaowu06-007","type":"term","match":true},{"id":"gaowu06-021","type":"short","match":true},{"id":"gaowu06-002","type":"tf","match":true}],"notes":[{"h":"表 3　银纹与剪切带的区别","t":"对比项 ｜ 银纹 ｜ 剪切带\n本质 ｜ 微纤加空隙的两相结构 ｜ 局部剪切屈服与取向\n方向 ｜ 垂直于外力方向 ｜ 与外力约成 45 度\n密度与光学 ｜ 密度下降，散射光，呈银白色 ｜ 密度基本不变，不散射\n承载能力 ｜ 仍有微纤承载，但易转成裂纹 ｜ 可承载，较稳定\n形成条件 ｜ 平面应力、低温、高速、脆性料 ｜ 平面应变、高温、低速、韧性料"},{"h":"五、银纹与剪切带：两大耗能机制","t":"银纹不是裂纹。它内部仍由取向的微纤连接着两侧，微纤之间有空洞，所以能传播光线（呈银白色）、密度下降、但仍有承载能力。银纹面垂直于外力方向。银纹的产生要吸收大量能量，因此是重要的增韧机制；但银纹过多会合并成裂纹，最终导致断裂。\n剪切带是局部剪切屈服区，链段沿剪切方向取向，面内密度基本不变、不散射光，方向与外力约呈 45 度。剪切带也能耗能，且不像银纹那样容易转成裂纹。\n判断材料靠哪种机制耗能，看它的应力状态：平面应力（薄试样、有缺口）易生银纹，平面应变（厚试样）易生剪切带；温度低、速率快时倾向银纹，温度高、速率慢时倾向剪切带。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"银纹与剪切带的区别（简答、论述）"},{"id":"gaowu06n05","label":"脆性断裂与韧性断裂的对比（简答（五方面））","stars":5,"point":"屈服有无、断口形貌、伸长率、断裂能","imgs":[],"quiz":[{"id":"gaowu06-021","type":"short","match":true},{"id":"gaowu06-003","type":"tf","match":true},{"id":"gaowu06-017","type":"mcq","match":true}],"notes":[{"h":"【真题 2】至少从 5 个方面对比总结脆性断裂与韧性断裂的区别。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 4 题（附标准答案）\n参考答案与给分点：①屈服：脆性断裂不存在屈服，韧性断裂先屈服再断裂；②应力—应变曲线：脆性为线性的，韧性为非线性的；③断裂伸长率：脆性较小，韧性较大；④断裂面：脆性光滑，韧性粗糙；⑤断裂能：脆性较小，韧性较大；⑥应力分量：脆性由张应力分量引起，韧性由切应力分量引起。给分点：任选五项，每项 1 分（0.5 分对比 + 0.5 分说明）。\n【真题 3】为改善聚丙烯的冲击性能，需选择一种橡胶增韧，现有三元乙丙橡胶与氯丁橡胶，应选哪种？说明原因并简述增韧机理。\n来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 6 题（附标准答案）\n参考答案与给分点：应选三元乙丙橡胶（EPDM）。原因是 EPDM 与 PP 极性相近、溶解度参数接近，相容性较好，界面粘结强；氯丁橡胶极性大，与 PP 不相容，界面易脱粘。增韧机理为银纹—剪切带机理：橡胶粒子作为应力集中体，在外力下引发周围基体的银纹与剪切带，二者吸收大量能量；同时橡胶粒子本身发生形变、终止银纹扩展，从而把脆性断裂转为韧性断裂。给分点：选择 1 分、原因 2 分、机理 3 分。\n【真题 4】硫化橡胶试样在 300 K 时用 15 N 拉力拉伸到初始长度的 2 倍，试样横截面为 30 mm×2 mm，橡胶密度为 950 kg/m³，求网链平均分子量 Mc。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 1 题（附标准答案）\n参考答案与给分点：①应力：横截面积 30 毫米乘 2 毫米等于 6 乘 10 的负 5 次方平方米，σ 等于 15 除以该面积，得 2.5 乘 10 的 5 次方帕；②用橡胶弹性状态方程 σ 等于（密度乘以气体常数乘以温度除以 Mc）乘以（λ 减 1 比 λ 平方），λ 等于 2，括号内等于 2 减 0.25 等于 1.75；③代入得 Mc 等于 950 乘 8.314 乘 300 乘 1.75 除以 2.5 乘 10 的 5 次方，约 1.66 乘 10 的 4 次方克每摩尔。给分点：公式 2 分、推导 2 分、结果 2 分。\n【真题 5】某聚合物 140 度时黏度为 1 乘 10 的 5 次方帕秒（Tg 为 110 度），求 160 度时的黏度。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 2 题（附标准答案）\n参考答案与给分点：用 WLF 方程 lg aT 等于负 17.44（T 减 Tg）除以 51.6 加（T 减 Tg）。140 度时：分子为 17.44 乘 30 等于 523.2，分母为 81.6，得 lg aT 约负 6.41；160 度时：分子为 17.44 乘 50 等于 872，分母为 101.6，得 lg aT 约负 8.58。两者之差为负 2.17，即 160…"},{"h":"十一、易错清单与自测","t":"★★★　能画三种应力—应变曲线并说明机制\n★★★　能对比银纹与剪切带五个方面\n★★★　能默写蠕变、应力松弛、滞后、内耗四个定义\n★★★　能用 Maxwell、Kelvin 模型解释松弛与蠕变\n★★★　能用 WLF 方程做一次完整的温度换算计算\n★★★　能用橡胶弹性状态方程算交联点间分子量\n★★　能说出脆性断裂与韧性断裂的五项区别\n★★　能解释内耗峰为什么出现在 Tg 附近\n★　能画出熔体流动三区并说明各区机理\n一句总结本章所有现象都由一个问题统摄：链段来不来得及跟上外场。跟得上就显韧性、低模量；跟不上就显脆性、高模量；刚好卡在中间，就是内耗峰与玻璃化转变。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"脆性断裂与韧性断裂的对比（简答（五方面））"},{"id":"gaowu06n06","label":"脆韧转变及其影响因素（论述）","stars":4,"point":"温度、速率、缺口、分子量、增塑","imgs":["img/map/m212.jpg"],"quiz":[{"id":"gaowu06-010","type":"fill","match":true}],"notes":[{"h":"一、本章坐标：一门课里最“工程”的一章","t":"前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。\n逻辑链：① 瞬时响应（应力—应变曲线、屈服、断裂韧性） → ② 缺陷与机理（银纹、剪切带、脆韧转变） → ③ 时间响应（蠕变、应力松弛、Maxwell 与 Kelvin 模型） → ④ 动态响应（储能模量、损耗模量、内耗峰、时温等效） → ⑤ 橡胶弹性（熵弹性、状态方程、交联点间分子量） → ⑥ 熔体流变（三区流动曲线、幂律、分子量影响）读法：读法：本章有一条贯穿线——时间。同一材料在快加载下是脆的，在慢加载或高温下是韧的，因为链段有松弛时间。凡答不出“为什么”，先想松弛时间够不够。\n命题口径本章是 866 分值最高的一章，简答、计算、论述都可能出。北化期末 A 卷在这章放了四道题（蠕变与内耗的定义、脆性与韧性断裂对比、橡胶弹性计算、WLF 计算）。必须做到：概念能背定义、曲线能画、公式能算。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"脆韧转变及其影响因素（论述）"},{"id":"gaowu06n07","label":"增韧机理与橡胶选择（论述）","stars":4,"point":"银纹—剪切带机理，选相容性好的橡胶","imgs":[],"quiz":[{"id":"gaowu06-014","type":"fill","match":true},{"id":"gaowu06-005","type":"tf","match":true},{"id":"gaowu06-023","type":"calc","match":true}],"notes":[{"h":"【真题 2】至少从 5 个方面对比总结脆性断裂与韧性断裂的区别。","t":"来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 4 题（附标准答案）\n参考答案与给分点：①屈服：脆性断裂不存在屈服，韧性断裂先屈服再断裂；②应力—应变曲线：脆性为线性的，韧性为非线性的；③断裂伸长率：脆性较小，韧性较大；④断裂面：脆性光滑，韧性粗糙；⑤断裂能：脆性较小，韧性较大；⑥应力分量：脆性由张应力分量引起，韧性由切应力分量引起。给分点：任选五项，每项 1 分（0.5 分对比 + 0.5 分说明）。\n【真题 3】为改善聚丙烯的冲击性能，需选择一种橡胶增韧，现有三元乙丙橡胶与氯丁橡胶，应选哪种？说明原因并简述增韧机理。\n来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 6 题（附标准答案）\n参考答案与给分点：应选三元乙丙橡胶（EPDM）。原因是 EPDM 与 PP 极性相近、溶解度参数接近，相容性较好，界面粘结强；氯丁橡胶极性大，与 PP 不相容，界面易脱粘。增韧机理为银纹—剪切带机理：橡胶粒子作为应力集中体，在外力下引发周围基体的银纹与剪切带，二者吸收大量能量；同时橡胶粒子本身发生形变、终止银纹扩展，从而把脆性断裂转为韧性断裂。给分点：选择 1 分、原因 2 分、机理 3 分。\n【真题 4】硫化橡胶试样在 300 K 时用 15 N 拉力拉伸到初始长度的 2 倍，试样横截面为 30 mm×2 mm，橡胶密度为 950 kg/m³，求网链平均分子量 Mc。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 1 题（附标准答案）\n参考答案与给分点：①应力：横截面积 30 毫米乘 2 毫米等于 6 乘 10 的负 5 次方平方米，σ 等于 15 除以该面积，得 2.5 乘 10 的 5 次方帕；②用橡胶弹性状态方程 σ 等于（密度乘以气体常数乘以温度除以 Mc）乘以（λ 减 1 比 λ 平方），λ 等于 2，括号内等于 2 减 0.25 等于 1.75；③代入得 Mc 等于 950 乘 8.314 乘 300 乘 1.75 除以 2.5 乘 10 的 5 次方，约 1.66 乘 10 的 4 次方克每摩尔。给分点：公式 2 分、推导 2 分、结果 2 分。\n【真题 5】某聚合物 140 度时黏度为 1 乘 10 的 5 次方帕秒（Tg 为 110 度），求 160 度时的黏度。\n来源：北京化工大学《高分子物理》期末试题 A 卷·计算题第 2 题（附标准答案）\n参考答案与给分点：用 WLF 方程 lg aT 等于负 17.44（T 减 Tg）除以 51.6 加（T 减 Tg）。140 度时：分子为 17.44 乘 30 等于 523.2，分母为 81.6，得 lg aT 约负 6.41；160 度时：分子为 17.44 乘 50 等于 872，分母为 101.6，得 lg aT 约负 8.58。两者之差为负 2.17，即 160…"},{"h":"一、本章坐标：一门课里最“工程”的一章","t":"前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。\n逻辑链：① 瞬时响应（应力—应变曲线、屈服、断裂韧性） → ② 缺陷与机理（银纹、剪切带、脆韧转变） → ③ 时间响应（蠕变、应力松弛、Maxwell 与 Kelvin 模型） → ④ 动态响应（储能模量、损耗模量、内耗峰、时温等效） → ⑤ 橡胶弹性（熵弹性、状态方程、交联点间分子量） → ⑥ 熔体流变（三区流动曲线、幂律、分子量影响）读法：读法：本章有一条贯穿线——时间。同一材料在快加载下是脆的，在慢加载或高温下是韧的，因为链段有松弛时间。凡答不出“为什么”，先想松弛时间够不够。\n命题口径本章是 866 分值最高的一章，简答、计算、论述都可能出。北化期末 A 卷在这章放了四道题（蠕变与内耗的定义、脆性与韧性断裂对比、橡胶弹性计算、WLF 计算）。必须做到：概念能背定义、曲线能画、公式能算。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"增韧机理与橡胶选择（论述）"},{"id":"gaowu06n08","label":"蠕变与应力松弛（名词解释、简答）","stars":5,"point":"恒应力下形变随时间增大；恒形变下应力随时间衰减","imgs":["img/map/m213.jpg"],"quiz":[{"id":"gaowu06-006","type":"term","match":true},{"id":"gaowu06-020","type":"short","match":true},{"id":"gaowu06-022","type":"short","match":true}],"notes":[{"h":"六、蠕变与应力松弛：时间一长，材料就“软”了","t":"蠕变是在恒定温度与恒定应力下，形变随时间增大的现象。它的曲线分三段：第一段是普弹形变（键长键角，瞬时、可完全回复）；第二段是高弹形变（链段舒展，随时间发展、可回复但有滞后）；第三段是黏性形变（整链滑移，不可回复）。温度越高、应力越大、分子量越低，蠕变越明显；交联可完全抑制第三段。\n应力松弛是在恒定形变下，应力随时间衰减的现象。原因是链段逐步重排，把初始的弹性应力“消化”掉。Maxwell 模型（弹簧与黏壶串联）能描述这一过程：应力按 exp 负 t 除以松弛时间的规律衰减，松弛时间等于黏度除以模量。\nKelvin（Voigt）模型是弹簧与黏壶并联，能描述交联聚合物的蠕变与回复：形变按 1 减 exp 的规律趋近平衡值，但给不出初始的普弹形变。所以常用四元件模型（Maxwell 与 Kelvin 串联）来完整描述蠕变的三段。\n松弛时间 τ 是本章的核心参数：τ 大表示偏弹性（应力保持久），τ 小表示偏黏性（应力很快消失）。定义上，应力松弛到初始值的 36.8%（即 1/e）所需时间就是 τ；北化填空题把“松弛过程完成 63.2%”作为 τ 的另一种表述，两者等价。\n图 3　蠕变曲线：普弹形变、高弹形变与黏性形变三段叠加（北化《高分子物理》期末复习课件）"},{"h":"十、真题与期末题演练","t":"【真题 1】说明聚合物的蠕变、应力松弛、滞后和内耗现象，并简要说明为什么聚合物具有这些现象。\n来源：北京化工大学《高分子物理》期末试题 A 卷·简答题第 2 题（附标准答案）\n参考答案与给分点：蠕变：在一定温度和较小的恒定应力下，材料的应变随时间增加而增大的现象。应力松弛：在恒定温度和形变保持不变的情况下，聚合物内部的应力随时间增加而逐渐衰减的现象。滞后：聚合物在交变应力作用下，应变落后于应力的现象。内耗：由于发生滞后现象，在每一循环变化中作为热损耗掉的能量。原因：高分子链可以通过链段运动使分子链重排或质心滑移，从而使应力松弛，因此出现蠕变与应力松弛；在交变应力下，链段运动受阻于内摩擦力，因此出现滞后与内耗。给分点：四个定义各 1.5 分，原因 2 分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"蠕变与应力松弛（名词解释、简答）"},{"id":"gaowu06n09","label":"Maxwell与Kelvin模型（简答、作图）","stars":4,"point":"Maxwell 串弹簧与黏壶，描述应力松弛","imgs":["img/map/m214.jpg","img/map/m215.jpg","img/map/m216.jpg"],"quiz":[],"notes":[{"h":"一、本章坐标：一门课里最“工程”的一章","t":"前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。\n逻辑链：① 瞬时响应（应力—应变曲线、屈服、断裂韧性） → ② 缺陷与机理（银纹、剪切带、脆韧转变） → ③ 时间响应（蠕变、应力松弛、Maxwell 与 Kelvin 模型） → ④ 动态响应（储能模量、损耗模量、内耗峰、时温等效） → ⑤ 橡胶弹性（熵弹性、状态方程、交联点间分子量） → ⑥ 熔体流变（三区流动曲线、幂律、分子量影响）读法：读法：本章有一条贯穿线——时间。同一材料在快加载下是脆的，在慢加载或高温下是韧的，因为链段有松弛时间。凡答不出“为什么”，先想松弛时间够不够。\n命题口径本章是 866 分值最高的一章，简答、计算、论述都可能出。北化期末 A 卷在这章放了四道题（蠕变与内耗的定义、脆性与韧性断裂对比、橡胶弹性计算、WLF 计算）。必须做到：概念能背定义、曲线能画、公式能算。"},{"h":"表 4　两个基本模型","t":"模型 ｜ 连接方式 ｜ 能描述 ｜ 描述不了\nMaxwell ｜ 弹簧与黏壶串联 ｜ 应力松弛（线形聚合物） ｜ 蠕变的初始普弹段与回复\nKelvin（Voigt） ｜ 弹簧与黏壶并联 ｜ 交联聚合物的蠕变与延迟回复 ｜ 初始普弹形变、应力松弛\n四元件 ｜ Maxwell 与 Kelvin 串联 ｜ 完整蠕变三段 ｜ 结构复杂，参数多"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"Maxwell 与 Kelvin 模型（简答、作图）"},{"id":"gaowu06n10","label":"滞后与内耗的定义与成因（简答）","stars":5,"point":"应变落后于应力，弹性能转为热","imgs":[],"quiz":[{"id":"gaowu06-024","type":"essay","match":true}],"notes":[{"h":"七、动态力学：储能、损耗与内耗峰","t":"在交变应力下，应变总是落后应力一个相位角 δ。把模量拆成两部分：与应变异相的部分叫储能模量（代表可储存的弹性能），与应变相差 90 度的部分叫损耗模量（代表每周期耗散的热）。两者之比的正切就是损耗因子。\n内耗（力学损耗）随温度的变化在 Tg 附近出现峰值：Tg 以下链段冻住，形变很小、摩擦小，内耗低；Tg 以上链段自由，应变跟得上应力，内耗也低；恰在 Tg 附近，链段能动但体系粘度大，应变严重滞后，把弹性能大量转为热，内耗最大。这个峰既是测 Tg 的手段，也是阻尼材料的选材依据。\n时温等效：高温下的短时间行为等价于低温下的长时间行为。把不同温度下测得的模量曲线沿对数时间轴水平平移，可拼成一条主曲线，平移量就是移动因子 aT。Tg 附近用 WLF 方程计算 aT；远离 Tg 用 Arrhenius 型。注意：温度从高温向低温变化时，aT 大于 1。"},{"h":"一、本章坐标：一门课里最“工程”的一章","t":"前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。\n逻辑链：① 瞬时响应（应力—应变曲线、屈服、断裂韧性） → ② 缺陷与机理（银纹、剪切带、脆韧转变） → ③ 时间响应（蠕变、应力松弛、Maxwell 与 Kelvin 模型） → ④ 动态响应（储能模量、损耗模量、内耗峰、时温等效） → ⑤ 橡胶弹性（熵弹性、状态方程、交联点间分子量） → ⑥ 熔体流变（三区流动曲线、幂律、分子量影响）读法：读法：本章有一条贯穿线——时间。同一材料在快加载下是脆的，在慢加载或高温下是韧的，因为链段有松弛时间。凡答不出“为什么”，先想松弛时间够不够。\n命题口径本章是 866 分值最高的一章，简答、计算、论述都可能出。北化期末 A 卷在这章放了四道题（蠕变与内耗的定义、脆性与韧性断裂对比、橡胶弹性计算、WLF 计算）。必须做到：概念能背定义、曲线能画、公式能算。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"滞后与内耗的定义与成因（简答）"},{"id":"gaowu06n11","label":"动态模量与时温等效（WLF）（计算、简答）","stars":5,"point":"储能模量与损耗模量相差 90 度；WLF 平移","imgs":[],"quiz":[{"id":"gaowu06-015","type":"fill","match":true},{"id":"gaowu06-023","type":"calc","match":true},{"id":"gaowu06-004","type":"tf","match":true}],"notes":[{"h":"一、本章坐标：一门课里最“工程”的一章","t":"前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。\n逻辑链：① 瞬时响应（应力—应变曲线、屈服、断裂韧性） → ② 缺陷与机理（银纹、剪切带、脆韧转变） → ③ 时间响应（蠕变、应力松弛、Maxwell 与 Kelvin 模型） → ④ 动态响应（储能模量、损耗模量、内耗峰、时温等效） → ⑤ 橡胶弹性（熵弹性、状态方程、交联点间分子量） → ⑥ 熔体流变（三区流动曲线、幂律、分子量影响）读法：读法：本章有一条贯穿线——时间。同一材料在快加载下是脆的，在慢加载或高温下是韧的，因为链段有松弛时间。凡答不出“为什么”，先想松弛时间够不够。\n命题口径本章是 866 分值最高的一章，简答、计算、论述都可能出。北化期末 A 卷在这章放了四道题（蠕变与内耗的定义、脆性与韧性断裂对比、橡胶弹性计算、WLF 计算）。必须做到：概念能背定义、曲线能画、公式能算。"},{"h":"七、动态力学：储能、损耗与内耗峰","t":"在交变应力下，应变总是落后应力一个相位角 δ。把模量拆成两部分：与应变异相的部分叫储能模量（代表可储存的弹性能），与应变相差 90 度的部分叫损耗模量（代表每周期耗散的热）。两者之比的正切就是损耗因子。\n内耗（力学损耗）随温度的变化在 Tg 附近出现峰值：Tg 以下链段冻住，形变很小、摩擦小，内耗低；Tg 以上链段自由，应变跟得上应力，内耗也低；恰在 Tg 附近，链段能动但体系粘度大，应变严重滞后，把弹性能大量转为热，内耗最大。这个峰既是测 Tg 的手段，也是阻尼材料的选材依据。\n时温等效：高温下的短时间行为等价于低温下的长时间行为。把不同温度下测得的模量曲线沿对数时间轴水平平移，可拼成一条主曲线，平移量就是移动因子 aT。Tg 附近用 WLF 方程计算 aT；远离 Tg 用 Arrhenius 型。注意：温度从高温向低温变化时，aT 大于 1。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"动态模量与时温等效（WLF）（计算、简答）"},{"id":"gaowu06n12","label":"橡胶弹性的热力学与统计理论（计算、简答）","stars":5,"point":"熵弹性，σ 与交联点间分子量有关","imgs":["img/map/m217.jpg","img/map/m218.jpg","img/map/m219.jpg"],"quiz":[{"id":"gaowu06-011","type":"fill","match":true},{"id":"gaowu06-004","type":"tf","match":true},{"id":"gaowu06-023","type":"calc","match":true}],"notes":[{"h":"八、橡胶弹性：唯一能算的一节","t":"橡胶的高弹性是熵弹性：拉伸时链由蜷曲变伸展，构象数减少、熵降低，回缩的驱动力是熵增而不是内能。所以橡胶拉伸时放热（红外测温可测到温升），且模量随温度升高而增大——这两点与金属、塑料正好相反，是判断题的经典陷阱。\n产生橡胶弹性的三个条件：长链（足够长的柔性链）、柔性链（Tg 远低于使用温度）、交联（形成网络防止整链滑移）。三者缺一不可，北化填空题正是这三条。\n统计理论给出状态方程：σ 等于（密度乘以气体常数乘以温度除以交联点间分子量）乘以（伸长比减伸长比平方的倒数）。由此可以算交联密度，也可以验证“模量正比于温度”。\n典型计算（北化 A 卷）：300 K 下，截面积 30 毫米乘 2 毫米的试样受 15 N 拉力拉伸到原长 2 倍，密度 950 千克每立方米。先算应力为 15 N 除以 6 乘 10 的负 5 次方平方米，得 2.5 乘 10 的 5 次方帕；伸长比 λ 为 2，括号内为 2 减 0.25 等于 1.75；代入解出交联点间分子量约 1.66 乘 10 的 4 次方克每摩尔。"},{"h":"表 6　橡胶弹性要点","t":"要点 ｜ 结论\n本质 ｜ 熵弹性，回缩力来自构象熵增加\n热效应 ｜ 绝热拉伸温度升高（内能变化小、熵减少）\n模量与温度 ｜ 随温度升高而增大（与金属相反）\n三个条件 ｜ 长链、柔性链、交联\n状态方程 ｜ σ 正比于密度、温度，反比于交联点间分子量\n体积变化 ｜ 拉伸时体积近似不变（泊松比约 0.5）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"橡胶弹性的热力学与统计理论（计算、简答）"},{"id":"gaowu06n13","label":"熔体流动的三区与幂律（作图、简答）","stars":4,"point":"第一牛顿区、假塑区、第二牛顿区","imgs":[],"quiz":[],"notes":[{"h":"九、熔体流变：三区一曲线","t":"聚合物熔体的流动曲线（粘度对剪切速率）分三区。第一牛顿区：剪切速率很低，缠结的生成与破坏达到动态平衡，缠结点数不变，粘度恒定，称零剪切粘度。假塑区：剪切速率升高，缠结破坏快于生成，缠结点减少，同时链沿流动方向取向，粘度随剪切速率上升而下降，服从幂律（n 小于 1）。第二牛顿区：剪切速率极高，缠结几乎全被破坏、取向已达极限，粘度再次恒定，称无穷剪切粘度。\n分子量的影响很陡：超过临界缠结分子量后，零剪切粘度按分子量的 3.4 次方增长。分布的影响见第 3 章：低剪切下宽分布更粘，高剪切下窄分布更粘。\n弹性效应是熔体独有的现象：爬杆（韦森堡效应）、挤出胀大（离模膨胀）、熔体破裂。它们都源于法向应力差，是“熔体不只是黏性流体，还储存弹性能”的直接证据。"},{"h":"一、本章坐标：一门课里最“工程”的一章","t":"前面讲的是“材料是什么”，本章讲的是“材料受力时怎样”。它由四块拼成：一是拉伸行为（应力—应变曲线与断裂）；二是时间相关的黏弹性（蠕变、应力松弛、动态损耗）；三是橡胶的高弹性（统计理论，能算交联密度）；四是熔体的流变（粘度与剪切速率）。四块共用一套语言：应力、应变、模量、松弛时间。\n逻辑链：① 瞬时响应（应力—应变曲线、屈服、断裂韧性） → ② 缺陷与机理（银纹、剪切带、脆韧转变） → ③ 时间响应（蠕变、应力松弛、Maxwell 与 Kelvin 模型） → ④ 动态响应（储能模量、损耗模量、内耗峰、时温等效） → ⑤ 橡胶弹性（熵弹性、状态方程、交联点间分子量） → ⑥ 熔体流变（三区流动曲线、幂律、分子量影响）读法：读法：本章有一条贯穿线——时间。同一材料在快加载下是脆的，在慢加载或高温下是韧的，因为链段有松弛时间。凡答不出“为什么”，先想松弛时间够不够。\n命题口径本章是 866 分值最高的一章，简答、计算、论述都可能出。北化期末 A 卷在这章放了四道题（蠕变与内耗的定义、脆性与韧性断裂对比、橡胶弹性计算、WLF 计算）。必须做到：概念能背定义、曲线能画、公式能算。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"熔体流动的三区与幂律（作图、简答）"},{"label":"熔体黏弹性：爬杆、挤出胀大与熔体破裂","stars":5,"point":"三者都说明聚合物熔体不是纯黏性流体：剪切/拉伸使链取向并储存可回复弹性能，弹性回复与流动失稳共同造成爬杆、离模膨胀和挤出畸变。","notesTitle":"真题补漏讲解","notes":[{"h":"现象—机理—改善措施要一一对应","t":"爬杆（Weissenberg 效应）：旋转剪切产生法向应力差，熔体沿搅拌杆上爬。\n挤出胀大：口模内被剪切、拉伸取向的链离开口模后发生弹性回复，挤出物直径可大于口模。\n熔体破裂：超过临界流动条件后，入口/口模附近应力集中、滑移—黏附及弹性失稳等造成鲨鱼皮、周期性畸变乃至破裂；不能把一切原因归结为单一“黏度过大”。\n\n改善思路：降低剪切速率、提高口模温度或优化入口和口模流道、减小入口应力集中、使用加工助剂。改变分子量或分布会同时改变黏度与弹性，不能笼统说“提高分子量就能消除”。"}],"quiz":[{"id":"past2022-004","type":"mcq","match":true},{"id":"past2022-013","type":"essay","match":true}],"added":true,"id":"gaowu06n14","imgs":[],"quizAudited":true,"fullLabel":"熔体黏弹性：爬杆、挤出胀大与熔体破裂","importanceBasis":"已录2021—2023真题与课程体系补漏"}],"logic":{"question":"链段运动与聚集态如何共同决定变形、断裂、耗能和熔体流动？","role":"全课程的力学综合章：把链结构、Tg、结晶和时间尺度汇入应力—应变、黏弹性、破坏与加工。","input":"链柔性＋Tg/松弛＋结晶/取向＋分子量分布","output":"应力—应变、黏弹模型、断裂增韧、橡胶弹性与流变","prev":"gaowu05","next":"gaowu07","links":[{"cid":"gaowu04","text":"蠕变、应力松弛、WLF 都是链段松弛的不同观察方式"},{"cid":"gaowu05","text":"结晶度与球晶尺寸改变模量、强度、韧性和透明性"},{"cid":"gaowu03","text":"分子量及分布决定熔体黏度与弹性效应"}],"focus":["应力—应变、屈服冷拉与脆韧断裂","银纹/剪切带与橡胶增韧","蠕变、应力松弛、Maxwell/Kelvin、WLF 和内耗","橡胶弹性与熔体流动","爬杆、挤出胀大、熔体破裂（真题补漏）"],"common":["画并比较典型应力—应变曲线，解释屈服、颈缩和冷拉","用链段运动解释蠕变/应力松弛并画模型曲线","设计 PS 增韧方案，比较银纹与剪切带耗能","列举熔体和本体黏弹性现象并提出加工改进措施","计算橡胶统计理论或动态模量/时温等效"],"examRefs":["past2023-008","past2023-011","past2023-014","past2022-002","past2022-004","past2022-006","past2022-013","past2021-004","past2021-009","past2021-017","past2021-022"]},"examRefs":["past2023-008","past2023-011","past2023-014","past2022-002","past2022-004","past2022-006","past2022-013","past2021-004","past2021-009","past2021-017","past2021-022"],"sourceNodeCount":13,"audit":{"sourceNodes":13,"added":1,"nodes":14,"withQuiz":12,"examRefs":11,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}},"gaowu07":{"title":"高聚物的电学性能","subject":"gaowu","nodes":[{"id":"gaowu07n01","label":"四种极化的机制（简答、选择）","stars":5,"point":"电子、原子、取向、界面，速度依次变慢","imgs":[],"quiz":[{"id":"gaowu07-002","type":"tf","match":true},{"id":"gaowu07-010","type":"fill","match":true}],"notes":[{"h":"表 2　四种极化的比较","t":"类型 ｜ 机制 ｜ 响应时间 ｜ 温度依赖 ｜ 存在于\n电子极化 ｜ 电子云相对核位移 ｜ 约 10 的负 15 次方秒 ｜ 无 ｜ 所有聚合物\n原子（离子）极化 ｜ 正负离子相对位移 ｜ 约 10 的负 13 次方秒 ｜ 弱 ｜ 含极性键者\n取向（偶极）极化 ｜ 极性基团整体转向 ｜ 10 的负 6 次方秒以上 ｜ 强，受 Tg 控制 ｜ 极性聚合物\n界面极化 ｜ 界面处电荷堆积 ｜ 最慢，低频显著 ｜ 弱 ｜ 非均相、含填料体系"},{"h":"三、极化：四种机制，四种速度","t":"极化是介质在外电场下产生偶极矩的过程。按机制分四种，关键区别在于“响应快慢”。\n①电子极化：原子核外的电子云相对原子核偏移，形成瞬时偶极。它极快（10 的负 15 次方秒），所有聚合物都有，贡献小、不随温度变化。②原子极化（离子极化）：正负离子或不同原子相对位移，速度稍慢（10 的负 13 次方秒），只在含极性键的聚合物中明显。③取向极化（偶极极化）：极性基团整体转向电场，速度最慢（10 的负 6 次方秒以上），受链段活动性控制，因此强烈依赖温度与频率——这是本章的核心。④界面极化（空间电荷极化）：在非均相体系（复合材料、含填料、含空隙）中，电荷在界面处堆积，速度最慢，常出现在低频。\n图 1　原子极化：正负电荷中心相对位移形成诱导偶极（北化《高分子物理》期末复习课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"四种极化的机制（简答、选择）"},{"id":"gaowu07n02","label":"介电常数的定义与影响因素（简答、计算）","stars":4,"point":"极性越大、取向越易，介电常数越大","imgs":["img/map/m220.jpg","img/map/m221.jpg","img/map/m222.jpg"],"quiz":[{"id":"gaowu07-023","type":"calc","match":true},{"id":"gaowu07-006","type":"term","match":true},{"id":"gaowu07-001","type":"tf","match":true}],"notes":[{"h":"四、介电常数：极化的宏观读数","t":"介电常数（相对介电常数）定义为电容器充入该介质后电容增大的倍数，也等于真空中的电场强度与介质中电场强度之比。极化越强，介质削弱电场的能力越强，介电常数越大。\n非极性聚合物（PE、PP、PTFE）只有电子与原子极化，介电常数小（约 2 到 2.5），且随频率与温度几乎不变，是优良的高频绝缘材料。极性聚合物（PVA、尼龙、酚醛）有取向极化，介电常数大（可达 4 到 10 以上），但随频率与温度变化剧烈。\n频率的影响：频率很低时，四种极化都跟得上，介电常数最大；频率升高到取向极化跟不上时，取向极化退出，介电常数陡降一阶；再高到原子极化也跟不上，再降一阶。所以介电常数—频率曲线上有台阶，每个台阶对应一种极化的“退出”，台阶处正是损耗峰的位置。\n温度的影响：升温使链段活动性提高，取向极化更容易，介电常数上升；但温度过高时热运动扰乱取向，介电常数又下降。对非极性聚合物，温度影响很小。\n图 2　（相对）介电常数：长时通电达稳态后，电容增大（电场减弱）的倍数（北化《高分子物理》期末复习课件）"},{"h":"五、介电损耗：热从哪里来","t":"交变电场下，偶极转向总有一点跟不上电场的变化，于是产生相位差 δ。每周期有一部分电能不可逆地转为热，这就是介电损耗，用损耗角正切 tan δ 表示（也等于损耗模量与储能模量之比，与力学章的定义同构）。\n损耗由两部分组成：一是电导损耗（漏电流发热），在低频与高温下显著；二是极化损耗（偶极转向滞后），在取向极化退出的频率段显著。工程上，高频绝缘材料要求 tan δ 极小（如 PTFE 约 10 的负 4 次方量级），而微波加热、焊接则要选 tan δ 大的材料。\n介电损耗—温度曲线上，极性聚合物在 Tg 附近出现一个陡峭的峰，机制与内耗峰完全相同：Tg 以下偶极被冻住不能转向，损耗小；Tg 以上转向太快、几乎无滞后，损耗也小；Tg 附近能转但阻力大，滞后最大，损耗最大。此外在更低温还会出现次级转变对应的 β 峰（侧基转动）。\n图 3　极性高聚物的介电常数与损耗随温度、频率的变化：Tg 附近出现损耗峰（北化《高分子物理》期末复习课件）\n一句话对照力学章的储能模量对应介电章的介电常数，损耗模量对应介电损耗，tan δ 在两章里是同一个符号、同一套物理。学会一章，另一章只需换名词。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"介电常数的定义与影响因素（简答、计算）"},{"id":"gaowu07n03","label":"介电损耗与损耗角正切（简答、名词解释）","stars":5,"point":"偶极转向滞后，能量转为热","imgs":[],"quiz":[{"id":"gaowu07-007","type":"term","match":true},{"id":"gaowu07-012","type":"fill","match":true},{"id":"gaowu07-020","type":"short","match":true}],"notes":[{"h":"五、介电损耗：热从哪里来","t":"交变电场下，偶极转向总有一点跟不上电场的变化，于是产生相位差 δ。每周期有一部分电能不可逆地转为热，这就是介电损耗，用损耗角正切 tan δ 表示（也等于损耗模量与储能模量之比，与力学章的定义同构）。\n损耗由两部分组成：一是电导损耗（漏电流发热），在低频与高温下显著；二是极化损耗（偶极转向滞后），在取向极化退出的频率段显著。工程上，高频绝缘材料要求 tan δ 极小（如 PTFE 约 10 的负 4 次方量级），而微波加热、焊接则要选 tan δ 大的材料。\n介电损耗—温度曲线上，极性聚合物在 Tg 附近出现一个陡峭的峰，机制与内耗峰完全相同：Tg 以下偶极被冻住不能转向，损耗小；Tg 以上转向太快、几乎无滞后，损耗也小；Tg 附近能转但阻力大，滞后最大，损耗最大。此外在更低温还会出现次级转变对应的 β 峰（侧基转动）。\n图 3　极性高聚物的介电常数与损耗随温度、频率的变化：Tg 附近出现损耗峰（北化《高分子物理》期末复习课件）\n一句话对照力学章的储能模量对应介电章的介电常数，损耗模量对应介电损耗，tan δ 在两章里是同一个符号、同一套物理。学会一章，另一章只需换名词。"},{"h":"一、本章坐标：链段运动在电场里的另一张“体检表”","t":"本章看似独立，其实与第 4 章（玻璃化转变）、第 6 章（黏弹性）是同一套逻辑。在电场里，极性基团（偶极）要转向电场方向，这个过程同样需要链段配合、同样有松弛时间。所以介电损耗随温度的曲线与内耗曲线形状几乎一样，峰位也落在 Tg 附近。学这一章，最好的方法是“对照力学章来读”。\n逻辑链：① 极化（电子、原子、取向（偶极）、界面四种） → ② 介电常数（极化的宏观度量，随频率与温度变） → ③ 介电损耗（偶极转向滞后产生的热，tan δ 与 Tg 峰） → ④ 导电性（离子导电与电子导电，渗流与导电高分子） → ⑤ 击穿与静电（耐电压、树枝状击穿、抗静电改性）读法：读法：把“偶极”当作“链段”的替身：偶极能不能转向，取决于链段能不能动，于是 Tg 附近介电常数突降、损耗出现峰。抓住这一句，本章就通了。\n命题口径本章在 866 中分值不高，通常出名词解释（极化、介电损耗）、选择（哪种聚合物介电常数大）、简答（介电损耗峰为什么在 Tg 附近）。属于“短平快”章节，投入 2 小时即可拿下大部分分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"介电损耗与损耗角正切（简答、名词解释）"},{"id":"gaowu07n04","label":"介电损耗的温度与频率谱（简答、作图）","stars":4,"point":"Tg 附近出现损耗峰","imgs":["img/map/m223.jpg","img/map/m224.jpg"],"quiz":[{"id":"gaowu07-020","type":"short","match":true},{"id":"gaowu07-007","type":"term","match":true},{"id":"gaowu07-002","type":"tf","match":true}],"notes":[{"h":"五、介电损耗：热从哪里来","t":"交变电场下，偶极转向总有一点跟不上电场的变化，于是产生相位差 δ。每周期有一部分电能不可逆地转为热，这就是介电损耗，用损耗角正切 tan δ 表示（也等于损耗模量与储能模量之比，与力学章的定义同构）。\n损耗由两部分组成：一是电导损耗（漏电流发热），在低频与高温下显著；二是极化损耗（偶极转向滞后），在取向极化退出的频率段显著。工程上，高频绝缘材料要求 tan δ 极小（如 PTFE 约 10 的负 4 次方量级），而微波加热、焊接则要选 tan δ 大的材料。\n介电损耗—温度曲线上，极性聚合物在 Tg 附近出现一个陡峭的峰，机制与内耗峰完全相同：Tg 以下偶极被冻住不能转向，损耗小；Tg 以上转向太快、几乎无滞后，损耗也小；Tg 附近能转但阻力大，滞后最大，损耗最大。此外在更低温还会出现次级转变对应的 β 峰（侧基转动）。\n图 3　极性高聚物的介电常数与损耗随温度、频率的变化：Tg 附近出现损耗峰（北化《高分子物理》期末复习课件）\n一句话对照力学章的储能模量对应介电章的介电常数，损耗模量对应介电损耗，tan δ 在两章里是同一个符号、同一套物理。学会一章，另一章只需换名词。"},{"h":"四、介电常数：极化的宏观读数","t":"介电常数（相对介电常数）定义为电容器充入该介质后电容增大的倍数，也等于真空中的电场强度与介质中电场强度之比。极化越强，介质削弱电场的能力越强，介电常数越大。\n非极性聚合物（PE、PP、PTFE）只有电子与原子极化，介电常数小（约 2 到 2.5），且随频率与温度几乎不变，是优良的高频绝缘材料。极性聚合物（PVA、尼龙、酚醛）有取向极化，介电常数大（可达 4 到 10 以上），但随频率与温度变化剧烈。\n频率的影响：频率很低时，四种极化都跟得上，介电常数最大；频率升高到取向极化跟不上时，取向极化退出，介电常数陡降一阶；再高到原子极化也跟不上，再降一阶。所以介电常数—频率曲线上有台阶，每个台阶对应一种极化的“退出”，台阶处正是损耗峰的位置。\n温度的影响：升温使链段活动性提高，取向极化更容易，介电常数上升；但温度过高时热运动扰乱取向，介电常数又下降。对非极性聚合物，温度影响很小。\n图 2　（相对）介电常数：长时通电达稳态后，电容增大（电场减弱）的倍数（北化《高分子物理》期末复习课件）"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"介电损耗的温度与频率谱（简答、作图）"},{"id":"gaowu07n05","label":"聚合物的导电性（简答、选择）","stars":4,"point":"多数为绝缘体，靠离子或掺杂电子导电","imgs":["img/map/m225.jpg","img/map/m226.jpg","img/map/m227.jpg"],"quiz":[{"id":"gaowu07-004","type":"tf","match":true},{"id":"gaowu07-023","type":"calc","match":true},{"id":"gaowu07-020","type":"short","match":true}],"notes":[{"h":"六、导电性：绝缘是常态，导电是特例","t":"多数聚合物是优良绝缘体，体积电阻率在 10 的 14 次方欧姆厘米以上。它们的导电靠两类载流子：离子（来自杂质、增塑剂、抗静电剂、聚电解质解离）与电子（在共轭体系中）。\n离子导电型：聚电解质、含锂盐的聚合物电解质（锂电池隔膜与固态电解质就是这类）。电导率随含水率与温度升高而增大，服从类似 Arrhenius 的自由体积与链段运动规律——因为离子迁移需要链段帮忙“开门”。\n电子导电型：共轭聚合物经掺杂后导电，如碘掺杂的聚乙炔可达金属量级；聚苯胺、聚吡咯、聚噻吩是代表。它们的导电机理是共轭主链上的极化子与双极化子迁移，掺杂的作用是引入载流子并降低能隙。\n复合材料导电：把炭黑、碳纳米管、金属粉填入绝缘聚合物，当填料含量达到渗流阈值时，填料形成贯通网络，电阻率骤降几个数量级。渗流阈值与填料形状有关：长径比越大（碳纳米管），阈值越低。"},{"h":"一、本章坐标：链段运动在电场里的另一张“体检表”","t":"本章看似独立，其实与第 4 章（玻璃化转变）、第 6 章（黏弹性）是同一套逻辑。在电场里，极性基团（偶极）要转向电场方向，这个过程同样需要链段配合、同样有松弛时间。所以介电损耗随温度的曲线与内耗曲线形状几乎一样，峰位也落在 Tg 附近。学这一章，最好的方法是“对照力学章来读”。\n逻辑链：① 极化（电子、原子、取向（偶极）、界面四种） → ② 介电常数（极化的宏观度量，随频率与温度变） → ③ 介电损耗（偶极转向滞后产生的热，tan δ 与 Tg 峰） → ④ 导电性（离子导电与电子导电，渗流与导电高分子） → ⑤ 击穿与静电（耐电压、树枝状击穿、抗静电改性）读法：读法：把“偶极”当作“链段”的替身：偶极能不能转向，取决于链段能不能动，于是 Tg 附近介电常数突降、损耗出现峰。抓住这一句，本章就通了。\n命题口径本章在 866 中分值不高，通常出名词解释（极化、介电损耗）、选择（哪种聚合物介电常数大）、简答（介电损耗峰为什么在 Tg 附近）。属于“短平快”章节，投入 2 小时即可拿下大部分分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"聚合物的导电性（简答、选择）"},{"id":"gaowu07n06","label":"导电高分子与渗流阈值（简答）","stars":3,"point":"掺杂聚乙炔、复合材料的渗流","imgs":["img/map/m228.jpg","img/map/m229.jpg"],"quiz":[{"id":"gaowu07-024","type":"essay","match":true},{"id":"gaowu07-014","type":"fill","match":true},{"id":"gaowu07-004","type":"tf","match":true}],"notes":[{"h":"六、导电性：绝缘是常态，导电是特例","t":"多数聚合物是优良绝缘体，体积电阻率在 10 的 14 次方欧姆厘米以上。它们的导电靠两类载流子：离子（来自杂质、增塑剂、抗静电剂、聚电解质解离）与电子（在共轭体系中）。\n离子导电型：聚电解质、含锂盐的聚合物电解质（锂电池隔膜与固态电解质就是这类）。电导率随含水率与温度升高而增大，服从类似 Arrhenius 的自由体积与链段运动规律——因为离子迁移需要链段帮忙“开门”。\n电子导电型：共轭聚合物经掺杂后导电，如碘掺杂的聚乙炔可达金属量级；聚苯胺、聚吡咯、聚噻吩是代表。它们的导电机理是共轭主链上的极化子与双极化子迁移，掺杂的作用是引入载流子并降低能隙。\n复合材料导电：把炭黑、碳纳米管、金属粉填入绝缘聚合物，当填料含量达到渗流阈值时，填料形成贯通网络，电阻率骤降几个数量级。渗流阈值与填料形状有关：长径比越大（碳纳米管），阈值越低。"},{"h":"一、本章坐标：链段运动在电场里的另一张“体检表”","t":"本章看似独立，其实与第 4 章（玻璃化转变）、第 6 章（黏弹性）是同一套逻辑。在电场里，极性基团（偶极）要转向电场方向，这个过程同样需要链段配合、同样有松弛时间。所以介电损耗随温度的曲线与内耗曲线形状几乎一样，峰位也落在 Tg 附近。学这一章，最好的方法是“对照力学章来读”。\n逻辑链：① 极化（电子、原子、取向（偶极）、界面四种） → ② 介电常数（极化的宏观度量，随频率与温度变） → ③ 介电损耗（偶极转向滞后产生的热，tan δ 与 Tg 峰） → ④ 导电性（离子导电与电子导电，渗流与导电高分子） → ⑤ 击穿与静电（耐电压、树枝状击穿、抗静电改性）读法：读法：把“偶极”当作“链段”的替身：偶极能不能转向，取决于链段能不能动，于是 Tg 附近介电常数突降、损耗出现峰。抓住这一句，本章就通了。\n命题口径本章在 866 中分值不高，通常出名词解释（极化、介电损耗）、选择（哪种聚合物介电常数大）、简答（介电损耗峰为什么在 Tg 附近）。属于“短平快”章节，投入 2 小时即可拿下大部分分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"导电高分子与渗流阈值（简答）"},{"id":"gaowu07n07","label":"击穿的三种类型（简答）","stars":3,"point":"热击穿、电击穿、放电击穿","imgs":[],"quiz":[{"id":"gaowu07-008","type":"term","match":true},{"id":"gaowu07-021","type":"short","match":true},{"id":"gaowu07-020","type":"short","match":true}],"notes":[{"h":"表 3　导电的三条路线","t":"类型 ｜ 载流子 ｜ 代表材料 ｜ 关键规律\n离子导电 ｜ 离子 ｜ 聚电解质、PEO 锂盐 ｜ 随含水率、温度升高而增大，依赖链段运动\n电子导电 ｜ 极化子、双极化子 ｜ 掺杂聚乙炔、聚苯胺 ｜ 掺杂引入载流子，共轭主链传输\n复合导电 ｜ 电子（填料网络） ｜ 炭黑填充硅橡胶、碳纳米管复合材料 ｜ 渗流阈值，长径比越大阈值越低"},{"h":"九、易错清单与自测","t":"★★★　能列出四种极化并说明快慢与温度依赖\n★★★　能解释介电常数—频率曲线为什么有台阶\n★★★　能说明介电损耗峰为什么出现在 Tg 附近\n★★　能区分电导损耗与极化损耗\n★★　能说出离子导电与电子导电的载流子与代表材料\n★★　能解释导电复合材料的渗流阈值与长径比关系\n★★　能说出三种击穿类型与特征\n★　知道抗静电改性的三种手段\n全课收束高物七章到这里形成闭环：链结构决定柔性，柔性决定 Tg 与结晶能力，Tg 与结晶决定力学状态，力学状态在时间与温度上的表现就是黏弹性，在电场中的表现就是介电行为。答题时善用这条链，任何一道论述都能写得又宽又深。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"击穿的三种类型（简答）"},{"id":"gaowu07n08","label":"静电与抗静电（选择）","stars":2,"point":"表面电阻率、抗静电剂","imgs":[],"quiz":[{"id":"gaowu07-024","type":"essay","match":true},{"id":"gaowu07-005","type":"tf","match":true},{"id":"gaowu07-015","type":"fill","match":true}],"notes":[{"h":"七、击穿与静电：工程上的两条红线","t":"击穿是绝缘失效。分三型：热击穿——介质损耗发热大于散热，温度升高使损耗更大，正反馈直至熔穿，与电压作用时间有关；电击穿——电场直接使电子加速到足以电离分子，形成导电通道，时间极短（微秒级）；放电击穿——介质内部或表面的气体放电（如局部放电、树枝化），多见于高压电缆。\n聚合物的耐电压与厚度、温度、频率、缺陷密切相关。薄膜电容器要求高纯度、无缺陷、薄而均匀，就是为了避免局部放电。\n静电问题来自表面电阻率高、摩擦起电后电荷无处泄放。改性手段：加抗静电剂（表面活性剂型，靠吸湿形成导电水膜）、加导电填料、表面处理（电晕、等离子）。指标是表面电阻率降到 10 的 9 次方到 10 的 12 次方欧姆。"},{"h":"一、本章坐标：链段运动在电场里的另一张“体检表”","t":"本章看似独立，其实与第 4 章（玻璃化转变）、第 6 章（黏弹性）是同一套逻辑。在电场里，极性基团（偶极）要转向电场方向，这个过程同样需要链段配合、同样有松弛时间。所以介电损耗随温度的曲线与内耗曲线形状几乎一样，峰位也落在 Tg 附近。学这一章，最好的方法是“对照力学章来读”。\n逻辑链：① 极化（电子、原子、取向（偶极）、界面四种） → ② 介电常数（极化的宏观度量，随频率与温度变） → ③ 介电损耗（偶极转向滞后产生的热，tan δ 与 Tg 峰） → ④ 导电性（离子导电与电子导电，渗流与导电高分子） → ⑤ 击穿与静电（耐电压、树枝状击穿、抗静电改性）读法：读法：把“偶极”当作“链段”的替身：偶极能不能转向，取决于链段能不能动，于是 Tg 附近介电常数突降、损耗出现峰。抓住这一句，本章就通了。\n命题口径本章在 866 中分值不高，通常出名词解释（极化、介电损耗）、选择（哪种聚合物介电常数大）、简答（介电损耗峰为什么在 Tg 附近）。属于“短平快”章节，投入 2 小时即可拿下大部分分。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"静电与抗静电（选择）"},{"id":"gaowu07n09","label":"介电材料的应用（论述）","stars":3,"point":"电容器薄膜、绝缘、电磁屏蔽、压电","imgs":["img/map/m230.jpg"],"quiz":[{"id":"gaowu07-024","type":"essay","match":true},{"id":"gaowu07-023","type":"calc","match":true},{"id":"gaowu07-006","type":"term","match":true}],"notes":[{"h":"四、介电常数：极化的宏观读数","t":"介电常数（相对介电常数）定义为电容器充入该介质后电容增大的倍数，也等于真空中的电场强度与介质中电场强度之比。极化越强，介质削弱电场的能力越强，介电常数越大。\n非极性聚合物（PE、PP、PTFE）只有电子与原子极化，介电常数小（约 2 到 2.5），且随频率与温度几乎不变，是优良的高频绝缘材料。极性聚合物（PVA、尼龙、酚醛）有取向极化，介电常数大（可达 4 到 10 以上），但随频率与温度变化剧烈。\n频率的影响：频率很低时，四种极化都跟得上，介电常数最大；频率升高到取向极化跟不上时，取向极化退出，介电常数陡降一阶；再高到原子极化也跟不上，再降一阶。所以介电常数—频率曲线上有台阶，每个台阶对应一种极化的“退出”，台阶处正是损耗峰的位置。\n温度的影响：升温使链段活动性提高，取向极化更容易，介电常数上升；但温度过高时热运动扰乱取向，介电常数又下降。对非极性聚合物，温度影响很小。\n图 2　（相对）介电常数：长时通电达稳态后，电容增大（电场减弱）的倍数（北化《高分子物理》期末复习课件）"},{"h":"五、介电损耗：热从哪里来","t":"交变电场下，偶极转向总有一点跟不上电场的变化，于是产生相位差 δ。每周期有一部分电能不可逆地转为热，这就是介电损耗，用损耗角正切 tan δ 表示（也等于损耗模量与储能模量之比，与力学章的定义同构）。\n损耗由两部分组成：一是电导损耗（漏电流发热），在低频与高温下显著；二是极化损耗（偶极转向滞后），在取向极化退出的频率段显著。工程上，高频绝缘材料要求 tan δ 极小（如 PTFE 约 10 的负 4 次方量级），而微波加热、焊接则要选 tan δ 大的材料。\n介电损耗—温度曲线上，极性聚合物在 Tg 附近出现一个陡峭的峰，机制与内耗峰完全相同：Tg 以下偶极被冻住不能转向，损耗小；Tg 以上转向太快、几乎无滞后，损耗也小；Tg 附近能转但阻力大，滞后最大，损耗最大。此外在更低温还会出现次级转变对应的 β 峰（侧基转动）。\n图 3　极性高聚物的介电常数与损耗随温度、频率的变化：Tg 附近出现损耗峰（北化《高分子物理》期末复习课件）\n一句话对照力学章的储能模量对应介电章的介电常数，损耗模量对应介电损耗，tan δ 在两章里是同一个符号、同一套物理。学会一章，另一章只需换名词。"}],"quizAudited":true,"importanceBasis":"分章节复习资料·考点星级表","fullLabel":"介电材料的应用（论述）"}],"logic":{"question":"外电场下偶极和载流子怎样响应？为什么介电损耗也随温度与频率出现松弛峰？","role":"把分子运动延伸到电学响应：极化建立介电常数，松弛滞后产生损耗，载流子迁移决定导电与击穿。","input":"链结构、极性基团、链段松弛与多相结构","output":"极化/介电损耗、导电/渗流、击穿与抗静电","prev":"gaowu06","next":null,"links":[{"cid":"gaowu04","text":"介电谱中的峰与 Tg/次级转变共享松弛时间语言"}],"focus":["电子、原子、取向和界面极化","介电常数、损耗角正切及温度/频率谱","导电高分子、渗流阈值和击穿类型"],"common":["比较四种极化的时间尺度与结构来源","画介电损耗温度谱或频率谱并联系链段松弛","解释渗流阈值及绝缘/导电/抗静电应用"],"examRefs":[]},"examRefs":[],"sourceNodeCount":9,"audit":{"sourceNodes":9,"added":0,"nodes":9,"withQuiz":9,"examRefs":0,"scope":"考点完整性按分章节资料逐项核对；真题只统计已录入的2021—2023年52题，不外推为历年频率。"}}}}};
