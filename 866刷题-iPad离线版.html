<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="866 刷题">
<meta name="theme-color" content="#F4F5F7">
<title>866 刷题 · 高物高化</title>
<style>
:root {
  --bg: #f3f4f7;
  --bg-soft: #eef0f4;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --surface-3: #f1f3f7;
  --text: #15181d;
  --text-2: #3f4652;
  --muted: #7c8494;
  --line: #e7eaef;
  --line-strong: #d6dbe3;
  --brand: #2450e6;
  --brand-soft: #eceffd;
  --ok: #12a06a;
  --ok-soft: #e6f7f0;
  --bad: #dd3f4b;
  --bad-soft: #fdeced;
  --warn: #c9821a;
  --warn-soft: #fdf3e2;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 28px -18px rgba(16, 24, 40, .35);
  --radius: 20px;
  --radius-sm: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #0c0e12;
  --bg-soft: #11141a;
  --surface: #171b22;
  --surface-2: #1c2129;
  --surface-3: #232932;
  --text: #eef1f6;
  --text-2: #c3cad6;
  --muted: #8b93a3;
  --line: #272d36;
  --line-strong: #333a45;
  --brand: #7f9bff;
  --brand-soft: #1b2547;
  --ok: #35c68d;
  --ok-soft: #10291f;
  --bad: #ff6b77;
  --bad-soft: #2c1417;
  --warn: #e0a945;
  --warn-soft: #2a2012;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 32px -22px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { -webkit-appearance: none; appearance: none; border: none; background: none; cursor: pointer; }
a { color: var(--brand); text-decoration: none; }

#app { min-height: 100vh; padding: calc(10px + var(--safe-t)) 0 calc(16px + var(--safe-b)); }

.wrap { max-width: 780px; margin: 0 auto; padding: 0 20px; }

/* ---------- 基础组件 ---------- */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}

.h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.25; }
.h2 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
.h3 { font-size: 16px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.mono { font-variant-numeric: tabular-nums; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px; border-radius: 999px;
  background: var(--surface-3); color: var(--muted);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; padding: 0 22px; border-radius: 15px;
  font-size: 16.5px; font-weight: 650; letter-spacing: .01em;
  background: var(--surface-3); color: var(--text);
  transition: transform .14s ease, opacity .14s ease, background .14s ease;
  user-select: none;
}
.btn:active { transform: scale(.968); }
.btn.primary { background: var(--text); color: var(--surface); }
.btn.brand { background: var(--brand); color: #fff; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn.lg { height: 56px; font-size: 17.5px; border-radius: 17px; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn[disabled] { opacity: .4; pointer-events: none; }

.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; }

/* ---------- 首页 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0 18px;
}
.brandmark { display: flex; align-items: center; gap: 9px; }
.logo {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--text); color: var(--surface); font-weight: 800; font-size: 15px;
  letter-spacing: -.4px;
}
.brandmark .name { font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
.streak {
  display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 999px; background: var(--warn-soft); color: var(--warn);
  font-weight: 700; font-size: 14px;
}

.hero {
  position: relative; overflow: hidden;
  background:
    radial-gradient(120% 100% at 100% 0%, rgba(36, 80, 230, .10), transparent 60%),
    var(--surface);
  border-radius: 26px; padding: 24px 22px 20px;
  box-shadow: var(--shadow);
}
.hero .greet { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .04em; margin: 0 0 8px; }
.hero-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
.hero-title { font-size: 34px; line-height: 1.15; font-weight: 760; letter-spacing: -.03em; margin: 0; }
.hero-title em { font-style: normal; color: var(--brand); }
.hero-note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.hero-ring { flex: 0 0 auto; }
.hero .btn { margin-top: 20px; }

.ring {
  --p: 0; --size: 96px; --sw: 8px; --c: var(--brand);
  width: var(--size); height: var(--size); border-radius: 50%;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-3) 0);
  display: grid; place-items: center; position: relative;
}
.ring::after {
  content: ""; position: absolute; inset: var(--sw); border-radius: 50%; background: var(--surface);
}
.ring > span { position: relative; z-index: 1; text-align: center; line-height: 1.1; }
.ring b { display: block; font-size: 19px; font-weight: 760; font-variant-numeric: tabular-nums; }
.ring i { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); letter-spacing: .06em; margin-top: 2px; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 12px; }
.section-title .h3 { font-size: 15px; color: var(--muted); font-weight: 650; letter-spacing: .02em; }
.link { color: var(--muted); font-size: 13.5px; font-weight: 600; }

.subjects { display: grid; gap: 12px; }
.subject-card {
  position: relative; overflow: hidden; text-align: left;
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 18px 16px;
  transition: transform .16s ease;
  display: block; width: 100%;
}
.subject-card:active { transform: scale(.985); }
.subject-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--sc);
}
.subject-card .glow {
  position: absolute; right: -60px; top: -80px; width: 190px; height: 190px; border-radius: 50%;
  background: var(--sc); opacity: .12; filter: blur(26px); pointer-events: none;
}
.sc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sc-name { font-size: 18.5px; font-weight: 700; letter-spacing: -.01em; }
.sc-meta { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.bar { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--sc); transition: width .5s cubic-bezier(.2,.7,.2,1); }
.sc-foot { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12.5px; color: var(--muted); font-weight: 600; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.quick button {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm);
  padding: 14px 8px 12px; display: grid; place-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 650; color: var(--text-2); border: 1px solid var(--line);
}
.quick button:active { transform: scale(.97); }
.quick .ico { font-size: 20px; line-height: 1; }
.quick .num { color: var(--muted); font-weight: 600; }

.today-list { display: grid; gap: 10px; }
.today-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm);
}
.ti-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; flex: 0 0 auto; }
.ti-main { flex: 1; min-width: 0; }
.ti-main b { display: block; font-size: 15px; font-weight: 650; }
.ti-main span { font-size: 12.5px; color: var(--muted); }

/* ---------- 科目 / 章节 ---------- */
.subhead { display: flex; align-items: center; gap: 12px; padding: 4px 0 20px; }
.back {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface); box-shadow: var(--shadow-sm); color: var(--text-2);
  font-size: 18px; flex: 0 0 auto;
}
.back:active { transform: scale(.95); }

.chapter-list { display: grid; gap: 10px; }
.chapter-item {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 15px 16px; background: var(--surface); border-radius: 16px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--line);
}
.chapter-item:active { transform: scale(.985); }
.ch-no {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
  display: grid; place-items: center; font-weight: 750; font-size: 14px;
  background: var(--surface-3); color: var(--text-2); font-variant-numeric: tabular-nums;
}
.ch-main { flex: 1; min-width: 0; }
.ch-name { font-size: 15.5px; font-weight: 640; display: flex; align-items: center; gap: 6px; }
.ch-name .stars { color: var(--warn); font-size: 11px; letter-spacing: -1px; }
.ch-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; }
.ch-bar { margin-top: 8px; height: 5px; }
.ch-pct { font-size: 12px; color: var(--muted); font-weight: 650; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- 练习 ---------- */
.session { max-width: 780px; margin: 0 auto; padding: 0 18px; }
.s-top { position: sticky; top: 0; z-index: 10; background: linear-gradient(var(--bg) 70%, transparent); padding: 8px 0 14px; }
.s-progress { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.s-progress > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .35s ease; }
.s-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.s-count { font-size: 13px; color: var(--muted); font-weight: 650; font-variant-numeric: tabular-nums; }
.s-correct { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.dot-ok { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot-bad { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }

.q-card {
  background: var(--surface); border-radius: 22px; padding: 24px 20px;
  box-shadow: var(--shadow); min-height: clamp(250px, 40vh, 430px);
  display: flex; flex-direction: column; justify-content: center;
}
.q-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.q-stem { font-size: 19.5px; line-height: 1.6; font-weight: 600; letter-spacing: -.01em; white-space: pre-wrap; word-break: break-word; }
.q-stem .blank {
  display: inline-block; min-width: 3.4em; height: 1.05em;
  border-bottom: 1.6px solid var(--brand); margin: 0 3px 0 2px;
  vertical-align: -0.12em;
}
.q-hint { margin-top: 14px; font-size: 13px; color: var(--muted); }

.options { display: grid; gap: 10px; margin-top: 20px; }
.option {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  padding: 14px 15px; border-radius: 15px; border: 1.5px solid var(--line);
  background: var(--surface-2); font-size: 16px; line-height: 1.5;
  transition: border-color .15s ease, background .15s ease, transform .12s ease;
}
.option:active { transform: scale(.988); }
.option .key {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: var(--surface-3); font-size: 13px; font-weight: 750; color: var(--text-2);
}
.option.sel { border-color: var(--brand); background: var(--brand-soft); }
.option.sel .key { background: var(--brand); color: #fff; }
.option.right { border-color: var(--ok); background: var(--ok-soft); }
.option.right .key { background: var(--ok); color: #fff; }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .key { background: var(--bad); color: #fff; }
.option.dim { opacity: .55; }

.tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.tf-btn { height: 62px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 18px; font-weight: 650; }
.tf-btn:active { transform: scale(.98); }
.tf-btn.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.tf-btn.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

.fill-box { margin-top: 20px; display: grid; gap: 10px; }
.fill-input {
  height: 52px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface-2); padding: 0 16px; font-size: 16.5px; width: 100%;
  outline: none; transition: border-color .15s ease;
}
.fill-input:focus { border-color: var(--brand); }

.answer-reveal {
  margin-top: 18px; border-radius: 16px; background: var(--surface-3);
  padding: 16px; font-size: 15.5px; line-height: 1.7; white-space: pre-wrap;
  border-left: 3px solid var(--brand);
}
.answer-reveal .lab { display: block; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin-bottom: 6px; }

.feedback { margin-top: 16px; border-radius: 18px; padding: 16px; }
.feedback.good { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.warn { background: var(--warn-soft); }
.feedback .fb-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.feedback.good .fb-title { color: var(--ok); }
.feedback.bad .fb-title { color: var(--bad); }
.feedback.warn .fb-title { color: var(--warn); }
.feedback .fb-body { font-size: 14.5px; line-height: 1.7; color: var(--text-2); white-space: pre-wrap; }

.s-actions {
  position: sticky; bottom: 0; z-index: 10; margin-top: 16px;
  padding: 12px 0 calc(12px + var(--safe-b));
  background: linear-gradient(transparent, var(--bg) 26%);
  display: grid; gap: 10px;
}
.rate-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.s-actions:empty { display: none; }
.rate {
  height: 52px; border-radius: 15px; font-size: 15px; font-weight: 650;
  background: var(--surface); border: 1.5px solid var(--line);
  display: grid; place-items: center; gap: 2px;
}
.rate small { font-size: 11px; color: var(--muted); font-weight: 500; }
.rate.g0 { border-color: var(--bad); color: var(--bad); }
.rate.g1 { border-color: var(--warn); color: var(--warn); }
.rate.g2 { border-color: var(--ok); color: var(--ok); }
.rate:active { transform: scale(.975); }
.rate.active { background: var(--surface-3); }

/* ---------- 结果 ---------- */
.result-hero { text-align: center; padding: 26px 20px; }
.result-hero .big { font-size: 56px; font-weight: 780; letter-spacing: -.04em; line-height: 1.05; color: var(--brand); }
.result-hero .big small { font-size: 22px; font-weight: 650; }
.result-hero .msg { font-size: 17px; font-weight: 650; margin-top: 6px; }
.result-hero .sub { margin-top: 4px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px; text-align: center; box-shadow: var(--shadow-sm); }
.stat b { display: block; font-size: 21px; font-weight: 750; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

.review-list { display: grid; gap: 10px; }
.review-item { padding: 14px 16px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-sm); }
.review-item .rq { font-size: 14.5px; font-weight: 620; line-height: 1.55; }
.review-item .ra { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
.review-item .rbad { color: var(--bad); font-weight: 600; }

/* ---------- 统计 ---------- */
.heatmap { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
.cell { aspect-ratio: 1; border-radius: 6px; background: var(--surface-3); }
.cell.l1 { background: color-mix(in srgb, var(--brand) 25%, var(--surface-3)); }
.cell.l2 { background: color-mix(in srgb, var(--brand) 50%, var(--surface-3)); }
.cell.l3 { background: color-mix(in srgb, var(--brand) 75%, var(--surface-3)); }
.cell.l4 { background: var(--brand); }

.bars { display: grid; gap: 12px; }
.brow { display: grid; grid-template-columns: 92px 1fr 42px; align-items: center; gap: 10px; font-size: 13px; }
.brow .nm { color: var(--text-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .bar { height: 6px; }
.brow .pc { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- 设置 ---------- */
.list { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.li { display: flex; align-items: center; gap: 12px; padding: 15px 16px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: none; }
.li .l-main { flex: 1; min-width: 0; }
.li .l-main b { display: block; font-size: 15px; font-weight: 620; }
.li .l-main span { font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--surface-3); border-radius: 11px; padding: 3px; }
.stepper button { width: 32px; height: 30px; border-radius: 8px; font-size: 16px; font-weight: 700; color: var(--text-2); }
.stepper .val { min-width: 42px; text-align: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 620; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ---------- 导入 ---------- */
.code-area {
  width: 100%; min-height: 160px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface-2); padding: 14px; font-size: 13px; line-height: 1.5;
  font-family: ui-monospace, "SF Mono", Menlo, monospace; outline: none; resize: vertical;
}
.code-area:focus { border-color: var(--brand); }
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: 16px; padding: 26px;
  text-align: center; color: var(--muted); font-size: 14px; background: var(--surface-2);
}
.drop b { color: var(--text); display: block; font-size: 15px; margin-bottom: 4px; }

/* ---------- 杂项 ---------- */
.empty { text-align: center; padding: 54px 20px; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 10px; }

.divider { height: 1px; background: var(--line); margin: 18px 0; }
.reading h4 { margin: 18px 0 6px; font-size: 15px; font-weight: 650; }
.reading p { margin: 0 0 10px; font-size: 15px; line-height: 1.8; color: var(--text-2); }
.acc-head {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 14px 16px; background: var(--surface); border-radius: 14px; font-weight: 620;
  box-shadow: var(--shadow-sm); margin-top: 10px;
}

.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translate(-50%, 20px);
  background: var(--text); color: var(--surface); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: all .25s ease; z-index: 100; max-width: 86vw; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.sheet-back {
  position: fixed; inset: 0; background: rgba(10, 13, 18, .42); z-index: 60;
  display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px);
}
.sheet {
  background: var(--surface); width: 100%; max-width: 620px;
  border-radius: 22px 22px 0 0; padding: 20px 20px calc(20px + var(--safe-b));
  max-height: 82vh; overflow: auto; animation: up .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }

@media (min-width: 900px) {
  body { font-size: 18px; }
  .wrap { max-width: 860px; }
}
@media (max-width: 380px) {
  .hero-title { font-size: 30px; }
  .quick { grid-template-columns: repeat(2, 1fr); }
}

/* ============ 手写答题板 ============ */
.pad{margin:12px 0 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
.pad-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--muted);white-space:nowrap}
.pad-ico{font-style:normal;color:var(--brand);font-size:14px}
.pad-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pad-dot{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--line-strong);transition:transform .12s}
.pad-dot.on{border-color:var(--text);transform:scale(1.1)}
.pad-btn{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);transition:background .12s,color .12s}
.pad-btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.pad-body{position:relative;height:clamp(190px,30vh,300px);background-color:#fff;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(90,105,130,.13) 31px 32px);border-radius:0}
.pad-body canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
.pad.off .pad-body{display:none}
.pad.full{position:fixed;inset:0;z-index:80;margin:0;border:none;border-radius:0;display:flex;flex-direction:column;background:var(--surface);padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
.pad.full .pad-body{flex:1;height:auto}

/* ============ 知识地图 ============ */
.q-src{margin:-4px 0 10px;font-size:12px;color:var(--muted);line-height:1.5}
.fb-lab{margin-top:10px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.fb-from{font-weight:500;opacity:.8}
.mapbtn{border:1px dashed var(--brand);color:var(--brand);background:var(--brand-soft)}
.mapbox{position:relative;width:100%;aspect-ratio:1/.86;min-height:360px;border-radius:var(--radius);background:radial-gradient(circle at 50% 45%,var(--surface),var(--bg-soft));border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.maplines{position:absolute;inset:0;width:100%;height:100%}
.maplines line{stroke:var(--line-strong);stroke-width:1;opacity:.7}
.mcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--brand);color:#fff;box-shadow:0 10px 24px -12px rgba(36,80,230,.8)}
.mcenter span{font-size:13px;font-weight:700}
.mcenter em{font-style:normal;font-size:11px;opacity:.85;margin-top:2px}
.mnode{position:absolute;transform:translate(-50%,-50%);max-width:132px;min-width:74px;padding:7px 9px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-sm);transition:transform .12s}
.mnode:active{transform:translate(-50%,-50%) scale(.96)}
.mnode .mlab{font-size:12.5px;font-weight:650;color:var(--text);line-height:1.25;text-align:center;word-break:break-all}
.mnode .mstar{font-size:10.5px;color:var(--muted);letter-spacing:1px}
.mnode.s0{background:#eef0f4;border-color:#dde1e7;filter:grayscale(1);opacity:.92}
.mnode.s0 .mlab{color:#8b93a3}
.mnode.s1{background:#ffffff;border-color:#e6b8cb}
.mnode.s1 .mstar{color:#c9821a}
.mnode.s2{background:#ffd9e6;border-color:#ffb6d0}
.mnode.s2 .mstar{color:#d6336c}
.mnode.s3{background:#ff4fa3;border-color:#ff2e93;color:#fff;box-shadow:0 10px 22px -14px rgba(255,79,163,.9)}
.mnode.s3 .mlab{color:#fff}
.mnode.s3 .mstar{color:#fff8fb;font-weight:700}
.maplegend{margin:2px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.maplegend .lg{display:inline-block;width:13px;height:13px;border-radius:6px;border:1px solid var(--line-strong)}
.maplegend .s0{background:#eef0f4}.maplegend .s1{background:#fff;border-color:#e6b8cb}
.maplegend .s2{background:#ffd9e6;border-color:#ffb6d0}.maplegend .s3{background:#ff4fa3;border-color:#ff2e93}

/* ============ 闯关学习 ============ */
.lesson-lab{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.04em;margin-bottom:8px}
.lesson-text{font-size:16px;line-height:1.85;color:var(--text);white-space:pre-wrap}
.lfig{margin:14px 0 0}
.lfig img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.lfig figcaption{margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.result-hero{text-align:center;padding:26px 18px}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:34px;margin-bottom:6px}
.bigstars .bs{opacity:.25;color:var(--muted);transition:transform .2s}
.bigstars .bs.on{opacity:1;color:#ff4fa3;transform:scale(1.05)}

/* ============ 抽卡 / 卡册 ============ */
.cardmask{position:fixed;inset:0;z-index:90;background:rgba(12,14,18,.55);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cmod{width:min(420px,92vw);text-align:center}
.cmod-tip{color:#fff;font-size:13px;margin-bottom:12px;opacity:.9}
.mgcard{position:relative;height:300px;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
.mgcard:not(.flip){background:linear-gradient(150deg,#2450e6,#7f9bff);align-items:center;justify-content:center}
.mg-back{font-size:34px;font-weight:800;color:#fff;letter-spacing:.1em}
.mg-backtip{color:rgba(255,255,255,.85);font-size:12px;margin-top:6px}
.mgcard.rN{background:#fffdf5;border:1px solid #e9dfc4}
.mgcard.rR{background:linear-gradient(160deg,#e9f2ff,#fff);border:1px solid #b9d2ff}
.mgcard.rSR{background:linear-gradient(160deg,#ffeef7,#fff6ff);border:1px solid #ffb6d0;box-shadow:0 24px 60px -20px rgba(255,79,163,.6)}
.mg-rar{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.mg-q{font-size:15.5px;font-weight:650;line-height:1.55;max-height:96px;overflow:auto}
.mg-a{font-size:13px;color:var(--text-2);line-height:1.7;max-height:140px;overflow:auto;border-top:1px dashed var(--line);padding-top:10px}
.cmod .btn{margin-top:14px}
.baggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bagcard{position:relative;padding:14px 10px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);text-align:left;min-height:86px}
.bagcard.rSR{border-color:#ff8fc0;background:linear-gradient(160deg,#fff3fa,#fff)}
.bagcard.rR{border-color:#a9c7ff;background:linear-gradient(160deg,#f0f6ff,#fff)}
.bag-rar{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.bag-q{font-size:12.5px;line-height:1.5;color:var(--text);display:block;margin-top:6px}

/* ===== 首页知识地图大入口 + 地图总览 ===== */
.mapentry{position:relative;display:block;width:100%;text-align:left;border:0;cursor:pointer;
 margin:18px 0 6px;padding:20px 20px 16px;border-radius:22px;overflow:hidden;color:#fff;
 background:linear-gradient(135deg,#ff5fa8 0%,#ff3f8d 45%,#b447ff 100%);
 box-shadow:0 16px 34px rgba(255,63,141,.30),inset 0 1px 0 rgba(255,255,255,.35);}
.mapentry:active{transform:scale(.985)}
.mapentry .me-glow{position:absolute;right:-40px;top:-60px;width:190px;height:190px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.55),transparent 65%);pointer-events:none}
.mapentry .me-top{position:relative;display:flex;align-items:center;gap:12px}
.mapentry .me-ico{font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.mapentry .me-tt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.mapentry .me-title{font-size:21px;font-weight:800;letter-spacing:.4px}
.mapentry .me-sub{font-size:12.5px;opacity:.92}
.mapentry .me-go{font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;
 background:rgba(255,255,255,.94);color:#e0327c;white-space:nowrap}
.mapentry .me-bar{position:relative;display:block;height:9px;border-radius:9px;margin:14px 0 9px;
 background:rgba(255,255,255,.28);overflow:hidden}
.mapentry .me-bar i{display:block;height:100%;border-radius:9px;
 background:linear-gradient(90deg,#fff,#ffe6f2);box-shadow:0 0 10px rgba(255,255,255,.8)}
.mapentry .me-foot{position:relative;display:flex;justify-content:space-between;gap:10px;font-size:11.5px;opacity:.95}

.mh-card{border-radius:20px;padding:18px;margin:12px 0 4px;color:#fff;
 background:linear-gradient(135deg,#ff7ab0,#ff4fa3 55%,#c44dff);
 box-shadow:0 14px 30px rgba(255,79,163,.24)}
.mh-card .mh-k{margin:0 0 4px;font-size:12px;opacity:.9}
.mh-card .mh-big{font-size:34px;font-weight:800;line-height:1.1}
.mh-card .mh-big span{font-size:14px;font-weight:600;opacity:.92}
.mh-card .mh-note{margin:6px 0 10px;font-size:12.5px;opacity:.92}
.mh-card .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.28);margin-bottom:10px}
.mh-card .mh-tip{margin:0;font-size:12px;opacity:.9;line-height:1.55}

.maps-group{border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line,#e9edf5)}
.maps-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
 background:none;cursor:pointer;padding:13px 14px;border-bottom:1px solid var(--line,#f1f4fa)}
.maps-row:last-child{border-bottom:0}
.maps-row:active{background:#fff5fa}
.mr-no{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
 font-size:13px;font-weight:800;color:#e0327c;background:#ffe8f2}
.mr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mr-name{font-size:14.5px;font-weight:700;color:var(--ink,#1d2433);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-sub{font-size:11.5px;color:var(--sub,#7a8499)}
.mr-main .bar{height:6px;border-radius:6px;background:#f1f4fa}
.mr-main .bar i{display:block;height:100%;border-radius:6px}
.mr-pct{font-size:12.5px;font-weight:700;color:#e0327c;white-space:nowrap}

/* ===== 知识闯关：文字要点 / 资料原文 ===== */
.lnotes{margin-top:14px;border-top:1px dashed var(--line,#e9edf5);padding-top:12px}
.lnote{margin:0 0 14px}
.lnote h4{margin:0 0 6px;font-size:14px;font-weight:800;color:#e0327c;letter-spacing:.2px;line-height:1.4}
.lnote .lp{margin:0 0 8px;font-size:14px;line-height:1.8;color:var(--ink,#1d2433);text-align:justify}
.lnote .ltr{font-size:11.5px;line-height:1.65;color:#5b6577;background:#f6f8fc;border-radius:8px;
 padding:6px 8px;margin:0 0 6px;overflow-x:auto;white-space:pre;font-family:ui-monospace,Menlo,monospace}
.lfig figcaption{font-size:11px;color:var(--sub,#7a8499);margin-top:6px;text-align:center}

/* ===== v6：章节底层逻辑与重点复核 ===== */
.logic-bridge{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:13px 15px;border:1px solid #f4d4e3;border-radius:15px;background:#fff8fb;color:#6d4054;font-size:12.5px;line-height:1.65}
.logic-bridge b{flex:0 0 auto;color:#d6337b}
.flowline{display:flex;align-items:stretch;gap:7px;overflow-x:auto;padding:3px 2px 12px;scroll-snap-type:x proximity}
.flow-ch{flex:0 0 220px;min-height:104px;padding:13px 14px;text-align:left;border:1px solid #ece7ef;border-radius:16px;background:#fff;scroll-snap-align:start;cursor:pointer;box-shadow:0 4px 14px rgba(31,41,55,.04)}
.flow-ch b{display:block;font-size:14px;color:#c92f74;margin-bottom:7px}
.flow-ch span{display:block;font-size:12px;line-height:1.55;color:#586174}
.flow-arrow{align-self:center;flex:0 0 auto;color:#e78caf;font-size:18px;font-weight:800}
.mr-question{font-size:11.5px;line-height:1.45;color:#9a5270;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.logic-card{margin:12px 0 16px;padding:18px;border-radius:20px;background:linear-gradient(145deg,#fff,#fff7fb);border:1px solid #f1d4e2;box-shadow:0 10px 26px rgba(142,55,93,.07)}
.logic-kicker{font-size:11px;font-weight:800;letter-spacing:1px;color:#d6337b;text-transform:uppercase}
.logic-card h2{margin:7px 0 8px;font-size:18px;line-height:1.5;color:#27223a}
.logic-role{margin:0 0 13px;font-size:13px;line-height:1.7;color:#666075}
.logic-chain{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:2px 0 10px}
.logic-edge,.logic-now{flex:0 0 auto;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.logic-edge{border:1px solid #eadde5;background:#fff;color:#8a6476;cursor:pointer}
.logic-now{background:#ff4fa3;color:#fff;box-shadow:0 5px 12px rgba(255,79,163,.2)}
.logic-arrow{color:#d89ab4}
.logic-io{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.logic-io span{padding:10px 11px;border-radius:12px;background:#f7f4f8;color:#61586a;font-size:11.5px;line-height:1.55}
.logic-io b{display:block;color:#d6337b;font-size:11px;margin-bottom:3px}
.rel-title{margin:14px 0 8px;font-size:12px;font-weight:800;color:#8a5570}
.rel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rel-link{padding:10px 11px;border:1px dashed #e6b9ce;border-radius:12px;background:#fff;text-align:left;cursor:pointer}
.rel-link b{display:block;color:#d6337b;font-size:12px;margin-bottom:4px}
.rel-link span{display:block;color:#756577;font-size:11.5px;line-height:1.5}
.mnode.added{box-shadow:0 0 0 3px rgba(255,184,63,.32),0 5px 12px rgba(31,41,55,.12)}
.mnode.added:after{content:'补';position:absolute;right:-3px;top:-6px;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:#ffb23e;color:#fff;font-size:9px;font-weight:800;border:2px solid #fff}
.lg.added-dot{position:relative;background:#ffb23e;border-radius:50%}
.review-card{margin:16px 0 4px;padding:17px;border:1px solid #e8e9f0;border-radius:19px;background:#fff}
.review-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.review-head>b{font-size:15px;color:#2a2638}
.review-head>span{font-size:11px;color:#c52f74;background:#fff0f7;padding:5px 8px;border-radius:999px;white-space:nowrap}
.review-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.review-card h4{margin:0 0 8px;font-size:12.5px;color:#9b4268}
.focus-list,.common-list{margin:0;padding:0;list-style:none}
.focus-list li{display:flex;gap:8px;margin:0 0 9px;font-size:12px;line-height:1.55;color:#4d4b5b}
.focus-list li b{flex:0 0 19px;height:19px;display:grid;place-items:center;border-radius:6px;background:#ffe7f2;color:#d6337b;font-size:10px}
.common-list li{position:relative;padding-left:12px;margin:0 0 9px;font-size:12px;line-height:1.55;color:#4d4b5b}
.common-list li:before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:#ec86af}
.exam-list{display:grid;gap:7px}
.exam-link{display:grid;grid-template-columns:105px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid #f0e3ea;border-radius:11px;background:#fffafd;text-align:left;cursor:pointer}
.exam-link .exam-year{font-size:10.5px;font-weight:800;color:#c52f74}
.exam-link>span:nth-child(2){font-size:11.5px;color:#5f5260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam-link i{font-style:normal;font-size:10.5px;color:#a16a82;white-space:nowrap}
.audit-note,.no-direct-exam{margin:12px 0 0;padding-top:10px;border-top:1px dashed #eadfe6;font-size:10.5px;line-height:1.6;color:#8b7f8b}
.no-direct-exam{color:#a25e7e;background:#fff7fb;padding:10px;border:0;border-radius:10px}
@media(max-width:640px){.logic-io,.review-cols,.rel-grid{grid-template-columns:1fr}.exam-link{grid-template-columns:88px minmax(0,1fr)}.exam-link i{display:none}.review-head{align-items:flex-start}.logic-card{padding:15px}.flow-ch{flex-basis:205px}}

</style>


</head>
<body>
<div id="app"></div>

每题 8 分，共 16 分）","num":2,"ord":602,"src":"练习册","from":"课后作业练习册·高化01 绪论·简答（每题 8 分，共 16 分）·第 2 题"},{"id":"gaohua01-025","type":"calc","q":"某尼龙 66 样品按重复单元计的聚合度为 1000。求它的数均分子量；若同一句话改成“按结构单元计的聚合度为 1000”，答案又是多少？说明两种口径差在哪里。","a":"重复单元分子量：己二胺 116＋己二酸 146－2×18＝226（2 分）；1000×226＝2.26×10^5（2 分）；按结构单元口径时重复单元数为 500，得 1.13×10^5（2 分）；差别在于一个重复单元含两个结构单元（2 分）；结论：两种答案差一倍（2 分）。","stars":5,"sec":"计算（10 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高化01 绪论·计算（10 分）·第 1 题"},{"id":"gaohua01-026","type":"essay","q":"某厂用尼龙 66 做帘子线，要求数均分子量不低于 2 万。（1）核算时应采用哪种聚合度口径，为什么？（2）若实测“按结构单元计的聚合度为 100”，是否达标？（3）若改用己内酰胺开环聚合，分子量的控制手段与尼龙 66 有何本质不同？\n错题归因（做完自己填）","a":"（1）应用重复单元口径，因分子量与链节的化学式一一对应（3 分）。（2）结构单元 100 → 重复单元 50 → 50×226＝1.13 万＜2 万，未达标（3 分）。（3）开环聚合无小分子析出，聚合度不受配比锁死，靠引发剂用量与终止控制，且分布更窄，可做到更高分子量（6 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化01 绪论·论述（12 分）·第 1 题"},{"id":"gaohua01-p001","type":"point","q":"高分子的定义与分子量界限（选择、名词解释）","a":"相对分子质量约大于 1 万，且分子量不均一","stars":2,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 1 条）"},{"id":"gaohua01-p002","type":"point","q":"单体、结构单元、重复单元、链节、单体单元（名词解释、简答、计算前置）","a":"加聚三者合一，缩聚结构单元不等于重复单元","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 2 条）"},{"id":"gaohua01-p003","type":"point","q":"聚合度 DP 与聚合度 Xn 的区别（计算、简答）","a":"DP 以重复单元计，Xn 以单体单元计","stars":3,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 3 条）"},{"id":"gaohua01-p004","type":"point","q":"Carothers 分类与 Flory 分类（选择、填空、简答）","a":"一套按组成变化，一套按机理，不能混用","stars":4,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 4 条）"},{"id":"gaohua01-p005","type":"point","q":"连锁与逐步聚合的六项差别（简答、论述）","a":"转化率与分子量随时间的走势完全相反","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 5 条）"},{"id":"gaohua01-p006","type":"point","q":"开环聚合的归属（选择、判断）","a":"组成上像加成，机理上是连锁","stars":3,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 6 条）"},{"id":"gaohua01-p007","type":"point","q":"聚合物命名四法与常用缩写（填空、选择、反应式命名）","a":"PVA 不是由乙烯醇聚合而来","stars":3,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 7 条）"},{"id":"gaohua01-p008","type":"point","q":"数均、重均、粘均、Z 均分子量（计算、简答）","a":"高价项权重依次升高，Mw 恒大于 Mn","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 8 条）"},{"id":"gaohua01-p009","type":"point","q":"多分散系数 d（计算、简答）","a":"阴离子活性聚合接近 1，缩聚约等于 2","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 9 条）"},{"id":"gaohua01-p010","type":"point","q":"高分子科学的学科结构（论述铺垫）","a":"合成、结构与性能、加工三条主线","stars":1,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化01 绪论·二、考点星级总表（第 10 条）"},{"id":"gaohua01-t011","type":"fill","q":"从反应机理和动力学角度看，PET 和 PMMA 的合成反应分别属于（　）和（　）聚合机理。","a":"逐步聚合、连锁聚合。给分点：两个空各 0.5 分。判据是链的增长方式——PET 由酯交换或缩聚逐步并链，无活性中心；PMMA 由引发剂产生自由基，经引发、增长、终止一次性长成。若答“缩聚、加聚”只能得一半分，因为题目问的是机理而不是组成变化。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化01 绪论·九、真题与期末题演练"},{"id":"gaohua01-t012","type":"short","q":"简述影响线形缩聚聚合度的主要因素和影响方向。","a":"四点：①单体配比，等当量时聚合度最大，任一组分过量都会封端使 Xn 下降；②小分子残余量，及时排出小分子、降低其残留，平衡右移，Xn 上升；③反应程度 P，P 越大 Xn 越大；④平衡常数 K，K 越大 Xn 越大。给分点按四条各 1 分。答题时要写出方向（上升或下降），只写因素不给分。","stars":5,"sec":"八、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高化01 绪论·九、真题与期末题演练"},{"id":"gaohua01-t013","type":"short","q":"氯乙烯的聚合能通过阴离子聚合实现吗？阳离子呢？自由基呢？为什么？合成聚氯乙烯时为什么一般控制转化率低于 80%？","a":"只能用自由基聚合。氯乙烯的取代基氯是吸电子基，但存在 p-π 共轭使吸电子性减弱，且碳氯键极性大、易被离子进攻，阴离子与阳离子引发都会优先发生取代或消除等副反应，得不到规整的高分子。控制转化率低于 80% 的原因：转化率过高时单体浓度下降、体系粘度上升，链转移与支化加重，且残留单体在后续脱除时易引起降解，产品质量下降。","stars":5,"sec":"八、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高化01 绪论·九、真题与期末题演练"}],"reading":["一、本章坐标：绪论只回答四个问题","绪论不是背定义的章节，它是整门课的坐标系。后面每一章都在给这四个问题补细节：一是什么叫高分子、它的链由什么单元重复而成；二是这一步聚合属于哪一类反应；三是链的长短（聚合度）怎么算；四是链的长短不一致（分子量分布）会带来什么后果。把这四问的顺序记住，第二章到第八章就是往里填机理。","二、考点星级总表（先看这张表，再决定读哪一段）","读法：四星考点必须能默写并举例，三星要能判断对错，两星及以下只需见过、能认出来。全章复习时先扫这张表，星数高的段落读两遍，星数低的段落只读加粗句。","三、从单体到聚合物：五个名词必须分清","教材给的定义彼此咬合，孤立背会串味。先用一句话把关系立起来：单体是原料，结构单元是单体进入链后留下的那部分，重复单元是链上重复出现的最小片段，链节就是重复单元的另一种叫法，单体单元指与单体组成完全相同、只是电子结构变了的重复单元。","为什么要分这么细？因为缩聚时一个重复单元由两个不同单体各贡献一半，此时“结构单元数”是“重复单元数”的两倍，聚合度的两种算法就分岔了。这是计算题最常见的失分点。","图 1　缩聚体系中结构单元与重复单元的区别（尼龙 66 由己二胺与己二酸各贡献一个结构单元）（北化《高分子化学·重点内容》课件）","以尼龙 66 为例：重复单元是 —NH(CH₂)₆NH—CO(CH₂)₄CO—，它由己二胺去掉一个氢、己二酸去掉一个羟基缩合而成，所以一个重复单元 = 两个结构单元，且每生成一个重复单元脱去两分子水（端基处只脱一分子）。题目问 Xn 时用单体单元数，问 DP 时用重复单元数，两者差一倍。","再补一个换算：加聚物的分子量 M = DP × M₀（M₀ 为单体分子量），缩聚物要按重复单元的分子量算，并且扣掉脱去的小分子。这一步在计算题里经常被忘掉，导致答案差 1% 到 3%，评卷时就是“公式对、结果错”。","表 3　常用聚合物的重复单元分子量与聚合度换算","四、两大聚合反应：两套分类，不能混着用","4.1　Carothers 分类：看组成变没变","Carothers 按“反应前后原子组成是否变化”分：有小分子析出的叫缩聚，没有小分子析出、组成不变的叫加聚。后来发现有些反应组成不变却仍是逐步进行（如二异氰酸酯与二醇生成聚氨酯），于是补出“聚加成”一类，教材把它并入逐步聚合处理。","所以判断标准不是“有没有水脱出”，而是“链是不是一步一步长”。这句话是本章最值钱的一句，直接决定后面动力学用哪个模型。","4.2　Flory 分类：看机理","Flory 按机理分逐步聚合与连锁聚合。连锁聚合有明确的引发、增长、终止三个基元反应，活性中心（自由基或离子）寿命极短，链瞬间长成；逐步聚合没有任何“引发—终止”的仪式，任何两个带官能团的分子都能反应，链靠缩合慢慢变长，分子量要等反应程度逼近 1 才起来。","图 2　按反应机理分类（Flory 分类法）：逐步与连锁的判定依据（北化《高分子化学·重点内容》课件）","图 3　连锁聚合与逐步聚合在同一坐标下的比较：转化率曲线与分子量曲线方向相反（北化《高分子化学·重点内容》课件）","表 4　连锁与逐步聚合的六项差别（简答必背）","这六条不要死背，用一句话串：连锁是“链一次性长成”，逐步是“分子慢慢并大”。所有差别都是这句话的推论。答题时先写这句话，再展开六条，评卷给分点就踩全了。","4.3　三个必须分清的特例","第一个特例是开环聚合。环氧乙烷开环后组成不变（只是环打开了），按组成变化看像加聚；但它的增长靠活性中心逐个插入，机理是标准的连锁。教材把它单列一章，正是因为它同时踩在两套分类上。判断时以机理为准，答“连锁聚合”并说明理由。","第二个特例是聚氨酯。它由二异氰酸酯与二醇加成而成，不脱小分子，但链是逐步长的，所以属于逐步聚合（聚加成）。","第三个特例是聚乙烯醇。它不能由乙烯醇单体直接聚合（乙烯醇极不稳定，会立刻互变异构为乙醛），工业上先聚醋酸乙烯酯再醇解。这条常以反应式题出现，也常作为“聚合物化学反应”一章的引子。","五、命名与缩写：填空和反应式题的得分点","命名有四条路：来源命名（聚 + 单体名）、结构命名（按链上特征基团）、商品名或俗名（如涤纶、尼龙、有机玻璃）、英文缩写。教材反复强调的命名原则是“既表明结构特征，又反映与原料单体的联系”，因为很多聚合物两者并不同名。","图 4　常见聚合物的结构式与英文缩写（PMMA、PVAc、PET）（北化《高分子化学·重点内容》课件）","表 5　高频缩写与结构对应（背这张就够应试）","六条“起手式”反应式（绪论章就背下来，后面每一章都会用到）：①加聚　n CH₂=CH₂ → —(CH₂—CH₂)—n（聚乙烯）；②缩聚　n H₂N(CH₂)₆NH₂ + n HOOC(CH₂)₄COOH → —(NH(CH₂)₆NHCO(CH₂)₄CO)—n + 2n H₂O（尼龙 66）；③开环　n 己内酰胺 → —(NH(CH₂)₅CO)—n（尼龙 6，己内酰胺开环后无小分子析出）；④聚加成　n O=C=N—R—N=C=O + n HO—R′—OH → 聚氨酯（无小分子析出）；⑤共聚　n CH₂=CH₂ + m CH₂=CH(CH₃) → 乙丙共聚物（配位共聚，作橡胶用）；⑥官能团转化　PVAc + CH₃OH → PVA + 醋酸甲酯（醇解，详见高化 08）。","六、分子量与分布：第一章就要建立“分布”意识","聚合物的分子量不是一个数，而是一个分布。原因是聚合过程中每一条链的引发时刻、增长次数、终止时刻都不同，缩聚里更是随机缩合。于是同一个牌号的聚乙烯，分子量从几万到几十万都有。这就逼出了四种平均分子量。","表 6　四种平均分子量与常用测定方法","恒等关系要背下来：Mn < Mv < Mw < Mz。多分散系数 d = Mw / Mn，d 越大分布越宽。阴离子活性聚合接近单分散，d 可小到 1.05；缩聚按 Flory 分布，d 约等于 2；自由基聚合因终止与转移并存，d 常在 2 到 5；配位聚合视催化剂与工艺，常在 2 到 8。","例题（必做）：某聚苯乙烯试样中，分子量 10 万的链占总质量 50%，分子量 20 万的链占 50%，求 Mn、Mw 与 d。","解：按质量分数算，先换成摩尔分数。设总质量 100 g，则两种链的质量各 50 g，物质的量分别为 50/10 万与 50/20 万，即 5×10⁻⁴ mol 与 2.5×10⁻⁴ mol。Mn = 100 g / (7.5×10⁻⁴ mol) = 13.3 万；Mw = 0.5×10 万 + 0.5×20 万 = 15 万；d = 15 / 13.3 = 1.13。","七、把高分子化学接到高分子物理上","绪论最后一步是把两门课接起来。高化负责“怎么造出这条链”，高物负责“这条链为什么表现出这种性能”。接口在结构上：近程结构（构型、取代基、头尾）决定链的柔性，远程结构（分子量、分布、支化、构象）决定堆砌方式，堆砌方式决定分子运动能力，分子运动能力决定玻璃化温度、结晶、力学与电学行为。","举一个 2023 年真题的用法：问“为什么聚苯乙烯强度高但很脆，如何增韧”。按链条走，答案自然是：侧基苯环使链刚性大（近程）→ 链段运动困难、无法通过形变吸收冲击能（运动）→ 材料硬而脆（性能）。增韧的思路就是引入能诱发银纹、又能中止银纹扩展的橡胶相。同样的链条，高物第六章还要再用一次。","【真题 1】从反应机理和动力学角度看，PET 和 PMMA 的合成反应分别属于（　）和（　）聚合机理。","【真题 2】简述影响线形缩聚聚合度的主要因素和影响方向。","【真题 3】氯乙烯的聚合能通过阴离子聚合实现吗？阳离子呢？自由基呢？为什么？合成聚氯乙烯时为什么一般控制转化率低于 80%？","★★★　能不看笔记说出结构单元、重复单元、链节的三个定义，并举加聚与缩聚各一例","★★★　能默写连锁与逐步聚合的六项差别，并用一句话串起来","★★★　能写出 Mn、Mw 的公式，并说明为什么 Mw 恒大于 Mn","★★　能说出开环聚合为什么按机理算连锁，聚氨酯为什么算逐步","★★　能默写至少 10 个常用缩写及其单体","★★　能独立算出“质量分数各 50%、分子量 10 万与 20 万”的 Mn、Mw、d","★　知道 PVA 不能由乙烯醇直接聚合，能默写醇解反应式","★　能复述高分子科学的三条主线（合成、结构性能、加工）"],"imp":3.1,"hot":4},{"id":"gaohua02","no":2,"name":"高化02 逐步聚合反应","title":"逐步聚合反应","cards":[{"id":"gaohua02-001","type":"tf","q":"线形缩聚中，反应程度为 0.99 时，按重复单元计的聚合度约为 100。","a":"对（1 分）。DP＝1／(1－P)＝1／0.01＝100（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高化02 逐步聚合反应·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"对"},{"id":"gaohua02-002","type":"tf","q":"加单官能团封端剂时，有效配比 r＝Na／（Nb＋Nb′）。","a":"错（1 分）。封端剂只封一头，等于废掉另一头的配对能力，故 r＝Na／(Nb＋2Nb′)（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高化02 逐步聚合反应·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"错"},{"id":"gaohua02-003","type":"tf","q":"卡罗瑟斯法算出的凝胶点总高于实测值。","a":"错（1 分）。实测凝胶点常低于理论值，因分子内环化消耗了部分官能团（1 分）。","stars":3,"s 习册·高化02 逐步聚合反应·论述（12 分）·第 1 题"},{"id":"gaohua02-p001","type":"point","q":"官能度与平均官能度的计算（计算、填空）","a":"等量时按分子数平均，不等量时按少的官能团算","stars":4,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 1 条）"},{"id":"gaohua02-p002","type":"point","q":"反应程度 P 与 Xn = 1/(1-P)（计算）","a":"2-2 体系等当量缩聚的基本式","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 2 条）"},{"id":"gaohua02-p003","type":"point","q":"端基封锁与配比 r（计算、简答）","a":"Xn 有上限，由 r 决定","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 3 条）"},{"id":"gaohua02-p004","type":"point","q":"缩聚动力学（外加酸与自催化）（计算、简答）","a":"二级与三级反应的积分式不同","stars":3,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 4 条）"},{"id":"gaohua02-p005","type":"point","q":"平衡常数与小分子排出（简答、论述）","a":"Xn 与 K、残留水含量的平方根关系","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 5 条）"},{"id":"gaohua02-p006","type":"point","q":"凝胶点 Carothers 方程（计算）","a":"Pc = 2/f，f 为平均官能度","stars":4,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 6 条）"},{"id":"gaohua02-p007","type":"point","q":"凝胶点 Flory 统计法（计算、简答）","a":"考虑支化概率，结果比 Carothers 更准","stars":3,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 7 条）"},{"id":"gaohua02-p008","type":"point","q":"无规预聚物与结构预聚物（填空、简答）","a":"酚醛分酸碱两种催化，环氧属结构预聚物","stars":3,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 8 条）"},{"id":"gaohua02-p009","type":"point","q":"四种实施方法的比较（简答、论述）","a":"熔融最常用，界面能突破平衡","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 9 条）"},{"id":"gaohua02-p010","type":"point","q":"重要工业品种（PET、PA、PF、EP）（选择、反应式）","a":"合成路线要能默写","stars":2,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化02 逐步聚合反应·二、考点星级总表（第 10 条）"},{"id":"gaohua02-t011","type":"fill","q":"按照逐步聚合分子链形状分类，尼龙 46 和脲醛树脂分别是（　）和（　）结构；酸催化酚醛树脂预聚物属于（　）预聚物，碱催化酚醛树脂的预聚物则属于（　）预聚物。","a":"线形、体形；结构预聚物、无规预聚物。给分点：四个空各 0.5 分。判据是平均官能度——尼龙 46 由丁二胺与己二酸构成，两者 f 均为 2，故线形；脲醛树脂由尿素（f = 4）与甲醛缩合，必然体形。","stars":5,"sec":"九、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化02 逐步聚合反应·九、真题与期末题演练"},{"id":"gaohua02-t012","type":"short","q":"研究熔融聚合的聚酯反应的聚合动力学，为测定聚合活化能，请简述实验步骤并说明数据处理。","a":"步骤：①在装有搅拌、测温与真空/惰性气路的反应器中加入对苯二甲酸与乙二醇（或 PET 预聚物），升温熔融；②在恒定温度下开始计时，每隔一定时间取样，用端基滴定或粘度法测该时刻的相对分子质量并换算成反应程度 P；③改变温度（至少三到四个温度点，如 260、270、280、290 ℃）重复上述实验，每个温度下得到一组 P–t 数据。数据处理：对外加酸催化体系用 1/(1 - P) 对 t 作图，直线斜率为 k；对自催化体系用 1/(1 - P)² 对 t 作图；再由 ln k 对 1/T 作图，直线斜率为 -Ea/R，从而求出活化能 Ea。给分点：装置与取样、P 的测定方法、两种积分式的选择、Arrhenius 作图四部分。","stars":5,"sec":"九、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高化02 逐步聚合反应·九、真题与期末题演练"},{"id":"gaohua02-t013","type":"calc","q":"1 mol aAa 与 1 mol bBb 缩聚，若制备体形缩聚产品，按 Carothers 方法计算凝胶点为 0.80 时需加入多少摩尔多官能化合物？","a":"由 Pc = 2/f 得 f = 2/Pc = 2/0.8 = 2.5。设加入的多官能化合物（f = 3）为 x mol，则总分子数 ΣNi = 2 + x，总官能团数 = 1×2 + 1×2 + 3x，故 f = (4 + 3x)/(2 + x) = 2.5，解得 x = 0.667 mol。给分点：写出 Pc = 2/f、正确列出平均官能度表达式、解方程三部分。","stars":5,"sec":"九、真题与期末题演练","num":112,"ord":912,"src":"真题","from":"分章节复习资料·高化02 逐步聚合反应·九、真题与期末题演练"}],"reading":["一、本章坐标：一条链是怎么“并”出来的","逐步聚合和高物里的“分子量”概念是同一件事的两面：这里决定链有多长，那里决定链长了以后性能怎么变。所以本章的每个公式都在回答同一个问题——在什么条件下链才能长到足够长？答案集中在三个旋钮：反应程度 P、官能团配比 r、以及小分子副产物能不能及时排走。","表 1　逐步聚合考点与重要度","三、官能度：决定线形还是体形","官能度 f 是一个单体分子上能参与聚合的官能团的数目。二醇、二酸 f = 2，甘油 f = 3，季戊四醇 f = 4。规则很硬：平均官能度 f 等于 2 时只能得到线形或支化链，大于 2 就一定会交联成网。这不是经验，是拓扑约束——链要无限延伸，每个单元平均必须提供两条“生长方向”。","平均官能度的算法分两种情形，这是计算题的第一道坎：","情形一，两种官能团等物质的量：f = ΣNi·fi / ΣNi，即按分子数加权直接平均。例如 1 mol 甘油（f = 3）与 1.5 mol 邻苯二甲酸酐（f = 2），ΣNi = 2.5 mol，ΣNi·fi = 1×3 + 1.5×2 = 6，f = 2.4。","情形二，两种官能团不等量：f = 2 ×（较少那一类官能团的总物质的量）/ ΣNi。为什么要乘 2？因为多出来的官能团找不到配对对象，等于浪费，真正能形成链的只有成对的那部分。这一步如果算错，凝胶点必然跟着错。","图 1　反应的逐步性：链的增长靠官能团之间的逐步缩合，无引发与终止（北化《高分子化学·重点内容》课件）","再看一个常见的坑：单官能团化合物（如苯甲酸、甲醇）的 f = 1。它不能延长链，只能封端，所以它不参与 f 的平均计算意义上的“增长”，但恰恰是控制分子量的关键手段。题目给“加入少量醋酸”，八成是考端基封锁。","四、线形缩聚：P 决定一切","以二元酸与二元醇的等当量缩聚为例。设起始官能团总数为 N0，反应到某时刻剩余 N 个，则反应程度 P = (N0 - N)/N0。链的数目等于剩余官能团数的一半（每个分子有两个端基），所以体系中的分子数 Nm = N/2。","于是数均聚合度（以结构单元数计）Xn = N0 / Nm = 2N0 / N = 2/(1 - P)。若以重复单元（链节）计，DP = 1/(1 - P)。教材在讨论 2-2 体系时常用后一式，答题时要先声明口径。","这个公式带来一个非常重要的直觉：P = 0.99 时 DP 只有 100，P = 0.999 时才有 1000。也就是说，缩聚要得到真正的高分子量，反应程度必须做到千分之一以内的残留。工业上“高温、高真空、长时间、催化剂”四件套，全部是为了把最后那 1% 啃下来。","图 2　典型缩聚反应式：二元胺与二元酰氯合成芳纶 1414（Kevlar，杜邦），二元胺与二酰氯脱去 (2n−1) HCl；双酚 A 与光气合成聚碳酸酯，同样脱去 HCl（北化《高分子化学·重点内容》课件第 7.2 节「逐步聚合反应式」）","图 3　逐步加成聚合（聚加成）反应式：以二异氰酸酯与二元醇加成生成聚氨酯为代表，无小分子副产物析出（北化《高分子化学·重点内容》课件第 7.2 节「逐步聚合反应式」）","三类逐步聚合反应的通用式（考点要求能区分是否析出小分子）：①缩聚　~COOH + HO~ → ~COO~ + H₂O（析出小分子，酯化；酸与胺则析出 HCl 或水）；②聚加成　~N=C=O + HO~ → ~NH—COO~（无小分子析出，聚氨酯即此类）；③逐步加成与缩聚的关键区别就在于有无小分子副产物，以及反应是否靠基团的加成而非缩合。","两条最常考的具体缩聚式（自测清单要求默写，照抄不出错）：①PET（涤纶）　n HOOC—C₆H₄—COOH + n HO—CH₂CH₂—OH → —(OC—C₆H₄—COO—CH₂CH₂—O)—n + 2n H₂O（对苯二甲酸 + 乙二醇，酯化缩聚，工业上常用酯交换法先做 BHET 再缩聚）；②尼龙 66　n HOOC(CH₂)₄COOH + n H₂N(CH₂)₆NH₂ → —(OC(CH₂)₄CONH(CH₂)₆NH)—n + 2n H₂O（己二酸 + 己二胺，成盐后熔融缩聚）。注意两条式的副产物都是 2n H₂O，若题目用二元酰氯代替二元酸则改为脱 (2n−1) HCl。","五、分子量控制：r 与封端","实际生产中不可能只靠 P 来控制分子量，因为 P 很难稳定在 0.999。真正好用的旋钮是配比。设二元酸与二元醇的官能团数之比 r = Na/Nb，且 r ≤ 1，则","Xn = (1 + r)/(1 + r - 2rP)，当 P → 1 时，Xn(max) = (1 + r)/(1 - r)。","这就是“配比锁死分子量”的数学表达。举例：r = 0.99，则 Xn(max) = 1.99/0.01 = 199，无论怎么延长时间也上不去。工业上做尼龙 66 时用少量己二酸或己二胺过量来锁定牌号，就是这个道理。","更常用的手法是加单官能团封端剂。设加入的单官能团物质量为 Nb′，则有效配比 r = Na/(Nb + 2Nb′)，Xn = (1 + r)/(1 + r - 2rP)。为什么是 2Nb′？因为一个封端剂只封一头，相当于把另一头的配对能力也一起废掉。很多题把这一步写成 r = Na/(Nb + Nb′)，结果差一倍。","表 2　缩聚聚合度的三个常用公式","例题：1 mol 的 aAa 与 1 mol 的 bBb 进行缩聚，K = 400，采用开放体系，若要把平均聚合度控制在 150、反应程度 0.995，需加入多少摩尔单官能团化合物 Cb？（北京化工大学期末题原题）","解：由 Xn = (1 + r)/(1 + r - 2rP) 反解 r。150 = (1 + r)/(1 + r - 0.995·2r)，整理得 r = 0.9967。再由 r = Na/(Nb + 2Nb′) = 1/(1 + 2Nb′) 得 Nb′ ≈ 0.0033 mol。答题时必须写出 r 的定义式，否则过程分拿不到。","六、缩聚动力学：两条积分曲线","缩聚的速率由官能团之间的碰撞决定，所以是典型的二级反应：-dC/dt = kC²。若外加酸催化（如对甲苯磺酸），k 恒定，积分得 1/(1 - P) = 1 + C0·k·t，即 DP 随时间线性增长——注意是 DP 线性，不是 P 线性。","若不加外酸、靠二元酸自身提供的氢离子自催化，速率与羧酸浓度成正比，反应变成三级：-dC/dt = kC³，积分得 1/(1 - P)² = 1 + 2C0²·k·t。两条曲线形状不同，考计算时必须先判断体系属于哪一类。","平衡常数的影响更致命。缩聚是缩合反应，有水或氯化氢生成。密闭体系里小分子越积越多，平衡很快停在半路，Xn 被压在低水平。开放体系边反应边抽走小分子，才能把 P 推到 0.999。这里的关系式是 Xn = √(K/(P·nw))，nw 是残留小分子的物质的量——注意是平方根关系，所以要把 Xn 提高 10 倍，nw 必须降到 1/100。这个数量级关系是论述题的高分点。","表 3　缩聚动力学与平衡的四个关系式","当平均官能度大于 2，链不会一直线形延伸，而会在某个时刻突然连成一张网：粘度骤增、出现不溶不熔的凝胶，这个时刻对应的反应程度叫凝胶点 Pc。凝胶点之前叫预聚物阶段，之后叫固化阶段。工业上做酚醛、醇酸、环氧，都是先做到预聚物再成型固化。","Carothers 法用一个极简的假设：Xn 趋于无穷时发生凝胶。由 Xn = 2/(2 - fP)，令 Xn → ∞ 得","Pc = 2/f，f 为平均官能度。这个方法简单但偏高，因为它假设所有官能团等活性、且忽略了分子内的成环。","Flory 统计法考虑了支化概率，公式为 Pc = 1/√(r + r·ρ(f - 2))，其中 r 为官能团配比，ρ 为支化单元上官能团占总官能团的分数，f 为支化单体的官能度。算出来的 Pc 通常低于 Carothers 值，更接近实测。答题时两者的适用条件要写清：Carothers 适合快速估算与判断，Flory 适合精确设计配方。","图 4　体形缩聚的理论凝胶要点：Xn 趋于无穷与凝胶点的对应（北化《高分子化学·重点内容》课件）","表 4　两种凝胶点算法的比较","预聚物还分两类，填空题常考：无规预聚物（官能团分布随机，如碱催化酚醛树脂）与结构预聚物（官能团位于链端、结构明确，如酸催化酚醛树脂、环氧树脂）。前者固化时交联点随机，后者交联点可控，性能更稳定。","八、四种实施方法：为什么工业偏爱熔融","表 5　逐步聚合实施方法比较","界面缩聚为什么能突破平衡限制？因为反应在界面发生，生成的聚合物立刻离开反应区、小分子进入水相被碱中和，平衡被持续拉向右方；又因为两种单体分别处在两相，配比不必严格等当量也能得到高分子量——这是“配比锁死分子量”规律的一个著名例外，简答题常拿它做对比。","【真题 1】按照逐步聚合分子链形状分类，尼龙 46 和脲醛树脂分别是（　）和（　）结构；酸催化酚醛树脂预聚物属于（　）预聚物，碱催化酚醛树脂的预聚物则属于（　）预聚物。","【真题 2】研究熔融聚合的聚酯反应的聚合动力学，为测定聚合活化能，请简述实验步骤并说明数据处理。","【真题 3】1 mol aAa 与 1 mol bBb 缩聚，若制备体形缩聚产品，按 Carothers 方法计算凝胶点为 0.80 时需加入多少摩尔多官能化合物？","★★★　能写出三种 Xn 公式，并说明 r 用的是官能团数之比","★★★　能解释 r = 0.99 时分子量为何锁在 199，且能举工业例子","★★★　能默写 Carothers 与 Flory 两个凝胶点公式并说明差别","★★★　能用 Xn ∝ 1/√nw 解释真空操作的必要性","★★　能区分外加酸催化与自催化两条积分式","★★　能说出四种实施方法的优缺点，并解释界面缩聚为何能突破平衡","★★　能判断无规预聚物与结构预聚物的区别，并举工业品种","★　能默写 PET 与尼龙 66 的缩聚反应式"],"imp":3.4,"hot":5},{"id":"gaohua03","no":3,"name":"高化03 自由基聚合","title":"自由基聚合","cards":[{"id":"gaohua03-001","type":"tf","q":"过硫酸钾受热后一步均裂，直接生成两个硫酸根自由基。","a":"错（1 分）。KPS 先电离成 K⁺ 与 S₂O₈²⁻，再均裂为两个 SO₄·⁻（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"错"},{"id":"gaohua03-002","type":"tf","q":"引发效率 f 可以近似取 1 用于计算。","a":"错（1 分）。因笼蔽效应与副反应，f 通常为 0.6—0.9，不能取 1（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·判断并说明理由（每题 2 分，共 10 分）·第 2 题","verdict":"错"},{"id":"gaohua03-003","type": s":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":2,"ord":502,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·反应式与制备（每题 5 分，共 20 分）·第 2 题"},{"id":"gaohua03-021","type":"short","q":"写出 KPS 在水中的三步反应式。","a":"K₂S₂O₈ → 2K⁺ ＋ S₂O₈²⁻；S₂O₈²⁻ → 2SO₄·⁻；SO₄·⁻ ＋ H₂O → HSO₄⁻ ＋ ·OH（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":3,"ord":503,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·反应式与制备（每题 5 分，共 20 分）·第 3 题"},{"id":"gaohua03-022","type":"short","q":"写出 H₂O₂＋Fe²⁺ 的氧化还原引发式，并注明活化能降低的数值。","a":"H₂O₂ ＋ Fe²⁺ → ·OH ＋ OH⁻ ＋ Fe³⁺；活化能由 218 降至约 40 kJ·mol⁻¹，可在 −10—20 ℃ 引发（5 分）。","stars":4,"sec":"反应式与制备（每题 5 分，共 20 分）","num":4,"ord":504,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·反应式与制备（每题 5 分，共 20 分）·第 4 题"},{"id":"gaohua03-023","type":"short","q":"用等活性、稳态、聚合度很大三个假设，推导 Rp＝kp[M](f kd[I]／kt)^0.5，并说明 0.5 次方的来源。","a":"三假设：等活性（各步 k 与链长无关）、稳态（Ri＝Rt，自由基浓度恒定）、聚合度很大（引发与转移消耗单体可忽略）（各 2 分）；由稳态得 [M·]＝(f kd[I]／kt)^0.5，代入 Rp＝kp[M][M·]（1 分）；0.5 次方源于终止为双分子过程（1 分）。","stars":4,"sec":"简答（每题 8 分，共 16 分）","num":1,"ord":601,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·简答（每题 8 分，共 16 分）·第 1 题"},{"id":"gaohua03-024","type":"short","q":"解释：本体聚合进行到中期，转化率与速率同时突然上升，分子量也变大。","a":"中期黏度上升→链自由基扩散困难→kt 下降→[M·]升高→Rp 上升、Xn 上升；此时动力学公式失效，转入宏观动力学（每点 2 分）。","stars":4,"sec":"简答（每题 8 分，共 16 分）","num":2,"ord":602,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·简答（每题 8 分，共 16 分）·第 2 题"},{"id":"gaohua03-025","type":"calc","q":"已知 [M]＝5 mol·L⁻¹，[I]＝0.01 mol·L⁻¹，f＝0.8，kd＝1×10⁻⁵ s⁻¹，kp＝1×10³ L·mol⁻¹·s⁻¹，kt＝1×10⁷ L·mol⁻¹·s⁻¹。求初期聚合速率 Rp 与自由基浓度。","a":"[M·]＝(0.8×1×10⁻⁵×0.01／1×10⁷)^0.5＝(8×10⁻¹²)^0.5≈2.83×10⁻⁶ mol·L⁻¹（4 分）；Rp＝1×10³×5×2.83×10⁻⁶≈1.41×10⁻² mol·L⁻¹·s⁻¹（4 分）；结论单位与量级说明（2 分）。","stars":5,"sec":"计算（10 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·计算（10 分）·第 1 题"},{"id":"gaohua03-026","type":"essay","q":"某实验测得多组数据：lnRp 对 ln[I] 的斜率为 0.5，lnRp 对 ln[M] 的斜率为 1；但当转化率超过 40% 后，Rp 明显偏离该直线。（1）用微观动力学解释前一组数据说明了什么；（2）解释偏离的原因；（3）提出三条提高分子量的工艺措施。\n错题归因（做完自己填）","a":"（1）斜率 0.5 与 1 说明符合微观动力学：终止双分子、增长单分子，三假设成立（4 分）。（2）转化率升高后黏度大，kt 受扩散控制下降，出现自动加速，偏离直线（3 分）。（3）降温、降低引发剂浓度、加链转移剂（或选合适溶剂降低向溶剂转移）（3 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化03 自由基聚合·论述（12 分）·第 1 题"},{"id":"gaohua03-p001","type":"point","q":"连锁聚合的三个基元反应（简答、论述）","a":"引发、增长、终止，各有特征速率","stars":4,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 1 条）"},{"id":"gaohua03-p002","type":"point","q":"引发剂类型与分解反应式（填空、反应式）","a":"AIBN、BPO、KPS 及氧化还原体系","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 2 条）"},{"id":"gaohua03-p003","type":"point","q":"引发效率 f 与笼蔽效应（名词解释、简答）","a":"初级自由基被笼蔽消耗，f 常为 0.6 至 0.9","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 3 条）"},{"id":"gaohua03-p004","type":"point","q":"链终止的偶合与歧化（选择、简答）","a":"偶合得 2ν，歧化得 ν","stars":3,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 4 条）"},{"id":"gaohua03-p005","type":"point","q":"链转移的四种对象（计算、简答）","a":"向单体、溶剂、引发剂、大分子","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 5 条）"},{"id":"gaohua03-p006","type":"point","q":"三大假设与 Rp 方程（论述、计算）","a":"等活性、稳态、聚合度很大","stars":5,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 6 条）"},{"id":"gaohua03-p007","type":"point","q":"动力学链长 ν 与聚合度（计算）","a":"ν 是每个自由基消耗的单体数","stars":4,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 7 条）"},{"id":"gaohua03-p008","type":"point","q":"温度与浓度对 Rp、Xn 的影响（简答、论述）","a":"综合活化能约 60 至 70 kJ/mol","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 8 条）"},{"id":"gaohua03-p009","type":"point","q":"自动加速现象（凝胶效应）（论述、简答）","a":"kt 下降、kp 不变，Rp 反而上升","stars":5,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 9 条）"},{"id":"gaohua03-p010","type":"point","q":"分子量分布与聚合度控制（计算、简答）","a":"d 常为 2 至 5，转移剂可调分子量","stars":3,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化03 自由基聚合·二、考点星级总表（第 10 条）"},{"id":"gaohua03-t014","type":"essay","q":"某自由基聚合体系测得 ln Rp 与 ln[I] 成线性、斜率为 1/2，ln Rp 与 ln[M] 成线性、斜率为 1。（1）说明该体系符合哪些假设；（2）随反应进行体系粘度增大，Rp 反而上升，解释原因；（3）提出三条提高分子量而不显著降低速率的措施。","a":"（1）符合等活性、稳态、聚合度很大三个假设。斜率 1/2 来自双分子终止的稳态解，斜率 1 来自 Rp 对单体浓度的一次方依赖。（2）粘度增大使链段重排受阻、活性端基被包埋，双基终止困难，kt 下降、自由基寿命延长，而单体扩散基本不受影响、kp 不变，故 Rp 上升，同时分子量迅速增大，体系成胶状——即自动加速，此时微观动力学已不成立，进入宏观动力学范畴。（3）降低引发剂浓度、适当降低温度以减少链转移、选择合适溶剂以减弱向溶剂的链转移（或加入适量链转移剂并把控用量）。给分点：假设、机理、措施三块各占三分之一。","stars":5,"sec":"九、真题与期末题演练","num":113,"ord":913,"src":"真题","from":"分章节复习资料·高化03 自由基聚合·九、真题与期末题演练"},{"id":"gaohua03-t015","type":"fill","q":"在推导自由基聚合初期反应动力学方程时和二元共聚组成方程时都使用过的三个假设是（　）、（　）和（　）。","a":"自由基等活性假设、聚合度很大假设、稳态假设。给分点：三空各 0.5 分。注意题目问的是“都使用过”，所以不能答“忽略引发消耗”这类只在动力学中用的假设。","stars":5,"sec":"九、真题与期末题演练","num":114,"ord":914,"src":"真题","from":"分章节复习资料·高化03 自由基聚合·九、真题与期末题演练"},{"id":"gaohua03-t016","type":"short","q":"用 BPO 引发 10 g 苯乙烯在 80 mL 环己烷中聚合，要提高聚合速率，可加入四氢呋喃、N,N-二甲基苯胺、甲苯、聚苯乙烯中的哪些？为什么？","a":"可加 N,N-二甲基苯胺与聚苯乙烯。前者与 BPO 组成氧化还原体系，活化能大幅降低，相同温度下自由基生成速率快，Rp 上升；后者提高体系粘度，使 kt 下降，产生凝胶效应而提速。四氢呋喃是极性溶剂，主要影响离子聚合的离子对状态，对自由基体系无此作用；甲苯只是稀释，反而降低速率。给分点：两种添加物各 2 分，机理各 1 分。","stars":5,"sec":"九、真题与期末题演练","num":115,"ord":915,"src":"真题","from":"分章节复习资料·高化03 自由基聚合·九、真题与期末题演练"}],"reading":["一、本章坐标：四个基元反应决定两件事","自由基聚合回答两个问题：反应有多快（Rp），链有多长（Xn）。这两个答案都来自同一组基元反应——引发、增长、终止、链转移。谁能改变这四步的相对速率，谁就同时改变了速率和分子量。整章的结构就是这句话的展开。","表 1　自由基聚合考点与重要度","三、链引发：慢，且只有一部分有效","引发分两步：引发剂先分解产生两个初级自由基，初级自由基再与第一个单体加成，生成单体自由基。第一步慢（活化能高），第二步快，所以整个引发的速率由分解步骤控制，这是“慢引发”的含义。","常用引发剂分三类。第一类是热分解型，如偶氮二异丁腈（AIBN）在 60 至 80 ℃ 分解，放出氮气并生成两个自由基；过氧化二苯甲酰（BPO）受热均裂产生苯甲酰氧自由基，进一步脱羧成苯自由基。第二类是氧化还原型，如过硫酸钾与亚硫酸氢钠、或 BPO 与 N,N-二甲基苯胺，活化能低，可在室温甚至低温引发。第三类是光与辐射引发，靠紫外光直接激发或光敏剂。","图 1　链引发两步反应式：第一步 I → 2R·（分解，吸热 105—150 kJ/mol，控速步骤）；第二步 R· + M → RM·（加成，放热 20—32 kJ/mol）（北化《高分子化学·重点内容》课件第 2.3.1 节）","图 2　热分解型引发剂分解反应式：AIBN 均裂放出 N₂ 并生成 2 个氰基异丙基自由基；BPO 均裂生成 2 个苯甲酰氧自由基，无单体存在时进一步脱羧放出 CO₂（并非完全分解）（北化《高分子化学·重点内容》课件第 2.4.1.1 节）","过硫酸钾（KPS，K₂S₂O₈）的水溶液分解式要能默写：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（受热，约 60—80 ℃）2 SO₄·⁻；SO₄·⁻ + H₂O → HSO₄⁻ + ·OH。可见 KPS 是水溶性引发剂，常用于乳液聚合与水溶液聚合，且分解产生的是硫酸根自由基与羟基自由基两种初级自由基。","图 3　氧化还原引发体系反应式（水溶性）：H₂O₂ + Fe²⁺ → HO· + OH⁻ + Fe³⁺，活化能由 218 kJ/mol 降至 40 kJ/mol，可在 −10—20 ℃ 引发；还原剂过量时 HO· 会进一步与 Fe²⁺ 反应而失活，故还原剂用量一般少于氧化剂（北化《高分子化学·重点内容》课件第 2.4.1.2 节）","衡量引发剂活性最实用的指标是半衰期 t1/2：在某一温度下引发剂浓度消耗一半所需的时间。60 ℃ 时 AIBN 的 t1/2 约 10 小时，属于“中速”；工业上选择引发剂要让 t1/2 与聚合时间同量级，否则要么引发不足、要么过早耗尽。","引发效率 f 是真正引发链的自由基占全部分解自由基的比例。损失的主因是笼蔽效应：引发剂分子在溶剂或单体形成的“笼”中分解，两个初级自由基尚未扩散开就彼此结合或发生歧化，白白消耗。此外还有初级自由基向单体、溶剂、引发剂的转移消耗。因此 f 一般在 0.6 至 0.9，计算时不能当成 1。","四、链增长与链终止：一快一慢决定分子量","增长是单体逐个加到链自由基末端，每次加成都放出约 20 至 35 kJ/mol 的聚合热，活化能低（约 20 至 40 kJ/mol），所以极快：一个自由基在不到一秒内可加上上千个单体。增长的方向性带来“头尾结构”，这是高物第一章讲构型时的伏笔。","终止分两种。偶合是两个链自由基的独电子配对成键，把两条链连成一条，得到的分子量是动力学链长的 2 倍；歧化是一个自由基从另一个自由基的邻位碳上夺取氢（或反向夺取），生成两条死链，其中一条带不饱和端基，分子量等于动力学链长。两种方式的比例取决于温度与空间位阻：温度高、位阻大时歧化比例上升。","图 4　链终止的两种方式：偶合终止与歧化终止的结构差别（课件含完整反应式与结构式）（北化《高分子化学·重点内容》课件第 2.3.3 节）","反应式速记（考场直接写这三条）：①链增长　~M· + CH₂=CHX → ~M—CH₂—CHX·（每加成一个单体，放热 20—35 kJ/mol）；②偶合终止　2 ~M· → ~M—M~（两条链连成一条，聚合度等于两个自由基重复单元数之和，分子量为 2ν）；③歧化终止　2 ~M· → ~M—H + ~M=CHX（生成一条饱和链与一条带不饱和端基的链，分子量为 ν）。","这里有一个容易被忽略的结论：终止速率常数 kt 比增长速率常数 kp 大 3 到 4 个数量级，但体系中自由基浓度极低（约 10⁻⁸ mol/L），所以每个自由基平均要增长上千次才碰到另一个自由基。这就是为什么“终止快”不等于“链短”。","表 2　自由基聚合四个基元反应的速率与活化能","五、链转移：自由基没死，但链停长了","链转移是自由基从另一个分子上夺取原子（通常是氢），自己变成稳定分子，同时把对方变成新的自由基。结果是：活性中心数量不变，但长链终止了，新链从零开始。所以链转移会降低分子量，却不降低聚合速率。","四种转移对象各有常数：向单体转移（CM）、向溶剂转移（Cs）、向引发剂转移（Ci）、向大分子转移（导致支化）。工业上用十二烷基硫醇这类“分子量调节剂”就是故意利用向溶剂（或调节剂）转移，把分子量稳定控制在牌号要求。","定量关系写成：1/Xn = 1/Xn0 + CM + Cs[S]/[M] + Ci[I]/[M]。其中 Xn0 是无转移时的聚合度。这条式子在计算题里几乎必用，也解释了为什么溶液聚合的分子量通常低于本体聚合——因为多了 Cs[S]/[M] 这一项。","图 5　转化率对聚合速率与分子量的影响（MMA 本体聚合实测数据）（北化《高分子化学·重点内容》课件）","六、动力学推导：三个假设与一个方程","推导分三步，先把假设写清，再代速率式，最后做稳态近似。三个假设是：①自由基等活性，即链自由基不论长短，kp 与 kt 都相同；②稳态假设，引发产生的自由基与终止消耗的自由基相等，[M·] 恒定；③聚合度很大，即用于引发和转移消耗的单体可以忽略，Rp 近似等于增长速率。","由稳态：Ri = Rt，2f·kd[I] = 2kt[M·]²，得 [M·] = √(f·kd[I]/kt)。代入增长速率 Rp = kp[M][M·]，得","Rp = kp[M](f·kd[I]/kt)^0.5　，即 Rp ∝ [M]·[I]^0.5。","这个 0.5 次方是自由基聚合最著名的指纹：双分子终止导致引发剂浓度只以平方根影响速率。2023 年真题正是用 ln Rp 对 ln[I] 的斜率是否为 1/2 来判断体系是否符合微观动力学。","动力学链长 ν 定义为每个活性中心从引发到消失所消耗的单体数，等于增长速率与引发速率之比：ν = Rp/Ri = kp[M]/(2√(f·kd·kt[I]))。分子量与 ν 的关系要看终止方式：偶合为主时 Xn = 2ν，歧化为主时 Xn = ν，两种并存时按比例加权。","表 3　三个假设与两个方程的对应","七、温度、浓度与引发剂：三个旋钮的方向","温度对 Rp 的影响由综合活化能决定：Ea(Rp) = Ep + Ed/2 - Et/2 ≈ 30 + 60 - 5 ≈ 63 kJ/mol（数量级），所以升温加速。温度对 Xn 的影响则由 Ea(Xn) = Ep - Ed/2 - Et/2 决定，约为 -60 kJ/mol，所以升温使分子量下降。这正是“升温快而短”的来源。","引发剂浓度升高：Rp 按 0.5 次方上升，Xn 按 -0.5 次方下降。单体浓度升高：Rp 线性上升，Xn 也上升（因为 [M]/[M·] 增大）。这三个方向必须能直接说出来，简答题常以“要提高速率又不降低分子量，怎么办”设问，答案就是提高单体浓度、降低引发剂浓度、适当降温。","表 4　三个旋钮的作用方向","八、自动加速：公式失效的那一刻","聚合中期，单体与聚合物共存使体系粘度急剧上升。大分子链段运动受阻，两个链自由基靠近变难，kt 明显下降；而单体分子小、扩散仍容易，kp 基本不变。由 Rp = kp[M]√(f·kd[I]/kt) 可见，kt 下降使 Rp 反而上升，同时自由基寿命延长、分子量骤增，体系迅速变成“果冻”。这就是自动加速，也叫凝胶效应。","图 6　自动加速现象的定义与判据：外界条件不变、仅由体系内部引起的加速（北化《高分子化学·重点内容》课件）","自动加速不是好事。放热集中会造成局部过热、暴聚、产物不均一，甚至冲料。工业上的对策：降低引发剂浓度、分段升温、加强搅拌与传热、采用溶液或分散体系稀释粘度、必要时加入少量链转移剂抑制分子量暴涨。","与此相对的是“沉淀效应”：在非均相体系（如丙烯腈在水中的沉淀聚合）中，聚合物一生成就析出，反应在颗粒内部进行，同样会出现加速，但机理是局部浓度富集而非单纯粘度。两者要分清：凝胶效应讲的是粘度，沉淀效应讲的是相分离。","图 7　转化率与聚合速率的关系曲线：中期出现的速率回升即自动加速段（北化《高分子化学·重点内容》课件）","【真题 1】某自由基聚合体系测得 ln Rp 与 ln[I] 成线性、斜率为 1/2，ln Rp 与 ln[M] 成线性、斜率为 1。（1）说明该体系符合哪些假设；（2）随反应进行体系粘度增大，Rp 反而上升，解释原因；（3）提出三条提高分子量而不显著降低速率的措施。","【真题 2】在推导自由基聚合初期反应动力学方程时和二元共聚组成方程时都使用过的三个假设是（　）、（　）和（　）。","【真题 3】用 BPO 引发 10 g 苯乙烯在 80 mL 环己烷中聚合，要提高聚合速率，可加入四氢呋喃、N,N-二甲基苯胺、甲苯、聚苯乙烯中的哪些？为什么？","★★★　能不看书推出 Rp = kp[M](f·kd[I]/kt)^0.5，并写清三个假设","★★★　能说清 0.5 次方的物理来源，并能用它判断实验数据是否异常","★★★　能完整解释自动加速的四层内容","★★★　能写出 1/Xn 的四项表达式并解释每项","★★　能默写 AIBN、BPO、KPS 的分解反应式","★★　能解释为什么 kt 比 kp 大几个数量级，链却仍然很长","★★　能判断偶合与歧化对分子量的不同贡献","★　能列出引发剂选择的依据（半衰期与聚合时间匹配）"],"imp":4.0,"hot":8},{"id":"gaohua04","no":4,"name":"高化04 自由基共聚合","title":"自由基共聚合","cards":[{"id":"gaohua04-001","type":"tf","q":"恒比点投料时，生成的共聚物组成与单体组成相同，且不随转化率漂移。","a":"对（1 分）。此时消耗比与投料比一致，组成不漂移（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":1,"ord":101,"src":"练习册","from":"课后作业练习册·高化04 自由基共聚合·判断并说明理由（每题 2 分，共 10 分）·第 1 题","verdict":"对"},{"id":"gaohua04-002","type":"tf","q":"r2＝k22／k12。","a":"错（1 分）。r2＝k22／k21（1 分）。","stars":3,"sec":"判断并说明理由（每题 2 分，共 10 分）","num":2,"ord":102,"src":"练习册","from":"课后作业练习册·高化04 自由基共聚合·判断并说明理由（每题 2 分， F1 随之下降并趋近 AN 富集（4 分）；（2）组成分布变宽，链首富 St、链尾富 AN，性能不均、易分相（2 分）；（3）恒比点附近投料，或连续补加 St 维持 f1 恒定（2 分）。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化04 自由基共聚合·论述（12 分）·第 1 题"},{"id":"gaohua04-p001","type":"point","q":"竞聚率的定义与物理意义（名词解释、计算）","a":"k11/k12，衡量单体“自私”程度","stars":4,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 1 条）"},{"id":"gaohua04-p002","type":"point","q":"共聚组成微分方程的推导（论述、计算）","a":"四个增长反应 + 稳态假设","stars":5,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 2 条）"},{"id":"gaohua04-p003","type":"point","q":"五种 r1、r2 组合的曲线形状（选择、作图、简答）","a":"恒比、交替、无规、嵌段倾向","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 3 条）"},{"id":"gaohua04-p004","type":"point","q":"恒比点的计算与意义（计算、简答）","a":"F1 = f1 时组成不随转化率变","stars":4,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 4 条）"},{"id":"gaohua04-p005","type":"point","q":"转化率与组成漂移（简答、论述）","a":"活性大的单体先耗尽","stars":4,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 5 条）"},{"id":"gaohua04-p006","type":"point","q":"组成控制的三条工艺路线（简答）","a":"恒比投料、补加、连续","stars":3,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 6 条）"},{"id":"gaohua04-p007","type":"point","q":"竞聚率的测定方法（简答）","a":"Mayo-Lewis 截距斜率法","stars":3,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 7 条）"},{"id":"gaohua04-p008","type":"point","q":"Q-e 方程与单体活性顺序（简答、论述）","a":"Q 表共振稳定，e 表极性","stars":4,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 8 条）"},{"id":"gaohua04-p009","type":"point","q":"交替共聚与序列结构（选择、简答）","a":"r1r2 趋近 0 时交替","stars":3,"sec":"考点速记","num":9,"ord":18,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 9 条）"},{"id":"gaohua04-p010","type":"point","q":"共聚物的工业品种（填空、选择）","a":"ABS、SBR、EVA、乙丙橡胶","stars":2,"sec":"考点速记","num":10,"ord":19,"src":"考点","from":"分章节复习资料·高化04 自由基共聚合·二、考点星级总表（第 10 条）"},{"id":"gaohua04-t011","type":"calc","q":"对 St–AN 体系，r1 = 0.4，r2 = 0.04，以 [M1]/[M2] = 21/29（mol 比）投料，求聚合初期 F1，并定性画出 F1 与总单体转化率的关系图。","a":"f1 = 21/(29 + 21) = 0.42，f2 = 0.58。代入 F1 = (r1f1² + f1f2)/(r1f1² + 2f1f2 + r2f2²)，分子 = 0.4×0.1764 + 0.42×0.58 = 0.0706 + 0.2436 = 0.3142；分母 = 0.3142 + 0.04×0.3364 = 0.3142 + 0.0135 = 0.3277；F1 = 0.55。因 r1r2 = 0.016，远小于 1，有恒比点；当前 F1 > f1，说明 M1 消耗更快，随转化率升高 f1 下降、F1 沿曲线下降，图中应画出 F1 由 0.55 逐渐降低并向恒比点靠拢的曲线。给分点：f1 计算 1 分、F1 计算 5 分、曲线定性 2 分。","stars":5,"sec":"九、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化04 自由基共聚合·九、真题与期末题演练"},{"id":"gaohua04-t012","type":"short","q":"已知苯乙烯 Q = 1.00、e = -0.80，丁二烯 Q = 1.70、e = -1.05，丙烯腈 Q = 0.60、e = 1.28，乙烯 Q = 0.015、e = -0.20，醋酸乙烯酯 Q = 0.026、e = -0.22。哪些单体对容易进行自由基共聚？说明原因。","a":"易共聚的对有：苯乙烯–丁二烯（Q 相近、e 相近，r1r2 接近 1，趋近理想共聚）；苯乙烯–丙烯腈（Q 相近但 e 差别大，r1r2 趋近 0，交替倾向强，工业上即 SAN）；丁二烯–丙烯腈（同理）；乙烯–醋酸乙烯酯（Q 均极小、e 相近，可共聚，工业上为 EVA）。判据是 Q 值相近决定能否共聚，e 值差异决定序列是交替还是无规。给分点：每对 1 分、判据 1 分。","stars":5,"sec":"九、真题与期末题演练","num":111,"ord":911,"src":"真题","from":"分章节复习资料·高化04 自由基共聚合·九、真题与期末题演练"}],"reading":["一、本章坐标：两种单体的“性格”如何合成一条链","均聚只能改分子量，共聚能改结构，所以工业上的重要牌号几乎都是共聚物：ABS 是丙烯腈-丁二烯-苯乙烯，丁苯橡胶是苯乙烯-丁二烯，EVA 是乙烯-醋酸乙烯酯。共聚的核心问题只有一个：两种单体谁更愿意跟自己玩、谁更愿意跟对方玩？这个“性格”就是竞聚率。","表 1　自由基共聚合考点与重要度","三、竞聚率：一个比值讲清两种单体的关系","定义很朴素：r1 = k11/k12，即自由基 M1· 加到单体 M1 上与自己同类加成的速率，除以加到 M2 上交叉加成的速率。r1 大，说明 M1· 偏爱 M1；r1 小，说明它更愿意去接 M2。","记住这个直觉：r 不是“活性”，而是“选择性”。两种单体都可能很活泼，但 r 描述的是相对偏好。所以考题常把 r 与 Q 值分开问。","表 2　五种竞聚率组合与共聚行为","图 1　共聚组成曲线小结：五种竞聚率组合对应的 F1–f1 曲线（北化《高分子化学·重点内容》课件）","这五种情形不需要死记，画图即可推：把 F1 = f1 的对角线画出来，再看曲线在它上方还是下方。当 r1 很大、r2 很小时，曲线先在对角线上方、后穿过对角线到下方，中间那个交点就是恒比点。","四、组成微分方程：四个反应，一个稳态","推导假设五个：①等活性，链自由基活性与链长无关；②稳态，两种自由基浓度恒定；③聚合度很大，引发与转移消耗的单体忽略；④无解聚；⑤反应不可逆。前三条与第 3 章一致，后两条是本章补充。","体系里有四个增长反应：M1· + M1、M1· + M2、M2· + M1、M2· + M2，速率常数分别 k11、k12、k21、k22。对两种自由基分别写稳态方程，消去自由基浓度，得到","四个增长反应式（必须能写出并标注速率常数）：①~M1· + M1 → ~M1·，R11 = k11[M1·][M1]；②~M1· + M2 → ~M2·，R12 = k12[M1·][M2]；③~M2· + M1 → ~M1·，R21 = k21[M2·][M1]；④~M2· + M2 → ~M2·，R22 = k22[M2·][M2]。竞聚率就是同种加成与异种加成之比：r1 = k11/k12，r2 = k22/k21。注意 r2 的分母是 k21（顺序容易记反）。","图 2　二元共聚组成微分方程的两种等价写法：以摩尔浓度比表示（上）与以浓度比展开（下），推导时从四个增长反应的稳态方程出发（北化《高分子化学·重点内容》课件第 3.2 节）","F1 = (r1·f1² + f1·f2)/(r1·f1² + 2f1·f2 + r2·f2²)","其中 f1、f2 是投料时两种单体的摩尔分数，F1 是瞬间生成共聚物中 M1 的摩尔分数。这个式子只描述“某一瞬间”生成的共聚物，因此叫瞬时组成方程。转化率一高，f1 变了，F1 就跟着变——这是全章最容易被忽略的前提。","五、恒比点：唯一组成不漂移的配方","令 F1 = f1，代入方程化简得","f1(恒比) = (1 - r2)/(2 - r1 - r2)","只有当 r1 < 1 且 r2 < 1 时，这个值才落在 0 到 1 之间，恒比点才有物理意义。在恒比点投料，生成的共聚物组成与剩余单体组成始终相同，因此无论转化率多高，组成都不变。工业上做丁苯橡胶、SAN 树脂时，常把配方设计在恒比点附近，就是为了避免“前段富 A、后段富 B”的不均一。","图 3　共聚物组成随转化率的变化：曲线在对角线上方或下方意味着组成漂移（北化《高分子化学·重点内容》课件）","如果配方无法落在恒比点怎么办？三条工艺路线：①一次性投料、控制转化率在较低水平（如 10% 至 20%）就停，取“瞬时组成”这一段；②连续补加活性大的单体，把 f1 维持在恒定值；③采用连续聚合或管式反应器，让物料停留时间短、组成近似恒定。这三条是简答题的标准答案。","图 4　一次性投料法与补加单体法的组成控制比较（北化《高分子化学·重点内容》课件）","六、竞聚率怎么测：Mayo-Lewis 截距斜率法","把组成方程改写成线性形式：r2 = (f1/f2)·[f1(F1 - 1)/(-F1)] - r1·(f1²/f2)·(1/-F1)... 教材常用的是把实验数据整理成 y = r1·x - r2 的形式，以 x 为横坐标、y 为纵坐标作图，直线斜率为 r1、截距为 -r2。多做几组不同投料比的实验，取低转化率样品（保证 f 不变），就能定出两个竞聚率。","实验要点有两个：一是必须在低转化率下取样，否则 f 已经漂移，算出来的不是瞬时组成；二是要用多种投料比，单点无法定两个未知数。这两点常被写成简答题的“实验设计”部分。","七、Q-e 方程：用共振与极性预估 r","Q-e 把单体的反应性拆成两项：Q 表示共轭或共振稳定程度（Q 大则自由基稳定、活性大），e 表示极性（吸电子基为正、给电子基为负）。方程形式为 r1 = (Q1/Q2)·exp[-e1(e1 - e2)]，r2 = (Q2/Q1)·exp[-e2(e2 - e1)]，两者相乘得 r1·r2 = exp[-(e1 - e2)²]。","这个乘积式很有信息量：极性差越大，r1r2 越接近 0，越倾向交替共聚；极性相近则趋向理想共聚。苯乙烯（Q = 1.00，e = -0.80）与丙烯腈（Q = 0.60，e = 1.28）极性差别大，所以丁苯、SAN 体系都有明显的交替倾向。","Q-e 的局限也要会说：它假设位阻可以忽略、只以苯乙烯为参考标准、且把共振与极性完全解耦，因此对含大位阻基团或强氢键的单体误差较大。答题时把“能用”与“局限”都写上，才算完整。","表 3　常用单体的 Q、e 值（背下来可直接答分析题）","八、单体与自由基的活性顺序","教材把活性拆成两列，这一组结论常以选择题出现：单体的活性顺序大致为苯乙烯 > 丁二烯 > 异戊二烯 > 丙烯腈 > 醋酸乙烯酯 > 氯乙烯 > 乙烯；自由基的活性顺序则相反，氯乙烯自由基 > 醋酸乙烯酯自由基 > 丙烯腈自由基 > 丁二烯自由基 > 苯乙烯自由基。","为什么相反？因为取代基的共轭作用既稳定单体（降低其能量），也稳定自由基。共轭强的单体本身稳定、不容易被引发，但它生成的自由基很稳定、选择性高。所以“稳定的单体对应稳定的自由基，但反应活性低”——这句话是理解整张表的钥匙。","【真题 1】对 St–AN 体系，r1 = 0.4，r2 = 0.04，以 [M1]/[M2] = 21/29（mol 比）投料，求聚合初期 F1，并定性画出 F1 与总单体转化率的关系图。","【真题 2】已知苯乙烯 Q = 1.00、e = -0.80，丁二烯 Q = 1.70、e = -1.05，丙烯腈 Q = 0.60、e = 1.28，乙烯 Q = 0.015、e = -0.20，醋酸乙烯酯 Q = 0.026、e = -0.22。哪些单体对容易进行自由基共聚？说明原因。","★★★　能默写 "stars":4,"sec":"简答（每题 8 分，共 16 分）","num":2,"ord":602,"src":"练习册","from":"课后作业练习册·高化05 聚合方法·简答（每题 8 分，共 16 分）·第 2 题"},{"id":"gaohua05-025","type":"calc","q":"某乳液体系乳胶粒平均直径 100 nm，单体体积分数 0.2，体系总体积 1 L。若每个乳胶粒内平均只有 1 个自由基，估算乳胶粒数目，并说明若乳化剂用量加倍（乳胶粒数目按 0.6 次方增加）后聚合速率变为原来的几倍。","a":"单粒体积 V＝πd³/6≈5.24×10⁻²² m³；体系 1 L 中单体体积 0.2 L，粒子数≈0.2×10⁻³／5.24×10⁻²²≈3.8×10¹⁷（4 分）；乳化剂加倍，粒子数变为 2^0.6≈1.52 倍，速率约 1.5 倍（4 分）；说明速率与粒子数成正比（2 分）。","stars":5,"sec":"计算（10 分）","num":1,"ord":701,"src":"练习册","from":"课后作业练习册·高化05 聚合方法·计算（10 分）·第 1 题"},{"id":"gaohua05-026","type":"essay","q":"要生产三种产品：有机玻璃板材、聚氯乙烯糊树脂（乳胶）、涂料用丙烯酸树脂溶液。分别选择聚合方法，并从散热、纯度、分子量、成本、产物形态五个方面说明理由。\n错题归因（做完自己填）","a":"板材：本体聚合，纯度高、可直接浇注，但须分段控温防爆聚（4 分）；糊树脂：乳液聚合，产物即乳胶，粒径细、可直接使用（3 分）；涂料树脂：溶液聚合，产物即溶液、可直接调配，但分子量偏低、需回收溶剂（3 分）；成本与形态两条各 1 分。","stars":5,"sec":"论述（12 分）","num":1,"ord":801,"src":"练习册","from":"课后作业练习册·高化05 聚合方法·论述（12 分）·第 1 题"},{"id":"gaohua05-p001","type":"point","q":"四种方法的组分与配比（选择、填空）","a":"看有无水、有无乳化剂、有无溶剂","stars":4,"sec":"考点速记","num":1,"ord":10,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 1 条）"},{"id":"gaohua05-p002","type":"point","q":"本体聚合的优缺点与本体法 PS（简答、论述）","a":"纯度高但散热难，分预聚与后聚合","stars":4,"sec":"考点速记","num":2,"ord":11,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 2 条）"},{"id":"gaohua05-p003","type":"point","q":"悬浮聚合与分散剂作用（简答、选择）","a":"珠状产物，分散剂防粘连","stars":4,"sec":"考点速记","num":3,"ord":12,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 3 条）"},{"id":"gaohua05-p004","type":"point","q":"乳液聚合的四个组分与三个阶段（论述、简答）","a":"胶束成核、乳胶粒长大、聚合完成","stars":5,"sec":"考点速记","num":4,"ord":13,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 4 条）"},{"id":"gaohua05-p005","type":"point","q":"乳液聚合高速率又高分子量的原因（论述）","a":"反应被分隔在孤立胶束中，终止难","stars":5,"sec":"考点速记","num":5,"ord":14,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 5 条）"},{"id":"gaohua05-p006","type":"point","q":"乳化剂与临界胶束浓度（名词解释）","a":"形成胶束的最低浓度","stars":3,"sec":"考点速记","num":6,"ord":15,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 6 条）"},{"id":"gaohua05-p007","type":"point","q":"溶液聚合与沉淀聚合（简答）","a":"溶剂既是介质又是转移对象","stars":3,"sec":"考点速记","num":7,"ord":16,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 7 条）"},{"id":"gaohua05-p008","type":"point","q":"方法选择的依据（简答、论述）","a":"产物形态、传热、成本、环保","stars":3,"sec":"考点速记","num":8,"ord":17,"src":"考点","from":"分章节复习资料·高化05 聚合方法·二、考点星级总表（第 8 条）"},{"id":"gaohua05-t009","type":"short","q":"写出下列四个聚合体系的聚合机理和聚合方法：（1）MMA 15 g、AIBN 0.2 g、MgCO3 0.3 g、H2O 90 mL；（2）Bd 10 g、AN 4 g、K2S2O8 0.2 g、十二烷基硫酸钠 0.5 g、H2O 50 mL；（3）Bd 10 g、TiCl4 2×10⁻⁵ mol、AlEt3 10⁻³ mol、己烷 100 mL；（4）St 10 g、AlCl3 0.02 mL、痕量水、CH2Cl2 100 mL。","a":"（1）自由基聚合、悬浮聚合（AIBN 油溶、MgCO3 为分散剂、有水但无乳化剂）；（2）自由基共聚合、乳液聚合（KPS 水溶、有乳化剂十二烷基硫酸钠）；（3）配位聚合、溶液聚合（TiCl4–AlEt3 为 Ziegler-Natta 催化剂，己烷为溶剂）；（4）阳离子聚合、溶液聚合（AlCl3 为 Lewis 酸，需痕量水作质子源，CH2Cl2 为低极性溶剂）。给分点：四组各 2 分，机理与方法各 1 分。","stars":5,"sec":"八、真题与期末题演练","num":108,"ord":908,"src":"真题","from":"分章节复习资料·高化05 聚合方法·九、真题与期末题演练"},{"id":"gaohua05-t010","type":"fill","q":"工业上生产聚酯采用的聚合方法是（　），缩聚常用的其它三种聚合方法分别是（　）、（　）和（　）。","a":"熔融缩聚；溶液缩聚、界面缩聚、固相缩聚。给分点：四空各 0.5 分。注意题目问的是缩聚方法，不要与自由基的四种方法混答。","stars":5,"sec":"八、真题与期末题演练","num":109,"ord":909,"src":"真题","from":"分章节复习资料·高化05 聚合方法·九、真题与期末题演练"},{"id":"gaohua05-t011","type":"short","q":"简述乳液聚合的机理，并说明为什么乳液聚合可以达到很高的聚合速率和很高的分子量。","a":"机理按三个阶段答（胶束成核、乳胶粒生长、聚合完成），并指出引发剂在水相分解、反应主要在乳胶粒内进行。速率与分子量同时高的原因：乳胶粒被乳化剂彼此隔离，一个粒子内通常只有一个自由基，双基终止难以发生，自由基寿命长，链得以长到很高分子量；而乳胶粒数量极多（可达 10¹⁴ 个/mL），总速率仍很高；且 Rp 与乳胶粒数目成正比，故提高乳化剂用量可同时提高速率。给分点：三阶段 3 分、隔离终止 3 分、粒子数与速率关系 2 分。","stars":5,"sec":"八、真题与期末题演练","num":110,"ord":910,"src":"真题","from":"分章节复习资料·高化05 聚合方法·九、真题与期末题演练"}],"reading":["一、本章坐标：同一反应，四种“场地”","前三章讲的是分子怎么长，本章讲的是让它们在什么地方长。反应机理不变，换了场地之后，传热、粘度、产物形态、成本全变了。工业上选哪一种，往往不是因为化学更好，而是因为工程上更划算。","表 1　聚合方法考点与重要度","三、四种方法：一张表看清差别","图 1　乳液聚合与悬浮聚合的体系比较：分散尺度差三个数量级（北化《高分子化学·重点内容》课件）","一眼判别法：配方里有水、有乳化剂（如十二烷基硫酸钠）、引发剂是过硫酸钾，一定是乳液聚合；有水、有分散剂（如聚乙烯醇、碳酸镁）、引发剂是油溶性的 AIBN 或 BPO，一定是悬浮聚合；全是单体无溶剂是本体的悬浮？不，是本体；有大量溶剂（如甲苯、环己烷）则是溶液聚合。","图 2　悬浮聚合与乳液聚合的成粒过程示意（北化《高分子化学·重点内容》课件）","四、本体聚合：纯度最高，也最难过热","本体聚合只有单体和引发剂，产物纯净、后处理简单、适合做光学件与医用材料（如有机玻璃板、透镜）。它的死穴是散热：反应一开始体系就变粘，热量散不出去，局部温度升高又加快引发剂分解，正反馈下去就是暴聚。","工业上的解法是“两段式”：先在预聚釜里做到一定转化率（如 10% 至 20%），此时粘度还不高、可以搅拌散热；再把预聚物灌进模具，在较低温度下长时间后聚合。PMMA 板、PS 棒都是这么做的。这个工艺细节是论述题的加分点。","本体法聚苯乙烯还有连续本体法：用多级串联反应器，靠自身粘度形成活塞流，后期在脱挥器中抽走残余单体。苯乙烯本体聚合的难点是苯乙烯本身是良溶剂，聚合物一生成就溶解，粘度上升极快。","五、悬浮聚合：把本体反应切成小液滴","悬浮聚合本质上是“无数个小本体反应器”。单体被搅拌打散成液滴，靠分散剂（水溶性高分子如聚乙烯醇、或难溶无机盐如碳酸镁）吸附在液滴表面，防止碰撞后粘连。引发剂必须油溶，溶在单体里。","产物是珠状颗粒，粒径 0.1 至 1 mm，可直接用于成型，省去造粒。PVC 的 80% 以上产量来自悬浮法，这也是为什么市售 PVC 是白色粉末或珠粒。控制粒径靠三件事：搅拌转速、分散剂种类与用量、水与单体的比例。转速越高、分散剂越有效，粒径越小。","悬浮聚合的传热比本体好得多——每个液滴都在水中，热量通过水带走。这就是它的核心优势：既保留本体聚合的纯度（产物中几乎无乳化剂残留），又解决了散热。","六、乳液聚合：本章的重头戏","乳液聚合的体系有四个组分：单体（难溶于水）、水、乳化剂、水溶性引发剂。乳化剂是两亲分子，浓度超过临界胶束浓度（CMC）后，在水里自组装成胶束（直径约 5 至 10 nm），同时把部分单体增溶进胶束内部。","乳液聚合的引发反应式（KPS 体系，必须会写）：K₂S₂O₈ → 2K⁺ + S₂O₈²⁻；S₂O₈²⁻ →（70—90 ℃）2 SO₄·⁻；SO₄·⁻ + 单体 → 单体自由基。若加亚硫酸氢钠作还原剂，则 S₂O₈²⁻ + HSO₃⁻ → SO₄²⁻ + SO₄·⁻ + HSO₃·，活化能大幅下降，可在室温聚合（这就是“低温乳液聚合”丁苯橡胶的做法）。","反应分三个阶段，这是必背内容：","第一阶段（胶束成核期）：水溶性引发剂在水相分解，生成自由基；自由基扩散到胶束内，与其中的单体反应，胶束变成乳胶粒的“核”。此阶段乳胶粒数目迅速增加，单体主要来自单体液滴的补充。","第二阶段（乳胶粒生长期）：胶束消失，乳胶粒数目固定。单体从液滴经水相扩散进乳胶粒，在其中聚合。此阶段乳胶粒不断长大，聚合速率基本恒定，是主要的产品生长期。","第三阶段（聚合完成期）：单体液滴耗尽，只剩乳胶粒内部的残余单体继续聚合，单体浓度下降，速率随之降低，直至反应结束。","为什么乳液聚合能同时做到“速率快”和“分子量高”？关键在于“隔离”。每个乳胶粒里通常只有一个自由基（第二个自由基进入前，前一个已被终止或被困住），因此不存在双基终止，自由基寿命长、链可以长得很长；同时乳胶粒数量极多（每毫升可达 10¹⁴ 个），总反应速率并不低。这一条把第 3 章的“Rp 与 Xn 互相矛盾”直接推翻了，是全书最漂亮的工程解法。","定量上，乳液聚合速率 Rp = kp·[M]·N·n̄/（2N_A），其中 N 为乳胶粒浓度、n̄ 为每粒平均自由基数。可见 Rp 与乳胶粒数目成正比，而乳胶粒数目由乳化剂用量决定。所以“多加乳化剂 → 更多胶束 → 更多乳胶粒 → 更快”，这条推理链要能说清。","表 3　乳液聚合三个阶段的关键变化","图 3　乳液聚合工业生产实例与产物用途（北化《高分子化学·重点内容》课件）","溶液聚合把单体和引发剂溶在溶剂里，优点是粘度低、传热好、温度易控，适合做涂料、胶黏剂。缺点是溶剂成了链转移的对象，分子量偏低；而且溶剂回收成本高、有环保压力。","如果聚合物不溶于所选溶剂，反应一开始就析出，就是沉淀聚合。丙烯腈在水中聚合、以及聚丙烯腈碳纤维原丝的生产都属于这一类。沉淀聚合的机理与乳液不同：没有胶束，成核靠均相成核后析出，颗粒内部反应使局部浓度高，也常出现加速。","表 4　方法选择的三条判据","【真题 1】写出下列四个聚合体系的聚合机理和聚合方法：（1）MMA 15 g、AIBN 0.2 g、MgCO3 0.3 g、H2O 90 mL；（2）Bd 10 g、AN 4 g、K2S2O8 0.2 g、十二烷基硫酸钠 0.5 g、H2O 50 mL；（3）Bd 10 g、TiCl4 2×10⁻⁵ mol、AlEt3 10⁻³ mol、己烷 100 mL；（4）St 10 g、AlCl3 0.02 mL、痕量水、CH2Cl2 100 mL。","【真题 2】工业上生产聚酯采用的聚合方法是（　），缩聚常用的其它三种聚合方法分别是（　）、（　）和（　）。","【真题 3】简述乳液聚合的机理，并说明为什么乳液聚合可以达到很高的聚合速率和很高的分子量。","★★
